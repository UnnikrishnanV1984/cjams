version: 0.0
os: linux
files:
  - source: /
    destination: /usr/local/welfare_master_lb
hooks:
  BeforeInstall:
    - location: deploy/before-install.sh
      runas: root
      timeout: 300
  AfterInstall:
    - location: deploy/after-install.sh
      runas: root
      timeout: 300
  ApplicationStart:
    - location: deploy/app-start.sh
      runas: root
      timeout: 60