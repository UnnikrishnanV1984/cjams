<!DOCTYPE html>
<html lang="en">
   <head>
      <meta charset="UTF-8">
      <title>  </title>
      <link href="https://fonts.googleapis.com/css?family=Open+Sans:300,400,600,700,800" rel="stylesheet">
      <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
      <!-- Latest compiled and minified CSS -->
      <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css">
      <link rel="stylesheet" href="{{root_template_path_style}}/style.css">
      <style>
         .gray-bg {
         text-align: left; 
         padding: 0px;
         background-color: lightgray !important;
         -webkit-print-color-adjust: exact;
         }
         .gray-bg label {
         text-align: left;
         display: block;
         margin: 0px;
         }
         .blue-bg {
         text-align:left; 
         background-color:powderblue !important;
         -webkit-print-color-adjust: exact;
         padding: 5px 10px;
         }
         .sign-align {
         display: flex;
         align-items: flex-end;
         flex-direction: row;
         }
         .txt-overflow {
         text-overflow: ellipsis;
         overflow: hidden;
         }
         .pt-20 {
         padding-top: 20px;
         }
         .pt-10 {
         padding-top: 10px;
         }
         .mt-10 {
         margin-top: 10px;
         }
         .table> thead>th{
         color: black;
         }
         div.c {
         text-align: center;
         }
         div.l {
         text-align: left;
         }
         div.r {
         text-align: right;
         } 
         div.j {
         text-align: justify;
         } 
      </style>
   </head>
   <body>
      <div class="clsMain">
         <div class="clsOnePage">
            <div class="gridsec container-fluid" id="printIhmView">
               <div class="clearfix pt-20">
                  <h3 class="text-center">CONTACT SUMMARY REPORT</h3>
               </div>
               <div class="row">
                  <div class="col-xs-2"> &nbsp;</div>
               </div>
               <div class="row">
                  <div class="col-xs-2"> &nbsp;</div>
               </div>
               <div class="row">
                  <div class="col-xs-4 l"><label>User Name: </label> <span>{{username}}</span></div>
                  <div class="col-xs-4 l"><label>User Title: </label> <span>{{usertitle}}</span></div>
                  <div class="col-xs-4 l"><label>Report Date: </label> <span>{{currentdate}}</span></div>
               </div>
               <div class="row">
                  <div class="col-xs-4 l"><label>Local Department: </label> <span>{{localdepartment}}</span></div>
                  <div class="col-xs-4 l"><label>Unit: </label> <span>{{unit}}</span></div>
               </div>
               <div class="row">
                  <div class="col-xs-4 l"><label>Name: </label> <span>{{name}}</span></div>
                  <div class="col-xs-4 l"><label>ID: </label> <span>{{danumber}}</span></div>
                  <div class="col-xs-4 l"><label>Type: </label> <span>{{casetype}}</span></div>
               </div>

               <div class="row">
                  <div class="col-xs-2"> &nbsp;</div>
               </div>

               {{recording}}

            </div>
         </div>
      </div>
   </body>
</html>
