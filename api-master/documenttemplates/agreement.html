<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title> </title>
    <link href="https://fonts.googleapis.com/css?family=Open+Sans:300,400,600,700,800" rel="stylesheet">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{root_template_path_style}}/style.css">
    <style>
        label {
            font-size: 15px;
            font-weight: 600;
        }
    </style>
</head>

<body>
    <div class="clsMain">
        <div class="page-wrapper clsOnePage">
            <div class="">
                <h3 class="tab-title text-center">State of Maryland - Service Agreement</h3>

                <div class="row mt-20">
                    <div class="col-xs-6">
                        <p><label>Agreement Date : </label> {{AgreementDate}}</p>
                    </div>
                    <div class="col-xs-6">
                        <p><label>Participants : </label>
                            {{Participants}}</p>
                    </div>
                    <div class="col-xs-6">
                        <p><label>Collateral : </label>
                            {{Collateral}}</p>
                    </div>
                    <div class="col-xs-6">
                        <p><label> Signature Obtained : </label> {{SignatureObtained}}</p>
                        <p><label> Signed date : </label>{{Signeddate}}</p>
                    </div>
                </div>

                <div class="clearfix">
                    <p><label for=""> Why family came to the attention of the agency ? </label> {{Whyfamily}} </p>
                </div>

                <div class="row">
                    <div class="col-xs-6">
                        <p><label for=""> Head of household : </label> {{Headofhousehold}} </p>
                    </div>
                    <div class="col-xs-6">

                        <p><label for=""> Worker : </label>{{Worker}} </p>
                    </div>
                </div>
                <div class="row">
                    <div class="col-xs-6">
                        <p><label for=""> Supervisor : </label>{{Supervisor}} </p>
                    </div>
                    <div class="col-xs-6">
                        <p><label for=""> Case Associate : </label> {{CaseAssociate}} </p>
                    </div>
                    <div class="col-xs-6">
                        <p><label for=""> Status : </label> {{status}} </p>
                    </div>
                    <div class="col-xs-6">
                        <p><label for=""> Approved Date : </label> {{approvaldate}} </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
