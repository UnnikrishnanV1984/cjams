<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title> </title>
    <link href="https://fonts.googleapis.com/css?family=Open+Sans:300,400,600,700,800" rel="stylesheet">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
    <!-- Latest compiled and minified CSS -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{root_template_path_style}}/style.css">
    <style>
        td {
            height: 50px;
        }

        table,
        th,
        td {
            border: 1px solid black;
        }

        th {
            background: #cccccc;
        }

        table {
            border-collapse: collapse;
        }

        table tbody tr:last-child {
            background: #e3e5e8;
        }

        th,
        td {
            text-align: left;
            font-size: 14px;
            padding: 10px;
        }

        .text-b {
            font-weight: 700;
        }

        .m-t-30 {
            margin-top: 30px;
        }
    </style>
</head>

<body>
    <div class="clsMain">
        <div class="page-wrapper">
            <div class="clsOnePage">
                <h4 class="text-center text-b">CONTACT SUPPORT TICKETS REPORT</h4>
                <table style="width: 100%;" aria-describedby="Contact Support Tickets Report">
                    <thead>
                        <tr class="text-b">
                            <th scope="col">Support#</th>
                            <th scope="col">Issue Type</th>
                            <th scope="col">Severity</th>
                            <th scope="col">Priority</th>
                            <th scope="col">Intake Case Id</th>
                            <th scope="col">Program Area</th>
                            <th scope="col">Focus Area</th>
                            <th scope="col">County</th>
                            <th scope="col">User</th>
                            <th scope="col">Date & Time</th>
                            <th scope="col">Approval Status</th>
                            <th scope="col">Subject</th>
                            <th scope="col">Comments</th>
                            <th scope="col">Jira Ticket#</th>
                            <th scope="col">Jira Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        {{contactsupport}}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
