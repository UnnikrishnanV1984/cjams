<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>  </title>
        <link href="https://fonts.googleapis.com/css?family=Open+Sans:300,400,600,700,800" rel="stylesheet">
        <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
       <!-- Latest compiled and minified CSS -->
        <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css">
        <link rel="stylesheet" href="stylecss.css">
        <style>
         .clsMain{
                /* width: 750px; */
                margin: auto;
                position: relative;
            }
            .clsOnePage{
                height: 1094px;
                position: relative;
                padding-left: 15px;
                padding-right: 15px;
            }
            .clearfix {
                clear: both;
            }
            .m-0 {
                margin: 0px;
            }
            .m-t-40 {
                margin-top: 40px;
            }
            .m-t-20 {
                margin-top: 20px;
            }
            .m-t-30 {
                margin-top: 30px;
            }
            .m-b-10 {
                margin-bottom: 10px;
            }
            .p-t-30 {
                padding-top: 30px;
            }
            .p-t-20 {
                padding-top: 20px;
            }
            .p-b-10 {
                padding-bottom: 10px;
            }
            .p-0 {
                padding: 0px;
            }
            .font-b {
                font-weight: bold;
            }
            .border-btm {
                border-bottom: 1px solid #cccccc;
            }
            .border-t {
                border-top: 1px solid #cccccc;
            }
            .frm span:first-child {
                width: 150px;
                display: inline-block;
            }
            .frm span:first-child::after {
                content: ':';
                float: right;
            }
            .bd-btm {
                width: 60%;
                height: 5px;
                background-clip: content-box;
                border-bottom: 1px solid black;
                border-image: linear-gradient( to left, #ccc 80%, rgba(0,0,0,0) 0%);
                border-image-slice: 1;
                display: inline-block;
            }
            .title-div {
                width: 30%;
                float: left;
            }
            .para-div {
                width: 65%;
                float: left;
            }
            u {
                text-decoration: none;
                border-bottom: 2px solid black;
            }
            table {
                width: 100%;
            }

            table, th, td {
                border: 1px solid black;
                border-collapse: collapse;
            }

            th, td {
                padding: 5px;
                height: 70px;
            }

            th {
                text-align: left;
            }

            .first-col p label {
                width: 40%;
                text-align: right;
            }
            .second-col p label {
                width: 68%;
                text-align: right;
            }
        </style>
    </head>
<body>
        <div class="clsMain">
            <div class="clsOnePage">
                <header class="clsPlainHeader">
                    <br>
                    <div class="col-xs-12">
                        <div class="row">
                            <div class="col-xs-3">
                                <img src="{{root_template_path_logo}}/dhslogo.png" alt="logo" style="width: 45%;">
                            </div>
                            <div class="col-xs-5">
                                <div class="text-right">
                                    <h4 class="font-b">DHS 111 Client Expenditure Report</h4>
                                </div>
                            </div>
                        </div>
                    </div>
                </header>
                <div class="clearfix p-t-20">
                    <div class="row">
                        <div class="col-xs-4">
                            <p><label>Case ID : </label> <span>{{case_id}}</span></p>
                            <p><label>Case Name : </label> <span>{{case_name}}</span></p>                       
                        </div>
                        <div class="col-xs-3">
                            <p><label>Client ID : </label> <span>{{client_id}}</span></p>
                            <p><label>Client Name : </label> <span>{{client_name}}</span></p>                           
                        </div>
                        <div class="col-xs-3">
                            <p><label>CIS ID : </label> <span>{{cisclientid}}</span></p>
                            <p><label>Run Date : </label> <span>{{run_date}}</span></p>                           
                        </div>
                        <div class="col-xs-2">
                            <p><label>From : </label> <span>{{from}}</span></p>
                            <p><label>To : </label> <span>{{to}}</span></p>
                        </div>
                    </div>
                </div>
                <div class="clearfix p-t-20">
                    <div class="row">
                        <div class="col-xs-12">                         
                            <table aria-hidden="true" aria-describedby="Transaction Details">
                               {{transactionheader}}
                               {{transactiondetails}}
                            </table>
                        </div> 
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
