<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title> </title>
    <link href="https://fonts.googleapis.com/css?family=Open+Sans:300,400,600,700,800" rel="stylesheet">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
    <!-- Latest compiled and minified CSS -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{root_template_path_style}}/style.css">
    <style>
        td {
            height: 50px;
        }

        table,
        th,
        td {
            border: 1px solid black;
        }

        th {
            background: #cccccc;
        }

        table {
            border-collapse: collapse;
        }

        table tbody tr:last-child {
            background: #e3e5e8;
        }

        th,
        td {
            text-align: left;
            font-size: 14px;
            padding: 10px;
        }

        .text-b {
            font-weight: 700;
        }

        .m-t-30 {
            margin-top: 30px;
        }
    </style>
</head>

<body>
    <div class="clsMain">
        <div class="page-wrapper">
            <div class="clsOnePage">
                <h4 class="text-center text-b">OPEN CASE SUMMARY REPORT</h4>
                <div class="row">
                    <h6 class="text-center text-b col-xs-6">For period from {{startdate}} to {{enddate}}</h6>
                    <h6 class="text-center text-b col-xs-6">Account Area {{accountarea}}</h6>
                </div>
                <h6 class="text-center text-b col-xs-12">Generated at {{generatedat}}</h6>
                <div class="row">
                    <p class="col-xs-offset-2 text-b">TOTAL NUMBER OF OPEN CASES:<span
                            class="brd-btm">{{totalnumberofopencases}}</span></p>
                    <p class="col-xs-offset-2 text-b">TOTAL BALANCE: $ <span class="brd-btm">{{totalbalance}}</span></p>
                </div>
            </div>
</body>

</html>
