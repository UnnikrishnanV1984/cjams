<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title> </title>
    <link href="https://fonts.googleapis.com/css?family=Open+Sans:300,400,600,700,800" rel="stylesheet">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
    <!-- Latest compiled and minified CSS -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        td {
            height: 50px;
        }

        table, th, td {
            border: 1px solid black;
        }

        th {
            background: #cccccc;
        }

        table {
            border-collapse: collapse;
        }

        th, td {
            text-align: left;
            font-size: 14px;
            padding: 10px;
        }

        .text-b {
            font-weight: 700;
        }

        .m-t-30 {
            margin-top: 30px;
        }
    </style>
</head>

<body>
    <div class="clsMain">
        <div class="page-wrapper">
            <div class="clsOnePage">
                <h4 class="text-center text-b">NEW CASE BY PERIOD ({{startdate}} to {{enddate}})</h4>
                <table style="width: 100%; margin-top: 20px;" class="m-t-30" aria-describedby="Restitution Report">
                    <thead>
                        <tr class="text-b">
                            <th scope="col" style="width: 10%;"></th>
                            <th scope="col" style="width: 10%;">ACCT<br>AREA:</th>
                            <th scope="col" style="width: 20%;">RESTITUTION<br>AMOUNT</th>
                            <th scope="col" style="width: 10%;">ACCT #</th>
                            <th scope="col" style="width: 25%;">OFFENDER</th>
                            <th scope="col" style="width: 25%;">INITIAL ENTRY DATE</th>
                        </tr>
                    </thead>
                    <tbody>
                        {{newCaseDetails}}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>

</html>
