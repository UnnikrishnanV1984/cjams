<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title> </title>
    <link href="https://fonts.googleapis.com/css?family=Open+Sans:300,400,600,700,800" rel="stylesheet">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
    <!-- Latest compiled and minified CSS -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{root_template_path_style}}/style.css">
    <style>
        td {
            height: 50px;
        }

        table,
        th,
        td {
            border: 1px solid black;
        }

        th {
            background: #cccccc;
        }

        table {
            border-collapse: collapse;
        }

        th,
        td {
            text-align: left;
            font-size: 14px;
            padding: 10px;
        }

        .text-s-b {
            font-weight: 600;
        }

        .text-b {
            font-weight: 700;
        }

        .m-t-30 {
            margin-top: 30px;
        }

        .m-b-30 {
            margin-bottom: 30px;
        }

        .font-16 {
            font-size: 16px;
        }

        .font-14 {
            font-size: 14px;
        }
        
		.clearfix {
		    clear: both;
		}
		.clearfix:before{
			display: table;
    		content: " ";
		}
		.clearfix:after{
			clear: both;
			display: table;
    		content: " ";
		}
    </style>
</head>

<body>
    <div class="clsMain">
        <div class="page-wrapper">
            <div class="clsOnePage">
                <h4 class="text-center text-b" style="text-transform: capitalize;">{{reportName}}
                </h4>
                {{balance}}
                {{ccu}}
                {{supervision}}

                {{exceptionReport}}
            </div>
        </div>
    </div>
</body>

</html>
