<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title> </title>
    <link href="https://fonts.googleapis.com/css?family=Open+Sans:300,400,600,700,800" rel="stylesheet">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
    <!-- Latest compiled and minified CSS -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{root_template_path_style}}/style.css">
    <style>
        td {
            height: 50px;
        }

        table,
        th,
        td {
            border: 1px solid black;
        }

        th {
            background: #cccccc;
        }

        table {
            border-collapse: collapse;
        }

        th,
        td {
            text-align: left;
            font-size: 14px;
            padding: 10px;
        }

        .text-b {
            font-weight: 700;
        }

        .m-t-30 {
            margin-top: 30px;
        }
    </style>
</head>

<body>
    <div class="clsMain">
        <div class="page-wrapper">
            <div class="clsOnePage">
                <h4 class="text-center text-b">CASE CLOSING REPORT</h4>
                <h3 class="text-center text-b">Printed at {{printatdate}}</h3>
                <table style="width: 100%;" aria-describedby="Case Closing Report">
                    <thead>
                       <tr><td colspan="8" style="text-align: left; font-weight: 700;">Area: <span>{{area}}</span></td></tr>
                        <tr><td colspan="8" style="text-align: left; font-weight: 700;">Counselor:<span>{{counselor}}</span></td></tr>
                        <tr class="text-b">
                            <th scope="col" style="width: 10%;">Offender</th>
                            <th scope="col" style="width: 10%;">Acc#</th>
                            <th scope="col" style="width: 10%;">Vendor</th>
                        </tr>
                    </thead>
                    <tbody>
                        {{caseClosingReport}}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
