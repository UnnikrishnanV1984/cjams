<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title> </title>
    <link href="https://fonts.googleapis.com/css?family=Open+Sans:300,400,600,700,800" rel="stylesheet">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
    <!-- Latest compiled and minified CSS -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{root_template_path_style}}/style.css">
    <style>
        td {
            height: 50px;
        }

        table,
        th,
        td {
            border: 1px solid black;
        }

        th {
            background: #cccccc;
        }

        table {
            border-collapse: collapse;
        }

        table tbody tr:last-child {
            background: #e3e5e8;
        }

        th,
        td {
            text-align: left;
            font-size: 14px;
            padding: 10px;
        }

        .text-b {
            font-weight: 700;
        }

        .m-t-30 {
            margin-top: 30px;
        }
    </style>
</head>

<body>
    <div class="clsMain">
        <div class="page-wrapper">
            <div class="clsOnePage">
                <h4 class="text-center text-b">CCU CASE REPORT</h4>
                <h6 class="text-center text-b">For period from {{startdate}} to {{enddate}}</h6>
                <table style="width: 100%;" aria-describedby="Ccu Case Report1">
                    <thead>
                        <tr class="text-b">
                            <th scope="col" style="width: 10%;"></th>
                            <th scope="col" style="width: 10%;">Case #</th>
                            <th scope="col" style="width: 10%;">Amount</th>
                            <th scope="col" style="width: 20%;">Offender name</th>
                            <th scope="col" style="width: 10%;">Referral Date</th>
                            <th scope="col" style="width: 15%;">Primary Debtor</th>
                            <th scope="col" style="width: 15%;">Secondary Debtor</th>
                            <th scope="col" style="width: 10%;">CCU Accepted Date</th>
                        </tr>
                    </thead>
                    <tbody>
                        {{ccuReport}}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
