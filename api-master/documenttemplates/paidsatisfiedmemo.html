<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>  </title>
    <link href="https://fonts.googleapis.com/css?family=Open+Sans:300,400,600,700,800" rel="stylesheet">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
   <!-- Latest compiled and minified CSS -->
	<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css">
	<link rel="stylesheet" href="{{root_template_path_style}}/style.css">
	<style>
	.address-lb label, .lb-div {
		width: 100px;
		display: inline-block;
	}
	</style>
</head>
<body>
	<div class="clsMain">
		<div class="clsOnePage">
			<div class="row text-center text-9 ftitalic no-mar">
				<div class="col-xs-4">
					<p class="no-mar">{{DHSLtGovernor}}</p>
					<p>Lt. Governor</p>
				</div>
				<div class="col-xs-4">
					<p class="no-mar">{{DHSGovernor}}</p>
					<p>Governor</p>
				</div>
				<div class="col-xs-4">
					<p class="no-mar">{{DHSSecretary}}</p>
					<p>Secretary</p>
				</div>
			</div>

			<div class="clearfix pt-20">
				<h5 class="text-center pt-20 text-sm-b"> Paid and Satisfied Memo </h5>
			</div>

			<div class="row mt-30">
				<div class="col-xs-12">
					<p class=""><u>MEMORANDUM</u></p>
				</div>

				<div class="col-xs-12 mt-20 address-lb">
					<p><label>TO : </label><span>Case Management Specialist</span></p>
					<p><label>FROM : </label><span>{{rtcdcoordinator}}</span></p>
					<p><label>DATE : </label><span>{{crntdate}}</span></p>
					<div class="lb-div"><label>RE : </label></div>
					<div class="inline-block">
						<span>{{youthname}} – PAID AND SATISFIED {{description}}</span>
					</div>
				</div>
			</div>

			<div class="row mt-30">
				<div class="col-xs-9 col-xs-offset-1">
					<p class="bd"></p>
				</div>
			</div>

			<div class="row">
				<div class="col-xs-12 mt-20">
					<p class="indent">{{subject}}</p>
					<p class="mt-20">c:  Youth’s Restitution Account File</p>
				</div>
			</div>
		</div>
	</div>
</body>
</html>
