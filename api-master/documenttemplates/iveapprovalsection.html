<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>  </title>
      <link href="https://fonts.googleapis.com/css?family=Open+Sans:300,400,600,700,800" rel="stylesheet">
      <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
    <!-- Latest compiled and minified CSS -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{root_template_path_style}}/style.css">
    <style>
        table {
            width: 100%;
            display: block;
            border-collapse: collapse;
        }

        .table-bordered th,
        .table-bordered td {
            border: 1px solid #000000 !important;
            -webkit-print-color-adjust: exact;
        }

        .section-header {
            /* height: 20px; */
            border: 1px solid black;
            text-align: center;
            /* padding-bottom: 25px; */
            background-color: #ccc !important;
            -webkit-print-color-adjust: exact;
            font-weight: bold;
            margin-bottom: 20px;
            padding: 5px;
        }
    </style>
  </head>
    <body>
        <div id="vir-csp"></div>
        <div class="clsMain">
            <div class="clsOnePage">
               <div class="gridsec container-fluid" id="printIhmView">
                <div class="row">
                    <h2 class="text-center">TITLE IV-E APPROVAL SECTION PDF</h2>
                    </div>
                    <br>
                    <div class="row">
                           <div class="col-xs-5 l"><h4><label>User Name: </label> <span>{{ username }}</span></div></h4>
                           <div class="col-xs-4 l"><h4><label>Report Date: </label> <span>{{downloadDate}}</span></div></h4>
                    </div>
                    <div class="row">
                        <div class="col-xs-5 l"><h4><label>User Title: </label> <span>{{userroledetails }}</span></div></h4>
                        <div class="col-xs-4 l"><h4><label>Approval Status: </label> <span>{{approvalstatus }}</span></div></h4>
                 </div>
                    <br>
                   <div class="row">
                       <div class="col-xs-12">
                            {{approvalInfo}}
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-xs-12">
                            {{rejectedInfo}}
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-xs-12">
                            {{pendingInfo}}
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-xs-12">
                            {{norecords}}
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
