<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title> </title>
    <link href="https://fonts.googleapis.com/css?family=Open+Sans:300,400,600,700,800" rel="stylesheet">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
    <!-- Latest compiled and minified CSS -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{root_template_path_style}}/style.css">
    <style>
        td {
            height: 50px;
        }

        table,
        th,
        td {
            border: 1px solid black;
        }

        th {
            background: #cccccc;
        }

        table {
            border-collapse: collapse;
        }

        table tbody tr:last-child {
            background: #e3e5e8;
        }

        th,
        td {
            text-align: left;
            font-size: 14px;
            padding: 10px;
        }

        .text-b {
            font-weight: 700;
        }

        .m-t-30 {
            margin-top: 30px;
        }
    </style>
</head>

<body>
    <div class="clsMain">
        <div class="page-wrapper">
            <div class="clsOnePage">
                <h4 class="text-center text-b">RELEASE NOTES REPORT</h4>
                <div class="row">
                    <div class="col-xs-12">
                        <h5 class="text-b">RELEASE DATE:&nbsp; {{releasedate}}</h5>
                    </div>
                    <div class="col-xs-12">
                        <h5 class="text-b">RELEASE VERSION:&nbsp; {{releaseversionno}}</h5>
                    </div>
                </div>
                <table style="width: 100%; table-layout: fixed;" aria-describedby="Release Notes Report">
                    <thead>
                        <tr class="text-b">
                            <th scope="col" style="width:8% !important;">Defect/Story</th>
                            <th scope="col" style="width:8% !important;">JIRA#/Story # </th>
                            <th scope="col" style="width:8% !important;">Support# </th>
                            <th scope="col" style="width:10% !important;">Raised By </th>
                            <th scope="col" style="width:15% !important;">How to Guide </th>
                            <th scope="col" style="width:16% !important;">Title </th>
                            <th scope="col" style="width:35% !important;">Description </th>
                        </tr>
                    </thead>
                    <tbody>
                        {{releasenotes}}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>

</html>
