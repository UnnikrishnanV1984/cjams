<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>CANS-F Summary Sheet</title>

    <link href="https://fonts.googleapis.com/css?family=Open+Sans:300,400,600,700,800" rel="stylesheet" />
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css" />
    <link rel="stylesheet" href="{{root_template_path_style}}/style.css" />

    <style>
        body {
            font-family: 'Open Sans', sans-serif;
            font-size: 12px;
        }

        .page-wrapper {
            padding: 12px 16px;
        }

        .tab-title {
            margin: 6px 0 14px;
            font-weight: 700;
        }

        .section {
            margin-bottom: 16px;
        }

        .table {
            margin-bottom: 10px;
        }

        .table>thead>tr>th {
            background: #f5f7fa;
            font-weight: 600;
        }

        .table>tbody>tr>td {
            vertical-align: top;
        }

        .tight th,
        .tight td {
            padding: 6px 8px;
        }

        .title-row th {
            background: #e9edf3 !important;
            text-transform: uppercase;
        }

        .td-border-style {
            border-style: none;
        }

        /* avoid page breaks inside tables in PDF renderers */
        table,
        tr,
        td,
        th {
            page-break-inside: avoid;
        }
    </style>
</head>

<body>
    <div class="page-wrapper">
        <h3 class="tab-title text-center">CANS-F Summary Sheet</h3>

        <!-- IMMINENT RISK CRITERIA SELECTED -->

        <div class="section">
            {{candidatestraditionalHtml}}
        </div>
        <!-- QI Recommendation -->
        <div class="section">
            {{recommendation}}
        </div>

        <!-- COMPREHENSIVE FAMILY ASSESSMENT — Strengths -->
        <div class="section">
            {{family_strengths}}
        </div>

        <!-- COMPREHENSIVE FAMILY ASSESSMENT — Potential Strengths -->
        <div class="section">
            {{family_potential}}
        </div>

        <div class="section">
            {{familyCulture}}
        </div>
        <!-- COMPREHENSIVE CHILD ASSESSMENT — Actionable Needs (Youth) -->
        <div class="section">
            {{child_actionable}}
        </div>

        <!-- EMERGING ADULT NEEDS -->
        <div class="section">
            {{adult_actionable}}
        </div>

        <!-- COMPREHENSIVE CAREGIVER ASSESSMENT -->
        <div class="section">
            {{caregiver_actionable}}
        </div>

        <!-- Trauma Experiences (Over Lifetime) -->
        <div class="section">
            {{traumaexperiences}}
        </div>
    </div>
</body>

</html>
