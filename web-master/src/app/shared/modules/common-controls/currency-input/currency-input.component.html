<mat-form-field id="currency">
  <input matInput *ngIf="!hidden" (focus)="onFocus($event)" [required]='required' [disabled]="disabled ?? false" [(ngModel)]="formattedCurValue"
    [placeholder]="placeholder" [ngClass]="ngClass" (change)="onMaskCurChanged($event)" #formatted>
  <input matInput [min]="min" [max]="max" *ngIf="hidden" (focusout)="onFocusOut($event)" type="number"
    [(ngModel)]="curValue" [placeholder]="placeholder" (change)="onValueChange($event)" #original>
</mat-form-field>
