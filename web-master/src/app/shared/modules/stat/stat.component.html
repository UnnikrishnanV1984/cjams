<div class="card text-white bg-{{bgClass}}">
    <div class="card-header">
        <div class="row">
            <div class="col col-xs-3">
                <em class="fa {{icon}} fa-5x"></em>
            </div>
            <div class="col col-xs-9 text-end">
                <div class="d-block huge">{{count}}</div>
                <div class="d-block">{{label}}</div>
            </div>
        </div>
    </div>
    <div class="card-footer">
        <span class="float-start">View Details {{data}}</span>
        <a href="javascript:void(0)" class="float-end card-inverse">
            <span ><em class="fa fa-arrow-circle-right"></em></span>
        </a>
    </div>
</div>
