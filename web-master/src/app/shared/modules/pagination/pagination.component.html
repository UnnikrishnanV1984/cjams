<nav *ngIf="totalPages() > 1" aria-label="Pagination Navigation">
    <ul class="pagination pagination-sm justify-content-center mb-0">
        <!-- First Page -->
        <li class="page-item" [class.disabled]="page === 1">
            <a class="page-link" href="#" (click)="pageClicked(1); $event.preventDefault();"
                [attr.aria-disabled]="page === 1" tabindex="-1">First</a>
        </li>
        <li class="page-item" [class.disabled]="page === 1">
            <a class="page-link" href="#" (click)="pageClicked(prevPage()); $event.preventDefault();"
                [attr.aria-disabled]="page === 1" tabindex="-1">Previous</a>
        </li>
        <li class="page-item" *ngFor="let p of pagesRange()" [class.active]="p === page">
            <a class="page-link" href="#" (click)="pageClicked(p); $event.preventDefault();">{{ p }}</a>
        </li>
        <li class="page-item" [class.disabled]="page === totalPages()">
            <a class="page-link" href="#" (click)="pageClicked(nextPage()); $event.preventDefault();"
                [attr.aria-disabled]="page === totalPages()">Next</a>
        </li>
        <li class="page-item" [class.disabled]="page === totalPages()">
            <a class="page-link" href="#" (click)="pageClicked(totalPages()); $event.preventDefault();"
                [attr.aria-disabled]="page === totalPages()" tabindex="-1">Last</a>
        </li>
    </ul>
</nav>
