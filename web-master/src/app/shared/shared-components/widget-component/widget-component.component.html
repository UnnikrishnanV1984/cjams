
<div class="row">
    <ul class="statbox">
              <ng-container  *ngFor ="let item of widgetlist">
              <li  [class.active]="selectedGrid === item.description"
              [class.disabled] ="!checkifloaded(item.description)"
               (click)="displayList(item.description);progressselected=''" *ngIf ="item.hide != userRole">
               <span class="bold-text">{{ item.name === 'Case Closure Review' && userRole === 'ive-supervisor' ? 'Case Closure Assignment ' : item.name}}</span>
                <p>
                  <span class="pull-left bold-text">{{totalcountlist[item.description]}}</span>
                  <span class="pull-right">
                    <img [src]="item.img" class="icon-class" alt="item.name">
                  </span>
                </p>
              </li>
            </ng-container>

    </ul>
</div>
