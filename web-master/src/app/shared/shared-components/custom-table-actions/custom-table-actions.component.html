<div class="button-group">
    <button *ngFor="let status of statuslist" [ngClass]="{ 'active': selectedStatus === status.value }" class="status-btn"
        (click)="selectStatus(status)">
        <div>{{ status.label }}</div>
        <div class="count" [ngClass]="{
        'color-green': status.label === 'COMPLETED',
        'color-red':  status.label === 'PENDING'
      }">{{ status.count }}</div>
    </button>
</div>
