<div>
    <h4>Audit Trail</h4>
    <div class="searchDiv">
        <label class="rm10 fsm">Start Date:</label>
        <input type="date" class="rm50" [(ngModel)]="dateFrom" />
        <label class="rm10 fsm">End Date:</label>
        <input type="date" class="rm25" [(ngModel)]="dateTo" />
        <button class="rm10 btn-pri" (click)="onValidateSearch()">Search</button>
        <button class="rm10 btn-pri" (click)="onClear()">Clear</button>
    </div>
    <div class="tm40">
        <custom-table [tableData]="auditTrailList" [tableDataColumns]="auditTrailRequestColumns"
            [tableDataKeys]="auditTrailSearchKeys" [totalpagecount]="auditTrailTotalcount"
            (pageChangedEvent)="pageChanged($event)" [pageNumber]="paginationInfo.pageNumber"
            [styles]="auditStyles" (sortEvent)="onSort($event)" (fetchDataEvent)="callApi($event)"></custom-table>
    </div>
</div>
