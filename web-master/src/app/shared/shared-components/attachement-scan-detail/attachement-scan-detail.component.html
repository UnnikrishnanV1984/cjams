<div class="col-sm-12" [formGroup]="attachmentDetail">
    <div class="row form-search-person inline-form-wrap bg-gray pad-20">
        <div class="col-md-6">
            <div class="mb-3">
              <label class="full-collapse-horizontal required">
                File Name:
                <span
                  matTooltip="While editing File Name, please keep .pdf — only edit the text prior to that."
                  matTooltipPosition="right"
                  style="cursor: pointer; margin-left: 5px;"
                >
                  <i class="fa fa-info-circle text-primary" aria-hidden="true"></i>
                </span>
              </label>
              <input
                type="text"
                class="form-control"
                name=""
                placeholder="Enter File Name"
                formControlName="originalfilename"
              />
            </div>
            <div style="color: red; font-size: 14px;" *ngIf="fileNameError && isSaveBtnClicked">
                While editing File Name, please keep .pdf — only edit the text prior to that.
            </div>
        </div>
        <div class="col-md-6" formGroupName="documentattachment">
            <div class="mb-3">
                <label>Attachment Note:</label>
                <input type="text" class="form-control" name="" placeholder="Add Note" formControlName="note">
            </div>
        </div>
    </div>
    <div class="row form-search-person inline-form-wrap bg-gray pad-20 img-upinfo">
        <div class="col-md-3" formGroupName="documentattachment">
            <div class="mb-3">
                <label class="full-collapse-horizontal">Created by:</label>
                <input type="text" class="full-collapse-horizontal form-control" formControlName="insertedByUserName" placeholder="Add Creater name" [disabled] ="true">
            </div>
        </div>
        <div class="col-md-3">
            <div class="mb-3">
                <label class="full-collapse-horizontal">Description:</label>
                <input type="text" class="form-control full-collapse-horizontal" formControlName="description" placeholder="Add Description">
            </div>
        </div>
        <div class="col-md-3" formGroupName="documentattachment">
            <div class="mb-3">
                <label class="full-collapse-horizontal required">Attachment Type:</label>
                <select name="" class="form-select" formControlName="attachmenttypekey" (change)="typeUpdate($event)">
                    <option  [disabled]="this.isdisabled('')" value="">Attachment Type</option>
                    <option *ngFor="let attachment of attachmentTypeDropdown$ | async" [selected]="this.isselected(isdisabled)" [disabled]="this.isdisabled(attachment.value)" [value]="attachment.value">{{attachment.text}}</option>
                  </select>

            </div>
        </div>
        <div class="col-sm-3"> 
            <common-date-picker [max] = "maxDocumentDate" [required] ="true" (valueChange)="docDateAddUpdate($event)" placeholder="Document Date">
            </common-date-picker>
          </div>

        <div class="col-sm-6 required">
            <div class="select-icon">
              <input  formControlName="title"  type="text" [matMenuTriggerFor]="parentMenu" style="width: 100%;" [placeholder]='selectedItem()'>
              <mat-menu #parentMenu="matMenu">
                <button mat-menu-item *ngFor="let attachment of attachmentClassificationtype"
                  (mouseenter)="openChildMenu(attachment.value_text,attachment.ref_key)"
                  [matMenuTriggerFor]="childMenu">{{attachment.value_text}}</button>
              </mat-menu>
              <mat-menu #childMenu="matMenu">
                <button mat-menu-item *ngFor="let item of childArray"
                  (click)="selectChildMenu(item.value_text)" [matTooltip]="item.value_text">{{item.value_text}}</button>
              </mat-menu>
            </div>
        </div>

        <div class="col-sm-6" *ngIf="enablOtherTxt">
            <textarea name="" class="form-control" rows="7" spellcheck="True" placeholder="Other"
            maxlength="150"></textarea>
        </div>
    </div>
    <div class="row form-search-person inline-form-wrap bg-gray pad-20" formGroupName="documentattachment">
        <div class="col-md-6">
            <div class="mb-3">
                <label>Source / Author:</label>
                <input type="text" class="form-control" formControlName="sourceauthor" placeholder="Add Source / Author Name" name="">
            </div>
        </div>
        <div class="col-md-6">
            <div class="mb-3">
                <label>Subject:</label>
                <input type="text" class="form-control" formControlName="attachmentsubject" placeholder="Add Subject" name="">
            </div>
        </div>
        <div class="col-md-6">
            <div class="mb-3">
                <label>Position:</label>
                <input type="text" class="form-control" formControlName="sourceposition" placeholder="Add Position" name="">
            </div>
        </div>
        <div class="col-md-6">
            <div class="mb-3">
                <label>Purpose:</label>
                <input type="text" class="form-control" formControlName="attachmentpurpose" placeholder="Add Purpose" name="">
            </div>
        </div>
        <div class="col-md-6">
            <div class="mb-3">
                <label>Phone:</label>
                <input type="text" class="form-control" mask="(000) 000-0000" formControlName="sourcephonenumber" placeholder="Add Phone number"
                    name="">
            </div>
        </div>
        <div class="col-md-6">
            <div class="mb-3">
                <label>Acquisition Method:</label>
                <input type="text" class="form-control" formControlName="acquisitionmethod" placeholder="Add Acquisation Method" name="">
            </div>
        </div>
        <div class="col-md-6">
            <div class="mb-3">
                <label>Address:</label>
                <input type="text" class="form-control" formControlName="sourceaddress" placeholder="Add Address" name="">
            </div>
        </div>
        <div class="col-md-6">
            <div class="mb-3">
                <label>Location Of Original:</label>
                <input type="text" class="form-control" formControlName="locationoforiginal" placeholder="Add Location of original" name="">
            </div>
        </div>
    </div>
    <div class="col-sm-12 text-center">
        <button type="button" class="btn-pri" [disabled]="attachmentDetail.invalid || attachmentDetail.pristine" (click)="saveAttachmentDetails()">Save</button>
    </div>
</div>
