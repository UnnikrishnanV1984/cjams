<div class='survey container-fluid'>
	<form *ngIf="survey">
		<div class='survey-heading'>
			<h2 class='mt-15 mb-15'>Survey Detail</h2>
			<div class='row mb-15'>
				<div class='col-md-4 mt-15'>
					<select-question
						[question]='survey.participation'
						[name]='prefix + 34'
						[value]='answers[prefix + 34]'
						(didChange)='didChangeParticipation($event)'
					>
					</select-question>
							
					<mat-form-field>
						<mat-label>Date of Outcome Data Collection</mat-label>
						<input matInput 
							name='prefix + 35'
							[(ngModel)]='answers[prefix + 35]'
							placeholder=''
							autocomplete="off" [matDatepicker]='picker'
							(dateChange)='didChangeDate($event)'
						>
						<mat-datepicker-toggle matSuffix [for]='$any(picker)'></mat-datepicker-toggle>
						<mat-datepicker #picker startView='year' [startAt]='startDate'></mat-datepicker>
					</mat-form-field>
					<mat-checkbox name='prefix + 35' [(ngModel)]='answers[prefix + 36]' (change)="didChangeStatus($event)">
						Foster Care Status - Outcomes
					</mat-checkbox>
					
				</div>
			</div>
		</div>
		
		<radio-question 
			*ngFor='let question of survey?.questions'
			[question]='question'
			[name]='prefix + question.id'
			[value]='answers[prefix + question.id]'
			(didChange)='updateAnswer($event)'
		></radio-question>

		<div class='row'>
			<mat-divider></mat-divider>
			<div class='col-md-12 text-end'>
				
				<ui-modal-button
					modalId="survey-save-modal"
					[data]="'person'"
					label="Save"
					(didClick)="onClickSave($event)"
				>
				</ui-modal-button>
			</div>
		</div>
	</form>
</div>
