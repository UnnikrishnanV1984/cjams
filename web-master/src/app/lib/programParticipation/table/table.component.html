<table class="program-participation-table" *ngIf="programs.length !== 0" aria-describedby="participation table">
	<thead>
		<th scope="col" *ngFor="let column of columns">{{ column.name }}</th>
	</thead>
	<tbody>
		<ng-container  *ngFor="let program of programs">
			<tr (click)="handleClick(program.id)">
				<td *ngFor="let column of columns">{{ program[column.property] }}</td>
			</tr>
			<tr *ngIf="expanded === program.id && programParticipationService.loadedCaseDetails?.casenumber === program.id">
				<td [attr.colspan]="columns.length">
					<div class="program-detail">
						<span class="program-detail-label">CIS Reference Number: </span> <span>{{ programParticipationService.loadedCaseDetails.cisrefid }}</span>
					</div>
					<div class="program-detail">
						<span class="program-detail-label">Phone Number: </span> <span>{{ programParticipationService.loadedCaseDetails.phonenumber }}</span>
					</div>
				</td>
			</tr>
		</ng-container>
	</tbody>
</table>
<div class="loading-spinner" *ngIf="programParticipationService.loadingPrograms">
	<mat-spinner></mat-spinner>
</div>
<div *ngIf="programs.length === 0 && !programParticipationService.loadingPrograms">No results found.</div>
