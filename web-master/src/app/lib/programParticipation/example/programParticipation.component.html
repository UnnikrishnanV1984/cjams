<div class="container-fluid">
	<h1>Program Participation</h1>

	<ui-modal-button
		modalId="program-participation-modal"
		[data]="person"
		label="View Programs"
		(didClick)="programParticipationService.onSelectPerson($event)"
	>
	</ui-modal-button>
	
	<ui-modal
		modalId="program-participation-modal"
		title="Program Participation"
	>
		<program-participation-table
			[programs]="programParticipationService.loadedPrograms"
		>
		</program-participation-table>
	</ui-modal>
</div>
