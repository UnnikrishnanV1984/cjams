<div class="">
    <div class="col-box mytasks-action ">
        <h2 class="clsLeft-200">
            {{ totalRecords$ | async }}
        </h2>
        <table style="width:100%" class="perform-table fixed_header my-task-tbl" aria-describedby="tbl-dashboard-checklist">
            <thead>
                <tr>
                    <th scope="col">Task</th>
                    <th scope="col">Actvity Name</th>
                    <th scope="col">Due Date</th>
                    <th scope="col">Status</th>
                </tr>
            </thead>
            <tbody *ngIf="(getCheckListNotificationList$ | async); let checkList">
                <tr *ngFor="let item of checkList">
                    <td>{{ item.task }}</td>
                    <td>{{ item.actvityname }}</td>
                    <td>{{ item.duedate | date: 'MM/dd/yyyy' }}</td>
                    <td>{{ item.taskstatustype }}</td>
                </tr>
                <tr *ngIf="checkList?.length === 0">
                    <td colspan="4">No Records Found</td>
                </tr>
            </tbody>
        </table>
        <div class="text-center mt-10" *ngIf="{ taskList: getCheckListNotificationList$ | async, totalRecords: totalRecords$ | async } as validatePagination">
            <pagination
                *ngIf="validatePagination.taskList?.length !== 0"
                [totalItems]="validatePagination.totalRecords ?? 0"
                [(ngModel)]="paginationInfo.pageNumber"
                (pageChanged)="pageChanged($event.page)"
                class="pagination-sm"
                [boundaryLinks]="true"
                [maxSize]="10"
            >
            </pagination>
        </div>
    </div>
</div>
