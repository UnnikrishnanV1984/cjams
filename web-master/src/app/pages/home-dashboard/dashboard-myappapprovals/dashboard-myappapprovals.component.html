<div class="">
  <div class="col-box mydsds-action">
      <h2>{{totalRecords$|async}}
      </h2>
      <table style="width:100%"class="perform-table fixed_header ir-intake" aria-describedby="tbl-myapprovals">
          <thead>
              <tr>
                  <th scope="col">Application Number</th>
                  <th scope="col">Assigned By Person</th>
                  <th scope="col">Assigned By Role</th>
                  <th scope="col">Assigned on</th>
                  <th scope="col">Comments</th>
                  <th scope="col">Decision</th>
              </tr>
          </thead>
          <tbody *ngIf="myApplicationList$ | async; let applicationList">
              <tr *ngFor="let application of applicationList">
                  <td>
                    <a [routerLink]="['/pages/provider-applicant/new-applicant', application.objectid]">{{application.objectid}}</a>
                 </td>
                  <td>{{application.fullname}}</td>
                  <td>{{application.fromroleid}}</td>
                  <td>{{application.insertedon}}</td>
                  <td>{{application.remarks}}</td>
                  <td>{{application.status}}</td>
              </tr>
          </tbody>
      </table>
      <div class="text-center mt-10" *ngIf="{applicationList:myApplicationList$ | async,totalRecords:totalRecords$ | async} as validatePagination">
          <pagination *ngIf="validatePagination.applicationList?.length!==0" [totalItems]="validatePagination.totalRecords ?? 0" [(ngModel)]="paginationInfo.pageNumber"
              (pageChanged)="pageChanged($event.page)" class="pagination-sm" [boundaryLinks]="true" [maxSize]="10">
          </pagination>
      </div>

  </div>
</div>
