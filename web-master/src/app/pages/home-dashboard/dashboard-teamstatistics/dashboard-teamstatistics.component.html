<div class="">
    <div>
        <div style="padding: 10px; float: right;">
            <a style="font-size: 11px;color: #b39898;padding: 5px 15px;line-height: normal;border-radius: 15px;" [ngClass]="{'intro': dataFor==='day'}"
                (click)="getWidgetData('day')">Day</a>
            <a style="font-size: 11px;color: #b39898;padding: 5px 15px;line-height: normal;border-radius: 15px; " [ngClass]="{'intro': dataFor==='month'}"
                (click)="getWidgetData('month')">Month</a>
            <a style="font-size: 11px;color: #b39898;padding: 5px 15px;line-height: normal;border-radius: 15px;" [ngClass]="{'intro': dataFor==='year'}"
                (click)="getWidgetData('year')">Years</a>
        </div>

    </div>
    <div class="row">
        <div class="col-md-12">
            <div class="col-box" id="container-pie" style=" height: 59.5vh">
                <div *ngIf="!noData">
                    
                    <highcharts-chart [Highcharts]="Highcharts" [options]="chart"></highcharts-chart>
                </div>
                <div *ngIf="noData">
                    <p>No Records Found</p>
                </div>
            </div>
        </div>
    </div>
</div>
