<div class="row">
  <form [formGroup]="broadcastMessageForm">
    <div class="col-sm-12">
      <div class="row">
        <div class="col-md-9">
          <div class="broadcast-msg">
            <div class="mb-3">
              <label class="required">Message:</label>
              <textarea formControlName="details" id="details" class="form-control" rows="7" spellcheck="True" placeholder="Enter Message"></textarea>
            </div>
            <control-messages [control]="getControlByIndexFn('details')"></control-messages>
          </div>
        </div>
        <div class="col-md-3 text-center">
          <div class="">
            <button class="btn-pri mt-50" (click)="addBroadCastMessage()">Save</button>
          </div>
        </div>
      </div>
    </div>
  </form>
  <div class="col-md-12">
    <div class="broadcast-table">
      <table class="table" aria-describedby="Users and roles">
        <thead>
          <tr>
            <th scope="col">
              <label class="control control--checkbox m-b-0" (change)="selectAll()">
                <input type="checkbox">
                <div [class]="isallusers ? 'control__indicator default-checkmark' : 'control__indicator'"></div>
              </label>
            </th>
            <th scope="col">Username</th>
            <th scope="col">Role</th>
            <th scope="col">Email</th>
          </tr>
        </thead>
      </table>
      <ng-template #noItems>No Items!</ng-template>
      <ng-template #loading>
        <div class="loading-img">
          <img width="50" src="assets/images/loading.gif" alt="loader">
        </div>
      </ng-template>
      <div class="text-center">
        <pagination [totalItems]="(totalResulRecords$ | async) ?? 0" [(ngModel)]="paginationInfo.pageNumber" (pageChanged)="pageChanged($event.page)"
          class="pagination-sm" [boundaryLinks]="true" [maxSize]="5"></pagination>
      </div>
    </div>
  </div>
</div>
