<div class="modal fade on-demand-activities" id="myModal-view-notification" role="dialog" data-bs-backdrop="static" data-bs-keyboard="false">
    <div class="modal-dialog modal-lg">
        <!-- Modal content-->
        <div class="modal-content customize-modal">
            <div class="modal-header">
                <h4 class="modal-title">View Notification</h4>
                <button type="button" class="btn-close close pull-right" data-bs-dismiss="modal" aria-label="Close" (click)="closePopup()">X</button>
            </div>
            <div class="modal-body">
                <div class="row form-wrapper">
                    <div class="col-sm-12">
                        <p class="no-mar">Case Number:
                            <span>{{selectedNotification?.servicerequestnumber}}</span>
                        </p>
                    </div>
                    <div class="col-md-6 col-xs-12 col-sm-6">
                        <div class="mb-3">
                            <p>From</p>
                            <input type="text" class="form-control" name="" value="{{selectedNotification?.frommail}}" readonly>
                        </div>
                    </div>
                    <div class="col-md-6 col-xs-12 col-sm-6">
                        <div class="mb-3">
                            <p>To</p>
                            <input type="text" class="form-control" name="" value="{{selectedNotification?.tomail}}" readonly>
                        </div>
                    </div>
                    <div class="col-md-6 col-xs-12 col-sm-6">
                        <div class="mb-3">
                            <p>CC</p>
                            <input type="text" class="form-control" value="" readonly>
                        </div>
                    </div>
                    <div class="col-md-6 col-xs-12 col-sm-6">
                        <div class="mb-3">
                            <p>Priority:</p>
                            <div class="">
                                <ul class="list-unstyled list-inline">
                                    <li class="low hidden list-inline-item"  *ngIf="selectedNotification?.priorityleveltypekey === 'Low'">
                                        <span class="badge bg-success">{{selectedNotification?.priorityleveltypekey}}</span>
                                    </li>
                                    <li class="medium list-inline-item" *ngIf="selectedNotification?.priorityleveltypekey === 'Normal'">
                                        <span class="label label-warning">{{selectedNotification?.priorityleveltypekey}}</span>
                                    </li>
                                    <li class="high hidden list-inline-item" *ngIf="selectedNotification?.priorityleveltypekey === 'High'">
                                        <span class="label label-danger">{{selectedNotification?.priorityleveltypekey}}</span>
                                    </li>
                                </ul>
                            </div>
                        </div>
                    </div>
                    <div class="clearfix"></div>
                    <div class="col-md-6 col-xs-12 col-sm-6 clearfix">
                        <div class="mb-3">
                            <p>Subject:</p>
                            <input type="text" class="form-control" name="" value="{{selectedNotification?.subject}}" readonly>
                        </div>
                    </div>
                    <div class="col-md-12 col-xs-12 col-sm-12 clearfix">
                        <div class="mb-3">
                            <p>Body:</p>
                            <textarea name="" class="form-control" rows="5" readonly>{{selectedNotification?.body}}</textarea>
                        </div>
                    </div>
                    <div class="col-md-6 col-xs-12 col-sm-6">
                        <div class="mb-3">
                            <p>Attachments:</p>
                            <p class="value-txt">
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
