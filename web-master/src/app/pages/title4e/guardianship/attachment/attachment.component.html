
<div class="row">
    <div class="col-md-12" [formGroup]="personDocumentFilterForm">
        <div class="row">
            <div class="col-md-3">
                <mat-form-field>
                    <mat-label>Document Title</mat-label>
                    <input (change)="filterPersonDocuments()" matInput placeholder="" formControlName="title">
                </mat-form-field>
            </div>
            <div class="col-md-3">
                <mat-form-field>
                    <mat-label>Category</mat-label>
                    <mat-select multiple formControlName="category">
                        <mat-option *ngFor="let item of categories" [value]="item.subcategory">{{item.subcategory}}</mat-option>
                    </mat-select>
                </mat-form-field>
            </div>
            <div class="col-md-3">
                <mat-form-field>
                    <mat-label>Sub Category</mat-label>
                    <mat-select multiple formControlName="subcategory">
                        <mat-option *ngFor="let item of subCategories" [value]="item.subcategory">{{item.subcategory}}</mat-option>
                    </mat-select>
                </mat-form-field>
            </div>
            <div class="col-md-3">
                <mat-form-field>
                    <mat-label>Uploaded by</mat-label>
                    <input matInput placeholder="" formControlName="worker">
                </mat-form-field>
            </div>
            <div class="col-md-2">
                <common-date-picker formControlName="actualdocumentdate" placeholder="Document Date">
                </common-date-picker>
            </div>
            <div class="col-md-3">
                <button class="btn-pri m-t-20" (click)="filterPersonDocuments()">Filter</button>
                <button class="btn-pri m-t-20 m-l-20" (click)="resetPersonFilterDocuments()">Reset</button>
            </div>
        </div>
    </div>
</div>

<div [ngStyle]="{ 'pointer-events' : isCLW ? 'none' : 'inherit' }">
    <attachment-upload-shared [load] = "load"  [uploadedDocuments]="uploadedFiles" (FileUploaded)="FileUploaded($event)" (uploadclosed)="uploadclosed($event)"
    pageType="guardianship" [ivePersonId]="personid"  [additionalobjectid]="additionalobjectid"></attachment-upload-shared>
    <document-upload-list-shared [paginationRecorsds] = "totalRecordsperson" pageType="ivegap" [paginationRecorsds] = "paginationInfoperson" (pageChangedEvent)="pdpageChanged($event)"
        (loadEvent) = "updateLoad()" [ngClass]="''" [uploadedFiles]="uploadedFiles" [showedit] = "true" [uploadNumber]="uploadNumber" (FileEdited)="FileUploaded($event)" [ivePersonId]="personid"></document-upload-list-shared>
</div>
