<div class="dashboard-cont no-pad">
  <div class="tab-horizontal">
    <div class="col-md-10 col-md-offset-1">
  <div class="bs-example">
    <table class="table" sortable-table aria-describedby="Client Details">
      <thead style="background-color: #AEBED6;">
        <tr>
          <th scope="col">Client ID</th>
          <th scope="col">Removal ID</th>
          <th scope="col">Referral ID</th>
          <th scope="col">Action</th>
        </tr>
      </thead>
      <tbody>
        <ng-container *ngFor="let item of csmsdetails">
          <tr>
            <td>{{item.clientid}}</td>
            <td>{{item.removalid}}</td>
            <td>{{item.csmsreferralid}}</td>
            <td>
              <button type="button" (click)="sendIVEInformation(item)" class="btn btn-pri"> Send Referral</button>
             </td>
          </tr>
        </ng-container>
      </tbody>
    </table>
    <ng-template #noItems>
      <p class="no-datatxt"> No Items! </p>
    </ng-template>
  </div>
  </div>
  </div>
</div>
