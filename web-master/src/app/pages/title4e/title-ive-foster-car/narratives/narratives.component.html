<div [ngStyle]="{ 'pointer-events' : isCLW ? 'none' : 'inherit' }">
  <div class="row" style="margin-top:20px;">
    <div class="col-sm-12 nextprev-btn">
      <div>
        <label style="margin-left: 2%;">NARRATIVE</label>
      </div>
      <div class="row" style="margin-left:1%">
        <div class="col-xs-12" style="width: 98%; height:400px;">
          <br>
          <div id="divNonEditNarrative"></div>
          <div id="divEditNarrative" class=" narrative-textarea" style="height: 300px;">
            <quill-editor [(ngModel)]="progressNote.description"> </quill-editor>
          </div>
        </div>
        <div class="modal-footer wizard-buttons" *ngIf="!isreadonly && _authService.readonlyButton('titleive_read_only_access','')">
          <button *securityKeyNew = "'ivefc,ivefc.narrative.save'" [fieldKeyNew] = "'ivefc,ivefc.narrative.save'" class="btn-pri" (click)="addUpdateNarrative()">SAVE</button>
        </div>
      </div>
    </div>
  </div>
  <div class="col-md-12 card-body" style="margin-top:20px; height:300px;">
    <div class="col-md-6">
    </div>
  </div>

</div>
