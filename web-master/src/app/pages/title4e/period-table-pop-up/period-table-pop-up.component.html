<div class="panel panel-primary">
    <div class="card-header">
        <strong>Review Period </strong><span (click)="onTimes()" class="pull-right"><i class="fa fa-times" aria-hidden="true"></i></span>
    </div>
    <div class="card-body">
        <table class="table" aria-describedby="Period Table">
            <thead style="background-color: white">
                <tr>
                    <th scope="col">SELECT</th>
                    <th scope="col">COMPONENT</th>
                    <th scope="col">PERIOD</th>
                    <th scope="col">PERIOD START DATE</th>
                    <th scope="col">PERIOD END DATE</th>
                </tr>
            </thead>
            <tbody class="table-striped" style="background-color:white; padding-bottom: 20px;">
                <tr *ngFor="let item of periodTable">
                    <td style="color:#039be6;"><input type="checkbox" (change)="onSelectItem($event, item)"></td>
                    <td>{{item.cmpnt ? item.cmpnt : 'N/A'}}</td>
                    <td>{{item.sqnm_sw}} </td>
                    <td>{{item.start_dt | date: 'MM/dd/yyyy'}} </td>
                    <td>{{item.end_dt ? (item.end_dt | date: 'MM/dd/yyyy') : 'N/A'}}</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<button (click)='onSubmit()' class="pull-right btn btn-pri">SUBMIT
</button>
