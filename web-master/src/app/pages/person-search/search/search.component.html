<div id="Profile-info m-t-50" class="container-fluid">
    <h4 class="mt-20">PERSON SEARCH</h4>
    <form [formGroup]="involvedPersonSearchForm">

        <div class="row m-height">
            <div class="col-sm-4 col-sm-offset-2">
                <mat-form-field>
                    <mat-label>First Name</mat-label>
                    <input type="text" matInput formControlName="firstname" placeholder="">
                </mat-form-field>
                
                <mat-form-field>
                    <mat-label>Last Name</mat-label>
                    <input type="text" matInput formControlName="lastname" placeholder="">
                </mat-form-field>


                <div class="row">
                    <div class="col-sm-6">
                        <mat-form-field>
                            <mat-label>Approx. Age</mat-label>
                            <input type="text" matInput placeholder="" formControlName="age">
                        </mat-form-field>
                    </div>
                    <div class="col-sm-6">
                        <mat-form-field>
                            <mat-label>Select Gender</mat-label>
                            <mat-select placeholder="" formControlName="gender">
                                <mat-option *ngFor="let item of genderDropdownItems$ | async" value="{{item.gendertypekey}}">{{item.typedescription}}</mat-option>
                            </mat-select>
                        </mat-form-field>
                    </div>
                </div>

                <mat-form-field>
                    <mat-label>SSN</mat-label>
                    <input type="text" matInput placeholder="" mask="000-00-0000" formControlName="ssn">
                </mat-form-field>

                <mat-form-field>
                    <mat-label>Complaint #</mat-label>
                    <input type="text" matInput placeholder="" formControlName="complaintnumber">
                </mat-form-field>
            </div>
            <div class="col-sm-4">
                <mat-form-field>
                    <mat-label>CJIS # / SID # / Assist PID # /CJAMS PID #</mat-label>
                    <input type="text" matInput placeholder="" formControlName="cjisnumber">
                </mat-form-field>
                <mat-form-field>
                    <mat-label>Petition / Folder ID</mat-label>
                    <input type="text" matInput placeholder="" formControlName="petitionid">
                </mat-form-field>

                <div class="row">
                    <div class="col-sm-6">
                        <mat-form-field>
                            <mat-label>Zip Code</mat-label>
                            <input type="text" matInput placeholder="" mask="00000-9999" formControlName="zip">
                        </mat-form-field>
                    </div>
                    <div class="col-sm-6">
                        <mat-form-field>
                            <mat-label>Select State</mat-label>
                            <mat-select placeholder="" formControlName="stateid">
                                <mat-option *ngFor="let item of stateDropdownItems$ | async" value="{{item.stateabbr}}">{{item.statename}}</mat-option>
                            </mat-select>
                        </mat-form-field>
                    </div>
                </div>
                <mat-form-field>
                    <mat-label>City</mat-label>
                    <input type="text" matInput placeholder="" formControlName="city">
                </mat-form-field>
                <mat-form-field>
                    <mat-label>County</mat-label>
                    <input type="text" matInput placeholder="" formControlName="county">
                </mat-form-field>
            </div>
        </div>
        <div class="row">
            <div class="col-sm-10">
                <div class="wizard-buttons text-end">
                    <input class="btn-bg" type="button" (click)="clearPersonSearch()" value="Clear" />
                    <button class="btn-pri btn" type="submit" [disabled]="involvedPersonSearchForm.pristine || involvedPersonSearchForm.invalid"
                        (click)="searchInvolvedPersons(involvedPersonSearchForm.value)">Find</button>
                </div>
            </div>
        </div>
        
    </form>
</div>
