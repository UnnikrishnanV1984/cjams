<div class="form-search-person address-form no-pad">
    <div class="col-sm-8">
        <span *ngIf = "!onlyadoptivehomeprovider" style="color:red">*Note: Provider Address will not be editable from Child Welfare, as there are placement structures other than Adoptive home Active.</span> 
    </div>
    <div class="col-sm-12">
        <br>
    </div>
    <div class="row m-b-10">
        <div class="col-sm-12">
            <div class="row m-t-10 m-b-5">
                <div class="col-sm-12">
                    <div class="col-xs-6" *ngIf="!showAddress">
                        <provider-address [object_type]="object_type" [isReadOnly]="isReadOnly && onlyadoptivehomeprovider"
                                    [provider_type]="'PUBLIC_PROVIDER'" [object_id]="providerId" (addressupdated)="addressupdated($event)"></provider-address>
                    </div>
                    <div class="col-xs-6" [formGroup]="paymentForm">
                        <div class="row ">
                            <div class="col-xs-12 dt-m-pa">
                                <h4>Payment Address</h4>
                            </div>
                            <div class="col-xs-8">
                                <mat-form-field>
                                    <mat-label>Send Payment To</mat-label>
                                    <mat-select [disabled]="!isReadOnly || !onlyadoptivehomeprovider" required placeholder="" formControlName="pay_to_affiliate_cd" (selectionChange)="addressTypeChanged()">
                                        <mat-option *ngFor="let item of send_to_list" value="{{item.picklist_value_cd}}">
                                            {{ item.value_tx }}</mat-option>
                                    </mat-select>
                                </mat-form-field>
                            </div>
                            <div  class="col-xs-4 text-end" >
                                <button *ngIf="isReadOnly && onlyadoptivehomeprovider && showsavebutton" class="btn-pri" (click)="savePayment()">Save</button>
                            </div>
                            <div class="col-xs-4">
                            </div>
                            <div class="col-xs-8">
                                <h5><span class="span-hidden">Hidden</span>{{paymentAddress}}</h5>
                            </div>
                            <div class="col-xs-4">
                                <button class="no-bg" (click)="addressTypeChanged()" matTooltip="Refresh" *ngIf="showAddress"><em class="fa fa-refresh"></em></button>
                                <button class="no-bg" (click)="showAddress = true " matTooltip="Edit" *ngIf="!showAddress && isPayment && pay_to_affiliate_cd!='3368'"><em class="fa fa-pencil"></em></button>
                            </div>
                            <div class="col-xs-12" *ngIf="showAddress">
                                <mat-card appearance="outlined">
                                    <button class="no-bg pull-right" (click)="addressTypeChanged()" matTooltip="Close Address Card"><em class="fa fa-close"></em></button>
                                    <provider-address [object_type]="object_type" [isReadOnly]="isReadOnly && onlyadoptivehomeprovider"
                                    [object_id]="providerId" [isPayment] = "isPayment"></provider-address>
                                </mat-card>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
