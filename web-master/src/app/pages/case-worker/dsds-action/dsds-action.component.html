<div class="tab-pane active" id="dsds-action-tab">
    <div class="tab-horizontal">
        <div class="tab-horizontal-bg" id="cw-scroll-tab">
            <div class="d-flex border-bottom align-items-center" id="nav-bar-scroll">
                <button class="chevron-circle-btn" (click)="scrollTabs('left')" [disabled]="!canScrollLeft">
                    <em class="fa fa-chevron-circle-left"></em>
                </button>
                    <ul class="nav nav-pills caseworker-tabs text-tran nav-pills-scroll-class" role="tablist" #tabListRef (scroll)="onTabScroll()">
                        <ng-container *ngFor="let tabItem of tabList">
                            <li role="presentation" *securityKey="tabItem.screenKey" class="nav-item aut-lnk-li" [ngClass]="{'aut-lnk-placement-li':tabItem.tabName ==='Placement'}">
                                <a class="nav-link text-uppercase" [id]="tabItem.id" role="tab" [ngClass]="{active: tabItem.isActive, 'aut-lnk-placement':tabItem.tabName ==='Placement', 'aut-lnk-permanencyplan':tabItem.tabName ==='permanency Plan'}" (click)="selectTab(tabItem)">{{tabItem.tabName}}</a>
                            </li>
                        </ng-container>
                    </ul>
                <button class="chevron-circle-btn" (click)="scrollTabs('right')" [disabled]="!canScrollRight">
                    <em class="fa fa-chevron-circle-right"></em>
                </button>
            </div>
            <div class="tab-content box-grid ps-0 pe-0">
                <div class="tab-pane fade show active">
                    <router-outlet></router-outlet>
                </div>
            </div>
        </div>
    </div>
</div>
<div class="modal fade" id="docu-View" role="dialog" aria-labelledby="myModalLabel">
    <div class="modal-dialog modal-lg custom-wid" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h4 class="modal-title">PDF preview</h4>
                <button type="button" id="pdf-header-id" class="btn-close close pull-right" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <case-worker-document-creator></case-worker-document-creator>
            </div>
        </div>
    </div>
</div>
<div class="modal fade" id="folder-change" role="dialog" aria-labelledby="myModalLabel">
    <div class="modal-dialog modal-md custom-wid" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h4 class="modal-title">Folder Change</h4>
                <button type="button" id="pdf-header-id" class="btn-close close pull-right" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <folder-change></folder-change>
            </div>
        </div>
    </div>
</div>
