<div class="modal fade custom-modal in" id="involved-person-dhs-action" role="dialog"
 data-bs-backdrop="static" data-bs-keyboard="false" style="display: block;">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h4 class="modal-title"> DHS Actions </h4>
                <button type="button" class="btn-close close pull-right" data-bs-dismiss="modal"  [routerLink]="['/pages/case-worker/'+intakeRequestId+'/'+ daNumber+'/dsds-action/involved-person']"></button>
            </div>
            <div class="modal-body">
                <div class="table-responsive group-table">
                    <div class="card-group" id="accordion">
                        <div class="card panel-default"  *ngFor="let action of priorList$ | async; let i = index">
                            <div class="card-header">
                                <h4 class="card-title collapsed">
                                    <a href="#collapse-{{i}}"  data-bs-toggle="collapse"  aria-controls="collapseOne" data-parent="#accordion">{{action.daTypeName}}
                                        <span class="glyphicon pull-right glyphicon-plus"></span>
                                    </a>
                                </h4>
                            </div>
                            <div id="collapse-{{i}}" class="panel-collapse collapse" aria-expanded="true" style="height: 0px;">
                                <div class="card-body">
                                    <div class="row">
                                        <div class="col-sm-12">
                                            <div class="table-responsive">
                                                <table aria-describedby="tbl-da-status-details" class="table table-bordered">
                                                    <thead>
                                                        <tr>
                                                            <th scope="col">DA#</th>
                                                            <th scope="col">SubType</th>
                                                            <th scope="col">Name</th>
                                                            <th scope="col">Role</th>
                                                            <th scope="col">Received Date</th>
                                                            <th scope="col">Date Completed</th>
                                                            <th scope="col">Status</th>
                                                        </tr>
                                                    </thead>
                                                    <tbody>
                                                        <tr *ngFor="let list of action?.daDetails">
                                                            <td>{{list.danumber}}</td>
                                                            <td>{{list.description}}</td>
                                                            <td>{{list.firstname}} {{list.lastname}}</td>
                                                            <td>{{list.role}}</td>
                                                            <td>{{list.datereceived | date:'MM/dd/yyyy'}}</td>
                                                            <td>{{list.datecompleted | date: 'MM/dd/yyyy'}}</td>
                                                            <td>{{list.status}}</td>
                                                        </tr>
                                                    </tbody>
                                                </table>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>
