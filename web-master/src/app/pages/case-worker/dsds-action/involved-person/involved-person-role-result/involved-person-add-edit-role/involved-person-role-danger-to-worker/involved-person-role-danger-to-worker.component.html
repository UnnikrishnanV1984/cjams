<div class="tab-pane " id="worker">
   <form action=""  [formGroup]="dangerToWorkerFormGroup" class="dangerwork-form form-search-person">
        <label style="width: 100%;">Does the person seem harmful to you?</label>
        <div class="col-sm-6">
            <div class="mb-3">
                <label class="control control--radio">
                    No
                    <input type="radio" value="0" formControlName="dangerlevel" [checked]="(danger === 0)" (change)="dangerToWorkerFormGroup.get('dangerreason').disable(); dangerToWorkerFormGroup.get('dangerreason').reset(); ">
                    <div class="control__indicator"></div>
                </label>
                <label class="control control--radio">
                    Yes
                    <input type="radio" value="1" formControlName="dangerlevel" [checked]="(danger === 1)"  (change)="dangerToWorkerFormGroup.get('dangerreason').enable(); ">
                    <div class="control__indicator"></div>
                </label>
                <label class="control control--radio">
                    Unknown
                    <input type="radio" value="null" formControlName="dangerlevel" [checked]="(danger === null)" (change)="dangerToWorkerFormGroup.get('dangerreason').disable(); dangerToWorkerFormGroup.get('dangerreason').reset(); ">
                    <div class="control__indicator"></div>
                </label>
            </div>
        </div>
        <div class="clearfix"></div>

        <div class="">
            <label style="width: 100%;">Why to you think so?</label>
        </div>
        <div class="mb-3">
            <textarea name="" class="form-control full-collapse-horizontal" rows="3" formControlName="dangerreason" placeholder="Enter Reasons"></textarea>
        </div>

    </form>
</div>
