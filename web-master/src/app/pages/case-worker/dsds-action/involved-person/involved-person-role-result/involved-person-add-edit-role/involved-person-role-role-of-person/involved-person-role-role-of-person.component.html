<div class="tab-pane" id="person-role">
    <div class="form-search-person">
        <form [formGroup]="actorFormGroup">
            <div class="row">
                <div class="col-sm-6">
                    <div class="mb-3">
                        <label class="full-collapse-horizontal">Select the role of the person</label>
                        <ng-select #inref formControlName="actortype" (change)="actorOnChange(inref.selectedItems[0])" [searchable]="true" [clearable]="false">
                            <ng-option selected="selected" value="">Select</ng-option>
                            <ng-option *ngFor="let actor of actorTypes$ | async | orderBy:'text'" [value]="actor.value">{{actor.text}}</ng-option>
                        </ng-select>

                    </div>
                    <div class="Reported-Adult-sec" style="display:none;">
                        <div class="mb-3">
                            <label class="full-collapse-horizontal">Select RA's Living Arrangement</label>
                            <select name="" class="form-select full-collapse-horizontal">
                                <option value="">Select</option>
                                <option value="">With non-related person </option>
                            </select>
                            <span class="select__arrow pos"></span>
                        </div>
                        <div class="mb-3">
                            <label class="full-collapse-horizontal">Does RA have signs of mental illness?</label>
                            <div class="no-mar col-sm-6">
                                <label class="control control--radio">
                                    No
                                    <input type="radio" name="ill   ness">
                                    <div class="control__indicator"></div>
                                </label>
                                <label class="control control--radio">
                                    Yes
                                    <input type="radio" checked="" name="illness">
                                    <div class="control__indicator"></div>
                                </label>
                                <label class="control control--radio">
                                    Unknown
                                    <input type="radio" name="illness">
                                    <div class="control__indicator"></div>
                                </label>
                            </div>
                            <input type="text" class="form-control full-collapse-horizontal txtbox-light-bg" placeholder="Enter reason / justification if any ... ">
                        </div>
                        <div class="mb-3">
                            <label class="full-collapse-horizontal">Does RA appear to be mentally impaired?</label>
                            <div class="col-sm-6 no-mar">
                                <label class="control control--radio">
                                    No
                                    <input type="radio" name="impaired">
                                    <div class="control__indicator"></div>
                                </label>
                                <label class="control control--radio">
                                    Yes
                                    <input type="radio" checked="" name="impaired">
                                    <div class="control__indicator"></div>
                                </label>
                                <label class="control control--radio">
                                    Unknown
                                    <input type="radio" name="impaired">
                                    <div class="control__indicator"></div>
                                </label>
                            </div>
                            <input type="text" class="form-control full-collapse-horizontal txtbox-light-bg" placeholder="Enter reason / justification if any ... ">
                        </div>
                    </div>

                    <div class="mb-3 " *ngIf="showRelation">
                        <label class=""> Relationship to RA:</label>
                        <br/>
                        <div class="relation-checks full-collapse-horizontal" >
                            <div class="no-mar " *ngFor="let race of relationCheckboxFormArray.controls; let i=index">
                                <label class="control control--checkbox full-collapse-horizontal">
                                    {{relationCheckboxItems[i]?.description}}
                                    <input type="checkbox" (change)="onChangeRelation($event)" [value]="relationCheckboxItems[i]?.relationshiptypekey" />
                                    <span class="control__indicator"></span>
                                </label>
                            </div>
                        </div>

                    </div>


                    <button type="button" class="btn-bg" (click)="addRole(actorFormGroup.value)">Add Role</button>

                </div>
                <div class="col-sm-6">

                    <div class="tavle-responsive big-top-space">
                        <table class="table table-bordered icon-action" aria-describedby="tbl-rol-desc-dtls">
                            <thead>
                                <tr>
                                    <th scope="col"> Role </th>
                                    <th scope="col"> Description </th>
                                    <th scope="col">Actions </th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr *ngFor="let item of addedActor">
                                    <td> {{item.actortypedesc?.actortype}}</td>
                                    <td> {{item.actortypedesc?.typedescription}} </td>
                                    <td>
                                        <span data-bs-toggle="tooltip" data-bs-placement="top" class="left-mspace" data-original-title="Delete" (click)="confirmActor(item)">
                                            <a>
                                                <em class="fa fa-trash text-16"> </em>
                                            </a>
                                        </span>
                                    </td>
                                </tr>

                            </tbody>
                        </table>
                    </div>


                </div>
            </div>
        </form>
    </div>
</div>
