<div class="modal fade custom-modal in" id="view-persons-search" role="dialog" style="display: block;" data-bs-backdrop="static" data-bs-keyboard="false">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h4 class="modal-title">View Person Details
                        <span></span>
                    </h4>
                    <button type="button" class="btn-close close pull-right" data-bs-dismiss="modal" [routerLink]="['/pages/case-worker/'+id+'/'+ daNumber+'/dsds-action/involved-person']"></button>
                </div>

                <div class="modal-body">
                    <div class="row">
                        <div class="col-md-3">
                            <div class="tab-vertical">
                                <ul class="nav " id="leftTabs">
                                    <li class="active">
                                        <a href="#search-person" data-bs-toggle="tab">Person</a>
                                    </li>
                                    <li>
                                        <a href="#search-person-adds" data-bs-toggle="tab">
                                            Address Information </a>
                                    </li>
                                    <li>
                                        <a href="#search-dsds-action" data-bs-toggle="tab">
                                            DHS Action </a>
                                    </li>
                                    <li>
                                        <a href="#search-clearing" data-bs-toggle="tab">
                                            Clearing</a>
                                    </li>

                                </ul>
                            </div>
                        </div>

                        <div class="col-sm-9">
                            <div class="tab-content" style="padding:0;">
                                <div class="tab-pane active" id="search-person">
                                    <involved-person-view-person [person]="person" [id]="id" [person$]="person$"></involved-person-view-person>
                                </div>
                                <div class="tab-pane" id="search-person-adds">
                                    <involved-person-view-address-information [address]="address" [id]="id" [person$]="person$"></involved-person-view-address-information>
                                </div>
                                <div class="tab-pane" id="search-dsds-action">
                                    <involved-person-view-dhs-action [dhsAction]="dhsAction" [id]="id"></involved-person-view-dhs-action>
                                </div>
                                <div class="tab-pane" id="search-clearing">
                                    <involved-person-view-clearing [clearing]="clearing" [id]="id"></involved-person-view-clearing>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
