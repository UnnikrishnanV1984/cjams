<div class="timeline-section timeline-center pad-top20 clearfix">
    <ul class="list-unstyled">
        <li class="timeline-item timeline-time-item" *ngFor="let data of timeLineViewList">
            <div class="timeline-time">{{data.insertedon | date: 'MM/dd/yyyy, hh:mm a'}}
            </div>
            <a *ngIf="data.intakeserviceid && data.servicerequestnumber" class="timeline-badge" (click)="openWindow(data)">
                <em class="fa">&#xf103;</em>
            </a>
            <a *ngIf="!data.intakeserviceid && !data.servicerequestnumber" class="timeline-badge bg-gray">
                <em class="fa">&#xf103;</em>
            </a>
            <div class="timeline-panel">
                <h4 class="timeline-tile text-pink">{{data.datype}} {{data.dasubtype ? ','+data.dasubtype : '' }}</h4>
                <p *ngIf="data.createdby">
                    <label>Staff :</label>
                    <span>{{data.createdby}}</span>
                </p>
                <p *ngIf="data.assignedto">
                    <label>Assigned To :</label>
                    <span>{{data.assignedto}}</span>
                </p>
                <p *ngIf="data.status ">
                    <label>Status :</label>
                    <span>{{data.status}}</span>
                </p>
            </div>
        </li>
    </ul>
</div>
