<div class="row">
    <div class="col-sm-12 text-end btns-top pad-vspace">
            <button *securityKeyNew = "'assessment,assessment.assessments.print'" 
            (click)="printAssessment()" class="btn-pri">print</button>
            <button *ngIf="!isAppla && !isShelterForm" class="btn-pri aut-btn-backToAssessment" (click)="redirectToAssessment()">
                {{ intakAssessment.description === 'CINA Shelter Petition Request' ? 'Back to Child Removal' : 'Back to Assessments'}}</button>
                <button *ngIf="isAppla" class="btn-pri" (click)="redirectToAssessment()">
                    {{ 'Back to Appla'}}</button>
                    <button *ngIf="isShelterForm" class="btn-pri" (click)="redirectToAssessment()">
                        {{ 'Back to Child Removal'}}</button>
    </div>
</div>
<div id="assessmentForm"></div>

<div class="row" style="display:none">
<div class="col">
    <div id="divPrintView"></div>
</div>
</div>
