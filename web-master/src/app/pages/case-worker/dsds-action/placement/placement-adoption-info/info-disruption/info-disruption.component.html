<div class="tab-pane fade show active" id="disruption">
    <div class="col-sm-12 p-t-10 p-b-20 b-b">
        <h4 class="m-t-20 text-capitalize">disruption of pre-finalized adoptive placement</h4>
        <div class="row">
          <div class="col-sm-3">
            <p class="p-title">Date of Disruption</p>
            <mat-form-field class="no-placeholder">
              <input matInput autocomplete="off" [matDatepicker]="picker11" placeholder="Choose a date">
              <mat-datepicker-toggle matSuffix [for]="picker11"></mat-datepicker-toggle>
              <mat-datepicker #picker11></mat-datepicker>
            </mat-form-field>
          </div>
          <div class="col-sm-3">
              <p class="p-title">Reason(s) for Adoptive Disruption</p>
              <mat-form-field>
                <mat-label>Date of Disruption</mat-label>
                <mat-select placeholder="" multiple>
                  <mat-option></mat-option>
                </mat-select>
              </mat-form-field>
          </div>
          <div class="col-sm-5">
              <p class="p-title">Note/Specify</p>
              <mat-form-field>
                <mat-label>Write the Note</mat-label>
                <textarea matInput placeholder=""></textarea>
              </mat-form-field>
          </div>
        </div>
    </div>
    <div class="col-sm-12 p-t-10 p-b-20 b-b">
        <h4 class="m-t-20 text-capitalize">disruption of finalized adoption</h4>
        <div class="row">
          <div class="col-sm-3">
            <p class="p-title">Date of Dissolution</p>
            <mat-form-field class="no-placeholder">
              <input matInput autocomplete="off" [matDatepicker]="picker12" placeholder="Choose a date">
              <mat-datepicker-toggle matSuffix [for]="picker12"></mat-datepicker-toggle>
              <mat-datepicker #picker12></mat-datepicker>
            </mat-form-field>
          </div>
          <div class="col-sm-3">
              <p class="p-title">Reason(s) for Dissolution Adoption</p>
              <mat-form-field class="no-placeholder">
                <mat-select placeholder="Date of Disruption" multiple>
                  <mat-option></mat-option>
                </mat-select>
              </mat-form-field>
          </div>
          <div class="col-sm-5">
              <p class="p-title">Note/Specify</p>
              <mat-form-field>
                <mat-label>Write the Note</mat-label>
                <textarea matInput placeholder=""></textarea>
              </mat-form-field>
          </div>
        </div>
    </div>
    <button class="btn btn-theme btn-pri m-t-30">Disruption Adoption</button>
</div>
