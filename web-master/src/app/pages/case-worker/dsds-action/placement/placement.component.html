<ng-container *ngIf="isChildRemoval else isChildRemovalHide">
    <div class="box-grid no-mar no-pad">
        <div class="row p-b-10" *ngIf="isServiceCase">
            <div class="col-sm-5">
                <ol class="breadcrumb">
                    <li routerLinkActive="active" *ngIf="enabledTab === 'permanencyPlan'">
                        <a routerLink="permanency-plan">Permanency Plan
                        </a>
                    </li>
                    <li routerLinkActive="active" *ngIf="enabledTab === 'Guardianship'">
                        <a routerLink="placement-gap/disclosure-checklist">GAP
                        </a>
                    </li>
                    <li routerLinkActive="active" *ngIf="(enabledTab === 'APPLA' || enabledTab === 'CRLTC')">
                        <a routerLink="appla/list">APPLA
                        </a>
                    </li>
                    <li routerLinkActive="active" *ngIf="(enabledTab === 'ADOPTNR' || enabledTab === 'Adoption')">
                        <a routerLink="adoption/tpr-recom">Adoption
                        </a>
                    </li>
                </ol>
            </div>
        </div>
        <!-- Breadcrumb Navigation end -->
        <div class="tab-content">
            <router-outlet></router-outlet>
        </div>
    </div>
</ng-container>
<ng-template #isChildRemovalHide>
    <div class="pad-top20">
        <p class="col-sm-12 mat-error"> Child Removal must be done to continue Permanency Plan. </p>
    </div>
</ng-template>
