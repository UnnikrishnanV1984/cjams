<section>
  <div class="row">
    <div class="col-sm-3">
      <mat-form-field>
        <input type="text" matInput placeholder="Case Head Name">
      </mat-form-field>
    </div>
    <div class="col-sm-3">
      <mat-form-field>
        <input type="text" matInput placeholder="Case ID">
      </mat-form-field>
    </div>
    <div class="col-sm-3">
      <mat-form-field>
        <input matInput autocomplete="off" [matDatepicker]="Assessmentdate" placeholder="Associated Risk Assessment Date">
        <mat-datepicker-toggle matSuffix [for]="Assessmentdate"></mat-datepicker-toggle>
        <mat-datepicker #Assessmentdate></mat-datepicker>
      </mat-form-field>
    </div>
    <div class="col-sm-3">
      <mat-form-field>
        <mat-select placeholder="Service Plan Goal">
          <mat-option value="Service Plan">Service Plan</mat-option>
        </mat-select>
      </mat-form-field>
    </div>
  </div>
</section>

<div class="card panel-default">
  <div class="card-header">Determination of Candidate for Foster</div>
  <div class="card-body">
    <div class="row">
      <div class="col-sm-3">
        <mat-form-field>
          <input type="text" matInput placeholder="Client ID">
        </mat-form-field>
      </div>
      <div class="col-sm-3">
        <mat-form-field>
          <input type="text" matInput placeholder="Client Name">
        </mat-form-field>
      </div>
      <div class="col-sm-3">
        <mat-form-field>
          <input type="text" matInput placeholder="CIS Client ID">
        </mat-form-field>
      </div>
      <div class="col-sm-3">
        <mat-form-field>
          <mat-select placeholder="Candidacy Determination">
            <mat-option value="Determination">Determination</mat-option>
          </mat-select>
        </mat-form-field>
      </div>
    </div>
  </div>
</div>

<div class="card panel-default">
  <div class="card-header">Objectives</div>
  <div class="card-body">
    <div class="row">
      <div class="col-sm-3">
        <mat-form-field>
          <input type="text" matInput placeholder="Objective">
        </mat-form-field>
      </div>
      <div class="col-sm-3">
        <mat-form-field>
          <input matInput autocomplete="off" [matDatepicker]="reviewdate" placeholder="Date of Review">
          <mat-datepicker-toggle matSuffix [for]="reviewdate"></mat-datepicker-toggle>
          <mat-datepicker #reviewdate></mat-datepicker>
        </mat-form-field>
      </div>
      <div class="col-sm-3">
        <mat-form-field>
          <input matInput autocomplete="off" [matDatepicker]="Achieveddate" placeholder="Date Achieved">
          <mat-datepicker-toggle matSuffix [for]="Achieveddate"></mat-datepicker-toggle>
          <mat-datepicker #Achieveddate></mat-datepicker>
        </mat-form-field>
      </div>
      <div class="col-sm-3">
        <mat-form-field>
          <mat-select placeholder="Objective Status">
            <mat-option value="Determination">Determination</mat-option>
          </mat-select>
        </mat-form-field>
      </div>
      <div class="col-sm-6">
        <mat-form-field>
          <input type="text" matInput placeholder="Details">
        </mat-form-field>
      </div>
    </div>    
    <h3 class="mt-30">Task</h3>
    <div class="row">
      <div class="col-sm-3">
        <mat-form-field>
          <input type="text" matInput placeholder="Task">
        </mat-form-field>
      </div>
      <div class="col-sm-3">
        <mat-form-field>
          <input type="text" matInput placeholder="Family Member">
        </mat-form-field>
      </div>
      <div class="col-sm-3">
        <mat-form-field>
          <input matInput autocomplete="off" [matDatepicker]="Evaluationdate" placeholder="Evaluation Date">
          <mat-datepicker-toggle matSuffix [for]="Evaluationdate"></mat-datepicker-toggle>
          <mat-datepicker #Evaluationdate></mat-datepicker>
        </mat-form-field>
      </div>

    </div>
    <div class="row text-end">
        <div class="col-sm-12 mt-20">          
          <button class="btn btn-bg">Delete </button>
          <button class="btn btn-bg">Cancel </button>
          <button class="btn btn-pri">Save </button>
        </div>
      </div>
  </div>
</div>

<div class="card panel-default">
  <div class="card-header">Task in Home Family</div>
  <div class="card-body">
    <div class="row">
      <div class="col-sm-3">
        <mat-form-field>
          <input type="text" matInput placeholder="Task Details">
        </mat-form-field>
      </div>
      <div class="col-sm-3">
        <mat-form-field>
          <input type="text" matInput placeholder="Task Idea">
        </mat-form-field>
      </div>
      <div class="col-sm-3">
        <mat-form-field>
          <input matInput autocomplete="off" [matDatepicker]="Evaluationdate2" placeholder="Evaluation Date">
          <mat-datepicker-toggle matSuffix [for]="Evaluationdate2"></mat-datepicker-toggle>
          <mat-datepicker #Evaluationdate2></mat-datepicker>
        </mat-form-field>
      </div>
      <div class="col-sm-3">
        <mat-form-field>
          <input type="text" matInput placeholder="Family Member">
        </mat-form-field>
      </div>
      <div class="col-sm-3">
        <mat-form-field>
          <mat-select placeholder="Select">
            <mat-option value="Service Plan">Service Plan</mat-option>
          </mat-select>
        </mat-form-field>
      </div>
    </div>

    <div class="row mrg-top15">
        <div class="col-sm-12">
            <div class="grey-bg" style="padding:5px;">
                <div class="table-responsive mat-form-field-table">
                    <table class="table grid-list" aria-describedby="Role Details">
                        <thead>
                            <tr>
                                <th id="roleHeader">Role</th>
                                <th id="lastNameHeader">Last Name</th>
                                <th id="firstNameHeader">First Name</th>
                                <th id="relationshipHeader">Relationship</th>
                                <th id="rtsHeader">Refused to Sign</th>
                                <th id="electronicSigHeader">Electronic Signature</th>
                            </tr>
                        </thead>
                        <tbody >
                            <tr >
                                <td>
                                    <mat-form-field>
                                        <input type="text" matInput placeholder="Type of Role">
                                    </mat-form-field>
                                </td>
                                <td>
                                    <mat-form-field>
                                        <input type="text" matInput required placeholder="Last Name" >
                                    </mat-form-field>
                                </td>
                                <td>
                                    <mat-form-field>
                                        <input type="text" matInput required placeholder="First Name" >
                                    </mat-form-field>
                                </td>
                                <td>
                                    <mat-form-field>
                                        <input type="text"  matInput placeholder="Relationship to Child">
                                    </mat-form-field>
                                </td>
                                <td>
                                    <div style="margin-top:20px;">
                                        <mat-checkbox  value="1"></mat-checkbox>                                        
                                    </div>
                                </td>                                
                                <td>
                                    <mat-form-field>
                                        <input type="text" matInput placeholder="Electronic Signature">
                                    </mat-form-field>
                                </td>                               
                            </tr>
                        </tbody>
                    </table>
                </div>

            </div>
        </div>
    </div>

    <div class="row mt-20">
        <div class="col-sm-3">
            <mat-form-field>
              <input matInput autocomplete="off" [matDatepicker]="Evaluationdatem2" placeholder="Date Signed">
              <mat-datepicker-toggle matSuffix [for]="Evaluationdatem2"></mat-datepicker-toggle>
              <mat-datepicker #Evaluationdatem2></mat-datepicker>
            </mat-form-field>
          </div>
        <div class="col-sm-3">
          <mat-form-field>
            <input type="text" matInput placeholder="Family Emergency Phone">
          </mat-form-field>
        </div>
        <div class="col-sm-3">
          <mat-form-field>
            <input type="text" matInput placeholder="Worker Name">
          </mat-form-field>
        </div>
       
        <div class="col-sm-3">
          <mat-form-field>
            <input type="text" matInput placeholder="Supervisor Name">
          </mat-form-field>
        </div>
        <div class="col-sm-3">
          <mat-form-field>
              <input type="text" matInput placeholder="Associate Name">           
          </mat-form-field>
        </div>
        <div class="col-sm-3">
            <mat-form-field>
                <input type="text" matInput placeholder="Approval">             
            </mat-form-field>
          </div>
          <div class="col-sm-3">
              <mat-form-field>
                  <input type="text" matInput placeholder="Service Plan">               
              </mat-form-field>
            </div>
      </div>
  </div>
</div>

<div class="row text-end">
    <div class="col-sm-12 mt-20">       
      <button class="btn btn-pri">Save </button>
    </div>
  </div>
