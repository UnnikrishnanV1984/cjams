<div>
    <div class="row" [formGroup]="kinshipForm" [fieldKey]="'caseworker-kinship-program-assignment-save'">
        <div class="col-md-6">
            <mat-form-field>
                <mat-label>Program Area</mat-label>
                <mat-select placeholder="" required formControlName="programareakey">
                    <mat-option *ngFor="let item of (programDropDownDetails$ | async)" [value]="item.value">{{ item.text }}</mat-option>
                </mat-select>
            </mat-form-field>
        </div>
        <div class="col-md-6">
            <mat-form-field>
                <mat-label>Sub Program Area</mat-label>
                <mat-select placeholder="" required formControlName="subprogramareakey">
                    <mat-option *ngFor="let item of (subprogramDropDownDetails$ | async)" [value]="item.value">{{ item.text }}</mat-option>
                </mat-select>
            </mat-form-field>
        </div>
        <div class="col-md-6">
            <mat-form-field>
                <mat-label>Start Date</mat-label>
                <input matInput autocomplete="off" [matDatepicker]="picker" (click)="picker.open()" placeholder="" formControlName="startdate"  />
                <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
                <mat-datepicker #picker></mat-datepicker>
            </mat-form-field>
        </div>
        <div class="col-md-6">
            <mat-form-field>
                <mat-label>End Date</mat-label>
                <input
                    matInput
                    autocomplete="off" [matDatepicker]="picker1"
                    (click)="picker1.open()"
                    placeholder="End Date"
                    formControlName="enddate"
                    [min]="kinshipForm.controls['startdate'].value"
                />
                <mat-datepicker-toggle matSuffix [for]="picker1"></mat-datepicker-toggle>
                <mat-datepicker #picker1></mat-datepicker>
            </mat-form-field>
        </div>
    </div>
    <div class="col-sm-6  pull-right"><button class="btn btn-pri pull-right" (click)="kinshipSave(kinshipForm.value)" [disabled]="kinshipForm.invalid || kinshipForm.pristine">Save</button></div>
    <div class="col-sm-12" style="margin-bottom: 25px; margin-top: 19px;">
        <div class="col-sm-12" *ngIf="kinshipListDetails.length > 0">
            <div class="table-responsive table-theme table-bordered">
                <table class="table" aria-describedby="Kinship List Details">
                    <thead>
                        <tr>
                            <th id="klprogramAreaHeader">Program Area</th>
                            <th id="klSubProgramAreaHeader">Sub Program Area</th>
                            <th id="klStartDateHeader">Start Date</th>
                            <th id="klEndDateHeader">End Date</th>
                            <th id="klActionHeader">Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr *ngFor="let kinship of kinshipListDetails">
                            <td>{{ kinship.programdescription }}</td>
                            <td>{{ kinship.subprogramdescription }}</td>
                            <td>{{ kinship.startdate | date: 'MM/dd/yyyy' }}</td>
                            <td>{{ kinship.enddate | date: 'MM/dd/yyyy' }}</td>
                            <td>
                                <a (click)="editKinshp(kinship)"> <em class="fa fa-pencil text-16"></em></a>
                                <a (click)="deleteKinshp(kinship.kinshipcareprogramid)"> <em class="fa fa-trash text-16"></em> </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
