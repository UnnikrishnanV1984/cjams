<div id="subsidyDownload" class="tab-pane active m-t-20">
    <table class="table table-bordered table-hover" aria-describedby="Subsidydownload List">
        <thead>
                <tr>
                    <th id="documentNameHeader">Document Name</th>
                    <th id="actionHeader">Action</th>
                </tr>
            </thead>
        <tbody>
            <ng-container *ngFor="let subsidydownload of subsidydownloadList">
                <tr>
                    <td>{{subsidydownload.description}}</td>
                    <td>
                        <button class="btn btn-pri"  (click)="downloadsubsidyfile(subsidydownload.ref_key, subsidydownload.description)">Download</button>   
                    </td>
                </tr>
            </ng-container>
        </tbody>
    </table>    
</div>
