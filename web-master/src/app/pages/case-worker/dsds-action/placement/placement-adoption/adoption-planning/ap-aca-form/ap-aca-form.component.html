<div class="row">
        <div class="col-sm-12 col-lg-12 col-xl-12">
            <adoption-child-assessment [clientIDInput]="clientIDInput" [removalIDInput]="removalIDInput" #childassessment></adoption-child-assessment>
        </div>

        <div class="col-sm-12 col-lg-12 col-xl-12" *ngIf = "_authService.readonlyButton('read_only_access','caseworker-aca-save')">
            <div class="text-center">
                    <button class="sec-btn text-uppercase"
                    *securityKeyNew="'adoptionplanning,adoptionplanning.planning.acabypassive'"
                    [fieldKeyNew]="'adoptionplanning,adoptionplanning.planning.acabypassive'"
                    type="submit" (click)="bypassIVE()">Bypass IV-E</button>
            </div>
            <div class="d-flex justify-content-end gap-2">
                <button class="btn-bg text-uppercase" type="submit"
                *securityKeyNew="'adoptionplanning,adoptionplanning.planning.acasave'"
                [fieldKeyNew]="'adoptionplanning,adoptionplanning.planning.acasave'"
                (click)="saveData()">SAVE</button>
                <button  class="btn-pri text-uppercase" type="submit" (click)="sendToIVE()" [disabled]= "childassessment.disablesendtosupervisor"
                *securityKeyNew="'adoptionplanning,adoptionplanning.planning.acasendtoivesup'"
                [fieldKeyNew]="'adoptionplanning,adoptionplanning.planning.acasendtoivesup'">Send to IV-E Supervisor</button>
            </div>
        </div>
    </div>
