<div class="row" [formGroup]="apNarrativeForm">
    <div class="col-md-12">
        <h5 class="text-uppercase h5-title">Narrative</h5>
        <div class="row">
            <div class="col-lg-3 col-md-4 m-t-20">
                <mat-form-field>
                    <mat-label>Adoption Plan Begin Date</mat-label>
                    <input matInput autocomplete="off" [matDatepicker]="picker" (click)="picker.open()" class="aut-dtp-adotionBeginDate" formControlName="adoptiondate" placeholder="" required />
                    <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
                    <mat-datepicker #picker></mat-datepicker>
                </mat-form-field>
                <mat-error *ngIf="displayValidationMessages">
                    {{getErrorsMessage('adoptiondate','Adoption Plan Begin Date')}}
                </mat-error>
            </div>
        </div>
    </div>

    <div class="col-md-12">
        <h6 class="text-uppercase h6-title">Bio-Psycho-Socio-Cultural History for Child Presentation and Disclosure <label class="required"></label></h6>
        <mat-error *ngIf="displayValidationMessages">
            {{getErrorsMessage('narrative','Notes')}}
        </mat-error>
        <quill-editor formControlName="narrative" class="aut-txt-bioPsycho" format="html" placeholder="Notes" [required]="true"></quill-editor>
    </div>

    <div class="col-md-12 m-t-20">
        <span *securityKeyNew="'adoptionplanning,adoptionplanning.planning.narrativesave'">
            <button class="sec-btn text-uppercase aut-btn-save" [disabled]="apNarrativeForm.pristine || _authService.isDisabled('adoptionplanning','adoptionplanning.planning.narrativesave')" *ngIf="!isAdoptionCreated && _authService.readonlyButton('read_only_access','caseworker-narrative-save')" (click)="addNarrative('')" (click)="saveEmotionalTie('Next')">SAVE</button>
            <button class="btn-pri text-uppercase pull-left aut-btn-save-proceedtoNext" [disabled]="apNarrativeForm.pristine || _authService.isDisabled('adoptionplanning','adoptionplanning.planning.narrativesave')" *ngIf="!isAdoptionCreated && _authService.readonlyButton('read_only_access','caseworker-narrative-save')" (click)="addNarrative('Next')">SAVE AND PROCEED TO NEXT</button>
        </span>
    </div>
</div>
