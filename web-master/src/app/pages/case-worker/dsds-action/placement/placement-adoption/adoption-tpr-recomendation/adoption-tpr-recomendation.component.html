<div id="tpr-recommendation" class="tab-pane fade show active" *ngIf="tprRecommendation">
    <div class="checkbox-block mt-20 clearfix">
        <h4 class="text-uppercase m-t-20 semi-b">TPR Recommendation Checklist</h4>
        <div class="row">
            <div class="col-md-12" *ngIf="tprRecommendation.tprlist">
                <ng-container *ngFor="let tpr of tprRecommendation.tprlist; let i = index">
                    <div class="checkbox-m-t col-md-6">
                    <mat-checkbox [ngClass]="{'required': tpr.checklistname!=='Unknownparent' && tpr.checklistname!=='childplacement' ,
                                                'aut-chk-infeitherParent': tpr.checklistname ==='Unknownparent' ,
                                                'aut-chk-COofTPRforparents': tpr.checklistname ==='courtorder' ,
                                                'aut-chk-petTPRsendtoCO': tpr.checklistname ==='petition' ,
                                                'aut-chk-CC15out22': tpr.checklistname ==='childplacement' ,
                                                'aut-chk-COhearing': tpr.checklistname ==='courthearing' ,
                                                'aut-chk-PPPisAdoption': tpr.checklistname ==='permanancyplan' }"
                        class="checkbox-m-t col-md-12 " [disabled]="isCheckboxDisabled(tpr.checklistname)"
                        [checked]="tpr.isvalidated === 1 || ( tpr.checklistname === 'courtorder' && isCourtHearingOccurs ) "
                        (change)="onTprChecklistChange($event, i)">{{ tpr.description }}</mat-checkbox>
                 <mat-error *ngIf ="checkrequired && !(tpr.isvalidated === 1 || ( tpr.checklistname === 'courtorder' && isCourtHearingOccurs ) ) && (tpr.checklistname !== 'Unknownparent' && tpr.checklistname !== 'childplacement')">Please update  {{ tpr.description }}</mat-error>
                </div>  
              
                </ng-container>
            </div>
            <div class="col-sm-12 m-t-20 m-b-20 " [formGroup]="recommendedForm">
                <div class="row">
                    <div class="col-md-6 m-t-30" *ngIf="false">
                        <label class="p-r-20 m-l-20">Recommended</label>
                        <mat-radio-group formControlName="isrecommended">
                            <mat-radio-button value="true">Yes</mat-radio-button>
                            <mat-radio-button value="false">No</mat-radio-button>
                        </mat-radio-group>
                    </div>
                    <div class="col-md-6 m-t-20">
                        <mat-form-field class="collapse-horizontal-80">
                            <mat-select placeholder="Reason for Recommendation" formControlName="reasontypekey"
                                class="aut-lst-resonforRec" required>
                                <mat-option *ngFor="let item of reasonTypeDropDown" [value]="item.ref_key">
                                    {{item.description}}
                                </mat-option>
                            </mat-select>
                        </mat-form-field>
                        <mat-error *ngIf ="checkrequired && recommendedForm.get('reasontypekey')?.invalid ">Please enter Reason for Recommendation</mat-error>
                    </div>
                </div>
            </div>
            <div class="col-sm-12" *ngIf="!tprRecommendation.tprrecommendationid || child15to22CheckboxChanged">
                <div class="row">
                    <div class="col-md-12 text-end">
                        <button class="btn-pri btn-theme aut-btn-save" *securityKeyNew="'adoptionplanning,adoptionplanning.tprrecom.save'"
                            [disabled]="_authService.isDisabled('adoptionplanning','adoptionplanning.tprrecom.save')" type="submit"
                            (click)="saveRecommendation()">Save</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
