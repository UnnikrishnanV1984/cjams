<div class="row m-t-10">
    <div class="col-md-12">
        <div class="card panel-default panel-theme">
            <div class="card-header">
                <span class="site-color text-22">APPLA</span>
                <button type="button" class="btn-close close me-10 text-22 pull-right" (click)="close()"></button>
            </div>
            <div class="card-body">
                <div class="row">
                    <ng-container *ngIf="child">
                        <div class="row col-sm-12 col-xl-12 col-lg-12">
                            <div class="col-sm-3">
                                <h5>Name#</h5>
                                <p class="m-0">
                                    {{ child?.firstname }} {{ child?.lastname }}
                                </p>
                            </div>
                            <div class="col-sm-2">
                                <h5>CJAMS PID#</h5>
                                <p class="m-0">{{ child?.cjamspid }}</p>
                            </div>
                            <div class="col-sm-2">
                                <h5>D.O.B</h5>
                                <p class="m-0">
                                    {{ child?.dob | date: "MM/dd/yyyy" }}
                                </p>
                            </div>
                            <div class="col-sm-2">
                                <h5>Gender</h5>
                                <p class="m-0">{{ child?.gender }}</p>
                            </div>
                            
                        </div>


                    </ng-container>
               
                <router-outlet></router-outlet>
            </div>
        </div>
    </div>
</div>
</div>
