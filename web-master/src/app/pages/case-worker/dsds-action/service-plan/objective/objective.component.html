<div class="row" *ngIf="!hideForm">
  <div class="modal-body" [formGroup]="focusPlanFormGroup">
    <div *ngIf="objectiveAutoSaved" style="color: green;font-size: bold; text-align: left;" >Objective Auto Saved Successfully on {{lastObjectiveUpdatedTime}} </div>
    <div>
      <div class="col-md-12">
        <mat-form-field>
          <mat-label>Objective</mat-label>
          <input formControlName="objectivename" type="text" [readonly]="autoflag === 1" matInput placeholder="Objective" required>
        </mat-form-field>
        <mat-error *ngIf ="focusPlanFormGroup.get('objectivename')?.invalid && checkforrequired">Please Enter value in Objective</mat-error>
      </div>
    </div>

    <div class="row">
        <div class="col-md-4">
          <mat-form-field>
                                            <mat-label>Related Needs</mat-label>
            <mat-select formControlName="needs" placeholder="" multiple>
              <mat-option *ngFor="let need of cansFNeedsList" [value]="need.serviceplanneedname">
                {{need.serviceplanneedname}}</mat-option>
            </mat-select>
          </mat-form-field>
        </div>
        <div class="col-md-4">
          <mat-form-field>
                                            <mat-label>Related Strengths</mat-label>
            <mat-select formControlName="strengths" placeholder="" multiple>
              <mat-option *ngFor="let strength of cansFStrengthList" [value]="strength.serviceplanstrengthname">
                {{strength.serviceplanstrengthname}}
              </mat-option>
            </mat-select>
          </mat-form-field>
        </div>
        <div class="col-md-4">
          <mat-form-field>
                                            <mat-label>Status</mat-label>
            <mat-select placeholder="" required formControlName="status">
              <mat-option *ngFor="let item of objectiveStatusReferenceValues" [value]="item">
                {{item}}
              </mat-option>
            </mat-select>
          </mat-form-field>
          <mat-error *ngIf ="focusPlanFormGroup.get('status')?.invalid && checkforrequired">Please Select value in Status</mat-error>
        </div>
    </div>

    <div class="clearfix">
      <div class="col-md-12">
        <label>Comments</label>
        <div class="textarea-notes">
          <textarea name="comments" rows="5" formControlName="comments"
            class="form-control full-collapse-horizontal aut-txt-addNotesNarrator"></textarea>
        </div>
      </div>
    </div>
    <div class="d-flex gap-2 float-end m-t-20 m-b-20">
      <button class="sec-btn" type="button" data-bs-dismiss="modal" (click)="cancelObjective()">cancel</button>
      <button class="btn-pri" type="button" (click)="addFocusPlan(1, false)"
      [disabled]="focusPlanFormGroup.pristine || (focusPlanFormGroup.invalid && !requiredField)">Add</button>
    </div>
  </div>
</div>
