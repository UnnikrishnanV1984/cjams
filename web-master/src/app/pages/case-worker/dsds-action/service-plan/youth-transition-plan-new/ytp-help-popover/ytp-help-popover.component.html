<div class="popover-wrapper" #popoverWrapper>
  <span class="narr-help help-icon" (click)="toggle()">
      <em class="fa fa-question-circle"></em>
    </span>
  
    <div class="custom-popover" [class.show]="isVisible">
      <p style="font-size: 14px !important; font-weight: normal;" >
        <span [innerHTML]="helpText"></span>
        <ng-container *ngIf="shouldNavigate">&nbsp;
          <a (click)="confirmNavigation()" href="javascript:void(0)"
            style="font-size: 14px !important; color: #0d6efd; text-decoration: underline; cursor: pointer;">
            {{ linkText }}
          </a>
        </ng-container>
      </p>
      <button class="btn btn-pri btn-pop" (click)="close()">OK</button>
    </div>
</div>


<div class="modal" [id]="modalId" role="dialog">
  <div class="modal-dialog">
      <div class="modal-content">
          <div class="modal-header d-flex justify-content-between align-items-center">
            <h4 class="modal-title m-0">Confirm</h4>
             <button type="button" class="close pull-right" data-dismiss="modal" (click)="cancelDecision()">×</button>
          </div>

          <div class="modal-body">
             <p>Are you sure you want to save the Adult Public Guardianship Transition Petition details and redirect to the {{linkText}} screen? </p>
          </div>

          <div class="modal-footer">
              <div class="text-right right-mspace-15">
                  <button type="button" value="No" class="btn-bg" name="" (click)="cancelDecision()"> Cancel </button>
                  <button type="button" value="Yes" class="btn-pri" name="" (click)="handleLinkClick()"> Yes </button>
              </div>
          </div>
      </div>
  </div>
</div>
