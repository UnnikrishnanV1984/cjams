<div class="col-md-12 m-t-20 m-b-10">
  <span><strong>Contacts to Aid Transition of Youth with Special Needs:</strong> </span>
  <button type="button" class="service-btn p-r-20 col-fnt pull-right" name="" (click)="addGoal()" 
  [disabled]="ytpData.approvalstatuskey == 'Approved' || ytpData.approvalstatuskey == 'Pending'">+ Add</button>
</div>
<div class="col-sm-12">
  <div class="table-responsive">
    <table class="table table-bordered " aria-describedby="tbl-yth-edctn-gls-dtls">
      <thead>
        <tr>
          <th scope="col">Name  </th>
          <th scope="col">Contact #</th>
          <th scope="col">Email</th>
          <th scope="col">Action</th>
        </tr>
      </thead>
      <tbody>
        <ng-container *ngIf="details.length > 0; else noRecordTemplate">
          <ng-container *ngFor="let item of details; let index=index;">
            <tr>
              <td>
                <mat-form-field>
                  <input type="text" matInput [(ngModel)]="item.detail" placeholder="">
                </mat-form-field>
              </td>
              <td >
                <mat-form-field>
                  <input type="text" matInput [(ngModel)]="item.action_plan" placeholder="" mask="(000) 000-0000">
                </mat-form-field> 
              </td>
              <td>
                <mat-form-field>
                  <input type="email" matInput [(ngModel)]="item.responsible_parties" placeholder="" pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,3}$" id="email" name="email" #email="ngModel">
                </mat-form-field>
                <mat-error *ngIf="email.errors &&(email.touched || email.dirty || email.invalid)">
                  Invalid email format</mat-error>  
              </td>
              <td>
                <a (click)="deleteGoal(index)">
                  <em class="m-l-20  fa fa-trash text-16"></em>
                </a></td>
            </tr>
          </ng-container>
        </ng-container>
        <ng-template #noRecordTemplate>
          <tr>
            <td colspan="5" class="text-center">
              No Records found
            </td>
          </tr>
        </ng-template>
      </tbody>
    </table>
  </div>
</div>
<div class="modal fade custom-modal" id="delete-popup" role="dialog">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h4 class="modal-title"> Confirm Delete </h4>
        <button type="button" class="btn-close close pull-right" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <p> Are you sure you want to delete this Goal? </p>
        <div class="text-end big-bot-space right-mspace-15">
          <button type="button" value="No" class="btn-bg" name="" (click)="declineDelete()"> No </button>
          <button type="button" value="Yes" class="btn-pri" name="" data-bs-dismiss="modal" (click)="confirmDelete()"> Yes </button>
        </div>
      </div>
    </div>
  </div>
</div>
