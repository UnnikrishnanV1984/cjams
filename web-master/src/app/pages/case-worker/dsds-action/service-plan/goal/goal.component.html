<div class="row">
  <div class="modal-body">
    <div *ngIf="goalAutoSaved" style="color: green;font-size: bold; text-align: left;" >Goal Auto Saved Successfully on {{lastUpdatedTime}} </div>
    <div class="">
      <div [formGroup]="servicePlanGoal" class="row">
        <div class="col-md-6">
          <mat-form-field>
            <mat-label>Select the goal</mat-label>
            <!-- other goal option is no longer needed -->
            <mat-select placeholder="Select the goal" formControlName="goalname"
              matTooltip="{{servicePlanGoal.value.goalname}}">
              <mat-option matTooltip="{{item.description}}" *ngFor="let item of goalReferenceValues"
                value="{{item.description}}">
                {{item.description}}
              </mat-option>
            </mat-select>
          </mat-form-field>
        </div>
        <div class="col-md-3">
          <mat-form-field>
            <mat-label>Status</mat-label>
            <mat-select placeholder="" required formControlName="status">
              <mat-option *ngFor="let item of goalStatusReferenceValues" [value]="item">
                {{item}}
              </mat-option>
            </mat-select>
          </mat-form-field>
        </div>
        <div class="col-md-3 m-t-20">
          <button class="no-bg" type="button" (click)="addGoal(1,false)" matTooltip="Update Goal"><i class="fa fa-check col-pri"
              aria-hidden="true"></i></button>
          <button class="no-bg" type="button" matTooltip="Cancel" (click)="cancelGoal()"><i class="fa fa-times col-sec" aria-hidden="true"></i></button>
        </div>
      </div>
    </div>
  </div>
</div>
