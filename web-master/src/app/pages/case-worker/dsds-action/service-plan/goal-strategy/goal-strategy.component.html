<div class="row">
    <div class="col-sm-12 text-end btns-top mar-vspace" [fieldKey]="'caseworker-service-plan-goals-strategies-add-goals'">
        <button class="btn-pri" data-bs-target="#add-goals" data-bs-toggle="modal" type="submit"> <i aria-hidden="true" class="fa fa-plus"></i>
            Add Goals</button>
    </div>
</div>
<div class="table-responsive table-theme">
        <table class="table table-stripped" aria-describedby="tbl-add-goals">
        <thead>
            <tr>
                <th scope="col">Date of Goal Created</th>
                <th scope="col">Goals</th>
                <th scope="col">Strategies</th>
                <th scope="col">Actions</th>
            </tr>
        </thead>
        <tbody *ngIf="servicePlanGoal$ | async; let servicePlanGoal">
            <tr *ngFor="let goal of servicePlanGoal ">
                <td>{{goal.goaldate | date:'MM/dd/yyyy'}}</td>
                <td>{{goal.goal}}</td>
                <td>{{goal.strategy}}</td>
                <td class="icon">
                    <button [fieldKey]="'caseworker-service-plan-goals-strategies-edit-goals'" class="add-service no-bg" type="button" data-bs-target="#add-goals" data-bs-toggle="modal" matTooltip="Edit Goal" (click)="editGoals(goal)"><i class="fa fa-pencil-square-o" aria-hidden="true"></i></button>
                    <button [fieldKey]="'caseworker-service-plan-goals-strategies-delete-goals'" class="add-service no-bg" type="button" (click)="deleteServicePlanGoal(goal)" matTooltip="Delete"><i class="fa fa-trash" aria-hidden="true" ></i></button>
                </td>
            </tr>
        </tbody>
    </table>
</div>

<div class="modal fade" id="add-goals" tabindex="-1" role="dialog" data-bs-backdrop="static" data-bs-keyboard="false" aria-labelledby="myModalLabel">
    <div class="modal-dialog modal-md" role="document">
        <div class="modal-content Persons-Involved">
            <div class="modal-header">
                <h4 class="modal-title">{{addEditLabel}} Goals & Strategies</h4>
                <button type="button" class="btn-close close pull-right" id="cls-add-goal" data-bs-dismiss="modal" aria-label="Close" (click)="clearGoals()"></button>
            </div>
            <div class="modal-body" [formGroup]="goalStrategy">
                <div class="row">
                    <div class="col-sm-4">
                        <div class="no-pad clsIntake dpnew ">
                            <mat-form-field>
                                            <mat-label>Date of Goal Created</mat-label>
                                <input matInput autocomplete="off" [matDatepicker]="picker" id="dobirth" (click)="picker.open()"  placeholder="" formControlName="goaldate">
                                <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
                                <mat-datepicker #picker></mat-datepicker>
                            </mat-form-field>
                        </div>
                    </div>
                    <div class="col-sm-8">
                        <mat-form-field>
                                            <mat-label>Goal</mat-label>
                            <input type="text" matInput placeholder="" formControlName="goal" required>
                        </mat-form-field>
                    </div>
                </div>
                <div class="row">
                    <div class="col-sm-12">
                        <mat-form-field>
                                            <mat-label>Strategy</mat-label>
                            <input type="text" matInput placeholder="" formControlName="strategy">
                        </mat-form-field>
                    </div>
                </div>
                <div class="row">
                    <div class="col-sm-12 text-end">
                        <button class="btn-pri" type="submit" (click)="addServicePlanGoal(goalStrategy.value)" *ngIf="isAdded">Create</button>
                        <button class="btn-pri" type="submit" (click)="updateServicePlanGoal(goalStrategy.value)" *ngIf="!isAdded">Update</button>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>
