

<div class="row">
    <form [formGroup]="commentsForm" >
        <div class="col-sm-12 brd-lft">
            <div class="row">
                <div class="col-sm-12">
                   
                    <div class="row m-t-20" >
                        <div class="col-sm-6">
                            <mat-form-field>
                                <mat-label>Additional Comments to Support Referrals for Plan of Safe Care:</mat-label>
                                <textarea  class="form-control fm-style" 
                                style="height:250px;" matInput rows="4"  
                                formControlName = "comments" (change)="textchange()"
                                ></textarea>
                            </mat-form-field>
                        </div>
                        
                       
                 </div>
                 
                </div>
            </div>
            <div class="col-md-12">
                <button class="btn btn-pri" type="button" (click)="goToPrevious()">Back</button>

                <button class="btn btn-pri pull-right" type="button" (click)="saveSectionDetail()">Next</button>
            </div>
        </div>
     </form>
</div>
