<div class="row mt-10">
  <div class="col-md-12 mt-10">
    <h3>HEALTH</h3>
  </div>
</div>
<ng-container [formGroup]="healthForm">
  <div class="row m-t-20">
    <div class="col-md-12 m-t-20">
      <label class="required">Current Health Status</label>
      <mat-form-field>
        <textarea matInput class="form-control fm-style" style="height:85px;" placeholder=""
          formControlName="health_status"></textarea>
      </mat-form-field>
    </div>
    <div class="col-md-12">
      <label class="required">Goals to Obtain or Maintain Good Health</label>
      <mat-form-field>
        <textarea matInput class="form-control fm-style" style="height:85px;" placeholder=""
          formControlName="health_goals"> </textarea>
      </mat-form-field>
    </div>
    <div class="col-md-12">
      <label class="required">Plans for Medical Coverage after Foster Care: (Insurance? How will you access
        healthcare‐doctors visits, medicines?)</label>
      <mat-form-field>
        <textarea matInput class="form-control fm-style" style="height:85px;" placeholder=""
          formControlName="medical_plan"> </textarea>
      </mat-form-field>
    </div>

    <specific-health-issues [healthIssuesList]="healthIssuesList"></specific-health-issues>
    
    <div class="col-sm-12 m-t-20">
      <label class="required">It is important that you take time to think about and plan whom you would like to make major health care
        decisions for
        you if you were incapacitated. In the State of Maryland, this individual would be referred to as a Health Care
        Agent.
        Health Care Agents aren’t chosen for you. It is your decision to appoint someone you trust to make these major
        decisions should you become unable. The key question in selecting a Health Care Agent is: If you are unable to
        make
        a decision about your health or treatment, is there anyone you would like to make those decisions for you?</label>
      <mat-form-field>
        <textarea matInput class="form-control fm-style" formControlName="make_decision" placeholder=""></textarea>
      </mat-form-field>
    </div>

    <div class="col-sm-12 m-t-20">
      <label>Your caseworker will provide you with a copy of the Advance Directive for Selecting a Health Care Agent, to
        help you in the process of appointing a Health Care Agent should you choose to do so.</label>
      <div class="col-sm-12 m-t-10">
        <mat-checkbox class="m-t-20 ds-block" formControlName="health_care_agent"
         >Discussed the importance of designating a Health Care Agent
        </mat-checkbox>
      </div>
      <div class="col-sm-12">
        <mat-checkbox class="m-t-20 ds-block" formControlName="advance_directive_health"
         >Received copy of the Advance Directive for Selecting a Health
          Care Agent
        </mat-checkbox>
      </div>
    </div>
    <short-term-goals [goals]="healthShortTermGoals"></short-term-goals>

  </div>
  <div class="row">
      <div class="col-md-12 qa_Box mb-20  mt-20">
          <h4 class="text-center mb-20">??DO YOU KNOW...??</h4>
        <qa-list [questions] = "healthDoYouKnowItems"></qa-list>
      </div>
  </div>
  <div class="row mt-20">
      <div class="col-sm-12">
          <div class="pull-right">
              <button type="button" value="Clear" disabled class="btn-bg" name="" (click)="clearHealthForm()">Clear</button>
              <button *securityKeyNew = "'services,services.youthtransitionplan.save'" [fieldKeyNew] = "'services,services.youthtransitionplan.save'" 
                type="button" disabled value="Save" class=" btn-pri" name="" (click)="save()">Save</button>
          </div>
      </div>
  </div>
</ng-container>
