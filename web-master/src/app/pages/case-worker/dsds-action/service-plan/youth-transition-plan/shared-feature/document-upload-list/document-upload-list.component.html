<div class="row">
    <div class="col-md-12">
        <div class="row">
            <div class="col-md-12">
                <h4>Documents</h4>
            </div>
        </div>
        <div class="row">
            <div class="col-md-12 text-end">
                <label class="btn-pri btn-bs-file cursor-pointer" matTooltipClass='customTooltip' matTooltip="Maximum upload file size: 100 MB
Allowed file types: mp3,ogg,wav,acc,flac,aiff,mp4,mov,avi,3gp,wmv,mpeg-4,pdf,txt,docx,doc,xls,xlsx,jpeg,jpg,png,ppt,pptx,gif,cr2 and rtf">
                    <i class="fa fa-cloud-upload" aria-hidden="true"></i>
                    <input type="file" (ngxf-select)="uploadFile($event)" accept=".mp3,.ogg,.wav,.acc,.flac,.aiff,.mp4,.mov,.avi,.3gp,.wmv,.mpeg-4,.pdf,.txt,.docx,.doc,.xls,.xlsx,.jpeg,.jpg,.png,.ppt,.pptx,.gif,.cr2,.rtf"
                        [ngxf-validate]="{ size: { min: 5 } }" [multiple]="true" />Upload</label>
            </div>
        </div>
        <div class="m-t-20 m-b-20">
            <div >
                <div class="table-responsive table-theme">
                    <table class="table table-striped" aria-describedby="tbl-docs-dtl">
                        <thead>
                            <tr>
                                <th scope="col">Document Name</th>
                                <th scope="col">Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            <ng-container *ngIf="uploadedDocuments?.length; else elseTemplate">
                                <tr *ngFor="let attachment of uploadedDocuments;let index =index">
                                    <td>
                                        <ng-container *ngIf="attachment?.name; else elseNameTemplate">
                                            {{attachment?.name}}
                                        </ng-container>
                                        <ng-template #elseNameTemplate>
                                            {{attachment?.title}}
                                        </ng-template>
                                        <div class="progress" *ngIf="attachment.percentage">
                                            <div class="progress-bar progress-bar-primary"
                                                role="progressbar"
                                                attr.aria-valuenow="{{attachment.percentage}}"
                                                aria-valuemin="0" aria-valuemax="100"
                                                [ngStyle]="{width:attachment.percentage+'%'}">
                                                <span class="visually-hidden">{{attachment.percentage}}% Complete
                                                    (success)</span>
                                            </div>
                                        </div>

                                    </td>
                                    <td class="action-icons">
                                        <div>
                                            <a *ngIf="attachment.s3bucketpathname" matTooltip="Download"
                                                (click)="downloadFile(attachment.s3bucketpathname)">
                                                <i class="fa fa-download font-16" aria-hidden="true"></i>
                                            </a>
                                            <a class="m-l-10" matTooltip="Delete"
                                                (click)="confirmDeleteAttachment(index)">
                                                <i class="fa fa-trash font-16" aria-hidden="true"></i>
                                            </a>
                                        </div>

                                    </td>
                                </tr>
                            </ng-container>
                            <ng-template #elseTemplate>
                                <tr>
                                    <td colspan="2">
                                        No Documents Uploaded.
                                    </td>
                                </tr>
                            </ng-template>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>



    </div>
</div>
<!--Delete Confirm-->
<div class="modal fade " id="delete-attachment-popup" role="dialog">
    <div class="modal-dialog modal-md custom-wid">
        <div class="modal-content">
            <div class="modal-header">
                <h4 class="modal-title"> Confirm Delete </h4>
                <button type="button" class="btn-close close pull-right" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <p> Are you sure you want to delete this attachment? </p>

                <div class="text-end big-bot-space right-mspace-15">
                    <button type="button" value="No" class="btn-pri" name="" data-bs-dismiss="modal"> No</button>
                    <button type="button" value="Yes" class="btn-pri" name="" data-bs-dismiss="modal"
                        (click)="deleteAttachment()">
                        Yes
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
