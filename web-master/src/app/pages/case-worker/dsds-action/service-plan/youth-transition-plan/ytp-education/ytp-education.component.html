<div class="row mt-10">
    <div class="col-md-12 mt-10">
        <h3>EDUCATION</h3>
    </div>
</div>
<form [formGroup]="educationForm" class="ps-10">
<div class="row m-t-20">
  <div class="col-md-12 m-t-20">
    <label class="required">Current Educational Status: (In school? Grade? How are grades?
      IEP? Graduation date? GED? Other programs?</label>
    <mat-form-field>
      
        <textarea formControlName="educational_status" matInput ></textarea>
    </mat-form-field>
  </div>
  <div class="col-md-12">
    <label class="required">Future Goals or Plans for Education/Vocational Training:
      (Attend College? Type of program? Vocational training? Military?)</label>
    <mat-form-field>
        <textarea formControlName="future_goals" matInput ></textarea>
    </mat-form-field>
  </div>

  <short-term-goals [goals]="educationShortTermGoals" ></short-term-goals>

  <div class="col-md-12 m-t-20">
    <label class="required">Are you familiar with the education training voucher?</label>
    <div class="row">
      <div class="col-sm-3 m-t-20">
        <mat-radio-group  formControlName="is_familiar_edu_training_voucher">
          <mat-radio-button value="1">Yes</mat-radio-button>
          <mat-radio-button value="0">No</mat-radio-button>
        </mat-radio-group>
      </div>
      <div class="col-sm-4">
        <mat-form-field>
          <mat-label>Comments</mat-label>
          <input type="text" matInput formControlName="familiar_edu_training_voucher_desc" >
        </mat-form-field>
      </div>
    </div>
  </div>
  <div class="col-md-12 m-t-10">
    <label class="required">Are you exploring other financial resources (e.g., scholarships & grants) to support your future
      educational and/or vocation programs?</label>
    <div class="row">
      <div class="col-sm-3 m-t-20">
        <mat-radio-group  formControlName="is_exploring_fin_res">
          <mat-radio-button value="1">Yes</mat-radio-button>
          <mat-radio-button value="0">No</mat-radio-button>
        </mat-radio-group>
      </div>
      <div class="col-sm-4">
        <mat-form-field>
          <mat-label>Comments</mat-label>
          <input type="text" matInput formControlName="is_exploring_fin_res_desc" >
        </mat-form-field>
      </div>
    </div>
  </div>

  </div>

</form>
<div class="row">
    <div class="col-md-12 qa_Box mb-20  mt-20">
      <h4 class="text-center mb-20">??DO YOU KNOW...??</h4>
      <qa-list [questions] = "educationDoYouKnowItems"></qa-list>
    </div>
</div>
<div class="row mt-20">
    <div class="col-sm-12">
        <div class="pull-right">
            <button type="button" disabled value="Clear" class="btn-bg" name="" (click)="clear()">Clear</button>
            <button *securityKeyNew = "'services,services.youthtransitionplan.save'" [fieldKeyNew] = "'services,services.youthtransitionplan.save'" 
              type="button" value="Save" disabled class=" btn-pri" name="" (click)="save()" >Save</button>
        </div>
    </div>
</div>
