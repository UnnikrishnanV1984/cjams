<div class="col-md-12 m-t-20 m-b-10">
  <h3>Short Term Goals/Next Steps</h3>
  <button type="button" class="service-btn p-r-20 col-fnt pull-right" name="" (click)="addGoal()" 
  [disabled]="ytpData.approvalstatuskey == 'Approved' || ytpData.approvalstatuskey == 'Pending'">+ Goal</button>
</div>

<div class="col-sm-12">
  <div class="table-responsive">
    <table class="table table-bordered " aria-describedby="tbl-shrt-trm-goal-dtl">
      <thead>
        <tr>
          <th scope="col">Short Term Goals</th>
          <th scope="col">Plan of Action</th>
          <th scope="col">Responsible Parties</th>
          <th scope="col">Projected completion date</th>
          <th scope="col">Action</th>
        </tr>
      </thead>
      <tbody>
        <ng-container *ngIf="goals.length > 0; else noRecordTemplate">
          <ng-container *ngFor="let item of goals; let index=index;">
            <tr>
              <td>
                <mat-form-field>
                  <mat-label>Short Term Goals</mat-label>
                  <input type="text" matInput [(ngModel)]="item.goal">
                </mat-form-field>
              </td>
              <td >
                 <div class="row" style="margin-left: 0px !important;">
                    <div class="row">
                     <button  class="plus-btn-align p-r-10 no-bg col-fnt pull-left" (click)="addAction(item)" matTooltip="Add Actions">
                          <em class="fa fa-plus"></em> 
                          &nbsp;
                      </button> 
                    </div>
                    <div class="row" *ngFor="let action of item.actions; let ind=index;">
                    <div class="col-md-9" >
                           <mat-form-field >
                            <mat-label>Plan of action</mat-label>
                              <input type="text" matInput [(ngModel)]="action.action_plan">
                            </mat-form-field>
                            
                    </div>
                    <div class="col-md-3" >
                        <a (click)="deleteAction(ind,item.actions)">
                            <em class="m-l-20  fa fa-trash text-16"></em>
                        </a>
                      </div>
                     </div>
                   </div> 
              </td>
              <td>
                <mat-form-field>
                  <mat-label>Responsible Parties</mat-label>
                  <mat-select [(ngModel)]="item.responsible_parties" [compareWith]="compareObjects"
                   >
                    <mat-option>None</mat-option>
                    <mat-option *ngFor="let item of persons" [value]="item">{{item.firstname}} {{item.lastname}}
                    </mat-option>
                  </mat-select>
                </mat-form-field>
              </td>
              <td>
                <common-date-picker id="projected_date" [(ngModel)]="item.projected_date" placeholder="Projected
                          completion date">
                </common-date-picker>
              </td>
              <td>
                <a (click)="deleteGoal(index)">
                  <em class="m-l-20  fa fa-trash text-16"></em>
                </a></td>
            </tr>
          </ng-container>
        </ng-container>
        <ng-template #noRecordTemplate>
          <tr>
            <td colspan="5" class="text-center">
              No Records found
            </td>
          </tr>
        </ng-template>
      </tbody>
    </table>
  </div>
</div>
<div class="modal fade custom-modal" id="delete-popup" role="dialog">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h4 class="modal-title"> Confirm Delete </h4>
        <button type="button" class="btn-close close pull-right" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <p> Are you sure you want to delete this Goal? </p>
        <div class="text-end big-bot-space right-mspace-15">
          <button type="button" value="No" class="btn-bg" name="" (click)="declineDelete()"> No </button>
          <button type="button" value="Yes" class="btn-pri" name="" data-bs-dismiss="modal" (click)="confirmDelete()"> Yes </button>
        </div>
      </div>
    </div>
  </div>
</div>
