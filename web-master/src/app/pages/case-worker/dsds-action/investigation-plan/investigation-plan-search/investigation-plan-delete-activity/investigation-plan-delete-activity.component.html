<div class="modal fade in invest on-demand-activities" id="myModal-delete-activities-tasks" role="dialog">
  <div class="modal-dialog modal-lg">
    <div class="modal-content customize-modal">
      <div class="modal-header">
        <h4 class="modal-title">Delete Activities/Tasks</h4>
        <button type="button" class="btn-close close pull-right" data-bs-dismiss="modal" [routerLink]="['/pages/case-worker/'+ id+ '/' + daNumber +'/dsds-action/investigation-plan']"></button>
      </div>
      <form [formGroup]="deleteActivityFormGroup">
        <div class="modal-body">
          <div class="row">
            <div class="col-sm-6">
              <div class="fm-box">
                <p>
                 <strong>Activities</strong>
                </p>
                <div class="modal-multi">
                  <div *ngFor="let activity of listActivity$ | async" >
                    <label class="control control--radio full-collapse-horizontal">
                      <input formControlName="leftSelectedItems" type="radio" (change)="changeActivity($event)" [value]="activity.activityid" />{{activity.description}}
                      <div class="control__indicator"></div>
                    </label>
                  </div>
                </div>
              </div>
            </div>
            <div class="col-sm-6">
              <div class="fm-box">
                <p>
                 <strong>Tasks</strong>
                </p>
                <div [formGroup]="deleteTaskFormGroup" class="modal-multi">

                  <div *ngFor="let item of listTask$ | async">
                      <label class="control control--radio full-collapse-horizontal">
                    <input formControlName="rightSelectedItems" type="radio" [style.display]="!item.isSelected ? '' : 'none'" [value]="item.activitytaskid">{{item.description}}
                    <div class="control__indicator"></div>
                    </label>
                  </div>
                </div>
              </div>
            </div>
          </div>
          <div class="row">
            <div class="col-md-12 padding hide">
              <div class="mb-3">
                <p>
                 <strong>Enter Reason For Deleting</strong>
                </p>
                <textarea name="" class="form-control full-collapse-horizontal" rows="3" placeholder="Enter Notes"></textarea>
              </div>
            </div>
            <div class="col-sm-12 mrg-top25">
              <div class="pull-right">
                <button type="button" value="Cancel" class="btn-bg" name="" data-bs-dismiss="modal" [routerLink]="['/pages/case-worker/'+ id + '/' + daNumber +'/dsds-action/investigation-plan']">Cancel</button>
                <button type="button" value="Save" class="btn-pri" name="" (click)="confirmDeleteActivity(deleteActivity)" [disabled]="deleteActivityFormGroup.pristine || deleteActivityFormGroup.invalid">Delete Selected Activity</button>
                <button type="button" value="Save" class="btn-pri" name="" (click)=" confirmDeleteTask(deleteTask)" [disabled]="deleteTaskFormGroup.pristine || deleteTaskFormGroup.invalid">Delete Selected Tasks</button>
              </div>
            </div>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>
<div class="modal fade custom-modal" id="delete-popup" role="dialog">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h4 class="modal-title"> Confirm Delete </h4>
        <button type="button" class="btn-close close pull-right" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <p> Are you sure you want to delete this Activity? </p>
        <div class="text-end big-bot-space right-mspace-15">
          <button type="button" value="No" class="btn-bg" name="" (click)="declineDeleteActivity()"> No </button>
          <button type="button" value="Yes" class="btn-pri" name="" data-bs-dismiss="modal" (click)="deleteSelectedActivity()"> Yes </button>
        </div>
      </div>
    </div>
  </div>
</div>
<div class="modal fade custom-modal" id="delete-popup-task" role="dialog">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h4 class="modal-title"> Confirm Delete </h4>
        <button type="button" class="btn-close close pull-right" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <p> Are you sure you want to delete this Task? </p>
        <div class="text-end big-bot-space right-mspace-15">
          <button type="button" value="No" class="btn-bg" name="" (click)="declineDeleteTask()"> No </button>
          <button type="button" value="Yes" class="btn-pri" name="" data-bs-dismiss="modal" (click)="deleteSelectedTask()"> Yes </button>
        </div>
      </div>
    </div>
  </div>
</div>
