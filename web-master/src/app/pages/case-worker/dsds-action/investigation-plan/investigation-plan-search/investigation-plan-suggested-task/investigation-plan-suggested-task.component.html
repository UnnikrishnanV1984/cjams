<div class="modal fade in on-demand-activities" id="myModal-suggested-tasks" role="dialog" data-bs-backdrop="static" data-bs-keyboard="false" style="display: block;">
    <div class="modal-dialog modal-lg">
        <div class="modal-content customize-modal">
            <div class="modal-header">
                <h4 class="modal-title">Check List</h4>
                <button type="button" class="btn-close close pull-right" data-bs-dismiss="modal" [routerLink]="['/pages/case-worker/'+ id + '/' + daNumber + '/dsds-action/investigation-plan']"></button>
            </div>
            <form [formGroup]="formGroup">
                <div class="modal-body modal-body-maxh">
                    <div class="row">
                        <div class="col-sm-8">
                            <div class="fm-box dd-overflow-inherit">
                                <label>Activity:</label>
                                <div class="fm-box-form dd-overflow-inherit col-sm-8">
                                    <div class="select-icon">
                                    <ng-select #inref formControlName="selectActivityList" [searchable]="true" [clearable]="false" (change)="onChangeActivity(inref.selectedItems[0])">
                                        <ng-option value="">Select</ng-option>
                                        <ng-option *ngFor="let item of activityDropdownItems$ | async " [value]="item.value">{{item.text}}</ng-option>
                                    </ng-select>
                                    <control-messages [control]="getControlByIndexFn('selectActivityList')"></control-messages>
                                </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="row mrg-top25">
                        <div class="col-sm-5">
                            <div class="fm-box">
                                <p>
                                    <strong>Suggested Tasks</strong>
                                </p>
                                <div class="mb-3 multiple-select modal-multi">
                                    <table class="table" aria-describedby="tbl-suggested-task-lst">  <!--/* //NOSONAR */-->
                                        <tbody>
                                            <tr *ngFor="let item of leftTasks | orderBy:'name'">
                                                <td>
                                                    <label class="control control--checkbox">
                                                        <input type="checkbox" (change)="toggleTask('left', item, $event)">
                                                        <div class="control__indicator"></div>
                                                    </label>
                                                </td>
                                                <td>{{item.name}}</td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-2 text-center">
                            <div class="btn-group btn-group-re multi-slt-btn">
                                <button type="button" [disabled]="buttonStateSelected()" class="btn-pri" data-bs-target="#groupReason" data-bs-toggle="modal" (click)="selectAllTask()">Add All &gt; &gt;</button>
                                <button type="button" [disabled]="buttonStateSelected()" class="btn-pri" data-bs-target="#groupReason" data-bs-toggle="modal" (click)="selectTask()">Add &gt;</button>
                                <button type="button" [disabled]="buttonStateSelected()" class="btn-pri" data-bs-target="#groupReason" data-bs-toggle="modal" (click)="unSelectTask()">&lt; Remove</button>
                                <button type="button" [disabled]="buttonStateSelected()" class="btn-pri" data-bs-target="#groupReason" data-bs-toggle="modal" (click)="unSelectAllTask()"> &lt; &lt; Remove All</button>
                            </div>
                        </div>
                        <div class="col-sm-5">
                            <div class="fm-box">
                                <p>
                                    <strong>Selected Tasks</strong>
                                </p>
                                <div class="mb-3 multiple-select modal-multi">
                                    <table class="table" aria-describedby="tbl-selected-task-lst">    <!--/* //NOSONAR */-->
                                        <tbody>
                                            <tr *ngFor="let item of rightTasks">
                                                <td>
                                                    <label class="control control--checkbox">
                                                        <input type="checkbox" (change)="toggleTask('right', item, $event)">
                                                        <div class="control__indicator"></div>
                                                    </label>
                                                </td>
                                                <td>{{item.name}}</td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>

                    </div>
                    <div class="col-sm-12 mrg-top25">
                        <div class="pull-right">
                            <button type="button" value="Cancel" class="btn-bg" data-bs-dismiss="modal" name="" [routerLink]="['/pages/case-worker/'+ id + '/' + daNumber + '/dsds-action/investigation-plan']">Cancel</button>
                            <button type="button" value="Save" class="btn-pri" name="" (click)="activitySave()" [disabled]="(rightGoals.length === 0) && (rightTasks.length === 0)">Save</button>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
