<div class="modal fade in on-demand-activities" id="myModal-add-activity" role="dialog" data-bs-backdrop="static" data-bs-keyboard="false"
    style="display: block;">
    <div class="modal-dialog modal-lg cus-modal-collapse-horizontal">
        <div class="modal-content customize-modal">
            <div class="modal-header">
                <h4 class="modal-title">Add Activities</h4>
                <button type="button" class="btn-close close pull-right" data-bs-dismiss="modal" [routerLink]="['/pages/case-worker/'+ id + '/' + daNumber + '/dsds-action/investigation-plan']"></button>
            </div>
            <div class="modal-body">
                <div class="row">
                        <div class="col-sm-5">
                            <div class="fm-box">
                                <p>
                                    <strong>Available Activities</strong>
                                </p>
                                <div class="modal-multi">
                                    <table class="table" aria-describedby="tbl-available-activities-lst">    <!--/* //NOSONAR */-->
                                        <tbody>
                                            <tr *ngFor="let item of leftItems | orderBy:'description'">
                                                <td>
                                                    <label class="control control--checkbox">
                                                        <input type="checkbox" (change)="selectItem('left', item, $event)">
                                                        <div class="control__indicator"></div>
                                                    </label>
                                                </td>
                                                <td>{{item.description}}</td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-2 text-center">
                            <div class="btn-group btn-group-re multi-slt-btn">
                                <button type="button" [disabled]="buttonState()" class="btn-pri" (click)="selectAll()">Add All &gt; &gt; </button>
                                <button type="button" [disabled]="buttonState()" class="btn-pri" (click)="select()">Add &gt;</button>
                                <button type="button" [disabled]="buttonState()" class="btn-pri" (click)="unSelect()">
                                    &lt; Remove</button>
                                <button type="button" [disabled]="buttonState()" class="btn-pri" (click)="unSelectAll()">
                                    &lt; &lt; Remove All</button>
                            </div>
                        </div>
                        <div class="col-sm-5">
                            <div class="fm-box">
                                <p>
                                    <strong>Selected Activities</strong>
                                </p>
                                <div class="modal-multi">
                                    <table class="table" aria-describedby="tbl-selected-activities-list">    <!--/* //NOSONAR */-->
                                        <tbody>
                                            <tr *ngFor="let item of rightItems">
                                                <td>
                                                    <label class="control control--checkbox">
                                                        <input type="checkbox" (change)="selectItem('right', item, $event)">
                                                        <div class="control__indicator"></div>
                                                    </label>
                                                </td>
                                                <td>{{item.description}}</td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                        <div class="col-sm-12 mrg-top25">
                            <div class="pull-right">
                                <button class="btn-bg" data-bs-dismiss="modal" name="" [routerLink]="['/pages/case-worker/'+ id + '/' + daNumber + '/dsds-action/investigation-plan']">Cancel</button>
                                <button [disabled]="rightItems.length === 0" class="btn-pri" (click)="saveItem()">Save</button>
                            </div>
                        </div>
                </div>
            </div>
        </div>
    </div>
</div>
