<div class="table-responsive table-theme m-t-20 m-b-20">
    <document-upload-list-shared [uploadedFiles]="uploadedDocuments" [isDownload]="true" [pageType] = "uploadType"
        [hideUploadButton]="true" [isDelete]="true" [isView] = "false" [uploadhealth]="true"
   ></document-upload-list-shared>  
</div>
<button class="btn-pri rm-margin-right" (click)="uploadLargeFile()"><i class="fa fa-cloud-upload" aria-hidden="true"></i> UPLOAD</button>
<button class="btn" mat-icon-button matSuffix type="button" aria-label="Upload Help" matTooltip="File size up to {{maxlargefilesize}} is allowed through Upload button." matTooltipPosition="above">
    <i class="fa fa-info-circle" aria-hidden="true"></i>
</button>
<!--Delete Confirm-->
<div class="modal fade " id="delete-attachment-popup" role="dialog">
    <div class="modal-dialog modal-md custom-wid">
        <div class="modal-content">
            <div class="modal-header">
                <h4 class="modal-title"> Confirm Delete </h4>
                <button type="button" class="btn-close close pull-right" (click)="closeAttachment()"></button>
            </div>
            <div class="modal-body">
                <p> Are you sure you want to delete this attachment? </p>

                <div class="text-end big-bot-space right-mspace-15">
                    <button type="button" value="No" class="btn-pri" name="" (click)="closeAttachment()"> No</button>
                    <button type="button" value="Yes" class="btn-pri" name="" (click)="deleteAttachment()">
                        Yes
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
<div class="modal fade " id="confirm-attachment-popup" role="dialog" >
    <div class="modal-dialog modal-md custom-wid m-upload-doc">
        <div class="modal-content">
            <div class="modal-header">
                <h4 class="modal-title"> Confirm Upload </h4>
                <button type="button" class="btn-close close pull-right" (click)="closeattachmentConfirm()"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                <p>Upload Type <span class="required"></span></p>
                <mat-radio-group [(ngModel)]="attachment_type" (change)="onChange($event.value)">
                    <mat-radio-button value="1">Add to Case</mat-radio-button>
                    <mat-radio-button value="2">Add to Person</mat-radio-button>
                </mat-radio-group><br/>
                </div>
                <div class="form-group" *ngIf="attachment_type && unsavedattachmentscount > 0 && !islargefileupload">
                    <label class="full-width required">Unsaved Documents Count: <span>{{unsavedattachmentscount}}</span></label>
                </div>
                <div class="mb-3" *ngIf="attachment_type=='2'">
                    <label class="full-collapse-horizontal required">Person:</label>
                    <select  [(ngModel)]="personid" (change)="onPersonChange($event)" class="form-select">
                        <option value="">Choose Person</option>
                        <option *ngFor="let person of involvedPerson" [value]="person.personid">
                            {{person.firstname}} {{person.lastname}} - DOB:{{person.dob | date: 'MM/dd/yyyy'}} - CJAMS PID:{{person.cjamspid}} -
                            Role:
                            <ng-container *ngFor="let role of person.roles; let isLast=last">
                                {{ role.typedescription }} <span *ngIf="!isLast">,</span>
                            </ng-container>
                        </option>
                        </select>
                </div>
                <div class="text-end big-bot-space right-mspace-15">
                    <button type="button" value="Continue" class="btn-pri" name="" (click)="continueUpload()">
                        Continue
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
