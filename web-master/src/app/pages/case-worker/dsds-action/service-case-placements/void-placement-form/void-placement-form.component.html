<div class="row m-t-10">
    <div class="col-sm-12">
        <div class="card panel-default panel-theme">
            <div class="card-header">
                <h4>Void Placement</h4>
            </div>
            <div class="card-body">
                <form  [formGroup]="voidPlacementForm">
                    <div class="row">
                        <div class="col-md-4">
                            <mat-form-field>
                                <mat-label>Reason Type</mat-label>
                                <mat-select formControlName="voidreasontypekey" required placeholder="">
                                    <mat-option matTooltip="{{item.description}}" *ngFor="let item of voidPlacementReasonTypes" [value]="item.ref_key">
                                        {{item.description}}
                                    </mat-option>
                                </mat-select>
                                <mat-error *ngIf="voidPlacementForm.get('voidreasontypekey')?.invalid">
                                    Please select Reason Type.
                                </mat-error>
                            </mat-form-field>
                        </div>

                    </div>
                    <div class="row">
                        <div class="col-md-6">
                            <p class="full-collapse-horizontal required">Comments</p>
                            <div class="textarea-notes">
                                <textarea  formControlName="voidremarks" id="voidremarks" name="description" rows="5"
                                    class="form-control full-collapse-horizontal aut-txt-addNotesNarrator" (input)="onChange()"></textarea>
                                <mat-error
                                    *ngIf="voidPlacementForm.get('voidremarks')?.hasError('required') && voidPlacementForm.get('voidremarks')?.touched">
                                    Please enter Comments.
                                </mat-error>
                                <mat-error *ngIf="voidPlacementForm.get('voidremarks')?.hasError('maxlength')">
                                    Max length 1000
                                </mat-error>
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6">
                            <p class="full-collapse-horizontal ">Explain why this is the Least Restrictive Placement for the child</p>
                            <div class="textarea-notes">
                                <textarea formControlName="leastrestrictiveplacement" name="leastrestrictiveplacement"
                                    rows="5" required
                                    class="form-control full-collapse-horizontal aut-txt-addNotesNarrator"></textarea>
                                <mat-error *ngIf="voidPlacementForm.get('leastrestrictiveplacement')?.invalid">
                                    Please Explain why this is the Least Restrictive Placement for the child.
                                </mat-error>
                            </div>
                        </div>
                    </div>

                </form>
            </div>
        </div>
    </div>
</div>
