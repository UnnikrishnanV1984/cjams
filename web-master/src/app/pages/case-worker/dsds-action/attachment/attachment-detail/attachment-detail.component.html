<div class="col-sm-12" [formGroup]="attachmentDetail">
    <div class="row form-search-person inline-form-wrap bg-gray pad-20">
        <div class="col-md-6">
            <div class="mb-3">
                <label>File Name:</label>
                <input type="text" class="form-control" name="" placeholder="Enter File Name " formControlName="filename" [disabled]="true">
            </div>
        </div>
        <div class="col-md-6" formGroupName="documentattachment">
            <div class="mb-3">
                <label>Attachment Note:</label>
                <input type="text" class="form-control" name="" placeholder="Add Note" formControlName="note">
            </div>
        </div>
    </div>
    <div class="row form-search-person inline-form-wrap bg-gray pad-20 img-upinfo">
        <div class="col-md-3">
            <div class="mb-3">
                <label class="full-collapse-horizontal required">Title:</label>
                <input type="text" class="full-collapse-horizontal form-control" placeholder="Add Title" formControlName="title">
                <control-messages [control]="getControlByIndexFn('title')"></control-messages>
            </div>
        </div>
        <div class="col-md-6" formGroupName="documentattachment">
            <div class="mb-3">
                <label class="full-collapse-horizontal">Created by:</label>
                <input type="text" class="full-collapse-horizontal form-control" formControlName="insertedby" placeholder="Add Creater name" [disabled]="true">
            </div>
        </div>
        <div class="col-md-3 dd-overflow-inherit">
            <div class="mb-3">
                <label class="full-collapse-horizontal">Created Date:</label>
                <div class="fm-box-form">
                    
                    <mat-form-field>
                        <mat-label>Created Date</mat-label>
                        <input matInput [matDatepicker]="picker" autocomplete="off" placeholder="" class="form-control full-collapse-horizontal" formControlName="documentdate" validdate [disabled]="true">
                        <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
                        <mat-datepicker #picker></mat-datepicker>
                    </mat-form-field>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="mb-3">
                <label class="full-collapse-horizontal required">Description:</label>
                <input type="text" class="form-control full-collapse-horizontal" formControlName="description" placeholder="Add Description">
                <control-messages [control]="getControlByIndexFn('description')"></control-messages>
            </div>
        </div>
        <div class="col-md-3" formGroupName="documentattachment">
            <div class="mb-3">
                <label class="full-collapse-horizontal required">Attachment Type:</label>
                <select name="" class="form-select" formControlName="attachmenttypekey" (change)="typeUpdate($event)">
                    <option  [disabled]="this.isdisabled('')" value="">Attachment Type</option>
                    <option *ngFor="let attachment of attachmentTypeDropdown$ | async" [selected]="this.isselected(isdisabled)" [disabled]="this.isdisabled(attachment.value)" [value]="attachment.value">{{attachment.text}}</option>
                  </select>

            </div>
        </div>
        <div class="col-md-3" formGroupName="documentattachment">
            <div class="mb-3">
                <label class="full-collapse-horizontal required">Classification Type:</label>
                    <select name="" class="form-select" formControlName="attachmentclassificationtypekey" (change)="categoryUpdate($event)">
                    <option value="">Category</option>
                    <option *ngFor="let attachment of attachmentClassificationtype" [value]="attachment.typedescription">{{attachment.typedescription}}</option>
                  </select>

            </div>
        </div>
        <div class="col-md-3" formGroupName="documentattachment">
            <div class="mb-3">
                <label class="full-collapse-horizontal required">Sub Category:</label>
                <select name="" class="form-select" formControlName="attachmentclassificationsubtypekey" (change)="subcategoryUpdate($event)">
                    <option value="">Sub Category</option>
                    <option *ngFor="let attachment of attachmentClassificationsubtype" [value]="attachment.subcategory">{{attachment.subcategory}}</option>
                  </select>

            </div>
        </div>
        <div class="col-md-3 dd-overflow-inherit" formGroupName="documentattachment">
            <div class="mb-3">
                <label class="full-collapse-horizontal">Attachment Date:</label>
                <div class="fm-box-form">
                    
                    <mat-form-field>
                        <mat-label>Attachment Date</mat-label>
                        <input matInput [matDatepicker]="picker1" autocomplete="off" placeholder="" class="form-control full-collapse-horizontal" formControlName="attachmentdate" validdate>
                        <mat-datepicker-toggle matIconSuffix [for]="picker1"></mat-datepicker-toggle>
                        <mat-datepicker #picker1></mat-datepicker>
                    </mat-form-field>
                </div>
            </div>
        </div>
    </div>
    <div class="row form-search-person inline-form-wrap bg-gray pad-20" formGroupName="documentattachment">
        <div class="col-md-6">
            <div class="mb-3">
                <label>Source / Author:</label>
                <input type="text" class="form-control" formControlName="sourceauthor" placeholder="Add Source / Author Name" name="">
            </div>
        </div>
        <div class="col-md-6">
            <div class="mb-3">
                <label>Subject:</label>
                <input type="text" class="form-control" formControlName="attachmentsubject" placeholder="Add Subject" name="">
            </div>
        </div>
        <div class="col-md-6">
            <div class="mb-3">
                <label>Position:</label>
                <input type="text" class="form-control" formControlName="sourceposition" placeholder="Add Position" name="">
            </div>
        </div>
        <div class="col-md-6">
            <div class="mb-3">
                <label>Purpose:</label>
                <input type="text" class="form-control" formControlName="attachmentpurpose" placeholder="Add Purpose" name="">
            </div>
        </div>
        <div class="col-md-6">
            <div class="mb-3">
                <label>Phone:</label>
                <input type="text" class="form-control" mask="(000) 000-0000" formControlName="sourcephonenumber" placeholder="Add Phone number"
                    name="">
            </div>
        </div>
        <div class="col-md-6">
            <div class="mb-3">
                <label>Acquisition Method:</label>
                <input type="text" class="form-control" formControlName="acquisitionmethod" placeholder="Add Acquisation Method" name="">
            </div>
        </div>
        <div class="col-md-6">
            <div class="mb-3">
                <label>Address:</label>
                <input type="text" class="form-control" formControlName="sourceaddress" placeholder="Add Address" name="">
            </div>
        </div>
        <div class="col-md-6">
            <div class="mb-3">
                <label>Location Of Original:</label>
                <input type="text" class="form-control" formControlName="locationoforiginal" placeholder="Add Location of original" name="">
            </div>
        </div>
    </div>
    <div class="col-sm-12 text-center">
        <button type="button" class="btn-pri" [disabled]="attachmentDetail.invalid || attachmentDetail.pristine" (click)="saveAttachmentDetails()">Save</button>
    </div>
</div>
