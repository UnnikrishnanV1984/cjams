<div class="modal fade in" id="upload-attachment" tabindex="-1" data-bs-backdrop="static" data-bs-keyboard="false" role="dialog"
    style="display: block;">
    <div class="modal-dialog modal-lg" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h4 class="modal-title" id="myModalLabel">Record Audio
                </h4>
                <button type="button" class="btn-close close pull-right" data-bs-dismiss="modal" aria-label="Close" (click)="stopRecording()" [routerLink]="['/pages/case-worker/' + id + '/' + daNumber  + '/dsds-action/attachment']"></button>
            </div>
            <div class="modal-body bg-grey-fill">
                <div class="row">
                    <div class="col-md-12">
                        <div class="wizard">
                            <div class="wizard-inner">
                                <div class="connecting-line"></div>
                                <ul class="nav nav-tabs" role="tablist">
                                    <li class="nav-item" role="presentation" [ngClass]="!tabActive ? 'active' : 'disabled'">
                                        <a class="nav-link" href="#step1" data-bs-toggle="tab" aria-controls="step1" role="tab" title="Upload">
                                            <span class="round-tab">
                                                <em class="glyphicon glyphicon-folder-open"></em>
                                            </span>
                                        </a>
                                    </li>
                                    <li class="nav-item" role="presentation" [ngClass]="tabActive ? 'active' : 'disabled'">
                                        <a class="nav-link" href="#complete" data-bs-toggle="tab" aria-controls="complete" role="tab" title="Complete">
                                            <span class="round-tab">
                                                <em class="glyphicon glyphicon-ok"></em>
                                            </span>
                                        </a>
                                    </li>
                                </ul>
                            </div>
                            <form role="form">
                                <div class="tab-content">
                                    <div class="tab-pane active" role="tabpanel" id="step1">
                                        <div class="audio-wrap">
                                            <audio #audio class="audio"></audio>
                                        </div>
                                        <div class="clearfix"></div>
                                        <div class="btn-group">
                                            <button *ngIf="!record" class="btn btn-custom" (click)="startRecording()">
                                                <img src="assets/images/start-record.png" alt="Start Recording">
                                            </button>
                                            <button *ngIf="record" class="btn btn-custom" (click)="stopRecording()">
                                                <img src="assets/images/start-record.png" alt="Start Recording">
                                            </button>
                                        </div>
                                        <ul class="list-inline pull-right">
                                            <li>
                                                <button class="btn-pri next-step"  [disabled]="!enableSave || record" (click)="startUpload()">Save and continue</button>
                                            </li>
                                        </ul>
                                    </div>
                                    <div class="tab-pane" role="tabpanel" id="complete">
                                        <attachment-detail (modalDismiss)="modalDismiss()"></attachment-detail>
                                    </div>
                                    <div class="clearfix"></div>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
