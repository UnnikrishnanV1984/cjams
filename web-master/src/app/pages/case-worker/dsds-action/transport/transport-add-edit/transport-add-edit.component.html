<div class="tab-content no-shadow">
  <div id="add-Profile-info" class="tab-pane fade show active">
    <div class="content-pad ">
      <div class="row">
        <div class="col-sm-12">
          <h4 class="header-4" style="text-transform: capitalize;">{{operation}} Transport Request</h4>
        </div>
      </div>
      <form [formGroup]="transportForm">
        <div class="row">
           <div class="col-sm-6">
            <div class="row">
            <div class="col-sm-4">
              <common-date-picker [min]="minDateOfTrasnport" formControlName="dateoftransport" placeholder="Date of Transport"></common-date-picker>
            </div>
            <div class="col-sm-4">
              <mat-form-field>
                <mat-label>Pick Up Time</mat-label>
                <input formControlName="pickuptime" matInput  type="time">
              </mat-form-field>
            </div>
            <div class="col-sm-4">
              <mat-form-field>
                <mat-label>Day</mat-label>
                <input required formControlName="day" matInput >
              </mat-form-field>
            </div>
            </div>
          </div>
          <div class="col-sm-6">
              <div class="row">
                  <div class="col-sm-6">
                      <common-date-picker [min]="minDateOfTrasnport" formControlName="dateoftransportdrop" placeholder="Date of Expected"></common-date-picker> 
                    </div>
                  <div class="col-sm-6">
                    <mat-form-field>
                      <mat-label>Expected Drop Time</mat-label>
                      <input formControlName="droptime" matInput  type="time">
                    </mat-form-field>
                  </div>
              </div>
          </div>
          <div class="col-sm-4">
            <mat-form-field>
              <mat-label>Youth Name</mat-label>
              <input formControlName="youthname" matInput >
            </mat-form-field>
          </div>
          <div class="col-sm-4">
            <mat-form-field>
              <mat-label>DOB</mat-label>
              <input formControlName="dob" (click)="picker2.open()" matInput autocomplete="off" [matDatepicker]="picker2" >
              <mat-datepicker-toggle matSuffix [for]="picker2"></mat-datepicker-toggle>
              <mat-datepicker #picker2></mat-datepicker>
            </mat-form-field>
          </div>
          <div class="col-sm-4">
              <mat-form-field>
                <mat-label>Select Offence</mat-label>
                <mat-select  formControlName="allegationid">
                    <mat-option *ngFor="let item of OffenceValuesDropdownItems$ | async" [value]="item.value">{{item.text}}</mat-option>
                </mat-select>
            </mat-form-field>
            </div>
          <div class="col-sm-6">
            <mat-form-field>
              <mat-label>Court Time</mat-label>
              <input formControlName="courttime" matInput  type="time">
            </mat-form-field>
          </div>
          <div class="col-sm-6">
            <mat-form-field>
              <mat-label>Court Location</mat-label>
              <input formControlName="courtlocation" matInput >
            </mat-form-field>
          </div>
        </div>
        <mat-form-field>
          <mat-label>Charge(s) Reason</mat-label>
          <input formControlName="chargereason" matInput >
        </mat-form-field>
        <div class="row">
          <div class="col-sm-6">
            <mat-form-field>
              <mat-label>Location From</mat-label>
              <mat-select required (selectionChange)="fromChange($event.value)" formControlName="locationfromtypekey"
                >
                <mat-option *ngFor="let item of fromDropdownItems$ | async" value="{{item.locationfromtypekey}}">{{item.description}}</mat-option>
              </mat-select>
            </mat-form-field>
          </div>
          <div class="col-sm-6">
            <mat-form-field>
              <mat-label>Location To</mat-label>
              <mat-select required (selectionChange)="toChange($event.value)" formControlName="locationtotypekey" >
                <mat-option *ngFor="let item of toDropdownItems$ | async" value="{{item.locationtotypekey}}">{{item.description}}</mat-option>
              </mat-select>
            </mat-form-field>
          </div>
        </div>
        <div class="row" *ngIf="isFromOther || isToOther">
          <div class="col-sm-6">
            <mat-form-field *ngIf="isFromOther">
              <mat-label>Other Location From</mat-label>
              <input required formControlName="otherlocationfrom" matInput >
            </mat-form-field>
          </div>
          <div class="col-sm-6">
            <mat-form-field *ngIf="isToOther">
              <mat-label>Other Location To</mat-label>
              <input required formControlName="otherlocationto" matInput >
            </mat-form-field>
          </div>
        </div>
        <mat-form-field>
          <mat-label>Memo/Notes</mat-label>
          <textarea formControlName="notes" matInput ></textarea>
        </mat-form-field>
      </form>
      <div *ngIf="operation === 'add'" class="text-end">
        <button class="btn btn-sec btn-theme" (click)="goBackToList();">Cancel</button>
        <button class="btn btn-pri btn-theme" (click)="saveTransport();" [disabled]="transportForm.invalid">Save</button>
      </div>
      <div *ngIf="operation === 'edit'" class="text-end">
        <button class="btn btn-sec btn-theme" (click)="goBackToList();">Cancel</button>
        <button class="btn btn-pri btn-theme" (click)="updateTransport();" [disabled]="transportForm.invalid">Update</button>
      </div>
    </div>
  </div>
</div>
