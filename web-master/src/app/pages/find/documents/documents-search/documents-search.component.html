<form onSubmit="return false;" [formGroup]="documentsFormGroup">
  <div class="left-side-form space-15">
    <h5 class="blue">Document Filters</h5>
    <div class="row">
      <h4 class="col-md-12">Type</h4>
      <div class="col-md-12 col-sm-12 col-xs-12">
        <div class="fm-box" *ngFor="let type of documentTypeCheckBoxItems$ | async">
          <label class="control control--checkbox zero">
            <input type="checkbox" (change)="onDocumentTypeCheckBoxChange(type.value,$event)">{{type.value}}
            <div class="control__indicator"></div>
          </label>
        </div>
      </div>
    </div>
    <hr>
    <div class="row dd-overflow-inherit" style="height: 400px;">
      <div class="col-md-12 col-sm-12 col-xs-12">
        <h4>Received Date</h4>
        <div class="col-md-6 col-sm-12 col-xs-12 no-pad">
          <div class="fm-box">
            <label class="col-sm-12 no-pad">From</label>
            <div class="fm-box-form col-md-12 col-sm-12 col-xs-12 no-pad">
             
              <mat-form-field>
                <mat-label>MM/DD/YYYY</mat-label>
                <input matInput [matDatepicker]="picker" autocomplete="off"  class="form-control fm-style" formControlName="receivedfrom" validdate>
                <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
                <mat-datepicker #picker></mat-datepicker>
              </mat-form-field>
            </div>
          </div>
        </div>
        <div class="col-md-6 col-sm-12 col-xs-12 pe-0">
          <div class="fm-box">
            <label class="col-sm-12 no-pad">To</label>
            <div class="fm-box-form col-md-12 col-sm-12 col-xs-12 no-pad">
             
              <mat-form-field>
                <mat-label>MM/DD/YYYY</mat-label>
                <input matInput [matDatepicker]="picker" autocomplete="off"  class="form-control fm-style" formControlName="receivedto">
                <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
                <mat-datepicker #picker></mat-datepicker>
              </mat-form-field>
            </div>
          </div>
        </div>
      </div>
      <small class="text-danger" *ngIf="documentsFormGroup.hasError('notValid')">From date is greater than To date</small>
    </div>
    <hr>
    <div class="row">
      <div class="col-sm-12 text-start">
        <h4>Created By</h4>
        <label class="control control--checkbox ">Mine
          <input type="checkbox" name="mine" value="mine" (change)="onCreatedByCheckBoxChange($event)">
          <div class="control__indicator"></div>
        </label>
        <label class="control control--checkbox ">My Team
          <input type="checkbox" name="myteam" value="myteam" (change)="onCreatedByCheckBoxChange($event)">
          <div class="control__indicator"></div>
        </label>
      </div>
    </div>
    <hr>
    <div class="row">
      <div class="col-sm-12">
        <div class="fm-box">
          <label class="col-sm-12 no-pad">Doc Identifier</label>
          <div class="fm-box-form col-sm-12 no-pad">
            <input type="text" class="form-control fm-style"  name="documentidentifer" formControlName="documentidentifer">
          </div>
        </div>
      </div>
    </div>
    <div class="pull-right mrg-top25">
      <button type="button" value="Go" class="btn-pri" name="" (click)="searchDocuments(1,documentsFormGroup.value)">Go</button>
    </div>
  </div>
</form>
