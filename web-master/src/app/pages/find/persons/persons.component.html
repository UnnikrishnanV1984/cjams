<!-- header end -->
<div class="container-fluid no-pad">
  <div class="form-control-size">
    <div class="col-md-12 col-sm-12 col-xs-12 no-pad white-bg">
      <div class="col-md-3 col-sm-4 col-xs-12 ps-0">
        <app-person-search-filters 
        [personListSubject$]="personListDataSubject$" 
        [totalRecordSubject$]="totalRecordsSubject$" 
        [pageNumber$]="pageNumberSubject$"></app-person-search-filters>
      </div>
      <div class="col-md-9 col-sm-8 col-xs-12 right-side-box">
        <app-person-search-result
        [showTable]="showTable" 
        [pageNumberSubject$]="pageNumberSubject$" 
        [personList$]="personSearchResult$" 
        [totalRecords$]="totalRecords$"></app-person-search-result>
      </div>
    </div>
  </div>
</div>
<script src="assets/js/jquery.min.js" type="text/javascript"></script>
<script src="assets/js/bootstrap.min.js" type="text/javascript"></script>
