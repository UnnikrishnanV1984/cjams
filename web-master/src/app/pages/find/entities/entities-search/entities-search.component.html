<form onSubmit="return false;" [formGroup]="entitiesFormGroup">
  <div class="left-side-box space-15 textLeft">
    <h4> Entity Filters </h4>
    <div class="row">
      <div class="col-md-5 col-sm-12 col-xs-12 mb-10">
        <label for=""> Official Name </label>
      </div>
      <div class="col-md-7 col-sm-12 col-xs-12 mb-10">
        <input type="text" class="form-control" placeholder="Enter Official Name" name="agencyname" formControlName="agencyname">
      </div>
    </div>
    <div class="row">
      <div class="col-md-5 col-sm-12 col-xs-12 mb-10">
        <label for=""> Common Name </label>
      </div>
      <div class="col-md-7 col-sm-12 col-xs-12 mb-10">
        <input type="text" class="form-control" placeholder="Enter Common Name" name="commonname" formControlName="commonname">
      </div>
    </div>
    <div class="row">
      <div class="col-md-5 col-sm-12 col-xs-12 mb-10">
        <label for=""> Status </label>
      </div>
      <div class="col-md-7 col-sm-12 col-xs-12 mb-10 ">
        <ng-select [searchable]="true" [clearable]="false" name="status" formControlName="status">
            <ng-option selected="selected" value="">--select--</ng-option>
          <ng-option value="InActive" > InActive </ng-option>
          <ng-option value="Active"> Active </ng-option>
          <ng-option value="Other"> Other </ng-option>
        </ng-select>
      </div>
    </div>

    <div class="row">
      <div class="col-md-5 col-sm-12 col-xs-12 mb-10">
        <label for=""> Phone Number </label>
      </div>
      <div class="col-md-7 col-sm-12 col-xs-12 mb-10">
        <input type="text" class="form-control" placeholder="Enter Phone No" name="phonenumber" formControlName="phonenumber">
      </div>
    </div>
    <div class="row">
      <div class="col-md-5 col-sm-12 col-xs-12 mb-10">
        <label for=""> FAC ID </label>
      </div>
      <div class="col-md-7 col-sm-12 col-xs-12 mb-10">
        <input type="text" class="form-control" placeholder="Enter FAC ID " name="facid" formControlName="facid">
      </div>
    </div>


    <div class="sep-top-blue ver-mspace bot-space"> </div>
    <h4>Location filters </h4>
    <div class="row">
      <div class="col-md-5 col-sm-12 col-xs-12 mb-10">
        <label for=""> Street </label>
      </div>
      <div class="col-md-7 col-sm-12 col-xs-12 mb-10">
        <input type="text" class="form-control" placeholder="Enter Street" name="address" formControlName="address">
      </div>
    </div>
    <div class="row">
      <div class="col-md-5 col-sm-12 col-xs-12 mb-10">
        <label for=""> Street2 </label>
      </div>
      <div class="col-md-7 col-sm-12 col-xs-12 mb-10">
        <input type="text" class="form-control" placeholder="Enter Street2" name="street2" formControlName="street2">
      </div>
    </div>
    <div class="row">
      <div class="col-md-5 col-sm-12 col-xs-12 mb-10">
        <label for=""> City </label>
      </div>
      <div class="col-md-7 col-sm-12 col-xs-12 mb-10">
        <input type="text" class="form-control" placeholder="Enter City" name="city" formControlName="city">
      </div>
    </div>
    <div class="row">
      <div class="col-md-5 col-sm-12 col-xs-12 mb-10">
        <label for=""> ZipCode </label>
      </div>
      <div class="col-md-7 col-sm-12 col-xs-12 mb-10">
        <input type="text" class="form-control" placeholder="Enter ZipCode" name="zipcode" formControlName="zipcode">
      </div>
    </div>
    <div class="row">
      <div class="col-md-5 col-sm-12 col-xs-12 mb-10">
        <label for=""> County </label>
      </div>
      <div class="col-md-7 col-sm-12 col-xs-12 mb-10 ">
        <ng-select [searchable]="true" [clearable]="false" name="county" formControlName="county">
          <ng-option selected="selected" value="">--select--</ng-option>
          <ng-option *ngFor="let county of countyDropDownItems$ | async| orderBy:'text'" [value]="county.value"> {{county.text}} </ng-option>

        </ng-select>
      </div>
    </div>
    <div class="row">
      <div class="col-md-5 col-sm-12 col-xs-12 mb-10">
        <label for=""> Region </label>
      </div>
      <div class="col-md-7 col-sm-12 col-xs-12 mb-10 ">
        <ng-select [searchable]="true" [clearable]="false" name="region" formControlName="region">
          <ng-option selected="selected" value="">--select--</ng-option>
          <ng-option *ngFor="let region of regionDropDownItems$ | async| orderBy:'text'" [value]="region.value"> {{region.text}} </ng-option>

        </ng-select>
      </div>
    </div>


    <div class="sep-top-blue ver-mspace bot-space"> </div>
    <h4>Service filters </h4>


    <div class="row">
      <div class="col-md-5 col-sm-12 col-xs-12 mb-10">
        <label for=""> Category </label>
      </div>
      <div class="col-md-7 col-sm-12 col-xs-12 mb-10 ">
        <ng-select [searchable]="true" [clearable]="false" name="category" formControlName="category">
          <ng-option selected="selected" value="">--select--</ng-option>
          <ng-option *ngFor="let category of categoryDropDownItems$ | async| orderBy:'text'" [value]="category.value"> {{category.text}} </ng-option>

        </ng-select>
      </div>
    </div>
    <div class="row">
      <div class="col-md-5 col-sm-12 col-xs-12 mb-10">
        <label for=""> Type </label>
      </div>
      <div class="col-md-7 col-sm-12 col-xs-12 mb-10 ">
        <ng-select [searchable]="true" [clearable]="false" name="type" (change)="onSelectType(entitiesFormGroup.value.type)" formControlName="type" >
          <ng-option selected="selected" value="">--select--</ng-option>
          <ng-option *ngFor="let type of typeDropDownItems$ | async| orderBy:'text'" [value]="type.value"> {{type.text}} </ng-option>
        </ng-select>
      </div>
    </div>

    <div class="row">
      <div class="col-md-5 col-sm-12 col-xs-12 mb-10">
        <label for=""> Business Type </label>
      </div>
      <div class="col-md-7 col-sm-12 col-xs-12 mb-10 ">
        <ng-select [searchable]="true" [clearable]="false" [disabled]="true"  name="businessType" formControlName="businesstype">
          <ng-option selected="selected"  value="">--select--</ng-option>
          <ng-option *ngFor="let businessType of businessTypeDropDownItem | async| orderBy:'text'" [value]="businessType.value"> {{businessType.text}} </ng-option>

        </ng-select>
      </div>
    </div>
    <div class="row">
      <div class="col-md-5 col-sm-12 col-xs-12 mb-10">
        <label for=""> Service </label>
      </div>
      <div class="col-md-7 col-sm-12 col-xs-12 mb-10 ">
        <ng-select [searchable]="true" [clearable]="false" name="service" formControlName="service">
          <ng-option selected="selected" value="">--select--</ng-option>
          <ng-option *ngFor="let service of serviceDropDownItems$  | async| orderBy:'text' " [value]="service.value"> {{service.text}} </ng-option>

        </ng-select>
      </div>
    </div>

    <div class="row">
      <div class="col-md-5 col-sm-12 col-xs-12 mb-10">
        <label for=""> Area Serviced </label>
      </div>
      <div class="col-md-7 col-sm-12 col-xs-12 mb-10 ">
        <ng-select [searchable]="true" [clearable]="false" name="areaServiced" formControlName="areaserviced">
          <ng-option selected="selected" value="">--select--</ng-option>
          <ng-option *ngFor="let areaServiced of countyDropDownItems$ |async| orderBy:'value'" [value]="areaServiced.value"> {{areaServiced.value}} </ng-option>

        </ng-select>
      </div>
    </div>

    <div class="text-end">
      <button class="btn btn-bg mb-10" (click)="clearEntities()"> CLEAR </button>
      <button class="btn btn-pri mb-10" (click)="searchEntities(1,entitiesFormGroup.value)"> GO </button>
    </div>
  </div>
</form>
