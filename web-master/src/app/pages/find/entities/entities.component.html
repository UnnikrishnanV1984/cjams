<!-- header end -->
<div class="container-fluid no-pad">
  <div class="form-control-size">
    <div class="col-md-12 col-sm-12 col-xs-12 no-pad white-bg">
      <div class="col-md-3 col-sm-4 col-xs-12 ps-0">
        <entities-search [searchEntitiesList$]="searchEntitiesList$" [searchTotalRecords$]="searchTotalRecords$" [searchPageNumber$]="resultsPageNumber$">
        </entities-search>
      </div>
      <div class="col-md-9 col-sm-8 col-xs-12 right-side-box">
        <entities-results [showTable]="showTable" 
        [resultsPageNumber$]="resultsPageNumber$" [resultsEntitiesList$]="resultsEntitiesList$" [resultsTotalRecords$]="resultsTotalRecords$">
        </entities-results> 
      </div>
    </div>
  </div>
</div>
