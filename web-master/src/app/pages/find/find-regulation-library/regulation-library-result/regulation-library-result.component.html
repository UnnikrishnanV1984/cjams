
    <div class="row">
        <div class="col-sm-12">
            <h5 class="mrg-top25">
                <strong>Search Result</strong>
            </h5>
            <div *ngIf="showTable" class="table-responsive form-letter-tab">
                <table class="table table-bordered" aria-describedby="tbl-regltn-lbry-rslt-dtls">
                    <thead>
                        <tr>
                            <th scope="col">Statutes Key</th>
                            <th scope="col">Description</th>
                            <th scope="col">Statute Text</th>
                            <th scope="col">Type</th>
                        </tr>
                    </thead>
                    <tbody *ngIf="(regulationResultData$ | async)?.length !== 0">
                        <tr *ngFor="let regulationData of regulationResultData$ | async">
                            <td (click)="selectRegulation(regulationData)">
                                <a href="#" data-bs-toggle="modal" data-bs-target="#myModal-regulation">{{regulationData.statestatuteskey}}</a>
                            </td>
                            <td>{{regulationData.description}}</td>
                            <td>{{regulationData.statestatutetext}}</td>
                            <td>{{regulationData.librarytype}}</td>
                        </tr>
                    </tbody>

            </table>
            <div class="text-center" *ngIf="{regulationResultData : regulationResultData$ | async, totalResultRecords :totalResulRecords$ | async } as validatePagination">
                <pagination *ngIf="validatePagination && validatePagination.regulationResultData && validatePagination.regulationResultData.length !==0" [totalItems]="validatePagination?.totalResultRecords ?? 0" [(ngModel)]="paginationInfo.pageNumber" (pageChanged)="pageChanged($event.page)"
                    class="pagination-sm" [boundaryLinks]="true" [maxSize]="10"></pagination>
            </div>
        </div>
    </div>


<div>
    <regulation-library-view [selectedRegulation]="selectedRecord"></regulation-library-view>
</div>
