<div class="modal fade custom-modal" id="myModal-regulation" role="dialog">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h4 class="modal-title"> Edit State Statute </h4>
                <button type="button" class="btn-close close pull-right fw-bold" data-bs-dismiss="modal">X</button>
            </div>
            <div class="modal-body">
                <div class="fm-box">
                    <div class="row">
                        <div class="col-sm-4">
                            <label> State Statute Key: </label>
                        </div>
                        <div class="col-sm-8">
                            <div class="fm-box-form">
                                <input type="text" name="" class="form-control" disabled="disabled" value="{{selectedRegulation.statestatuteskey}}">
                            </div>
                        </div>
                    </div>
                </div>
                <div class="fm-box">
                    <div class="row">
                        <div class="col-sm-4">
                            <label> Description: </label>
                        </div>
                        <div class="col-sm-8">
                            <div class="fm-box-form">
                                <textarea class="form-control" disabled="disabled">{{selectedRegulation.description}}</textarea>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="fm-box">
                    <div class="row">
                        <div class="col-sm-4">
                            <label> State Statute Text: </label>
                        </div>
                        <div class="col-sm-8">
                            <div class="fm-box-form">
                                <textarea class="form-control content-height" row="10" disabled="disabled">{{selectedRegulation.statestatutetext}}</textarea>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="fm-box">
                    <div class="row">
                        <div class="col-sm-4">
                            <label> Effective Date: </label>
                        </div>
                        <div class="col-sm-5">
                            <div class="fm-box-form">
                                <input type="text" name="" class="form-control" disabled="disabled" value="{{selectedRegulation.effectivedate | date:'shortDate'}}">
                                <i class="fa fa-calendar" aria-hidden="true"></i>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="fm-box">
                    <div class="row">
                        <div class="col-sm-4">
                            <label> Expiration Date: </label>
                        </div>
                        <div class="col-sm-5">
                            <div class="fm-box-form">
                                <input type="text" name="" class="form-control" disabled="disabled" value="{{selectedRegulation.expirationedate | date:'shortDate'}}">
                                <i class="fa fa-calendar" aria-hidden="true"></i>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="fm-box">
                    <div class="row">
                        <div class="col-sm-4">
                            <label> Status Type: </label>
                        </div>
                        <div class="col-sm-5">
                            <div class="fm-box-form">
                                <input type="text" name="" class="form-control" disabled="disabled" value="{{selectedRegulation.librarytype}}">
                            </div>
                        </div>
                    </div>
                </div>
                <div class="fm-box">
                    <div class="row">
                        <div class="col-sm-4">
                            <label> Possible Sanction Flag: </label>
                        </div>
                        <div class="col-sm-5">
                            <div class="fm-box-form">
                                <input type="text" name="" class="form-control" disabled="disabled" [value]="(selectedRegulation.possiblesanctionflag)? 'Yes' : 'No'">
                            </div>
                        </div>
                    </div>
                </div>
                <div class="fm-box">
                    <div class="row">
                        <div class="col-sm-4">
                            <label> Possible Referral Flag: </label>
                        </div>
                        <div class="col-sm-5">
                            <div class="fm-box-form">
                                <input type="text" name="" class="form-control" disabled="disabled" [value]="(selectedRegulation.possiblereferralflag)? 'Yes' : 'No'">
                            </div>
                        </div>
                    </div>
                </div>
                <div class="text-end">
                    <button type="button" class="btn-bg" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>
</div>
