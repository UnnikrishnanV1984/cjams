<div class="left-side-box space-15" [formGroup]="formSearchCriteria">
    <span class="blue"> User Filters </span>
    <div class="row big-top-space">
        <div class="col-md-5 col-sm-12 col-xs-12 mb-10">
            <label for=""> Last Name </label>
        </div>
        <div class="col-md-7 col-sm-12 col-xs-12 mb-10">
            <input type="text" class="form-control" placeholder="Last Name" name="LastName" formControlName="LastName">
        </div>
    </div>
    <div class="row">
        <div class="col-md-5 col-sm-12 col-xs-12 mb-10">
            <label for=""> First Name </label>
        </div>
        <div class="col-md-7 col-sm-12 col-xs-12 mb-10">
            <input type="text" class="form-control" placeholder="First Name" name="FirstName" formControlName="FirstName">
        </div>
    </div>
    <div class="sep-top-blue ver-mspace bot-space"> </div>
    <h4> User Location Filters </h4>
    <div class="row">
        <div class="col-md-5 col-sm-12 col-xs-12 mb-10">
            <label for=""> City </label>
        </div>
        <div class="col-md-7 col-sm-12 col-xs-12 mb-10">
            <input type="text" class="form-control" placeholder="City" name="UserCity" formControlName="UserCity">
        </div>
    </div>
    <div class="row">
        <div class="col-md-5 mb-10">
            <label for=""> ZipCode </label>
        </div>
        <div class="col-md-7 col-sm-12 col-xs-12 mb-10">
            <input type="text" class="form-control" placeholder="ZipCode" name="UserZipCode" formControlName="UserZipCode">
        </div>
    </div>
    <div class="row">
        <div class="col-md-5 col-sm-12 col-xs-12 mb-10">
            <label for="">County </label>
        </div>
        <div class="col-md-7 col-sm-12 col-xs-12 mb-10 ">
            <ng-select [searchable]="true" [clearable]="false"  formControlName="UserCounty">
                <ng-option selected="selected" value="">--select--</ng-option>
                <ng-option *ngFor="let item of countyDropdownItems$ | async" [value]="item.value">{{item.text}}</ng-option>
            </ng-select>
        </div>
    </div>
    <div class="sep-top-blue ver-mspace bot-space"> </div>
    <h4> Position Filters </h4>
    <div class="row">
        <div class="col-md-5 col-sm-12 col-xs-12 mb-10">
            <label for=""> Team Number </label>
        </div>
        <div class="col-md-7 col-sm-12 col-xs-12 mb-10 ">
            <ng-select [searchable]="true" [clearable]="false" formControlName="TeamNo">
                <ng-option selected="selected" value="">--select--</ng-option>
                <ng-option *ngFor="let item of teamNumberDropdownItems$ | async" [value]="item.value">{{item.text}}</ng-option>
            </ng-select>
        </div>
    </div>
    <div class="row">
        <div class="col-md-5 col-sm-12 col-xs-12 mb-10">
            <label for=""> Team Type </label>
        </div>
        <div class="col-md-7 col-sm-12 col-xs-12 mb-10">
            <ng-select [searchable]="true" [clearable]="false" formControlName="TeamType">
                <ng-option selected="selected" value="">--select--</ng-option>
                <ng-option *ngFor="let item of teamTypeDropdownItems$ | async" [value]="item.value">{{item.text}}</ng-option>
            </ng-select>
        </div>
    </div>
    <div class="row">
        <div class="col-md-5 col-sm-12 col-xs-12 mb-10">
            <label for=""> Position Title </label>
        </div>
        <div class="col-md-7 col-sm-12 col-xs-12 mb-10">
            <ng-select [searchable]="true" [clearable]="false"  formControlName="positionTitle">
                <ng-option selected="selected" value="">--select--</ng-option>
                <ng-option *ngFor="let item of positionTitleDropdownItems$ | async" [value]="item.value">{{item.text}}</ng-option>
            </ng-select>
        </div>
    </div>
    <div class="row">
        <div class="col-md-5 col-sm-12 col-xs-12 mb-10">
            <label for=""> Position/Load </label>
        </div>
        <div class="col-md-7 col-sm-12 col-xs-12 mb-10">
            <input type="text" class="form-control" placeholder="Position" name="Position" formControlName="Position">
        </div>
    </div>
    <div class="row">
        <div class="col-md-5 col-sm-12 col-xs-12 mb-10">
            <label for=""> Org Number </label>
        </div>
        <div class="col-md-7 col-sm-12 col-xs-12 mb-10">
            <input type="text" class="form-control" name="org Number" placeholder="Org Number" formControlName="orgNumber">
        </div>
    </div>
    <div class="sep-top-blue ver-mspace bot-space"> </div>
    <h4>Coverage Filter </h4>
    <div class="row">
        <div class="col-md-5 col-sm-12 col-xs-12 mb-10">
            <label for=""> City </label>
        </div>
        <div class="col-md-7 col-sm-12 col-xs-12 mb-10">
            <input type="text" class="form-control" placeholder="City" name="city" formControlName="city">
        </div>
    </div>
    <div class="row">
        <div class="col-md-5 col-sm-12 col-xs-12 mb-10">
            <label for=""> ZipCode </label>
        </div>
        <div class="col-md-7 col-sm-12 col-xs-12 mb-10">
            <input type="text" class="form-control" placeholder="ZipCode" name="zipCode" formControlName="zipcode">
        </div>
    </div>
    <div class="row">
        <div class="col-md-5 col-sm-12 col-xs-12 mb-10">
            <label for=""> County </label>
        </div>
        <div class="col-md-7 col-sm-12 col-xs-12 mb-10">
            <ng-select [searchable]="true" [clearable]="false" formControlName="county">
                <ng-option selected="selected" value="">--select--</ng-option>
                <ng-option *ngFor="let item of countyDropdownItems$ | async" [value]="item.value">{{item.text}}</ng-option>
            </ng-select>
        </div>
    </div>
    <div class="row">
        <div class="col-md-5 col-sm-12 col-xs-12 mb-10">
            <label for=""> Region </label>
        </div>
        <div class="col-md-7 col-sm-12 col-xs-12 mb-10">
            <ng-select [searchable]="true" [clearable]="false" formControlName="region">
                <ng-option selected="selected" value="">--select--</ng-option>
                <ng-option *ngFor="let item of regionDropdownItems$ | async" [value]="item.value">{{item.text}}</ng-option>
            </ng-select>
        </div>
    </div>
    <div class="text-end big-top-space">
        <button class="btn btn-bg mb-10" (click)="clear()"> CLEAR </button>
        <button class="btn btn-pri mb-10" (click)="search(1,formSearchCriteria.value)"> GO </button>
    </div>
</div>
