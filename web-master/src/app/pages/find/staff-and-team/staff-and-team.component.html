<div class="container-fluid no-pad white-bg">
    <div class="col-md-12 col-sm-12 col-xs-12 no-pad staff">
        <div class="col-md-3 col-sm-4 col-xs-12 ps-0">
            <staff-and-team-search [pageNumberSubject$]="pageNumberSubject$" [searchListSubject$]="searchListSubject$" [totalRecordsSubject$]="totalRecordsSubject$"></staff-and-team-search>
        </div>
        <div class="col-md-9 col-sm-8 col-xs-12">
            <div class="card-group form-letter-tab big-top-space" id="accordion">
                <staff-and-team-result [pageNumberSubject$]="pageNumberSubject$" [searchList$]="searchList$" [totalRecords$]="totalRecords$"
                    [userIDSubject$]="userIDSubject$"></staff-and-team-result>
                <br>
                <staff-and-team-details [userIDSubject$]="userIDSubject$"></staff-and-team-details>
            </div>
        </div>
    </div>
</div>
<script type="text/javascript">
    $(function () {
        $('[data-bs-toggle="tooltip"]').tooltip();
    });
</script>
<script>
    $(document).ready(function () {
        // Add minus icon for collapse element which is open by default
        $(".collapse.in").each(function () {
            $(this).siblings(".card-header").find(".glyphicon").addClass("glyphicon-minus").removeClass("glyphicon-plus");
        });

        // Toggle plus minus icon on show hide of collapse element
        $(".collapse").on('show.bs.collapse', function () {
            $(this).parent().find(".glyphicon").removeClass("glyphicon-plus").addClass("glyphicon-minus");
        }).on('hide.bs.collapse', function () {
            $(this).parent().find(".glyphicon").removeClass("glyphicon-minus").addClass("glyphicon-plus");
        });
    });
</script>
