<form onSubmit="return false;" [formGroup]="dsdsActionForm">
    <div class="left-side-box textLeft">
        <h5 class="blue">Agency Action Filters</h5>
        <h4>Status</h4>
        <div class="row">
            <div class="col-md-12 col-sm-12 col-xs-12">
                <label class="control pad-rht15 control--checkbox mb-10">Open
                    <input type="checkbox" name="openStatus" value="Open" formControlName="status" (change)="onStatusCheckBoxChange('Open',$event)">
                    <div class="control__indicator"></div>
                </label>
                <label class="control pad-rht15 control--checkbox mb-10">Closed
                    <input type="checkbox" name="closedStatus" value="Closed" formControlName="status" (change)="onStatusCheckBoxChange('Closed',$event)">
                    <div class="control__indicator"></div>
                </label>
            </div>
        </div>
        <div class="sep-top-blue ver-mspace bot-space"> </div>
        <h4>Assigned</h4>
        <div class="row">
            <div class="col-md-12 col-sm-12 col-xs-12">
                <label class="control pad-rht15 control--checkbox mb-10">Mine
                    <input type="checkbox" name="mineAssigned" formControlName="assigned" (change)="onAssignedCheckBoxChange('mine',$event)">
                    <div class="control__indicator"></div>
                </label>
                <label class="control pad-rht15 control--checkbox mb-10">My Team's
                    <input type="checkbox" name="teamAssigned" formControlName="assigned" (change)="onAssignedCheckBoxChange('myteam',$event)">
                    <div class="control__indicator"></div>
                </label>
            </div>
        </div>
        <div class="sep-top-blue ver-mspace bot-space"> </div>
        <h4>Dates</h4>
        <div class="row">
            <div class="col-md-12 col-sm-12 col-xs-12">
                <label class="control pad-rht15 control--checkbox mb-10">Received Today
                    <input type="checkbox" name="reporteddate" formControlName="reporteddate">
                    <div class="control__indicator"></div>
                </label>
                <label class="control pad-rht15 control--checkbox mb-10">Due Today
                    <input type="checkbox" name="duedate" formControlName="duedate">
                    <div class="control__indicator"></div>
                </label>
                <label class="control pad-rht15 control--checkbox mb-10">Overdue
                    <input type="checkbox" name="overdue" formControlName="overdue">
                    <div class="control__indicator"></div>
                </label>
            </div>
        </div>
        <div class="sep-top-blue ver-mspace bot-space"> </div>
        <h4>Type</h4>
        <div class="row">
            <div class="col-md-12 col-sm-12 col-xs-12">
                <label class="control control--checkbox mb-10">ANE
                    <input type="checkbox" name="aneType" formControlName="srtype" (change)="onTypeCheckBoxChange('ANE',$event)">
                    <div class="control__indicator"></div>
                </label>
            </div>
        </div>
        <div class="row">
            <div class="col-md-12 col-sm-12 col-xs-12">
                <label class="control control--checkbox mb-10">HCBS Referral
                    <input type="checkbox" name="hcbsType" formControlName="srtype" (change)="onTypeCheckBoxChange('HCBS',$event)">
                    <div class="control__indicator"></div>
                </label>
            </div>
        </div>
        <div class="row">
            <div class="col-md-12 col-sm-12 col-xs-12">
                <label class="control control--checkbox mb-10">Referral
                    <input type="checkbox" name="referralType" formControlName="srtype" (change)="onTypeCheckBoxChange('RF',$event)">
                    <div class="control__indicator"></div>
                </label>
            </div>
        </div>
        <div class="row">
            <div class="col-md-12 col-sm-12 col-xs-12">
                <label class="control control--checkbox mb-10">Provider Complaint
                    <input type="checkbox" name="providerComplaintType" formControlName="srtype" (change)="onTypeCheckBoxChange('Complaint-DSDS',$event)">
                    <div class="control__indicator"></div>
                </label>
            </div>
        </div>
        <div class="row">
            <div class="col-md-12 col-sm-12 col-xs-12">
                <label class="control control--checkbox mb-10">Provider Contracting
                    <input type="checkbox" name="providerContractType" formControlName="srtype" (change)="onTypeCheckBoxChange('PA,PAAM,PAT,Proposal,PAAC,PAA,PAC,ProviderCommu,PCSV',$event)">
                    <div class="control__indicator"></div>
                </label>
            </div>
        </div>
        <div class="sep-top-blue ver-mspace bot-space"> </div>
        <h4>Location</h4>
        <div class="row">
            <div class="col-md-5 col-sm-12 col-xs-12 mb-10">
                <label>Region</label>
            </div>
            <div class="col-md-7 col-sm-12 col-xs-12 mb-10 ">
                <ng-select name="region" formControlName="region" [searchable]="true" [clearable]="false">
                    <ng-option value="">Select</ng-option>
                    <ng-option *ngFor="let region of regionDropdownItems$ | async|orderBy:'text'" [value]="region.text">{{region.text}}</ng-option>
                </ng-select>
            </div>
        </div>
        <div class="row">
            <div class="col-md-5 col-sm-12 col-xs-12 mb-10">
                <label> County </label>
            </div>
            <div class="col-md-7 col-sm-12 col-xs-12 mb-10 ">
                <ng-select name="county" formControlName="county" [searchable]="true" [clearable]="false">
                    <ng-option value="">Select</ng-option>
                    <ng-option *ngFor="let county of countyDropdownItems$ | async|orderBy:'text'" [value]="county.value">{{county.text}}</ng-option>
                </ng-select>
            </div>
        </div>
        <div class="row">
            <div class="col-md-5 col-sm-12 col-xs-12 mb-10">
                <label for=""> Zip Code </label>
            </div>
            <div class="col-md-7 col-sm-12 col-xs-12 mb-10">
                <input type="text" class="form-control" placeholder="Enter Zip Code" name="zipCode" formControlName="zipCode">
            </div>
        </div>
        <div class="sep-top-blue ver-mspace bot-space"> </div>
        <div class="row">
            <div class="col-md-6 col-sm-12 col-xs-12 no-pad">
                <div class="col-md-12 col-sm-12 col-xs-12 mb-10">
                    <label for="">AA Number</label>
                </div>
                <div class="col-md-12 col-sm-12 col-xs-12 mb-10">
                    <input type="text" class="form-control" placeholder="Enter AA No" name="servicerequestnumber" formControlName="servicerequestnumber">
                </div>
            </div>
            <div class="col-md-6 col-sm-12 col-xs-12 no-pad">
            </div>
        </div>
        <div class="pad-vspace">
            <button class="btn-bg" (click)="cancelDSDSActionModal()"> Clear </button>
            <button class="btn-pri" (click)="searchDSDSAction(1,dsdsActionForm.value)"> Search </button>
            <a href="#myModal-complex-search" class="link btn btn-link pad-left0" data-bs-toggle="modal" (click)="complexSearchDSDSAction()" data-bs-target="#myModal-complex-search">Complex Search</a>
        </div>
    </div>


    <div class="modal fade custom-modal in" id="myModal-complex-search" role="dialog">
        <!--Modal - Complex Search-->
        <div class="modal-dialog modal-lg complex-search">
            <div class="modal-content">
                <div class="modal-header">
                    <h4 class="modal-title"> Complex Search </h4>
                    <button type="button" class="btn-close close pull-right" (click)="cancelDSDSActionModal()" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body text-start scrollBar">
                    <div class="row">
                        <div class="col-sm-6">
                            <div class="row">
                                <div class="col-sm-5 bot-mspace-15">
                                    <label for="">Service Type </label>
                                </div>
                                <div class="col-sm-7 bot-mspace-15 select-icon">
                                    <select class="form-select" name="srtype" formControlName="srtype" (change)="onChangeDaType($event)">
                                        <option value="">Select</option>
                                        <option *ngFor="let daType of daTypeDropdownItems$ | async" [value]="daType.value">{{daType.text}}</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                        <div class="col-sm-6">
                            <div class="row">
                                <div class="col-sm-5 bot-mspace-15">
                                    <label for="">Service Subtype
                                    </label>
                                </div>
                                <div class="col-sm-7 bot-mspace-15 select-icon">
                                    <select id="" class="form-select" name="srsubtype" formControlName="srsubtype" (change)="onChangeDaSubType($event)">
                                        <option value="">Select</option>
                                        <option *ngFor="let daSubType of daSubTypeDropdownItems$ | async" [value]="daSubType.value">{{daSubType.text}}</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-sm-6">
                            <div class="row">
                                <div class="col-sm-5 bot-mspace-15">
                                    <label>Status</label>
                                </div>
                                <div class="col-sm-7 bot-mspace-15 select-icon">
                                    <select id="" class="form-select" name="status" formControlName="status" (change)="onChangeStatus($event)">
                                        <option value="">Select</option>
                                        <option *ngFor="let status of statusDropdownItems$ | async" [value]="status.value">{{status.text}}</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                        <div class="col-sm-6">
                            <div class="row">
                                <div class="col-sm-5 bot-mspace-15">
                                    <label for="">Disposition</label>
                                </div>
                                <div class="col-sm-7 bot-mspace-15 select-icon">
                                    <select id="" class="form-select" name="disposition" formControlName="disposition">
                                        <option value="">Select</option>
                                        <option *ngFor="let disposition of dispositionDropdownItems$ | async" [value]="disposition.value">{{disposition.text}}</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-4 col-sm-12 col-xs-12">
                            <h4>Recieved</h4>
                            <div class="row">
                                <div class="col-md-12 col-sm-6 col-xs-12 bot-mspace-15">
                                    <label class="col-md-4 col-sm-4 col-xs-12 no-pad">From :</label>
                                    <div class="fm-box-form col-md-7 col-sm-8 col-xs-12 no-pad">
                                       
                                        <mat-form-field>
                                            <mat-label>MM/DD/YYYY</mat-label>
                                            <input matInput [matDatepicker]="picker" autocomplete="off"  class="form-control fm-style" formControlName="receivedFrom">
                                            <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
                                            <mat-datepicker #picker></mat-datepicker>
                                        </mat-form-field>
                                    </div>
                                </div>
                                <div class="col-md-12 col-sm-6 col-xs-12 bot-mspace-15">
                                    <label class="col-md-4 col-sm-4 col-xs-12 no-pad">To :</label>
                                    <div class="fm-box-form col-md-7 col-sm-8 col-xs-12 no-pad">
                                        
                                        <mat-form-field>
                                            <mat-label>MM/DD/YYYY</mat-label>
                                            <input matInput [matDatepicker]="picker5" autocomplete="off"  class="form-control fm-style" formControlName="receivedTo" validdate>
                                            <mat-datepicker-toggle matIconSuffix [for]="picker5"></mat-datepicker-toggle>
                                            <mat-datepicker #picker5></mat-datepicker>
                                        </mat-form-field>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-4 col-sm-12 col-xs-12">
                            <h4>Opened</h4>
                            <div class="row">
                                <div class="col-md-12 col-sm-6 col-xs-12 bot-mspace-15">
                                    <label class="col-md-4 col-sm-4 col-xs-12 no-pad">From :</label>
                                    <div class="fm-box-form col-md-7 col-sm-8 col-xs-12 no-pad">
                                       
                                        <mat-form-field>
                                            <mat-label>MM/DD/YYYY</mat-label>
                                            <input matInput [matDatepicker]="picker3" autocomplete="off"  class="form-control fm-style" formControlName="openedFrom" validdate>
                                            <mat-datepicker-toggle matIconSuffix [for]="picker3"></mat-datepicker-toggle>
                                            <mat-datepicker #picker3></mat-datepicker>
                                        </mat-form-field>
                                    </div>
                                </div>
                                <div class="col-md-12 col-sm-6 col-xs-12 bot-mspace-15">
                                    <label class="col-md-4 col-sm-4 col-xs-12 no-pad">To :</label>
                                    <div class="fm-box-form col-md-7 col-sm-8 col-xs-12 no-pad">
                                       
                                        <mat-form-field>
                                            <mat-label>MM/DD/YYYY</mat-label>
                                            <input matInput [matDatepicker]="picker4" autocomplete="off"  class="form-control fm-style" formControlName="openedTo" validdate>
                                            <mat-datepicker-toggle matIconSuffix [for]="picker4"></mat-datepicker-toggle>
                                            <mat-datepicker #picker4></mat-datepicker>
                                        </mat-form-field>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-4 col-sm-12 col-xs-12">
                            <h4>Closed</h4>
                            <div class="row">
                                <div class="col-md-12 col-sm-6 col-xs-12 bot-mspace-15">
                                    <label class="col-md-4 col-sm-4 col-xs-12 no-pad">From :</label>
                                    <div class="fm-box-form col-md-7 col-sm-8 col-xs-12 no-pad">
                                        
                                        <mat-form-field>
                                            <mat-label>MM/DD/YYYY</mat-label>
                                            <input matInput [matDatepicker]="picker2" autocomplete="off"  class="form-control fm-style" formControlName="closedFrom" validdate>
                                            <mat-datepicker-toggle matIconSuffix [for]="picker2"></mat-datepicker-toggle>
                                            <mat-datepicker #picker2></mat-datepicker>
                                        </mat-form-field>
                                    </div>
                                </div>
                                <div class="col-md-12 col-sm-6 col-xs-12 bot-mspace-15">
                                    <label class="col-md-4 col-sm-4 col-xs-12 no-pad">To :</label>
                                    <div class="fm-box-form col-md-7 col-sm-8 col-xs-12 no-pad">
                                       
                                        <mat-form-field>
                                            <mat-label>MM/DD/YYYY</mat-label>
                                            <input matInput [matDatepicker]="picker3" autocomplete="off"  class="form-control fm-style" formControlName="closedTo" validdate>
                                            <mat-datepicker-toggle matIconSuffix [for]="picker3"></mat-datepicker-toggle>
                                            <mat-datepicker #picker3></mat-datepicker>
                                        </mat-form-field>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="sep-top-blue ver-mspace bot-space"> </div>
                    <div class="row">
                        <div class="col-sm-6">
                            <div class="row">
                                <div class="col-sm-5 bot-mspace-15">
                                    <label for="">Region</label>
                                </div>
                                <div class="col-sm-7 bot-mspace-15 select-icon">
                                    <select class="form-select" name="region" formControlName="region">
                                        <option value="">Select</option>
                                        <option *ngFor="let region of regionDropdownItems$ | async" [value]="region.text">{{region.text}}</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                        <div class="col-sm-6">
                            <div class="row">
                                <div class="col-sm-5 bot-mspace-15">
                                    <label for="">County</label>
                                </div>
                                <div class="col-sm-7 bot-mspace-15 select-icon">
                                    <select name="county" formControlName="county" id="" class="form-select">
                                        <option value="">Select</option>
                                        <option *ngFor="let county of countyDropdownItems$ | async" [value]="county.value">{{county.text}}</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-sm-6">
                            <div class="row">
                                <div class="col-sm-5 bot-mspace-15">
                                    <label for="">Zipcode</label>
                                </div>
                                <div class="col-sm-7 bot-mspace-15">
                                    <input type="text" class="form-control"  name="zipCode" formControlName="zipCode">
                                </div>
                            </div>
                        </div>
                        <div class="col-sm-6">
                        </div>
                    </div>
                    <div class="sep-top-blue ver-mspace bot-space"> </div>
                    <div class="row">
                        <div class="col-sm-6">
                            <div class="row">
                                <div class="col-sm-5 bot-mspace-15">
                                    <label for="">Reported Adult</label>
                                </div>
                                <div class="col-sm-7 bot-mspace-15">
                                    <input type="text" class="form-control"  name="reportedAdult" formControlName="reportedAdult">
                                </div>
                            </div>
                        </div>
                        <div class="col-sm-6">
                            <div class="row">
                                <div class="col-sm-5 bot-mspace-15">
                                    <label for="">Alleged Perpetrator</label>
                                </div>
                                <div class="col-sm-7 bot-mspace-15">
                                    <input type="text" class="form-control"  name="allegedPerpetrator" formControlName="allegedPerpetrator">
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-sm-6">
                            <div class="row">
                                <div class="col-sm-5 bot-mspace-15">
                                    <label for="">Agency Provider</label>
                                </div>
                                <div class="col-sm-7 bot-mspace-15">
                                    <input type="text" class="form-control"  name="dsdsProvider" formControlName="dsdsProvider">
                                </div>
                            </div>
                        </div>
                        <div class="col-sm-6">
                            <div class="row">
                                <div class="col-sm-5 bot-mspace-15">
                                    <label for=""> Reporter</label>
                                </div>
                                <div class="col-sm-7 bot-mspace-15">
                                    <input type="text" class="form-control"  name="reporter" formControlName="reporter">
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-sm-6">
                            <div class="row">
                                <div class="col-sm-5 bot-mspace-15">
                                    <label for="">Agency Worker</label>
                                </div>
                                <div class="col-sm-7 bot-mspace-15">
                                    <input type="text" class="form-control"  name="dsdsWorker" formControlName="dsdsWorker">
                                </div>
                            </div>
                        </div>
                        <div class="col-sm-6">
                            <div class="row">
                                <div class="col-sm-5 bot-mspace-15">
                                    <label for="">Load number</label>
                                </div>
                                <div class="col-sm-7 bot-mspace-15">
                                    <input type="text" class="form-control"  name="loadNumber" formControlName="loadNumber">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <div class="text-end">
                        <button type="button" value="Cancel" class="btn-bg" (click)="cancelDSDSActionModal()" data-bs-dismiss="modal">Cancel</button>
                        <button type="button" class="btn-pri" (click)="searchDSDSAction(1,dsdsActionForm.value)" data-bs-dismiss="modal">Search</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</form>
