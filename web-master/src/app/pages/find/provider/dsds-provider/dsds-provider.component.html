<div>
  <h3> Search Results </h3>

  <div class="table-responsive form-letter-tab" *ngIf="showTable">
    <table class="table table-bordered" aria-describedby="tbl-dsds-prvdr-legl-dtls">
      <thead>
        <tr>
          <th scope="col">Legal Name</th>
          <th scope="col"> DBA Name </th>
          <th scope="col">SSBG</th>
          <th scope="col"> Provider Category </th>
          <th scope="col"> Provider Type </th>
          <th scope="col">Business Type</th>
          <th scope="col">PA Type</th>
          <th scope="col"> Actions </th>
        </tr>
      </thead>
      <tbody *ngIf="searchList$ | async; let searchList">
        <tr *ngFor="let item of searchList">
          <td>{{item.agencyname}}</td>
          <td> </td>
          <td>{{item.ssbg}}</td>
          <td>{{item.agencycategory}}</td>
          <td>{{item.agencytypedesc}}</td>
          <td>{{item.agencysubtype}}</td>
          <td>{{item.provideragreementtypename}}</td>
          <td>
            <span data-bs-toggle="tooltip" data-bs-placement="top" title="Edit" class="mrg-rht10">
              <a [routerLink]="['/pages/find/provider/showProviderDetails',item.agencyid]">
                <em class="fa fa-eye font-16 site-color"> </em>
              </a>
            </span>
          </td>
        </tr>
      </tbody>
    </table>
    <div class="text-center">
      <pagination [totalItems]="(totalRecords$ | async) ?? 0" [(ngModel)]="paginationInfo.pageNumber" (pageChanged)="pageChanged($event.page)"
        class="pagination-sm" [boundaryLinks]="true" [maxSize]="10">
      </pagination>
    </div>
  </div>
</div>

<div role="dialog" class="da-type-config">
  <router-outlet></router-outlet>
</div>
