<div class="col-sm-12 p-2">
    <h4>Release Notes</h4>
</div>

<!-- Search cards: always shown unless viewing a specific version or in keyword results mode -->
<release-note-search
    *ngIf="kwState && !selectedVersion && !kwState.mode"
    [kwState]="kwState"
    (versionSearch)="onVersionSearch($event)"
    (versionCleared)="onVersionCleared()"
    (keywordSearch)="onKeywordSearch($event)"
    (keywordCleared)="onKeywordCleared()">
</release-note-search>

<!-- Version list: shown when not in keyword mode and no specific version selected -->
<release-version-list
    *ngIf="!selectedVersion && kwState && !kwState.mode"
    [releaseApprover]="releaseApprover"
    [releaseAdmin]="releaseAdmin"
    [filter]="versionFilter"
    (openVersion)="onOpenVersion($event)"
    (firstVersionLoaded)="onFirstVersionLoaded($event)"
    (filterCleared)="onVersionCleared()">
</release-version-list>

<!-- Keyword results: full-page replacement when keyword search is active -->
<keyword-search-list
    *ngIf="kwState && kwState.mode && !selectedVersion"
    [searchTerm]="kwState.searchTerm"
    [itemtype]="kwState.itemtype"
    [results]="kwState.results"
    [totalRecords]="kwState.totalRecords"
    [totalStoryCount]="kwState.totalStoryCount"
    [totalDefectCount]="kwState.totalDefectCount"
    [totalDistinctReleaseCount]="kwState.totalDistinctReleaseCount"
    [paginationInfo]="kwState.paginationInfo"
    [hasSearched]="kwState.hasSearched"
    (cleared)="onKeywordCleared()"
    (sorted)="onKeywordSorted($event)"
    (pageChanged)="onKeywordPageChanged($event)">
</keyword-search-list>

<!-- Ticket list: shown when a specific version is selected -->
<ticket-list
    *ngIf="selectedVersion"
    [version]="selectedVersion"
    [releaseApprover]="releaseApprover"
    [releaseAdmin]="releaseAdmin"
    (back)="onBack()">
</ticket-list>
