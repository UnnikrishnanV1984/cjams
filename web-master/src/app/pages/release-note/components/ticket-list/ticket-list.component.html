<div class="col-sm-12 p-2">

    <!-- Field filters -->
    <div class="col-sm-12 row">
        <div class="col-sm-2">
            <mat-form-field>
                <mat-label>Support Ticket No</mat-label>
                <input type="text" matInput [(ngModel)]="supportticketno">
            </mat-form-field>
        </div>
        <div class="col-sm-2">
            <mat-form-field>
                <mat-label>JIRA/Story ID</mat-label>
                <input type="text" matInput [(ngModel)]="jiraid">
            </mat-form-field>
        </div>
        <div class="col-sm-2">
            <mat-form-field>
                <mat-label>Raised By User</mat-label>
                <input type="text" matInput [(ngModel)]="raisedbyuser">
            </mat-form-field>
        </div>
        <div class="col-sm-2">
            <mat-form-field>
                <mat-label>Title</mat-label>
                <input type="text" matInput [(ngModel)]="title">
            </mat-form-field>
        </div>
        <div class="col-sm-2">
            <mat-form-field>
                <mat-label>Description</mat-label>
                <input type="text" matInput [(ngModel)]="description">
            </mat-form-field>
        </div>
        <div class="col-sm-3 m-t-10">
            <button class="btn-pri" (click)="search()">Search</button>
            <button class="btn-pri" (click)="reset()">Clear</button>
            <button type="button" class="btn-pri" (click)="back.emit()">Back</button>
        </div>
    </div>
    <!-- <div class="col-sm-12 row m-t-10">
        <button type="button" class="btn-pri pull-right" (click)="back.emit()">BACK</button>
    </div> -->
    <!-- In-version keyword search -->
    <!-- <div class="col-sm-12 row m-t-10">
        <div class="col-sm-4 d-flex align-items-center gap-2">
            <mat-form-field class="flex-grow-1">
                <mat-label>Keyword Search</mat-label>
                <input type="text" matInput placeholder="Search release notes..."
                    [(ngModel)]="popupKeywordSearchTerm"
                    (keyup.enter)="onKeywordSearch()">
            </mat-form-field>
            <i class="fa fa-search" title="Search" style="cursor:pointer; font-size:1.2rem;"
                (click)="onKeywordSearch()"></i>
        </div>
    </div> -->

    <!-- Tabs -->
    <div class="tab-horizontal m-t-30">
        <ul class="nav nav-pills click-triggers intake-tabs">
            <li class="nav-item">
                <a class="nav-link" [ngClass]="{'active': isValue == 0}" (click)="switchTab(0)">Defects</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" [ngClass]="{'active': isValue == 1}" (click)="switchTab(1)">Story/Enhancements</a>
            </li>
        </ul>
    </div>

    <!-- Ticket table -->
    <div class="table-responsive table-theme m-t-10">
        <div class="m-t-10 m-b-10">
            <label>RELEASE VERSION: {{version?.releaseversionno}}</label>
            <label class="m-l-40">RELEASE DATE: {{version?.releasedate | date: 'MM/dd/yyyy'}}</label>
        </div>

        <table sortable-table (sorted)="onSort($event)" class="table table-striped" aria-describedby="Tickets">
            <thead>
                <tr>
                    <th scope="col" sortable-column="jiraid" sort-direction="desc">{{isValue == 0 ? 'Jira' : 'Story'}} Id</th>
                    <th scope="col" sortable-column="raisedbyuser">Raised by User</th>
                    <th scope="col" sortable-column="supportno">Support No</th>
                    <th scope="col">Title</th>
                    <th scope="col">Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let ticket of tickets">
                    <td>{{ticket.itemid}}</td>
                    <td *ngIf="tabType == 'Defect'">{{ticket.displayname}}</td>
                    <td *ngIf="tabType == 'Story'">{{ticket.raisedby}}</td>
                    <td><a (click)="getSupportLog(ticket)">{{ticket.supportno}}</a></td>
                    <td>{{ticket.title}}</td>
                    <td>
                        <span>
                            <a [routerLink]="">
                                <i aria-hidden="true" title="View" class="fa fa-eye" (click)="viewRelease(ticket)"></i>
                            </a>
                        </span>
                        &nbsp;
                        <span>
                            <a [routerLink]="">
                                <i *ngIf="releaseApprover || (releaseAdmin && !ticket.publish)"
                                    title="Edit" aria-hidden="true" class="fa fa-edit"
                                    (click)="editRelease(ticket)"></i>
                            </a>
                        </span>
                        &nbsp;
                        <span *ngIf="getSafeDocumentLink(ticket.documentlink) as safeLink">
                            <a [href]="safeLink" target="_blank" rel="noopener noreferrer">
                                <i aria-hidden="true" title="Document Link" class="fa fa-link"></i>
                            </a>
                        </span>
                    </td>
                </tr>
                <tr *ngIf="tickets.length === 0">
                    <td colspan="5">No records found.</td>
                </tr>
            </tbody>
        </table>

        <div class="text-center" *ngIf="totalCount && totalCount > paginationInfo.pageSize">
            <pagination [totalItems]="totalCount" [(ngModel)]="paginationInfo.pageNumber"
                (pageChanged)="pageChanged($event.page)" class="pagination-sm"
                [boundaryLinks]="true" [maxSize]="10">
            </pagination>
        </div>
    </div>
</div>

<!-- All ticket modals delegated to the ticket-detail child component -->
<ticket-detail
    [ticketDetails]="ticketDetails"
    [selectedRelease]="selectedRelease"
    [releaseDate]="version?.releasedate"
    [releaseVersion]="version?.releaseversionno"
    [mode]="ticketMode"
    [isValue]="isValue"
    [releaseApprover]="releaseApprover"
    [releaseAdmin]="releaseAdmin"
    (saved)="loadTickets()">
</ticket-detail>
