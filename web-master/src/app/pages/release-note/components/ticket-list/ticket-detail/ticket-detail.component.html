<!-- Support log modal (read-only) -->
<div class="modal fade" [id]="modalIdSupportLog" role="dialog">
    <div class="modal-dialog modal-lg">
        <div class="modal-content reject">
            <div class="modal-header">
                <h4 class="modal-title">Ticket Details</h4>
                <button type="button" class="btn-close close pull-right" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body" *ngIf="ticketDetails">
                <div class="col-md-12 col-sm-12 col-xs-12 fill-data" style="font-size: 14px">
                    <div class="row">
                        <div class="col-sm-12 col-md-6 m-t-20">
                            <div class="m-t-10"><label>Support No:</label><label class="fw-500 m-l-10">{{ticketDetails?.supportno}}</label></div>
                            <div class="m-t-10"><label>Case ID / Client ID:</label><label class="fw-500 m-l-10">{{ticketDetails?.caseid}}</label></div>
                            <div class="m-t-10"><label>Severity:</label><label class="fw-500 m-l-10">{{ticketDetails?.severity}}</label></div>
                            <div class="m-t-10"><label>Type:</label><label class="fw-500 m-l-10">{{ticketDetails?.issuetype}}</label></div>
                            <div class="m-t-10"><label>Program Area:</label><label class="fw-500 m-l-10">{{ticketDetails?.application}}</label></div>
                            <div class="m-t-10"><label>County:</label><label class="fw-500 m-l-10">{{ticketDetails?.ldssregion}}</label></div>
                            <div class="m-t-10"><label>User:</label><label class="fw-500 m-l-10">{{ticketDetails?.frommailid}}</label></div>
                        </div>
                        <div class="col-sm-12 col-md-6 m-t-20">
                            <div><label>Date:</label><label class="fw-500 m-l-10">{{getFormattedDate(ticketDetails?.effectivedate)}}</label></div>
                            <div class="m-t-10"><label>Program Group:</label><label class="fw-500 m-l-10">{{ticketDetails?.program}}</label></div>
                            <div class="m-t-10"><label>Focus Area:</label><label class="fw-500 m-l-10">{{ticketDetails?.focus}}</label></div>
                            <div class="m-t-10"><label>Subject:</label><label class="fw-500 m-l-10">{{ticketDetails?.subject}}</label></div>
                            <div class="m-t-10"><label>Approval Status:</label><label class="fw-500 m-l-10">{{ticketDetails?.jirarequestsent}}</label></div>
                            <div class="m-t-10">
                                <label>{{isValue == 0 ? 'JIRA Ticket' : 'Story'}} Number:</label>
                                <label class="fw-500 m-l-10">{{ticketDetails?.jirarequestno}}</label>
                            </div>
                            <div class="m-t-10">
                                <label>{{isValue == 0 ? 'JIRA' : 'Story'}} Status:</label>
                                <label class="fw-500 m-l-10">{{ticketDetails?.jiraStatus}}</label>
                            </div>
                        </div>
                    </div>
                    <div class="col-sm-12 col-md-11 m-t-20">
                        <div class="m-t-10">
                            <label>Description:</label>
                            <div class="textarea-notes">
                                <textarea disabled [value]="ticketDetails?.notes" rows="5"
                                    class="form-control full-collapse-horizontal aut-txt-addNotesNarrator"></textarea>
                            </div>
                        </div>
                    </div>
                    <div class="col-sm-12 col-md-11 m-t-20">
                        <div class="m-t-10">
                            <label>JIRA Comments:</label>
                            <div class="textarea-notes">
                                <textarea disabled [value]="ticketDetails?.jiraComments" rows="5"
                                    class="form-control full-collapse-horizontal aut-txt-addNotesNarrator"></textarea>
                            </div>
                        </div>
                    </div>
                    <div class="text-end m-t-20 right-mspace-15">
                        <a class="btn-pri" data-bs-dismiss="modal">Close</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- View / Edit release item modal -->
<div class="modal fade" [id]="modalIdEditView" role="dialog">
    <div class="modal-dialog modal-lg">
        <div class="modal-content reject">
            <div class="modal-header">
                <h4 class="modal-title">Ticket Details</h4>
                <button type="button" class="btn-close close pull-right" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body" *ngIf="selectedRelease">
                <div class="col-md-12 col-sm-12 col-xs-12 fill-data" style="font-size: 14px">
                    <form [formGroup]="editForm">
                        <div class="row col-sm-12">
                            <div class="col-sm-12 col-md-6">
                                <label>Release Date: {{releaseDate | date: 'MM/dd/yyyy'}}</label>
                            </div>
                            <div class="col-sm-12 col-md-6">
                                <label>Release Version: {{releaseVersion}}</label>
                            </div>
                        </div>
                        <div class="row col-sm-12">
                            <div class="col-sm-12 col-md-6 m-t-10">
                                <label>Support No:</label>
                                <input class="form-control fm-style" formControlName="supportno">
                            </div>
                            <div class="col-sm-12 col-md-6 m-t-10">
                                <label>{{isValue == 0 ? 'Defect:' : 'Story:'}}</label>
                                <input class="form-control fm-style" type="text" formControlName="Defect">
                            </div>
                        </div>
                        <div class="col-sm-12 row">
                            <div class="col-sm-12 col-md-8 m-t-10">
                                <label>Title:</label>
                                <input class="form-control fm-style" type="text" formControlName="Title">
                            </div>
                        </div>
                        <div class="col-md-12 row">
                            <div class="col-sm-12 col-md-8 m-t-10" *ngIf="isValue == 0">
                                <label>Document Link:</label>
                                <input class="form-control fm-style" type="text" formControlName="documentlink">
                            </div>
                            <div class="col-sm-12 col-md-8 m-t-10" *ngIf="isValue != 0">
                                <label>How To Guide:</label>
                                <input class="form-control fm-style" type="text" formControlName="documentlink">
                            </div>
                        </div>
                        <div class="col-md-12 row">
                            <div class="col-sm-12 m-t-10">
                                <label>Description:</label>
                                <textarea class="form-control full-collapse-horizontal aut-txt-addNotesNarrator"
                                    rows="5" formControlName="Description"></textarea>
                            </div>
                        </div>
                    </form>
                    <div class="text-end m-t-20 right-mspace-15">
                        <ng-container *ngIf="mode === 'edit'">
                            <button class="btn-pri" (click)="save()">Save</button>
                            <button class="btn-pri" data-bs-dismiss="modal">Cancel</button>
                        </ng-container>
                        <button *ngIf="mode === 'view'" class="btn-pri" data-bs-dismiss="modal">Close</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Invalid support number popup -->
<div class="modal fade" [id]="modalIdJiraError" role="dialog">
    <div class="modal-dialog modal-md custom-wid">
        <div class="modal-content">
            <div class="modal-header">
                <h4 class="modal-title">Support Number</h4>
                <button type="button" class="btn-close close pull-right" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <p>Invalid Support Number. Please correct the entry in application.</p>
                <div class="text-end big-bot-space right-mspace-15">
                    <button type="button" class="btn-pri" data-bs-dismiss="modal">Ok</button>
                </div>
            </div>
        </div>
    </div>
</div>
