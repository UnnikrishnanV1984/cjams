<div class="col-sm-12 p-3">
    <div class="row align-items-stretch">

        <!-- Release Version Search card -->
        <div class="col-sm-5">
            <div class="card h-100">
                <div class="card-body">
                    <h6 class="card-title fw-bold">Release Version Search</h6>
                    <hr>
                    <div class="row">
                        <div class="col-sm-4 m-b-10">
                            <label class="form-label">Release Version #:</label>
                            <input type="text"
                                class="form-control"
                                placeholder="e.g. 14.0.2"
                                [(ngModel)]="releaseversionno"
                                (keyup.enter)="onVersionSearch()">
                        </div>
                        <div class="col-sm-4 m-b-10">
                            <label class="form-label">Start Date:</label>
                            <input type="date"
                                class="form-control"
                                placeholder="mm/dd/yyyy"
                                [(ngModel)]="startdate">
                        </div>
                        <div class="col-sm-4 m-b-10">
                            <label class="form-label">End Date:</label>
                            <input type="date"
                                class="form-control"
                                placeholder="mm/dd/yyyy"
                                [(ngModel)]="enddate">
                        </div>
                    </div>
                    <div class="row m-t-10">
                        <div class="col-sm-12">
                            <button class="btn-pri"
                                [disabled]="!releaseversionno && !startdate && !enddate"
                                (click)="onVersionSearch()">
                                Release Version Search
                            </button>
                            <button class="btn-pri m-l-10" (click)="onVersionClear()">Clear</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Divider with "or" -->
        <div class="col-sm-1 d-flex flex-column align-items-center justify-content-center">
            <div style="flex:1; width:1px; background:#000;"></div>
            <span class="fw-bold" style="
                display: inline-flex;
                align-items: center;
                justify-content: center;
                width: 2.5rem;
                height: 2.5rem;
                border-radius: 50%;
                background: #dee2e6;
                color: #495057;
                font-size: 1rem;
                margin: 8px 0;
                border: 2px solid #000;">OR</span>
            <div style="flex:1; width:1px; background:#000;"></div>
        </div>

        <!-- Keyword Search card -->
        <div class="col-sm-6">
            <div class="card h-100">
                <div class="card-body">
                    <h6 class="card-title fw-bold">Keyword Search</h6>
                    <hr>
                    <div class="row">
                        <div class="col-sm-12 m-b-10">
                            <div class="d-flex align-items-center gap-2">
                                <input type="text"
                                    class="form-control"
                                    placeholder="Search by story title, description, or story/defect ID..."
                                    [(ngModel)]="keywordTerm"
                                    (keyup.enter)="onKeywordSearch()">
                                <i class="fa fa-info-circle text-muted"
                                    matTooltip="Search across all release note titles, descriptions, and IDs"
                                    matTooltipPosition="above"
                                    style="font-size:1.2rem; cursor:default; flex-shrink:0;"></i>
                            </div>
                        </div>
                        <div class="col-sm-12 m-b-10">
                            <div class="d-flex align-items-center gap-3">
                                <label class="form-label m-b-0 fw-semibold">Search In:</label>
                                <div class="form-check form-check-inline m-b-0">
                                    <input class="form-check-input" type="radio"
                                        name="itemtype" id="itemtype-both"
                                        value="both" [(ngModel)]="itemtype">
                                    <label class="form-check-label" for="itemtype-both">Both</label>
                                </div>
                                <div class="form-check form-check-inline m-b-0">
                                    <input class="form-check-input" type="radio"
                                        name="itemtype" id="itemtype-stories"
                                        value="Story" [(ngModel)]="itemtype">
                                    <label class="form-check-label" for="itemtype-stories">Only Stories</label>
                                </div>
                                <div class="form-check form-check-inline m-b-0">
                                    <input class="form-check-input" type="radio"
                                        name="itemtype" id="itemtype-defects"
                                        value="Defect" [(ngModel)]="itemtype">
                                    <label class="form-check-label" for="itemtype-defects">Only Defects</label>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="row m-t-10">
                        <div class="col-sm-12 text-end">
                            <button class="btn-pri" [disabled]="!keywordTerm.trim()" (click)="onKeywordSearch()">Keyword Search</button>
                            <button class="btn-pri m-l-10" (click)="onKeywordClear()">Clear</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>
