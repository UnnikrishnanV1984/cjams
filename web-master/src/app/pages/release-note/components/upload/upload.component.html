<div class="modal fade" [id]="modalId" role="dialog">
    <div class="modal-dialog modal-lg">
        <div class="modal-content reject">
            <div class="modal-header">
                <h4 class="modal-title">Upload Release Notes</h4>
                <button type="button" class="btn-close close pull-right" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="col-md-12 col-sm-12 col-xs-12 fill-data" style="font-size: 14px">
                    <div class="row">
                        <form [formGroup]="uploadForm">
                            <div class="col-md-12">
                                <div class="col-md-6 m-t-10">
                                    <common-date-picker formControlName="releasedate" [required]="true" placeholder="Release Date">
                                    </common-date-picker>
                                </div>
                                <div class="col-md-6 m-t-10">
                                    <mat-form-field>
                                        <input formControlName="releaseversion" matInput placeholder="Release Version" required>
                                    </mat-form-field>
                                </div>
                            </div>
                        </form>
                    </div>
                    <div class="text-end m-t-20 right-mspace-15">
                        <button class="btn-pri pull-right" (click)="cancel()">Cancel</button>
                        <button class="btn-pri pull-right"
                            (ngxf-select)="onFileSelected($event)"
                            [ngxf-validate]="{ size: { min: 5 } }"
                            [disabled]="uploadForm.pristine || uploadForm.invalid">Upload</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
