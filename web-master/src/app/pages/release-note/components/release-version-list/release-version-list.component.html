<div class="col-sm-12 d-flex justify-content-end" *ngIf="releaseAdmin">
    <button class="btn-pri" (click)="uploadComponent.open()">Upload Release Notes</button>
</div>

<div class="col-sm-12 p-2">
    <div class="table-responsive table-theme">
        <table class="table table-striped" sortable-table (sorted)="onSorted($event)" aria-describedby="Release Versions">
            <thead>
                <tr>
                    <th sortable-column="Version" sort-direction="desc" scope="col">Release Version</th>
                    <th sortable-column="ReleaseDate" sort-direction="desc" scope="col">Release Date</th>
                    <th scope="col" *ngIf="releaseApprover || releaseAdmin">Status</th>
                    <th scope="col">Actions</th>
                </tr>
            </thead>
            <tbody>
                <ng-container *ngIf="versions && versions.length > 0; else noItems">
                    <tr *ngFor="let item of versions">
                        <td>{{item.releaseversionno}}</td>
                        <td>{{item.releasedate | date: 'MM/dd/yyyy'}}</td>
                        <td *ngIf="releaseApprover || releaseAdmin">
                            {{item.publish ? 'Published' : 'Publish Pending'}}
                        </td>
                        <td>
                            <a class="action-link" (click)="openVersion.emit(item)">View</a>
                            <span class="action-sep">&nbsp;&nbsp;|&nbsp;&nbsp;</span>
                            <span class="text-muted">Download -</span>
                            <ng-container *ngIf="isDownloading(item, 'xlsx'); else xlsxLink">
                                <span class="action-link disabled m-l-5">Excel</span>
                            </ng-container>
                            <ng-template #xlsxLink>
                                <a class="action-link m-l-5" (click)="downloadReport(item, 'xlsx')">Excel</a>
                            </ng-template>
                            <span class="action-sep">&nbsp;|&nbsp;</span>
                            <ng-container *ngIf="isDownloading(item, 'pdf'); else pdfLink">
                                <span class="action-link disabled">PDF</span>
                            </ng-container>
                            <ng-template #pdfLink>
                                <a class="action-link" (click)="downloadReport(item, 'pdf')">PDF</a>
                            </ng-template>
                            <ng-container *ngIf="releaseApprover && !item.publish">
                                <span class="action-sep">&nbsp;&nbsp;|&nbsp;&nbsp;</span>
                                <a class="action-link" (click)="publish(item)">Publish</a>
                            </ng-container>
                            <ng-container *ngIf="releaseApprover || (releaseAdmin && !item.publish)">
                                <span class="action-sep">&nbsp;&nbsp;|&nbsp;&nbsp;</span>
                                <a class="action-link text-danger" (click)="deleteVersion(item)">Delete</a>
                            </ng-container>
                        </td>
                    </tr>
                </ng-container>
                <ng-template #noItems>
                    <tr><td colspan="4">No records found.</td></tr>
                </ng-template>
            </tbody>
        </table>
    </div>

    <div class="text-center m-t-20" *ngIf="totalRecords && totalRecords > paginationInfo.pageSize">
        <pagination
            [totalItems]="totalRecords"
            [(ngModel)]="paginationInfo.pageNumber"
            (pageChanged)="pageChanged($event)"
            class="pagination-sm"
            [boundaryLinks]="true"
            [maxSize]="10"
            [itemsPerPage]="paginationInfo.pageSize">
        </pagination>
    </div>
</div>

<upload #uploadComponent (uploadComplete)="onUploadComplete()"></upload>

<release-note-confirm-dialog
    modalId="publish-confirmation"
    title="Publish Release Notes?"
    message="You are about to publish release notes. Do you want to continue?"
    (confirmed)="confirmPublish()"
    (cancelled)="pendingPublishItem = null">
</release-note-confirm-dialog>

<release-note-confirm-dialog
    modalId="delete-confirmation"
    title="Delete Release Notes?"
    message="You are about to delete release notes. Do you want to continue?"
    (confirmed)="confirmDelete()"
    (cancelled)="pendingDeleteItem = null">
</release-note-confirm-dialog>
