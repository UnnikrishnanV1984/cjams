<div class="modal fade" [id]="modalId" role="dialog">
    <div class="modal-dialog modal-md custom-wid">
        <div class="modal-content">
            <div class="modal-header">
                <h4 class="modal-title">{{title}}</h4>
                <button type="button" class="btn-close close pull-right" data-bs-dismiss="modal" (click)="onCancel()"></button>
            </div>
            <div class="modal-body">
                <p>{{message}}</p>
                <div class="text-end big-bot-space right-mspace-15">
                    <button type="button" class="btn-pri" data-bs-dismiss="modal" (click)="onCancel()">No</button>
                    <button type="button" class="btn-pri" (click)="onConfirm()">Yes</button>
                </div>
            </div>
        </div>
    </div>
</div>
