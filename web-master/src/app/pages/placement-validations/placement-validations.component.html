<div *ngIf="ipaduser"> 
    <div style="margin-top: 125px;"></div>
</div>
<div class="container-fluid">
    <div class="tab-horizontal m-t-30" *ngIf = "moduleview">
        <ul class="nav nav-pills click-triggers intake-tabs">
            <li class="nav-item" *ngFor="let tab of tabDetails" routerLinkActive="active">
                <a class="nav-link" id="tab.id" [routerLink]="tab.route">{{tab.title}}</a>
            </li>
        </ul>
        <div class="tab-content">
            <router-outlet></router-outlet>
        </div>
    </div>        
</div>
