<div class="dashboard-cont no-pad">
  <div class="m-t-20">
    <div class="col-sm-12">
      <div class="person-section-header lvagr">Living Arrangement</div>
    </div>
    <div class="col-sm-12" *ngIf="!isShowAddLivingArrangement">
      <div class="add-address m-t-10 m-b-20" *ngIf="!_personService.getClosed()">
        <a (click)='enableAddLivingArrangement()'>+ Add New Living Arrangement</a>
       </div>
    </div>
    <add-living-arrangement *ngIf="isShowAddLivingArrangement" (addflag)="livingArrangementAdd($event)"></add-living-arrangement>
    <list-living-arrangement *ngIf="Flag" (clearAddForm)="clearAddForm() "></list-living-arrangement>
  </div>
</div>
<router-outlet></router-outlet>
