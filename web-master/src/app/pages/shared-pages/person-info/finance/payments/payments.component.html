<div>
    <div class="mt10">View Cases > Payments </div>
    <div class="headingDiv">
        <p>Claimant Information</p>
        <div class="detailsDiv">
            <div class="w50">
                <div class="dataDiv">
                    <span> Claimant Name:</span>
                    <span> {{claimant.fullName}} </span>
                </div>
                <div class="dataDiv">
                    <span> Benefit Year Begin Date:</span>
                    <span> {{claimant.benefit_year_begin_date}} </span>
                </div>
            </div>
            <div class="w50">
                <div class="dataDiv">
                    <span> Claim ID:</span>
                    <span> {{claimant.claim_id}} </span>
                </div>
                <div class="dataDiv">
                    <span> Benefit Year End Date:</span>
                    <span> {{claimant.benefit_year_end_date}} </span>
                </div>
            </div>
        </div>
    </div>
    <div class="tblDiv">
        <p> Claimant Case </p>
        <div style="float: right;height: 35px;">
            <button class="btn btn-primary" style="background-color: #00a2fd;margin-right: 5px;"
                (click)="onSelected('Over Payment')">Over Payments</button>
            <button class="btn btn-primary" style="background-color: #00a2fd;margin-right: 2px;"
                (click)="onSelected('Adjusted Payments')">Adjustments</button>
        </div>
        <br /><br />
        <div>
            <custom-table [tableData]="payemtsList" [tableDataColumns]="payemtsColumns"
                [tableDataKeys]="payemtsSearchKeys" [totalpagecount]="totalcount"
                [pageNumber]="paginationInfo.pageNumber" (pageChangedEvent)="pageChanged($event)" [styles]="styles"
                (sortEvent)="onSort($event)" (fetchDataEvent)="callApi($event)" [isRequiredSearching]="false"
                [unsortablecolumn]="unsortablecolumnsList">
            </custom-table>
        </div>

    </div>

    <div id="dilog-container-over-payments" class="dialog-container-over-payments" *ngIf="isOpenOverPaymentsDialog">
        <div id="dialog-over-payments " class="dialog-over-payments">
            <div class="dialog-header">
                <span> {{dialogHeader}} </span>
                <span id='close-btn' class="close-btn" (click)="onCloseOverPayments()">X</span>
            </div>
            <div class="dialog-body-over-payments">
                <payments-view-dialog [overPayments]="overPayments" [adjustedPaymentHistoryDetailsSegment]="adjustedPaymentHistoryDetailsSegment"
                    [screen]="dialogHeader"></payments-view-dialog>
            </div>
            <div class="dialog-buttons">
                <button class="btn-pri" (click)="onCloseOverPayments()">Close</button>
            </div>
        </div>
    </div>
