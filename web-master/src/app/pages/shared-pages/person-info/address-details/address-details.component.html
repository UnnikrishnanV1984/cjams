<div class="dashboard-cont mx-3 py-1">
  <div class="m-t-20">
    <div class="col-sm-12">
      <div class="person-section-header">ADDRESS</div>
    </div>
    <div class="col-sm-12" *ngIf="!isShowAddAddress">
      <div class="add-address m-t-10 m-b-20" *ngIf="!isClosed">
        <a (click)='enableAddAddress()'>+ Add New Address</a>
      </div>
    </div>
    <add-address *ngIf="isShowAddAddress" (addflag)="addressAdd($event)"></add-address>
    <list-address *ngIf="Flag"></list-address>
  </div>
</div>
<router-outlet></router-outlet>
