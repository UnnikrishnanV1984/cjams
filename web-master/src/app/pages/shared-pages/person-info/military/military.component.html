<div class="dashboard-cont no-pad">
  <div class="m-t-20">
    <div class="col-sm-12" *ngIf="!isShowAddMilitary && !_personService.getClosed()">
      <div class="add-military m-t-10 m-b-20">
        <a (click)='enableAddMilitary()'>+ Add New Miltary Info</a> 
      </div>           
    </div>
    <add-military *ngIf="isShowAddMilitary" (addflag)="militarySubmit($event)"></add-military>
    <list-military *ngIf="Flag" (addflag)="militarySubmit($event)"></list-military>
  </div>  
</div>
<router-outlet></router-outlet>
