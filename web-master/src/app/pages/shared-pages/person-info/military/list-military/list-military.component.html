<div class="dashboard-cont no-pad">
    <div *ngIf="(militaryPersonList)?.length !== 0">
        <div class="col-sm-4 m-b-20" *ngFor="let mil of militaryPersonList; let i=index; let odd=odd" > 

         <div class="row add-list-item border border-bottom-none">
            <p><label>Branch :  </label> {{mil.branchdesc}}</p>
            <p><label>ID :  </label> {{mil.serviceid}}</p>
            <p><label>Duty Station :  </label> {{mil.dutystation}}</p>
            <p><label>Services Status :  </label> {{mil?.servicestatusdesc}}</p>
            <p><label>Start Date :  </label> {{mil.startdate | date:'MM/dd/yyyy'}}</p>
            <p><label>Discharge Date :  </label> {{mil.enddate | date:'MM/dd/yyyy'}}</p>
            <p><label>Contact Phone :  </label> {{getContactPhone(mil.phonelist)}}</p>
        </div>
         <div class="d-flex justify-content-between action add-list-item border-top-none">
            <div *ngIf="!_personService.getClosed()" class="text-start pull-left"><a (click)="editAddress(mil)" matTooltip="Edit"><em class="fa fa-edit"></em>&nbsp;&nbsp;Edit</a></div>
            <div *ngIf="_personService.getClosed()" class="text-start pull-left"><a (click)="editAddress(mil)" matTooltip="View"><em class="fa fa-eye"></em>&nbsp;&nbsp;View</a></div>
            <div [ngClass]="{'disable-anchor' : _personService.getClosed(), 'text-left pull-right': true}"><a [ngClass]="{'pointer-events-none':_personService.getClosed()}" (click)="confirmDelete(mil.personmilitaryserviceid)" matTooltip="Delete"><em class="fa fa-trash"></em>&nbsp;&nbsp;Delete</a></div>
          </div>
    </div>
  </div> 
  
  
  <div class="modal fade custom-modal" id="delete-popup" role="dialog">
      <div class="modal-dialog">
          <div class="modal-content">
              <div class="modal-header">
                  <h4 class="modal-title">Confirm Delete</h4>
                  <button type="button" class="btn-close close pull-right" data-bs-dismiss="modal"></button>
              </div>
              <div class="modal-body">
                  <p>Are you sure you want to delete this item?</p>
                  <div class="text-end big-bot-space right-mspace-15">
                      <button type="button" value="No" class="btn-bg" name="" (click)="declineDelete()">No</button>
                      <button type="button" value="Yes" class="btn-pri" name="" (click)="deleteAddress()">Yes</button>
                  </div>
              </div>
          </div>
      </div>
  </div>
