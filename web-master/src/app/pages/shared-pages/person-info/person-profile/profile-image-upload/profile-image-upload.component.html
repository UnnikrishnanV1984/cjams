<div class="upload-container">
  <div class="profile-pic">
    <img [src]="imgURL ? imgURL : 'assets/images/ic_silhouette.png' " class="d-flex-object" alt="avatar" />
  </div>
  <p class="helper-text">
    Use the Upload Button
  </p>
  <label class="btn-pri btn-bs-file">
      <input style="display: none" type="file" id="filedata" accept=".jpeg,.jpg,.png"
        (change)="onAttachmentChange($event)">
      Upload
  </label>
</div>
