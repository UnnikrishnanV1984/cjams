<div class="p-3">
    <div class="dialog-header"style="width: 580px;">
    <h5 class="fw-600">A PRIMARY PHONE NUMBER HAS ALREADY BEEN IDENTIFIED IN CJAMS</h5>
    <button type="button" class="btn-close close pull-right" (click)="onCancel()" aria-label="Close"></button>
    <hr/>
</div>
<div class="m-t-20">
    <strong>{{data.phonenumber}} ({{data.type}})</strong> has already been identified as a Primary Phone Number. Do you still want to update <strong>{{data.currentPhoneNumber}}</strong> as the Primary Phone Number?
</div>
<div  class="text-end m-t-20">
    <button type="button" class="btn btn-bg" (click)="onCancel()" aria-label="No - Return to Edit">No - Return to Edit</button>
    <button type="button" class="btn btn-pri" (click)="onConfirm()" cdkFocusInitial aria-label="Yes">Yes</button>
</div>
</div>
