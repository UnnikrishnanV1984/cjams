<div class="dashboard-cont no-pad">
  <div>
    <div class="row">
      <div class="col-md-8 m-t-20"><h4 style="padding-left: 15px">Education</h4></div>
    </div>    
    <list-education *ngIf="!isShowAddEmployment" (childRemovalDate)="setChildRemovalDate($event)" (cachedEducationalInfo)="setCachedEducationalInfo($event)"></list-education>
    <div class="row">
      <div class="col-lg-3 col-md-4 col-md-6" *ngIf="!isShowAddEmployment && (!_authService.iscaseclosed('personeducation') && _authService.isPersonSubTabViewable('person','person.Education.add'))">
        <div class="add-education">
          <a (click)='enableAddEmployment()'>+ Add New Education Info</a>
        </div>           
      </div>
    </div>
    <add-education [isEdit] = "isEdit" *ngIf="isShowAddEmployment" [cachedEducationalInfo]="cachedEducationalInfo" [childremovaldates]="childremovaldates" (addflag)="educationSubmit($event)"></add-education>
   
  </div>  
</div>
<router-outlet></router-outlet>
