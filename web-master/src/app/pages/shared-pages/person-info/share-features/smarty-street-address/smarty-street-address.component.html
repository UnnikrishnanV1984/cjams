<!-- --neeed to check -->
<div class="row" *ngIf="!isRequiredSingleLine">
<div class="col-sm-6">
      <div class="cont-field">
        <mat-form-field>
          <mat-label>Address Line 1</mat-label>
          <input type="text" maxlength="100" matInput placeholder="" [(ngModel)]="address.address1" 
            [matAutocomplete]="auto" (input)="getSuggestedAddress()"  [disabled]="address.disable" [attr.required]="mandatoryrequired==false ? true : false"/>
          <mat-autocomplete #auto="matAutocomplete">
            <ng-container *ngIf="suggestedAddress$ as addressList">            
            <mat-option *ngFor="let item of addressList | async"
              (click)="selectedAddress(item)">
              {{item.text}}
            </mat-option>
          </ng-container>
          </mat-autocomplete>
        </mat-form-field>
  <mat-error *ngIf="requiredForApproval && !(address.address1)" >
          Please Enter value Address Line 1
            </mat-error>
      </div>
    </div>

    <div class="col-sm-6">
      <mat-form-field>
        <mat-label>Address Line 2</mat-label>
        <input type="text" maxlength="100" matInput placeholder="" [(ngModel)]="address.address2" [disabled]="address.disable"  (change)="addressDataHandler()"/> 
      </mat-form-field>
    </div>
    <div class="col-sm-6">
      <mat-form-field> 
        <mat-label>City</mat-label>
        <input type="text"  maxlength="100" matInput [(ngModel)]="address.city"  (change)="addressDataHandler()"
          placeholder="" [disabled]="address.disable" [attr.required]="mandatoryrequired==false ? true : false"/> </mat-form-field>
    </div>
  <div class="col-sm-6">
    <mat-form-field>
      <mat-label>State</mat-label>
      <mat-select placeholder="" [(ngModel)]="address.state" [disabled]="address.disable" [attr.required]="mandatoryrequired==false ? true : false"  (selectionChange)="addressDataHandler()">
        <mat-option *ngFor="let item of (this.stateDropdownItems$ | async)" value="{{item.ref_key}}" (click)="loadCounty(item.ref_key)" [disabled]="address.disable" >
          {{ item.description }}</mat-option>
      </mat-select>
    </mat-form-field>
  </div>
  <div class="col-sm-6" *ngIf="!countyrequired">
    <mat-form-field>
      <mat-label>County</mat-label>
      <mat-select [(ngModel)]="address.county" placeholder="" [disabled]="address.disable"  (selectionChange)="addressDataHandler()">
        <mat-option *ngFor="let item of countyDropDownItems$ | async" value="{{item.description}}">
          {{item.description}}</mat-option>
      </mat-select>
    </mat-form-field>
  </div>
  <div class="col-sm-6">
    <mat-form-field>
      <mat-label>Zip Code</mat-label>
      <input matInput placeholder="" zipcodeOnly numberOnly maxlength="5" [(ngModel)]="address.zipcode" [disabled]="address.disable" (change)="addressDataHandler()"
         />
    </mat-form-field>
  </div>
    </div>
    <div *ngIf="isRequiredSingleLine">
      <div class="row">
        <div class="col-sm-3">
            <div class="cont-field">
                <mat-form-field>
                    <mat-label>Address Line 1</mat-label>
                    <input type="text" maxlength="100" matInput [(ngModel)]="address.address1"
                        [matAutocomplete]="auto" (input)="getSuggestedAddress()" [disabled]="address.disable"
                        [attr.required]="mandatoryrequired==false ? true : false" />
                    <mat-autocomplete #auto="matAutocomplete">
                        <ng-container *ngIf="suggestedAddress$ as addressList">
                            <mat-option *ngFor="let item of addressList | async" (click)="selectedAddress(item)">
                                {{item.text}}
                            </mat-option>
                        </ng-container>
                    </mat-autocomplete>
                </mat-form-field>
                <mat-error *ngIf="requiredForApproval && !(address.address1)">
                    Please Enter value Address Line 1
                </mat-error>
            </div>
        </div>
    
        <div class="col-sm-2">
            <mat-form-field>
                <mat-label>Address Line 2</mat-label>
                <input type="text" maxlength="100" matInput [(ngModel)]="address.address2"
                    [disabled]="address.disable" (change)="addressDataHandler()" />
            </mat-form-field>
        </div>
        <div class="col-sm-2">
            <mat-form-field> 
                <mat-label>City</mat-label>
                <input type="text" maxlength="100" matInput [(ngModel)]="address.city"
                    (change)="addressDataHandler()" [disabled]="address.disable"
                    [attr.required]="mandatoryrequired==false ? true : false" /> </mat-form-field>
        </div>
        <div class="col-sm-2">
            <mat-form-field>
                <mat-label>State</mat-label>
                <mat-select [(ngModel)]="address.state" [disabled]="address.disable"
                    [attr.required]="mandatoryrequired==false ? true : false" (selectionChange)="addressDataHandler()">
                    <mat-option *ngFor="let item of (this.stateDropdownItems$ | async)" value="{{item.ref_key}}"
                        (click)="loadCounty(item.ref_key)" [disabled]="address.disable">
                        {{ item.description }}</mat-option>
                </mat-select>
            </mat-form-field>
        </div>
        <div class="col-sm-2" *ngIf="!countyrequired">
            <mat-form-field>
                <mat-label>County</mat-label>
                <mat-select [(ngModel)]="address.county" [disabled]="address.disable"
                    (selectionChange)="addressDataHandler()">
                    <mat-option *ngFor="let item of countyDropDownItems$ | async" value="{{item.description}}">
                        {{item.description}}</mat-option>
                </mat-select>
            </mat-form-field>
        </div>
        <div class="col-sm-1">
            <mat-form-field>
                <mat-label>Zip Code</mat-label>
                <input matInput zipcodeOnly numberOnly maxlength="5" [(ngModel)]="address.zipcode"
                    [disabled]="address.disable" (change)="addressDataHandler()" />
            </mat-form-field>
        </div>
    </div>
</div>
