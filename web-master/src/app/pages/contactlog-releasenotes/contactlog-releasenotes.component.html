
<div class="container-fluid">
    <div class="tab-horizontal m-t-30" >
        <ul class="nav nav-pills click-triggers intake-tabs">
            <li *ngFor="let tab of tabDetails" routerLinkActive="active">
                <a id="tab.id" [routerLink]="tab.route">{{tab.title}}</a>
            </li>
        </ul>
       
        <div class="tab-content">
            <router-outlet></router-outlet>
        </div>
    </div>  
      
</div>
