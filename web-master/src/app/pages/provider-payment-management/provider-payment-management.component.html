<div class="container-fluid">
    <div class="tab-horizontal m-t-30">
        <ul class="nav nav-pills click-triggers intake-tabs">
            <li *ngFor="let tab of tabs" routerLinkActive="active">
                <a *ngIf="tab.enable==1" (click)="tabChanged(tab.path)">{{tab.name}}</a>
            </li>
        </ul>
        <div class="tab-content">
            <router-outlet></router-outlet>
        </div>
    </div>        
</div>
