<div class="container-fluid" *ngIf = "moduleview">
    <div class="row">
      <div class="col-md-12 col-sm-12 col-xs-12">
        <div class="form-letter-tab m-t-30">
          <!-- Nav tabs -->
          <ul class="nav nav-tabs" role="tablist">
            <li class ="nav-item" *ngIf="!financeDirector" routerLinkActive="active">
              <a class="nav-link active" data-bs-target ="tab" [routerLink]="['./financial']">Funding Approval</a>
            </li>
  
            <li class ="nav-item" *ngIf="financeSupervisor" routerLinkActive="active">
              <a class="nav-link" data-bs-target ="tab" [routerLink]="['./payment']">Payment Approval </a>
            </li>
            <li  class ="nav-item" *ngIf="financeDirector" routerLinkActive="active">
              <a class="nav-link active" data-bs-target ="tab" [routerLink]="['./director']">Director Approval </a>
            </li>
          </ul>
          <!-- Tab panes -->
          <div class="tab-content m-t-30">
            <router-outlet></router-outlet>
          </div>
        </div>
      </div>
    </div>
  </div>
