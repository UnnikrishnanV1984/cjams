<form>
    <div class="row">
        <div class="left-side-filter" [formGroup]="clientSearchForm">
            <h5 class="m-t-20">Search Filter</h5>
            <div class="col-sm-12 pd-no">
                <div class="row pd-no">
                    <div class="col-sm-2 m-t-20 pd-r-0">
                        <mat-radio-group formControlName="clId" (change)="clientCheck($event.value)">
                            <mat-radio-button value="cid"></mat-radio-button>
                        </mat-radio-group>
                    </div>
                    <div class="col-sm-10">
                        <mat-form-field>
                            <mat-label>Client Id</mat-label>
                            <input matInput [disabled]="clientName"  value="" name="clientid" formControlName="clientid" onkeypress="return (event.charCode == 8 || event.charCode == 0) ? null : (event.charCode >= 46 && event.charCode <= 57) || event.charCode == 13">
                        </mat-form-field>
                    </div>
                </div>
            </div>
            <div class="col-sm-12 pd-no">
                <div class="row pd-no m-t-10">
                    <div class="col-sm-2 pd-r-0">
                        <mat-radio-group formControlName="cnm" (change)="clientCheck($event.value)">
                            <mat-radio-button value="cname"></mat-radio-button>
                        </mat-radio-group>
                    </div>
                    <div class="col-sm-10">
                        <span>Client Name</span>
                    </div>
                </div>
                <div class="row" *ngIf="clientName">
                    <div class="col-sm-12">
                        <mat-form-field>
                            <mat-label>First Name</mat-label>
                            <input matInput [disabled]="!clientName"  formControlName="v_firstname">
                        </mat-form-field>
                        <mat-form-field>
                            <mat-label>Last Name</mat-label>
                            <input matInput [disabled]="!clientName"  formControlName="v_lastname">
                        </mat-form-field>
                    </div>
                </div>
            </div>
            <div class="col-sm-12 pd-no">
                <div class="row pd-no">
                    <div class="col-sm-2 m-t-20 pd-r-0">
                        <mat-radio-group formControlName="ssnName" (change)="clientCheck($event.value)">
                            <mat-radio-button value="sname"></mat-radio-button>
                        </mat-radio-group>
                    </div>
                    <div class="col-sm-10">
                        <mat-form-field>
                            <mat-label>
                                SSN
                            </mat-label>
                            <input matInput [readonly]="sName"  value="" name="ssn" formControlName="ssn" onkeypress="return (event.charCode == 8 || event.charCode == 0) ? null : (event.charCode >= 46 && event.charCode <= 57) || event.charCode == 13">
                        </mat-form-field>
                    </div>
                </div>
            </div>
            <br>
                <h5>Payment Date Range</h5>
                <div class="row">
                    <div class="col-sm-6">
                        <mat-form-field>
                            <mat-label>Start</mat-label>
                            <input matInput autocomplete="off" [matDatepicker]="picker"  name="daterangefrom"
                                formControlName="daterangefrom">
                            <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
                            <mat-datepicker #picker></mat-datepicker>
                        </mat-form-field>
                    </div>
                    <div class="col-sm-6">
                        <mat-form-field>
                            <mat-label>End</mat-label>
                            <input matInput autocomplete="off" [matDatepicker]="picker1"  name="daterangeto"
                                formControlName="daterangeto">
                            <mat-datepicker-toggle matSuffix [for]="picker1"></mat-datepicker-toggle>
                            <mat-datepicker #picker1></mat-datepicker>
                        </mat-form-field>
                    </div>
                </div>
                <mat-form-field>
                    <mat-label>Local Department</mat-label>
                        <mat-select  formControlName="local_dept">
                            <mat-option>Select</mat-option>
                            <mat-option *ngFor="let dept of localDepartmentList" [value]="dept.value_tx">{{dept.value_tx}}</mat-option>
                        </mat-select>
                    </mat-form-field>
            <button *ngIf= "clientName" class="btn btn-pri pull-right mt-20 btn-align" [disabled]=
                        "(clientSearchForm.get('v_firstname')?.value == null || clientSearchForm.get('v_firstname')?.value == '') 
                        && (clientSearchForm.get('v_lastname')?.value == null || clientSearchForm.get('v_lastname')?.value == '')
                        && (clientSearchForm.get('daterangefrom')?.value == null || clientSearchForm.get('daterangefrom')?.value == '')
                        && (clientSearchForm.get('daterangeto')?.value == null || clientSearchForm.get('daterangeto')?.value == '')
                        && clientSearchForm.get('local_dept')?.value == null"
                        (click)="searchClient()">Go</button>
            <button *ngIf= "!clientName && !sName" class="btn btn-pri pull-right mt-20 btn-align" [disabled]=
                        "clientSearchForm.get('ssn')?.value == null
                        && (clientSearchForm.get('daterangefrom')?.value == null || clientSearchForm.get('daterangefrom')?.value == '')
                        && (clientSearchForm.get('daterangeto')?.value == null || clientSearchForm.get('daterangeto')?.value == '')
                        && clientSearchForm.get('local_dept')?.value == null"
                        (click)="searchClient()">Go</button>
            <button  *ngIf= "!clientName && sName"  class="btn btn-pri pull-right mt-20 btn-align" [disabled]=
                        "clientSearchForm.get('clientid')?.value == null 
                        && (clientSearchForm.get('daterangefrom')?.value == null || clientSearchForm.get('daterangefrom')?.value == '')
                        && (clientSearchForm.get('daterangeto')?.value == null || clientSearchForm.get('daterangeto')?.value == '')
                        && clientSearchForm.get('local_dept')?.value == null"
                        (click)="searchClient()">Go</button>            

            <button class="btn btn-sec pull-right mt-20" (click)="clearSearch()">Clear</button>
        </div>
    </div>
</form>
