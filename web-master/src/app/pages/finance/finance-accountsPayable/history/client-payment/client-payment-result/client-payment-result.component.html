<div class="container-fluid">
    <div class="row">
        <div class="col-md-2">
            <client-payment-search (searchEmitter)="getclientSearchData(1)"></client-payment-search>
        </div>
        <div class="col-md-10 m-t-10">
          <div class="row">
            <div class="col-md-12">
              <h3 class="fin-h3">Client Payment History</h3>
            </div>
          </div>
            <div class="row">
                <div class="col-md-12">
                    <label>Client(s) Found : </label>
                    <span></span>
                </div>
                <div class="col-md-12">
                    <div class="table-responsive table-theme mt-20">
                        <table class="table table-striped" aria-describedby="">
                          <thead>
                            <tr>
                              <th id="clientIdHeader">Client ID</th>
                              <th id="clientNameHeader">Client Name</th>
                              <th id="dobHeader">DOB</th>
                              <th id="ssnHeader">SSN
                                  <span>&nbsp;
                                    <a (click)="toggleSsn()">
                                        <em class="fa fa-lg {{ssnEye}}"></em>
                                    </a>
                                  </span>
                              </th>
                              <th id="localDepartmentHeader">Local Department</th>
                            </tr>
                          </thead>
                          <tbody *ngIf="clientSearch">
                            <tr *ngFor="let fund of clientSearch">
                              <td>
                                <a (click)="fundingDetails(fund)">{{fund.client_id}}</a>
                              </td>
                              <td>{{fund.client_name}}</td>
                              <td>{{fund.client_dob | date: 'MM/dd/yyyy'}}</td>
                              <td>{{fund.ssn | ssnmaskpipe:showSsnMask}}</td>
                              <td>{{fund.local_dept}}</td>
                            </tr>
                          </tbody>
                          <tr *ngIf="clientSearch?.length === 0">
                              <td colspan="6" style="text-align: center !important;">
                                  No Records Found.
                              </td>
                          </tr>
                        </table>
                        <div class="text-center mt-10"  *ngIf="totalRecords > 10">
                          <pagination [totalItems]="totalRecords"
                              [(ngModel)]="paginationInfo.pageNumber" (pageChanged)="pageChanged($event.page)"
                              class="pagination-sm" [boundaryLinks]="true" [maxSize]="10">
                          </pagination>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
