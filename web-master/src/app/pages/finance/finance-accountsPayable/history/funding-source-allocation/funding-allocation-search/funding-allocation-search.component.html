<form>
<div class="row">
    <div class="left-side-filter" [formGroup]="fundingSearchForm">
        <h5>Search Filter</h5>
        <mat-form-field>
            <mat-label>Client Id</mat-label>
            <input matInput  formControlName="client_id">
        </mat-form-field>
        <h5>Client Name</h5>
        <mat-form-field>
            <mat-label>First Name</mat-label>
            <input matInput  formControlName='client_first_name'>
        </mat-form-field>
        <mat-form-field>
            <mat-label>Last Name</mat-label>
            <input matInput  formControlName='client_last_name'>
        </mat-form-field>

        <mat-form-field>
            <mat-label>SSN</mat-label>
            <input matInput  formControlName="ssn">
        </mat-form-field>
        <br>
            <h5>DOB Range</h5>
            <div class="row">
                <div class="col-sm-6">
                    <mat-form-field> 
                        <mat-label>Start</mat-label>
                        <input matInput autocomplete="off" [matDatepicker]="picker"  name="dobdaterangefrom"
                            formControlName="dobdaterangefrom">
                        <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
                        <mat-datepicker #picker></mat-datepicker>
                    </mat-form-field>
                </div>
                <div class="col-sm-6">
                    <mat-form-field>
                        <mat-label>End</mat-label>
                        <input matInput autocomplete="off" [matDatepicker]="picker1"  name="dobdaterangeto"
                            formControlName="dobdaterangeto">
                        <mat-datepicker-toggle matSuffix [for]="picker1"></mat-datepicker-toggle>
                        <mat-datepicker #picker1></mat-datepicker>
                    </mat-form-field>
                </div>
            </div>
            <mat-form-field>
                <mat-label>Local Department</mat-label>
                    <mat-select  formControlName="local_dept">
                        <mat-option>Select</mat-option>
                        <mat-option *ngFor="let dept of localDepartmentList" [value]="dept.value_tx">{{dept.value_tx}}</mat-option>
                    </mat-select>
            </mat-form-field>
             <mat-form-field>
                         <mat-label>Payment Type</mat-label>
                    <mat-select  formControlName="payment_type_cd" multiple>
                        <mat-option>Select</mat-option>
                        <mat-option *ngFor="let payment of paymentType$ | async" [value]="payment.picklist_value_cd">{{payment.value_tx}}</mat-option>
                    </mat-select>
                </mat-form-field>
        <button class="btn btn-pri pull-right mt-20 btn-align" [ngClass]="{'disabled': fundingSearchForm.invalid || fundingSearchForm.pristine}" [disabled]="fundingSearchForm.pristine || fundingSearchForm.invalid"  (click)="searchClient()">Go</button>
        <button class="btn btn-sec pull-right mt-20" (click)="clearSearch()">Clear</button>
    </div>
</div>
</form>
