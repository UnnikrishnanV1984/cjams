<form onSubmit="return false;" [formGroup]="placementFormGroup">
        <div class="row" style="background: #e7fcff;">
          <div class="left-side-filter" style="margin: 15px;">
            <h5>Search Filter</h5>
            <mat-form-field>
              <mat-label>Client Id</mat-label>
              <input matInput  value="" name="cleintid" formControlName="clientid">
            </mat-form-field>
            <mat-form-field>
              <mat-label>Placement Id</mat-label>
                <input matInput  value="" name="placementid" formControlName="placementid">
              </mat-form-field>
            <mat-form-field>
              <mat-label>Client Name</mat-label>
              <input matInput  value="" name="clientname" formControlName="clientname">
            </mat-form-field>
            <mat-form-field>
              <mat-label>Provider Id</mat-label>
              <input matInput  value="" name="providerid" formControlName="providerid">
            </mat-form-field>
            <mat-form-field>
              <mat-label>Provider Name</mat-label>
              <input matInput  value="" name="providername" formControlName="providername">
            </mat-form-field>
            <hr class="h-row">
            <h5>Placement Start Date</h5>
            <div class="row">
              <div class="col-sm-6">
                <mat-form-field>
                  <mat-label>Start</mat-label>
                  <input matInput autocomplete="off" [matDatepicker]="picker2"  name="placementstartdatefrom" formControlName="placementstartdatefrom">
                  <mat-datepicker-toggle matSuffix [for]="picker2"></mat-datepicker-toggle>
                  <mat-datepicker #picker2></mat-datepicker>
                </mat-form-field>
              </div>
              <div class="col-sm-6">
                <mat-form-field>
                  <mat-label>End</mat-label>
                  <input matInput autocomplete="off" [matDatepicker]="picker3"  name="placementstartdateto" formControlName="placementstartdateto">
                  <mat-datepicker-toggle matSuffix [for]="picker3"></mat-datepicker-toggle>
                  <mat-datepicker #picker3></mat-datepicker>
                </mat-form-field>
              </div>
            </div>
            <h5>Placement End Date</h5>
            <div class="row">
              <div class="col-sm-6">
                <mat-form-field>
                  <mat-label>Start</mat-label>
                  <input matInput autocomplete="off" [matDatepicker]="picker4"  name="placementenddatefrom" formControlName="placementenddatefrom">
                  <mat-datepicker-toggle matSuffix [for]="picker4"></mat-datepicker-toggle>
                  <mat-datepicker #picker4></mat-datepicker>
                </mat-form-field>
              </div>
              <div class="col-sm-6">
                <mat-form-field>
                  <mat-label>End</mat-label>
                  <input matInput autocomplete="off" [matDatepicker]="picker5"  name="placementenddateto" formControlName="placementenddateto">
                  <mat-datepicker-toggle matSuffix [for]="picker5"></mat-datepicker-toggle>
                  <mat-datepicker #picker5></mat-datepicker>
                </mat-form-field>
              </div>
            </div>
            <hr class="h-row">
            <h5>Location</h5>
            <mat-form-field>
              <mat-label>Address</mat-label>
              <input matInput  value="" name="address" formControlName="address">
            </mat-form-field>
            <mat-form-field>
              <mat-label>City</mat-label>
              <input matInput  value="" name="city" formControlName="city">
            </mat-form-field>
            <mat-form-field>
              <mat-label>Zipcode</mat-label>
              <input matInput  value="" name="zip" formControlName="zip">
            </mat-form-field>
            <mat-form-field>
              <mat-label>Country</mat-label>
              <input matInput  value=""  name="county" formControlName="county">
            </mat-form-field>
            <mat-form-field>
              <mat-label>Region</mat-label>
              <input matInput  value="" name="region" formControlName="region">
            </mat-form-field>
            <mat-form-field>
              <mat-label>Phone Number</mat-label>
              <input matInput  value="" name="phonenumber" formControlName="phonenumber" mask="(000) 000-0000">
            </mat-form-field>
            <button class="btn btn-pri pull-right mt-20" (click)="searchPlacement(1,placementFormGroup.value)">Go</button>
            <button class="btn btn-sec pull-right mt-20" (click)="clearSearch()">Clear</button>
          </div>
        </div>
      </form>
