
<div class="row">
    <div class="left-side-filter m-left-filter">
        <form [formGroup]="providerChecklistForm"> 
        <h5>Search Filter</h5>
        <mat-radio-group formControlName="ayear">
            <mat-radio-button value="Y" >12 Months</mat-radio-button>
            <mat-radio-button value="A">All</mat-radio-button>
        </mat-radio-group>
        <mat-form-field>
            <mat-label>Provider Id</mat-label>
            <input type="text" matInput  formControlName="provider_id" onkeypress="return (event.charCode == 8 || event.charCode == 0) ? null : event.charCode >= 46 && event.charCode <= 57">
        </mat-form-field>
        <mat-form-field>
            <mat-label>Provider Name</mat-label>
            <input matInput  formControlName="provider_name">
        </mat-form-field>
        <h5>Other</h5>
        <mat-form-field>
            <mat-label>Tax ID</mat-label>
            <input type="text" matInput  formControlName="tax_id" onkeypress="return (event.charCode == 8 || event.charCode == 0) ? null : event.charCode >= 46 && event.charCode <= 57">
        </mat-form-field>
        <mat-form-field>
            <mat-label>Mail Code</mat-label>
            <input matInput  formControlName="mail_code">
        </mat-form-field>
        
        <h5>Date Range</h5>
        <div class="row">
            <div class="col-sm-12">
                <mat-form-field>
                    <mat-label>Start Date</mat-label>
                    <input matInput autocomplete="off" [matDatepicker]="picker"  name="startdate" formControlName="startdate">
                    <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
                    <mat-datepicker #picker></mat-datepicker>
                </mat-form-field>
                <mat-form-field>
                    <mat-label>End Date</mat-label>
                    <input matInput autocomplete="off" [matDatepicker]="picker1"  name="enddate" formControlName="enddate">
                    <mat-datepicker-toggle matSuffix [for]="picker1"></mat-datepicker-toggle>
                    <mat-datepicker #picker1></mat-datepicker>
                </mat-form-field>
            </div>
        </div>
        <button class="btn btn-pri pull-right mt-20" (click)="searchProvider()">Go</button>
        <button class="btn btn-sec pull-right mt-20 m-r-10" (click)="clearSearch()">Clear</button>
    </form>
    </div>

</div>
