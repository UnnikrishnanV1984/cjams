  <div class="container-fluid pa-wrapper">
      <div class="row">
          <div class="col-md-12 col-sm-12 col-xs-12">
            <div class="form-letter-tab">
              <ul class="nav nav-tabs" role="tablist">
                <li class="nav-item" [class.active]="isValue == 1">
                  <a class="nav-link" data-bs-toggle="tab" href="#fundingPurchase" aria-controls="home" role="tab" data-bs-toggle="tab" (click)="getFundingApprove();isValue = 1">Funding Approval</a>
                </li>
      
                <li *ngIf="financeSupervisor" class="nav-item" [class.active]="isValue == 2">
                  <a class="nav-link" data-bs-toggle="tab" href="#paymentPurchase" aria-controls="details" role="tab" data-bs-toggle="tab" (click)="getPaymentApprove();isValue = 2">Payment Approval</a>
                </li>
              </ul>
              <div class="tab-content">
                  <div role="tabpanel" class="tab-pane" [class.active]="isValue == 1" id="fundingPurchase">
                       <div class="col-md-3 search-box">
                        </div>
          
                      <div class="col-md-12">
                          <custom-table [tableData] ="tableData"  [tableDataColumns] ="columns" [tableDataKeys] ="keys" 
                           [toolTipMsg] = "'Funding Approval Redirect'" [totalpagecount] = "totalpagecount"  [styles] = "styles" 
                           [pageNumber] = "pageInfo.pageNumber" (pageChangedEvent) = "pageNumberChanged($event)"
                           (sortEvent) = "onSortedFunding($event)"
                           (fetchDataEvent)= "callApi($event)" (actionEvent)= "callReDirectToFundingMethod($event)" [allowTableScrollV]="true" [isFullHieght]="true"></custom-table>
                      </div>

                  </div>
                  <div role="tabpanel" class="tab-pane" [class.active]="isValue == 2" id="paymentPurchase">
                      <div class="row">
                          <div class="col-md-3 search-box">
                            </div>
                                    <div class="col-md-12">
                                      <custom-table [tableData] ="pamentAprrovalTableData"  [tableDataColumns] ="pamentAprrovalColumns" [tableDataKeys] ="pamentAprrovalKeys" 
                                       [toolTipMsg] = "'Payment Approval Redirect'" [totalpagecount] = "totalcount" 
                                       [pageNumber] = "paginationInfo.pageNumber" (pageChangedEvent) = "pageChanged($event)"
                                       [styles] = "styles"
                                       (sortEvent) = "onSortedPayment($event)"
                                       (fetchDataEvent)= "callPaymentApi($event)" (actionEvent)= "callReDirectToPaymentMethod($event)" [allowTableScrollV]="true" [isFullHieght]="true"></custom-table>
                                  </div>
                        </div>
                  </div>
              </div>
            </div>
          </div>
        </div>
</div>
