<div class="container-fluid">
    <div class="dashboard-inner">
        <div class="container-fluid">
            <div class="dashboard-inner mt0">
                 <gridster [options]="options" class = "gridster">   
                    <gridster-item class="gridster-item" [item]="item" *ngFor="let item of dashboardWidget">
                        <div>
                            <div class="row drag-handler d-flex justify-content-between align-items-center" style="margin:0px;">
                                <div class="col-md-11">
                                <span class="dashboard-title">{{item.title}}</span>
                            </div>
                            <div class="col-md-1">
                                <div class="dropdown float-end">
                                    <img src="assets/images/dashboard-menu-icon.png" data-bs-toggle="dropdown" alt="Dashboard Menu Icon">
                                    <ul aria-labelledby="dLabel" class="dropdown-menu user-dropdown-menu">
                                        <li>
                                            <a class="dropdown-item"  (mousedown)="refreshItem(item)" (touchstart)="removeItem(item)" matTooltip="Remove">
                                                Refresh
                                            </a>
                                        </li>
                                        <li>
                                            <a class="dropdown-item"  (mousedown)="removeItem(item)" (touchstart)="removeItem(item)" matTooltip="Remove">
                                                Delete
                                            </a>
                                        </li>
                                    </ul>
                                </div>

                            </div>
                        </div>
                            <div class="gridster-item-content">
                                <ndc-dynamic [ndcDynamicComponent]="item.component" [ndcDynamicInputs]="item.input"></ndc-dynamic>
                            </div>
                        </div>
                    </gridster-item>
                </gridster>
            </div>
        </div>
    </div>
</div>
