<div class="row">
  <div class="col-md-12">
      <div class="table-responsive table-theme mt-20">
        <table class="table table-striped" aria-describedby="Client Details">
          <thead>
            <tr>
              <th id="client-id">Client ID</th>
              <th id="client-account-id">Client Account ID</th>
              <th id="client-name">Client Name</th>
              <th id="account-number">Account Number</th>
              <th id="account-balance">Account Balance</th>
            </tr>
          </thead>
          <tbody *ngFor="let alert of conservedAlert">
            <tr>
              <td>{{alert.client_id}}</td>
              <td>{{alert.client_account_id}}</td>
              <td>{{alert.client_name}}</td>
              <td>{{alert.account_no_tx}}</td>
              <td>{{alert.total_balance_no | cjamsCurrency}}</td>
            </tr>
          </tbody>
      </table>
    </div>
    <div class="text-center" *ngIf="totalcount > 10">
      <pagination [totalItems]="totalcount" [(ngModel)]="paginationInfo.pageNumber" (pageChanged)="pageChanged($event.page)"
        class="pagination-sm" [boundaryLinks]="true" [maxSize]="10">
      </pagination>
    </div>
  </div>
</div>
