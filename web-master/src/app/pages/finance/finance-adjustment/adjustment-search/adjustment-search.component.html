<form>
    <div class="row">
        <div class="left-side-filter" [formGroup]="ancillaryAdjustmentFormGroup">
            <mat-form-field>
                <mat-label>Payment Id</mat-label>
                <input matInput  name="paymentid" formControlName="paymentid" onkeypress="return (event.charCode == 8 || event.charCode == 0) ? null : (event.charCode >= 46 && event.charCode <= 57) || event.charCode == 13">
            </mat-form-field>
            <mat-form-field>
                <mat-label>FEIN/Tax Id</mat-label>
                <input matInput  name="taxid" formControlName="taxid" onkeypress="return (event.charCode == 8 || event.charCode == 0) ? null : (event.charCode >= 46 && event.charCode <= 57) || event.charCode == 13">
            </mat-form-field>
            <mat-form-field>
                <mat-label>Vendor Id</mat-label>
                <input matInput  name="providerid" formControlName="providerid" onkeypress="return (event.charCode == 8 || event.charCode == 0) ? null : (event.charCode >= 46 && event.charCode <= 57) || event.charCode == 13">
            </mat-form-field>
            <mat-form-field>
                <mat-label>Vendor Name</mat-label>
                <input matInput  name="providername" formControlName="providername">
            </mat-form-field>
            <mat-form-field>
                <mat-label>Client Id</mat-label>
                <input matInput  name="clientid" formControlName="clientid" onkeypress="return (event.charCode == 8 || event.charCode == 0) ? null : (event.charCode >= 46 && event.charCode <= 57) || event.charCode == 13">
            </mat-form-field>
            <mat-form-field>
                <mat-label>Client Name</mat-label>
                <input matInput  name="clientname" formControlName="clientname">
            </mat-form-field>
            <hr class="h-row">
            <button class="btn btn-pri pull-right mt-20 btn-align" [ngClass]="{'disabled': ancillaryAdjustmentFormGroup.invalid || ancillaryAdjustmentFormGroup.pristine}" [disabled]="ancillaryAdjustmentFormGroup.pristine || ancillaryAdjustmentFormGroup.invalid"   (click)="searchProviders()">Go</button>
            <button class="btn btn-sec pull-right mt-20" (click)="clearSearch()">Clear</button>
        </div>
    </div>
</form>
