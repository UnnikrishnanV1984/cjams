<div class="container-fluid">
    <div class="row">
      <div class="col-md-12">
        <div class="vendor-wrapper box-grid-main" [formGroup]="calendarPayFileFormGroup">
          <div class="box-grid box-grid">
            <h3>Vendor/Pay File Calendar</h3>
            <div class="row">
              <div class="col-md-2">
                <mat-form-field>
                  <mat-label>Calendar Year</mat-label>
                  <mat-select formControlName="year_no" (selectionChange)="listVendorPayCalendar($event.value)"  required>
                      <mat-option *ngFor="let year of calendarYearList" [value]="year.value">{{year.text}}</mat-option>
                  </mat-select>
                </mat-form-field>
              </div>
              <div class="col-md-10 m-t-20 text-end">
                <button (click)="generateNextYear()" class="btn-pri text-uppercase add-btn" type="button">Generate Next Year</button>
              </div>
            </div>

            <div class="row">
              <div class="col-md-12">
                <h4>Vendor and Pay File Delivery Dates</h4>
                <div class="table-responsive">
                  <table class="table table-bordered vendor-tb" aria-describedby="vendor details">
                    <thead>
                      <tr>
                        <th id="month">Month</th>
                        <th id="vendor-file-date-1">Vendor File Date (1)</th>
                        <th id="pay-file-date-1">Pay File Date (1)</th>
                        <th id="vendor-file-date-2">Vendor File Date (2)</th>
                        <th id="pay-file-date-2">Pay File Date (2)</th>
                        <th id="comments">Comments</th>
                        <th id="last-created-updated-by">Last Created /Updated By</th>
                        <th id="updated-on">Updated On</th>
                      </tr>
                    </thead>
                    <tbody formArrayName="calendar">
                      <tr *ngFor="let calendar of getCalanderControls(); let i=index" [formGroupName]="i">
                        <td>
                          <p>{{calendar.get('monthName')?.value}}</p>
                        </td>
                        <td>
                          <common-date-picker (valueClick)="check($event)" (valueChange)="appendList(i, '1', $event)" [min]="calendar.get('min_date_vendor_file_dt_1')?.value" [max]="calendar.get('max_date')?.value"
                            [ngClass]="calendar.get('vendor_1_default_date')?.value ? 'text-bold': ''" formControlName="vendor_file_1_dt"
                            [disabled]="calendar.get('past_month')?.value">
                          </common-date-picker>
                        </td>
                        <td>
                          <common-date-picker (valueClick)="check($event)" (valueChange)="appendList(i, '4', $event)" [min]="calendar.get('min_date')?.value" [max]="calendar.get('max_date')?.value"
                            [ngClass]="calendar.get('pay_1_default_date')?.value ? 'text-bold': ''" formControlName="pay_file_1_dt"
                            [disabled]="calendar.get('past_month')?.value">
                          </common-date-picker>
                        </td>
                        <td>
                          <common-date-picker (valueClick)="check($event)" (valueChange)="appendList(i, '13', $event)" [min]="calendar.get('min_date')?.value" [max]="calendar.get('max_date')?.value"
                            [ngClass]="calendar.get('vendor_2_default_date')?.value ? 'text-bold': ''"formControlName="vendor_file_2_dt"
                            [disabled]="calendar.get('past_month')?.value">
                          </common-date-picker>
                        </td>
                        <td>
                          <common-date-picker (valueClick)="check($event)" (valueChange)="appendList(i, '16', $event)" [min]="calendar.get('min_date')?.value" [max]="calendar.get('max_date')?.value"
                            [ngClass]="calendar.get('pay_2_default_date')?.value ? 'text-bold': ''" formControlName="pay_file_2_dt"
                            [disabled]="calendar.get('past_month')?.value">
                          </common-date-picker>
                        </td>
                        <td>
                          <mat-form-field class="">
                            <textarea matInput  [disabled]="calendar.get('past_month')?.value" (change)="appendList(i, '', $event)"  formControlName="comments_tx"></textarea>
                          </mat-form-field>
                        </td>
                        <td>
                            <mat-form-field class="">
                                <input matInput [disabled]="true" readonly formControlName="updated_by">
                            </mat-form-field>
                        </td>
                        <td>
                            <common-date-picker formControlName="updated_on"
                            [disabled]="true">
                          </common-date-picker>
                        </td>
                      </tr>
                    </tbody>
                  </table>
                </div>
                <div class="row">
                  <div class="col-md-12 text-end m-t-20">
                    <button type="button" class="btn-pri" [disabled]="calendarPayFileFormGroup.invalid" (click)="saveCalendar()">Save</button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
  </div>
</div>
