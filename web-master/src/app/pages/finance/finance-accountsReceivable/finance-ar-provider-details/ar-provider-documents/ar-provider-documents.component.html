<div class="container-fluid">
  <div class="row">
    <div class="col-md-12">
        <div class="row">
            <div class="col-md-12 m-t-20">
                <div class="table-responsive table-theme original-payment-tb">
                    <table class="table table-striped" aria-describedby="tbl-document-list">
                        <thead>
                            <tr>
                                <th scope="col">Document Name</th>
                                <th scope="col">Collection Status</th>
                                <th scope="col">Uploaded by</th>
                                <th scope="col">Uploaded Date</th>
                                <th scope="col">Receivable Detail Id</th>                                
                                <th scope="col">Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr *ngFor="let status of receivableDocumentList; let i=index">
                                <td>{{status.filename}}</td>                                
                                <td>{{status.collectionstatus}}</td>
                                <td>{{status.fullname}}</td>
                                <td>{{status.uploadeddate | date:'MM/dd/yyyy'}}</td>
                                <td>{{status.receivabledetailid}}</td>
                                <td>
                                    <button class="btn btn-pri" (click)="downloadFile(status.uploadpath.data)">
                                        <i class="fa fa-download" aria-hidden="true"></i>&nbsp;Download
                                    </button>
                                    <button class="btn btn-pri" matTooltip="Delete" data-bs-toggle="modal" (click)="confirmDelete(status)" >
                                            <i class="fa fa-trash" aria-hidden="true"></i>
                                        </button>
                                </td>                                                
                            </tr>
                            <tr *ngIf="doucmentFlag">
                                    <td colspan="4" style="text-align: center !important;">No Documents.</td>
                                </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
  </div>
</div>
<div class="modal fade in" id="delete-attachment" tabindex="-1" role="dialog" aria-labelledby="myModalLabel">
    <div class="modal-dialog modal-dialog-w450" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h4 class="modal-title">Confirm Delete?</h4>
                <button aria-label="Close" class="btn-close close pull-right" data-bs-dismiss="modal" type="button"></button>
            </div>
            <div class="modal-body">
                <div class="row">
                    <div class="col-md-12">
                        <div class="row text-center">
                            <figure>
                                <p>Are you sure you want to delete this attachment?</p>
                            </figure>
                            <div class="col-md-12 text-center">
                                <div class="btn-group btn-group-re">
                                    <button type="button" class="btn-pri" (click)="deleteAttachment()">Yes</button>
                                    <button type="button" class="btn-bg" data-bs-dismiss="modal">No</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            </div>
        </div>
</div>
