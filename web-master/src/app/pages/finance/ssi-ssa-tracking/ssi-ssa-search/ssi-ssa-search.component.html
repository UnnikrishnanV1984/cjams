<form onSubmit="return false;" [formGroup]="ssiSsaFormGroup">
    <div class="row">
        <div class="left-side-filter">
            <h5>Search Filter</h5>
            <mat-radio-group formControlName="ayear">
                <mat-radio-button value="Y">12 Months</mat-radio-button>
                <mat-radio-button>All</mat-radio-button>
            </mat-radio-group>
            <mat-form-field>
                <mat-label>Client Id</mat-label>
                <input matInput  value="" formControlName='client_id' onkeypress="return (event.charCode == 8 || event.charCode == 0) ? null : event.charCode >= 46 && event.charCode <= 57">
            </mat-form-field>
            <mat-form-field>
                <mat-label>Client First Name</mat-label>
                <input matInput  value="" formControlName='client_firstname'>
            </mat-form-field>
            <mat-form-field>
                <mat-label>Client Last Nam</mat-label>
                <input matInput  value="" formControlName='client_lastname'>
            </mat-form-field>
            <mat-form-field>
                <mat-label>Client Middle Name</mat-label>
                <input matInput  value="" formControlName='client_middlename'>
            </mat-form-field>
            <mat-form-field>
                <mat-label>SSN</mat-label>
                <input matInput  formControlName='ssn'>
            </mat-form-field>
            <mat-form-field>
                <mat-label>Case Worker Name</mat-label>
                <input matInput  value="" formControlName='caseworker_name'>
            </mat-form-field>
            <hr class="h-row">
            <h5>DOB Range</h5>
            <div class="row">
                <div class="col-sm-6">
                    <mat-form-field>
                        <mat-label>Start</mat-label>
                        <input matInput autocomplete="off" [matDatepicker]="picker6" value="" formControlName='dobdaterangefrom'
                            >
                        <mat-datepicker-toggle matSuffix [for]="picker6"></mat-datepicker-toggle>
                        <mat-datepicker #picker6></mat-datepicker>
                    </mat-form-field>
                </div>
                <div class="col-sm-6">
                    <mat-form-field>
                        <mat-label>End</mat-label>
                        <input matInput autocomplete="off" [matDatepicker]="picker7" value="" formControlName='dobdaterangeto' >
                        <mat-datepicker-toggle matSuffix [for]="picker7"></mat-datepicker-toggle>
                        <mat-datepicker #picker7></mat-datepicker>
                    </mat-form-field>
                </div>
            </div>

            <button class="btn btn-pri pull-right mt-20 btn-align" (click)='searchProviders()'>Go</button>
            <button class="btn btn-sec pull-right mt-20" (click)='clearSearch()'>Clear</button>
        </div>
    </div>
</form>
