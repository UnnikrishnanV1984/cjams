<div class="container-fluid">
    <div class="row">
        <div class="col-md-12 col-sm-12 col-xs-12 form-letter-tab">
            <div class="box-grid contracting-pg">
                <div class="tab-subtitle">
                    <h3>New Agency Action</h3>
                </div>
                <form [formGroup]="contractingForm">
                    <div class="row">
                        <div class="col-md-5 col-sm-6">
                            <div class="">
                                <label class="required pull-left">Action Type</label>
                                <div class="col-md-6 col-sm-8 contracting-w-select">
                                    <ng-select formControlName="intakeservreqtypekey" [searchable]="true" [clearable]="false">
                                        <ng-option value="">Select</ng-option>
                                        <ng-option *ngFor="let actionList of actionTypeList$ | async| orderBy:'text' " [value]="actionList.value">{{actionList.text}}</ng-option>
                                    </ng-select>
                                    <control-messages [control]="intakeservreqtypekeyControl"></control-messages>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-12">
                            <h3>Provider Search</h3>
                            <div class="provider-serch row">
                                <div class="col-sm-3">
                                    <div class="">
                                        <label class="required">Provider Name</label>
                                        <div class="">
                                            <input formControlName="agency_name" class="form-control fm-style" placeholder="">
                                            <control-messages [control]="agencynameControl"></control-messages>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-sm-2">
                                    <div class="">
                                        <label class="required">SSBG</label>
                                        <div class="">
                                            <input formControlName="ssbg_" class="form-control fm-style" placeholder="">
                                            <control-messages [control]="ssbgControl"></control-messages>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-sm-2">
                                    <div class="">
                                        <label class="required">PA Type:</label>
                                        <div class="">
                                            <ng-select formControlName="servicerequestsubtype" [searchable]="true" [clearable]="false">
                                                <ng-option value="">Select</ng-option>
                                                <ng-option *ngFor="let paList of paTypeList$ | async| orderBy:'text'" [value]="paList.value">{{paList.text}}</ng-option>
                                            </ng-select>
                                            <control-messages [control]="servicerequestsubtypeControl"></control-messages>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-sm-4">
                                    <div class="radio-contol-ctm">
                                        <label>Fiscal Year</label>
                                        <div class="">

                                            <label class="control control--radio col-md-6">
                                                Current Year
                                                <input type="radio" checked="" value="Current Year " formControlName="fiscal_year">
                                                <div class="control__indicator"></div>
                                            </label>

                                            <label class="control control--radio col-md-6">
                                                Next Year
                                                <input type="radio" value="Next Year" formControlName="fiscal_year">
                                                <div class="control__indicator"></div>
                                            </label>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="btn-group btn-group-re pull-right">
                                <button type="button" class="btn-pri" (click)="searchItem()" [disabled]="contractingForm.pristine || contractingForm.invalid">
                                    Search</button>
                            </div>
                        </div>
                    </div>
                </form>

                <div class="row mrg-top25">
                    <div class="col-md-12">

                        <div class="card-group form-letter-tab" id="accordion">
                            <div class="card panel-default">
                                <div class="card-header">
                                    <h4 class="card-title collapsed" data-bs-toggle="collapse" data-parent="#accordion" href="#collapseOne" aria-expanded="false">
                                        <a>Search Result
                                            <span class="glyphicon pull-right glyphicon-plus"></span>
                                        </a>
                                    </h4>
                                </div>
                                <div id="collapseOne" class="panel-collapse collapse" aria-expanded="false" style="height: 0px;">
                                    <div class="card-body">
                                        <div class="col-sm-12">
                                            <div class="table-responsive">
                                                <table class="table table-bordered" aria-describedby="Provider Details">
                                                    <thead>
                                                        <tr>
                                                            <th id="provider-name-contracttype">Provider Name / ContractType</th>
                                                            <th id="provider-dba">Provider DBA</th>
                                                            <th id="fein">FEIN</th>
                                                            <th id="actions">Actions</th>
                                                        </tr>
                                                    </thead>
                                                    <tbody>
                                                        <tr *ngFor="let searchItem of serchContract$ | async ">
                                                            <td>{{searchItem.agencyname}}</td>
                                                            <td>{{searchItem.name}}</td>
                                                            <td>{{searchItem.provideragreementstatuskey}}</td>
                                                            <td>{{searchItem.federaltaxid}}</td>
                                                        </tr>
                                                    </tbody>
                                                </table>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
