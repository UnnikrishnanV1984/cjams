<div class="container-fluid">
    <div class="row">
        <div class="col-md-12">
            <div class="form-letter-tab">
                <div class="box-grid">
                    <div class="row">
                        <div class="col-sm-9">
                            <h3>Manage Non-Contracting Types</h3>
                        </div>
                        <div class="col-sm-3 tab-title-btn">
                            <button data-bs-toggle="modal" (click)="updateAddEditLabel('Add')" data-bs-target="#myModal-non-contracting-type-edit-add" class="btn-pri pull-right">
                                <em class="fa fa-plus right-sspace"> </em> AddNonContractingType</button>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-sm-12">
                            <div class="table-responsive">
                                <table class="table table-bordered" sortable-table (sorted)="onSorted($event)" aria-describedby="Non Contracting Type List">
                                    <thead>
                                        <tr>
                                            <th id="typekeyHeader" sortable-column="providernonagreementtypekey" sort-direction="asc">Type Key</th>
                                            <th id="descriptionHeader" sortable-column="typedescription">Description</th>
                                            <th id="activeHeader">Active</th>
                                            <th id="enctHeader">EditNonContractingTypes</th>
                                            <th id="actionHeader">Action</th>
                                        </tr>
                                        <tr>
                                            <td>
                                                <div class="inner-addon right-addon">
                                                    <em class="fa fa-search" href="#" data-bs-toggle="modal" data-bs-target="#attach-user-selection"></em>
                                                    <input class="form-control full-collapse-horizontal" type="text" (input)="onSearch('providernonagreementtypekey', $event)"
                                                        placeholder="Type Key">
                                                </div>
                                            </td>
                                            <td>
                                                <div class="inner-addon right-addon">
                                                    <em class="fa fa-search" href="#" data-bs-toggle="modal" data-bs-target="#attach-user-selection"></em>
                                                    <input class="form-control full-collapse-horizontal" type="text" (input)="onSearch('typedescription', $event)" value="" placeholder="Description">
                                                </div>
                                            </td>
                                            <td></td>
                                            <td></td>
                                            <td></td>
                                        </tr>
                                    </thead>
                                    <tbody *ngIf="nonContractionType$ | async; let nonContractingTypeList">
                                        <tr *ngFor="let nonContract of nonContractingTypeList">
                                            <td>{{nonContract.providernonagreementtypekey}}</td>
                                            <td>{{nonContract.typedescription}}</td>
                                            <td>
                                                <div *ngIf="nonContract.activeflag == 0; then thenBlock else elseBlock"></div>
                                                <ng-template #thenBlock>No</ng-template>
                                                <ng-template #elseBlock>Yes</ng-template>
                                            </td>
                                            <td>
                                                <span data-bs-toggle="tooltip" data-bs-placement="top" title="Edit">
                                                    <a data-bs-toggle="modal" (click)="updateAddEditLabel('Edit')" data-bs-target="#myModal-non-contracting-type-edit-add" (click)="editItem(nonContract)">
                                                        <i class="fa fa-pencil" aria-hidden="true"></i>
                                                    </a>
                                                </span>
                                            </td>
                                            <td>
                                                <div *ngIf="nonContract.activeflag == 0; then thenInactive else elseActive"></div>
                                                <ng-template #thenInactive>
                                                    <a (click)="updateActiveState(nonContract, nonContract.activeflag=1)">
                                                        Inactivate</a>
                                                </ng-template>
                                                <ng-template #elseActive>
                                                    <a (click)="updateActiveState(nonContract, nonContract.activeflag=0)">
                                                        Activate</a>
                                                </ng-template>
                                            </td>
                                        </tr>
                                        <tr *ngIf="nonContractingTypeList?.length === 0">
                                            <td colspan="5">No records found.</td>
                                        </tr>
                                    </tbody>
                                </table>
                                <div *ngIf="{ canDisplayPager: canDisplayPager$ | async, totalRecords: totalRecords$ | async } as pagination">
                                    <pagination *ngIf="pagination.canDisplayPager" [totalItems]="pagination.totalRecords ?? 0" [(ngModel)]="paginationInfo.pageNumber"
                                        (pageChanged)="pageChanged($event)" class="pagination-sm" [boundaryLinks]="true" [maxSize]="10"
                                        [itemsPerPage]="paginationInfo.pageSize"></pagination>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>


<div class="modal fade" id="myModal-non-contracting-type-edit-add" role="dialog">
    <div class="modal-dialog">
        <div class="modal-content customize-modal">
            <div class="modal-header">
                <button type="button" class="btn-close" data-bs-dismiss="modal">&times;</button>
                <h4 class="modal-title">{{addEditLabel}} NonContractType:</h4>
            </div>
            <form [formGroup]="formGroup" class="modal-body">
                <div class="row">
                    <div class="col-sm-12">
                        <div class="fm-box">
                            <label class="required">Type Key:</label>
                            <div class="fm-box-form col-sm-5">
                                <input formControlName="providernonagreementtypekey" class="form-control fm-style" placeholder="">
                                <control-messages [control]="providernonagreementtypekeyControl"></control-messages>
                            </div>
                        </div>
                    </div>
                    <div class="col-sm-12">
                        <div class="fm-box">
                            <label class="required">Type Description:</label>
                            <div class="fm-box-form col-sm-5 fm-narrate">
                                <textarea class="form-control fm-style" formControlName="typedescription" placeholder=""></textarea>
                                <control-messages [control]="typedescriptionControl"></control-messages>
                            </div>
                        </div>
                    </div>
                    <div class="col-sm-12 mrg-top25">
                        <div class="pull-right">
                            <button type="button" value="Close" class="btn-bg" name="" (click)="cancelItem()">Cancel</button>
                            <button type="button" value="Add" class="btn-pri" name="" [disabled]="formGroup.pristine || formGroup.invalid" (click)="saveItem()">Save</button>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
