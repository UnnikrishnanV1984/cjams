<div class="modal fade in" id="add-edit-doc-types" data-bs-backdrop="static" data-bs-keyboard="false" role="dialog" style="display: block;">
  <div class="modal-dialog">

    <div class="modal-content customize-modal">
      <div class="modal-header">
        <button type="button" class="btn-close" data-bs-dismiss="modal" [routerLink]="['/pages/admin/da-config/provider-contracting/doc-types']">×</button>
        <h4 class="modal-title">Add Document Type</h4>
      </div>
      <div class="modal-body">
        <div class="row">
          <div class="col-sm-6 mrg-top25">
            <div class="fm-box">
              <label>Doc Type :</label>
              <div class="fm-box-form">
                <input type="text" name="" class="form-control fm-style" placeholder="">
              </div>
            </div>
          </div>
          <div class="col-sm-6 mrg-top25">
            <div class="fm-box">
              <label>Doc Type Key :</label>
              <div class="fm-box-form">
                <input type="text" name="" class="form-control fm-style" placeholder="">
              </div>
            </div>
          </div>
          <div class="col-sm-12 mrg-top25">
            <div class="pull-right">
              <button type="button" value="Cancel" class="btn-bg" data-bs-dismiss="modal" [routerLink]="['/pages/admin/da-config/provider-contracting/doc-types']" name="">Cancel</button>
              <button type="button" value="Save" class="btn-pri" name="">Save</button>
            </div>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>
