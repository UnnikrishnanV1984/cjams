<div role="tabpanel" class="tab-pane" id="pa-activities">
    <div class="box-grid">
        <div class="row">
            <div class="col-sm-9">
                <h3>Manage Activities</h3>
            </div>
            <div class="col-sm-3">
                <div class="tab-title-btn">
                    <button data-bs-toggle="modal" data-bs-target="#myModal-doc-types-edit" class="btn-pri pull-right" (click)="changeModelLabel('Add Task')">
                        <em class="fa fa-plus right-sspace"> </em> Add Activity</button>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col-md-12">
                <div class="table-responsive">
                    <table class="table table-bordered" sortable-table (sorted)="onSorted($event)" aria-describedby="Add Activity">
                        <thead>
                            <tr>
                                <th id="nameHeader" sortable-column="name" sort-direction="asc">Name</th>
                                <th id="descriptionHeader" sortable-column="nadescriptionme">Description</th>
                                <th id="actionHeader">Action</th>
                            </tr>
                            <tr>
                                <td>
                                    <div class="inner-addon right-addon">
                                        <em class="fa fa-search" href="#" data-bs-toggle="modal" data-bs-target="#attach-user-selection"></em>
                                        <input class="form-control full-collapse-horizontal" type="text" value="" (input)="onSearch('name', $event)" placeholder="Search Name">
                                    </div>
                                </td>
                                <td>
                                    <div class="inner-addon right-addon">
                                        <em class="fa fa-search" href="#" data-bs-toggle="modal" data-bs-target="#attach-user-selection"></em>
                                        <input class="form-control full-collapse-horizontal" type="text" value="" (input)="onSearch('description', $event)" placeholder="Search Description">
                                    </div>
                                </td>
                                <td></td>
                            </tr>
                        </thead>
                        <tbody *ngIf="paActivitiesPC$ | async; let paActivitiesList">
                            <tr *ngFor="let activity of paActivitiesList">
                                <td>{{activity.name}}</td>
                                <td>{{activity.description}}</td>
                                <td>
                                    <span data-bs-toggle="tooltip" data-bs-placement="top" title="Edit" class="mrg-rht10">
                                        <a (click)="editItem(activity)" data-bs-toggle="modal" data-bs-target='#myModal-doc-types-edit'>
                                            <img src="assets/images/form-letter/edit-icon.png" alt="">
                                        </a>
                                    </span>
                                    <span data-bs-toggle="tooltip" data-bs-placement="top" title="Delete">
                                        <a (click)="confirmDelete(activity)">
                                            <img src="assets/images/form-letter/delete-icon.png" alt="">
                                        </a>
                                    </span>
                                </td>
                            </tr>
                            <tr *ngIf="paActivitiesList?.length === 0">
                                <td colspan="3">No records found.</td>
                            </tr>
                        </tbody>
                    </table>
                    <div *ngIf="{ canDisplayPager: canDisplayPager$ | async, totalRecords: totalRecords$ | async } as pagination">
                        <pagination *ngIf="pagination.canDisplayPager" [totalItems]="pagination.totalRecords ?? 0" [(ngModel)]="paginationInfo.pageNumber"
                            (pageChanged)="pageChanged($event)" class="pagination-sm" [boundaryLinks]="true" [maxSize]="10" [itemsPerPage]="paginationInfo.pageSize"></pagination>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>

<div class="modal fade in" data-bs-backdrop="static" id="myModal-doc-types-edit" data-bs-keyboard="false" role="dialog">
    <div class="modal-dialog">

        <div class="modal-content customize-modal">
            <div class="modal-header">
                <button type="button" class="btn-close" data-bs-dismiss="modal">×</button>
                <h4 class="modal-title" *ngIf="!isEditMode">Add Activities</h4>
                <h4 class="modal-title" *ngIf="isEditMode">Edit Activities</h4>
            </div>
            <form [formGroup]="paActivitiesformGroup">
                <div class="modal-body">
                    <div class="row">
                        <div class="col-sm-6 mrg-top25">
                            <div class="fm-box">
                                <label class="required">PA Activities :</label>
                                <div class="fm-box-form">
                                    <input type="text" formControlName="name" class="form-control fm-style" placeholder="" />
                                    <control-messages [control]="nameControl"></control-messages>
                                </div>
                            </div>
                        </div>
                        <div class="col-sm-6 mrg-top25">
                            <div class="fm-box">
                                <label class="required">Description :</label>
                                <div class="fm-box-form">
                                    <input type="text" formControlName="description" class="form-control fm-style" placeholder="">
                                    <control-messages [control]="deficiencyControl"></control-messages>
                                </div>
                            </div>
                        </div>
                        <div class="col-sm-12 mrg-top25">
                            <div class="pull-right">
                                <button type="button" value="Cancel" class="btn-bg" data-bs-dismiss="modal">Cancel</button>
                                <button type="button" value="Save" class="btn-pri" name="" (click)='saveItem()' [disabled]="paActivitiesformGroup.pristine || paActivitiesformGroup.invalid"
                                    data-bs-dismiss="modal">Save</button>
                            </div>
                        </div>
                    </div>
                </div>
            </form>
        </div>


    </div>
</div>

<div class="modal fade custom-modal" id="delete-popup" role="dialog">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="btn-close" data-bs-dismiss="modal">×</button>
                <h4 class="modal-title"> Confirm Delete </h4>
            </div>
            <div class="modal-body">
                <p> Are you sure you want to delete this item? </p>
                <div class="text-end big-bot-space right-mspace-15">
                    <button type="button" value="No" class="btn-bg" name="" (click)="declineDelete()"> No </button>
                    <button type="button" value="Yes" class="btn-pri" name="" (click)="deleteItem()"> Yes </button>
                </div>
            </div>
        </div>
    </div>
</div>
