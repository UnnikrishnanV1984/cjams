<div role="tabpanel" class="tab-pane" id="pa-tasks">
  <div class="box-grid">
    <div class="row">
      <div class="col-sm-9">
        <h3>Manage Tasks</h3>
      </div>
      <div class="col-sm-3">
        <div class="tab-title-btn">
          <button data-bs-toggle="modal" (click)="changeModelLabel('Add Task')" data-bs-target='#add-edit-pa-tasks' class="btn-pri pull-right">
            <em class="fa fa-plus right-sspace"> </em> Add Task</button>
        </div>
      </div>
    </div>

    <div class="row">
      <div class="col-md-12">
        <div class="table-responsive">
          <table class="table table-bordered" sortable-table (sorted)="onSorted($event)" aria-describedby="Add Task">
            <thead>
              <tr>
                <th id="tableHeaderName" sortable-column="name" sort-direction="asc">{{providerContractingConfig.TableHeaderName}}</th>
                <th id="tableHeaderDescription" sortable-column="description">{{providerContractingConfig.TableHeaderDescription}}</th>
                <th id="actionHeader">Action</th>
              </tr>
              <tr>
                <td>
                  <div class="inner-addon right-addon">
                    <em class="fa fa-search" href="#" data-bs-toggle="modal" data-bs-target="#attach-user-selection"></em>
                    <input class="form-control full-collapse-horizontal" type="text" value="" (input)="onSearch('name', $event)" placeholder="Search Name">
                  </div>
                </td>
                <td>
                  <div class="inner-addon right-addon">
                    <em class="fa fa-search" href="#" data-bs-toggle="modal" data-bs-target="#attach-user-selection"></em>
                    <input class="form-control full-collapse-horizontal" type="text" value="" (input)="onSearch('description', $event)" placeholder="Search Description">
                  </div>
                </td>
                <td></td>
              </tr>
            </thead>
            <tbody *ngIf="paTasksPC$ | async; let paTasksList">
              <tr *ngFor="let PaTask of paTasksList">
                <td>{{PaTask.name}}</td>
                <td>{{PaTask.description}}</td>
                <td>
                  <span data-bs-toggle="tooltip" data-bs-placement="top" title="Edit" class="mrg-rht10">
                    <a (click)='editItem(PaTask)' data-bs-toggle="modal" data-bs-target='#add-edit-pa-tasks'>
                      <img src="assets/images/form-letter/edit-icon.png" alt="">
                    </a>
                  </span>
                  <span data-bs-toggle="tooltip" data-bs-placement="top" title="Delete">
                    <a (click)="confirmDelete(PaTask)">
                      <img src="assets/images/form-letter/delete-icon.png" alt="">
                    </a>
                  </span>
                </td>
              </tr>
              <tr *ngIf="paTasksList?.length === 0">
                <td colspan="2">No records found.</td>
              </tr>
            </tbody>
          </table>
        </div>
        <div *ngIf="{ canDisplayPager: canDisplayPager$ | async, totalRecords: totalRecords$ | async } as pagination">
          <pagination *ngIf="pagination.canDisplayPager" [totalItems]="pagination.totalRecords ?? 0" [(ngModel)]="paginationInfo.pageNumber"
            (pageChanged)="pageChanged($event)" class="pagination-sm" [boundaryLinks]="true" [maxSize]="10" [itemsPerPage]="paginationInfo.pageSize"></pagination>
        </div>
      </div>
    </div>
  </div>
</div>
<div class="modal fade in" id="add-edit-pa-tasks" data-bs-backdrop="static" data-bs-keyboard="false" role="dialog" style="display: none;">
  <div class="modal-dialog">

    <div class="modal-content customize-modal">
      <div class="modal-header">
        <div class="modal-header">
          <button type="button" class="btn-close" data-bs-dismiss="modal">×</button>
          <h4 class="modal-title">{{addEditLabel}}</h4>
        </div>
      </div>
      <form [formGroup]="paTaskForm" class="modal-body">
        <div class="row">
          <div class="col-sm-12">
            <div class="fm-box">
              <label class="required">Name</label>
              <div class="fm-box-form col-sm-5">
                <input type="text" formControlName="name" class="form-control fm-style" placeholder="" required>
                <control-messages [control]="nameControl"></control-messages>
              </div>
            </div>
          </div>
          <div class="col-sm-12">
            <div class="fm-box">
              <label class="required">Description</label>
              <div class="fm-box-form col-sm-5 fm-narrate">
                <textarea class="form-control fm-style" formControlName="description" placeholder="Start writing from here.." required></textarea>
                <diV>
                  <control-messages [control]="deficiencyControl"></control-messages>
                </diV>
              </div>
            </div>
          </div>
          <div class="col-sm-12 mrg-top25">
            <div class="pull-right">
              <button type="button" value="Cancel" class="btn-bg" data-bs-dismiss="modal" name="">Cancel</button>
              <button type="button" value="Save" class="btn-pri" (click)="saveItem()" data-bs-dismiss="modal" [disabled]="paTaskForm.pristine || paTaskForm.invalid">Save</button>
            </div>
          </div>
        </div>
      </form>
    </div>

  </div>
</div>

<div class="modal fade custom-modal" id="delete-popup" role="dialog">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <button type="button" class="btn-close" data-bs-dismiss="modal">×</button>
        <h4 class="modal-title"> Confirm Delete </h4>
      </div>
      <div class="modal-body">
        <p> Are you sure you want to delete this item? </p>
        <div class="text-end big-bot-space right-mspace-15">
          <button type="button" value="No" class="btn-bg" name="" (click)="declineDelete()"> No </button>
          <button type="button" value="Yes" class="btn-pri" name="" data-bs-dismiss="modal" (click)="deleteItem()"> Yes </button>
        </div>
      </div>
    </div>
  </div>
</div>
