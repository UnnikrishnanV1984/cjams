<div role="tabpanel" class="tab-pane active" id="dsds-action-goals">
    <div class="box-grid">
        <div class="row">
            <div class="col-sm-9">
                <h3>Manage Activity Goals</h3>
            </div>
            <div class="col-sm-3 tab-title-btn">
                <button href="javascript:void();" data-bs-toggle="modal" data-bs-target="#myModal-dsds-action-goals-add-edit" class="btn-pri pull-right"
                    (click)="changeModelLabel('Add')">
                    <em class="fa fa-plus right-sspace"> </em> Add Activity Goal</button>
            </div>
        </div>
        <div class="row">
            <div class="col-md-12">
                <div class="table-responsive">
                    <table class="table table-bordered" sortable-table (sorted)="onSorted($event)" aria-describedby="Goal">
                        <thead>
                            <tr>
                                <th id="header-name" sortable-column="name" sort-direction="asc">Name</th>
                                <th id="header-description" sortable-column="description">Description</th>
                                <th id="header-actions">Actions</th>
                            </tr>
                            <tr>
                                <td>
                                    <div class="inner-addon right-addon">
                                        <em class="fa fa-search" href="#" data-bs-toggle="modal" data-bs-target="#attach-user-selection"></em>
                                        <input class="form-control full-collapse-horizontal" type="text" value="" (input)="onSearch('name', $event)" placeholder="Search Name">
                                    </div>
                                </td>
                                <td>
                                    <div class="inner-addon right-addon">
                                        <em class="fa fa-search" href="#" data-bs-toggle="modal" data-bs-target="#attach-user-selection"></em>
                                        <input class="form-control full-collapse-horizontal" type="text" value="" (input)="onSearch('description', $event)" placeholder="Search Description">
                                    </div>
                                </td>
                                <td></td>
                            </tr>
                        </thead>
                        <tbody *ngIf="dsdsActionGols$ | async; let dsdsActionGolsList">
                            <tr *ngFor="let data of dsdsActionGolsList">
                                <td>{{data.name}}</td>
                                <td>{{data.description}}</td>
                                <td>
                                    <span data-bs-toggle="tooltip" data-bs-placement="top" title="" class="mrg-rht10" data-original-title="Edit">
                                        <a href="#" data-bs-toggle="modal" data-bs-target="#myModal-dsds-action-goals-add-edit" (click)="editActionGoal(data)">
                                            <img src="assets/images/form-letter/edit-icon.png" alt="">
                                        </a>
                                    </span>
                                    <span data-bs-toggle="tooltip" data-bs-placement="top" title="" data-original-title="Delete">
                                        <a href="javascript:{}" (click)="confirmDelete(data)">
                                            <img src="assets/images/form-letter/delete-icon.png" alt="">
                                        </a>
                                    </span>
                                </td>
                            </tr>
                            <tr *ngIf="dsdsActionGolsList?.length === 0">
                                <td colspan="2">No records found.</td>
                            </tr>
                        </tbody>
                    </table>
                    <div *ngIf="{ canDisplayPager: canDisplayPager$ | async, totalRecords: totalRecords$ | async } as pagination">
                        <pagination *ngIf="pagination.canDisplayPager" [totalItems]="pagination.totalRecords ?? 0" [(ngModel)]="paginationInfo.pageNumber"
                            (pageChanged)="pageChanged($event)" class="pagination-sm" [boundaryLinks]="true" [maxSize]="10" [itemsPerPage]="paginationInfo.pageSize"></pagination>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<div class="modal fade" id="myModal-dsds-action-goals-add-edit" data-bs-backdrop="static" data-bs-keyboard="false" role="dialog">
    <div class="modal-dialog">
        <div class="modal-content customize-modal">
            <div class="modal-header">
                <button type="button" class="btn-close" data-bs-dismiss="modal">×</button>
                <h4 class="modal-title">{{ addEditLabel }} Activity Goal</h4>
            </div>
            <div class="modal-body">
                <div class="row" [formGroup]="actionGoalsFormGroup">
                    <div class="col-sm-12">
                        <div class="fm-box">
                            <label class="required">Name</label>
                            <div class="fm-box-form col-sm-5">
                                <input type="text" name="name" class="form-control fm-style" placeholder="" formControlName="name">
                                <control-messages [control]="nameControl"></control-messages>
                            </div>
                        </div>
                    </div>
                    <div class="col-sm-12">
                        <div class="fm-box">
                            <label class="required">Description</label>
                            <div class="fm-box-form col-sm-5 fm-narrate">
                                <textarea class="form-control fm-style" name="description" formControlName="description"></textarea>
                                <control-messages [control]="descriptionControl"></control-messages>
                            </div>
                        </div>
                    </div>
                    <div class="col-sm-12 mrg-top25">
                        <div class="pull-right">
                            <button type="button" value="Cancel" class="btn-bg" (click)="clearItem()" name="" data-bs-dismiss="modal">Cancel</button>
                            <button type="button" value="Save" class="btn-pri" (click)="saveItem()" name="" [disabled]="actionGoalsFormGroup.pristine || actionGoalsFormGroup.invalid">Save</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<div class="modal fade custom-modal" id="delete-popup" role="dialog">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="btn-close" data-bs-dismiss="modal">×</button>
                <h4 class="modal-title"> Confirm Delete </h4>
            </div>
            <div class="modal-body">
                <p> Are you sure you want to delete this item? </p>
                <div class="text-end big-bot-space right-mspace-15">
                    <button type="button" value="No" class="btn-bg" name="" data-bs-dismiss="modal"> No </button>
                    <button type="button" value="Yes" class="btn-pri" name="" (click)="deleteItem()"> Yes </button>
                </div>
            </div>
        </div>
    </div>
</div>
