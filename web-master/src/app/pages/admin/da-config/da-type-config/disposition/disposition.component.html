<div id="disposition" role="dialog" data-bs-backdrop="static" data-bs-keyboard="false" role="dialog" style="display: block;">
    <div class="row">
        <form [formGroup]="dispositionsForm" (submit)="saveItem(dispositionsForm.value)">
            <div class="col-sm-12">
                <div class="manage-dispositions">
                    <h5>Manage Disposition:</h5>
                    <div class="col-sm-6">
                        <div class="fm-box full-collapse-horizontal">
                            <label class="required">Status: </label>
                            <div class="fm-box-form select-new">
                                <ng-select formControlName="intakeserreqstatustypeid" [searchable]="true" [clearable]="false">
                                    <ng-option value="">Select</ng-option>
                                    <ng-option *ngFor="let dtdropdown of dispositionStatusDropDownList$ | async | orderBy:'text'" [value]="dtdropdown.value">
                                        {{dtdropdown.text}}
                                    </ng-option>
                                </ng-select>
                            </div>
                        </div>
                    </div>
                    <div class="col-sm-6">
                        <div class="fm-box">
                            <label class="required" style="width:120px;">Disposition Type</label>
                            <div class="fm-box-form select-new">
                                <ng-select #inref formControlName="dispositioncode" [searchable]="true" [clearable]="false" (change)="setDispositionLabel(inref.selectedItems[0])">
                                    <ng-option value="">Select</ng-option>
                                    <ng-option *ngFor="let dtdropdown of dispositionTypeDropDownList$ | async | orderBy:'text'" [value]="dtdropdown.value">
                                        {{dtdropdown.text}}
                                    </ng-option>
                                </ng-select>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="clearfix"></div>
            </div>
            <div class="col-sm-12">
                <div class="pull-right">
                    <button type="submit" [disabled]="dispositionsForm.pristine || dispositionsForm.invalid" class="btn-bg"> ADD</button>
                </div>
                <div class="pull-left" *ngIf="isDjsUser">
                    <label class="control control--radio pull-left">
                        Initial Disposition
                        <input type="radio" value="Init" formControlName="recommendationtype">
                        <div class="control__indicator"></div>
                    </label>
                    <label class="control control--radio pull-left" style="margin-left: 20px">
                        Final Disposition
                        <input type="radio" value="Final" formControlName="recommendationtype">
                        <div class="control__indicator"></div>
                    </label>
                </div>
            </div>
        </form>
        <div class="col-sm-12">
            <div class="table-responsive mrg-top25">
                <table class="table table-striped table-hover icon-action" aria-describedby="disposition">
                    <thead>
                        <tr>
                            <th id="status">Status</th>
                            <th id="disposition">Disposition</th>
                            <th id="actions">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr *ngFor="let disposition of dispositions$ | async">
                            <td>{{disposition.intakeserreqstatustype.description}}</td>
                            <td>{{disposition.description}}</td>
                            <td>
                                <ul class="list-unstyled list-inline mrg-btm0">
                                    <li>
                                        <a (click)="deleteItem(disposition)">
                                            <i class="fa fa-trash" aria-hidden="true"></i>
                                        </a>
                                    </li>
                                </ul>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
