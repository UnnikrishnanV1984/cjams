<div id="user-roles" role="dialog" data-bs-backdrop="static" data-bs-keyboard="false" role="dialog" style="display: block;">
  <div class="row">
    <form [formGroup]="userRolesForm" (submit)="saveItem(userRolesForm.value)">
      <div class="clearfix"></div>
      <div class="col-sm-12">
        <div class="manage-dispositions">
          <h5>Manage User Roles:</h5>
          <div class="col-sm-5">
            <div class="fm-box">
              <label class="required">User Role</label>
              <div class="fm-box-form col-sm-8">
                <ng-select [searchable]="true" [clearable]="false" formControlName="entityroletypekey" name="entityroletypekey">
                  <ng-option value="">Select</ng-option>
                  <ng-option *ngFor="let x of userRolesDropdownList$ | async | orderBy: 'text'" [value]="x.text">
                    {{x.text}}
                  </ng-option>
                </ng-select>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="clearfix"></div>
      <div class=" mrg-top25">
        <div class="col-sm-12">
            <div class="pull-right">
          <button type="submit" class="btn-bg" [disabled]="userRolesForm.pristine || userRolesForm.invalid"> ADD</button>
        </div>
        </div>
      </div>
    </form>
    <div class="col-sm-12">
      <div class="table-responsive mrg-top25">
        <table class="table table-striped table-hover icon-action" aria-describedby="User table">
          <thead>
            <tr>
              <th id="userRoleHeader">User Role</th>
              <th id="actionHeader">Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let user of userRoles$ | async">
              <td>{{user.name}}</td>
              <td>
                <ul class="list-unstyled list-inline mrg-btm0">
                  <li>
                    <a href="javascript:{}" (click)="deleteItem(user)">
                      <i class="fa fa-trash" aria-hidden="true"></i>
                    </a>
                  </li>
                </ul>
              </td>
            </tr>
          </tbody>
          <tbody>
          </tbody>
        </table>
      </div>
    </div>

  </div>
</div>
