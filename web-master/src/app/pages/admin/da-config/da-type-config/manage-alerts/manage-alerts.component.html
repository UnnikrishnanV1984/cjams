<div id="Manage-Alerts" role="dialog" data-bs-backdrop="static" data-bs-keyboard="false" role="dialog" style="display: block;">
    <div class="row">
        <form [formGroup]="manageAlertsForm" (submit)="saveManageAlert(manageAlertsForm.value)">
            <div class="clearfix"></div>
            <div class="col-sm-12">

                <div class="">
                    <h5>Manage Alerts:</h5>

                    <div class="col-sm-6">
                        <div class="fm-box">
                            <label class="required">Alert event: </label>
                            <div class="fm-box-form col-sm-8">
                                <ng-select [searchable]="true" [clearable]="false" formControlName="alerteventkey" name="alerteventkey">
                                    <ng-option value="">Select</ng-option>
                                    <ng-option *ngFor="let x of alertEventDropdownList$ | async | orderBy:'text'" [value]="x.value">
                                        {{x.text}}
                                    </ng-option>
                                </ng-select>
                            </div>
                        </div>
                        <div class="fm-box">
                            <label class="required">Time:</label>
                            <div class="fm-box-form col-sm-8">
                                <input type="number" class="form-control fm-style" formControlName="alerttimeinterval" placeholder="Time">
                            </div>
                        </div>
                    </div>

                    <div class="col-sm-6">
                        <div class="fm-box">
                            <label class="required">Team Type: </label>
                            <div class="fm-box-form col-sm-8">
                                <ng-select #inref formControlName="teamtypekey" name="teamtypekey" (change)="teamRoleType(inref.selectedItems[0])" [searchable]="true" [clearable]="false">
                                    <ng-option value="">Select</ng-option>
                                    <ng-option *ngFor="let item of teamTypedropdownList$ | async | orderBy:'text'" [value]="item.value">
                                        {{item.text}}
                                    </ng-option>
                                </ng-select>
                            </div>
                        </div>
                        <div class="fm-box">
                            <label class="control control--radio" style="width:auto;">
                                Days
                                <input type="radio" value="Days" formControlName="alerttimetype">
                                <div class="control__indicator"></div>
                            </label>

                            <label class="control control--radio col-md-6">
                                Minutes
                                <input type="radio" value="Minutes" formControlName="alerttimetype">
                                <div class="control__indicator"></div>
                            </label>
                        </div>
                    </div>
                </div>
                <div class="clearfix"></div>
            </div>
            <div class="col-sm-12">
                <div class="">
                    <div class="row">
                        <div class="col-md-5 ">
                            <div class="modal-multi">
                                <table class="table" aria-describedby=" alert"><!--/* //NOSONAR */-->
                                    <tbody>
                                        <tr *ngFor="let item of leftItems| orderBy: 'description'">
                                            <td>
                                                <label class="control control--checkbox">
                                                    <input type="checkbox" (change)="selectItem('left', item, $event)">
                                                    <div class="control__indicator"></div>
                                                </label>
                                            </td>
                                            <td>{{item.description}}</td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                        <div class="col-md-2 text-center">
                            <div class="btn-group btn-group-re multi-slt-btn">
                                <button type="button" class="btn-pri" data-bs-target="#groupReason" data-bs-toggle="modal" (click)="selectAll()">
                                    Add All</button>
                                <button type="button" class="btn-pri" data-bs-target="#groupReason" data-bs-toggle="modal" (click)="select()">
                                    Add</button>
                                <button type="button" class="btn-pri mt-15" (click)="unSelect()"> Remove</button>
                                <button type="button" class="btn-pri" data-bs-target="#groupReason" data-bs-toggle="modal" (click)="unSelectAll()">Remove All</button>
                            </div>
                        </div>
                        <div class="col-md-5">
                            <div class="modal-multi">
                                <table class="table" aria-describedby="manage alerts"><!--/* //NOSONAR */-->
                                    <tbody>
                                        <tr *ngFor="let item of rightItems">
                                            <td>
                                                <label class="control control--checkbox">
                                                    <input type="checkbox" (change)="selectItem('right', item, $event)">
                                                    <div class="control__indicator"></div>
                                                </label>
                                            </td>
                                            <td>{{item.description}}</td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-sm-12 pad-vspace">
                <div class="text-end">
                    <button type="submit" [disabled]=" (manageAlertsForm.pristine && manageAlertsForm.invalid) || rightItems.length === 0" class="btn-bg"> ADD</button>
                </div>
            </div>
        </form>
        <div class="col-sm-12">
            <div class="table-responsive ">
                <table class="table table-striped table-hover icon-action" aria-describedby="Event">
                    <thead>
                        <tr>
                            <th id="event-type">Event Type</th>
                            <th id="team-alert">Team Alert</th>
                            <th id="time">Time</th>
                            <th id="time-type">Time Type</th>
                            <th id="action">Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr *ngFor="let item of manageAlert$ | async">
                            <td>{{item.alerteventkey}}</td>
                            <td>{{item.teamtypekey}}</td>
                            <td>{{item.alerttimeinterval}}</td>
                            <td>{{item.alerttimetype}}</td>
                            <td>
                                <ul class="list-unstyled list-inline mrg-btm0">
                                    <li>
                                        <a (click)="deleteItem(item)">
                                            <i class="fa fa-trash" aria-hidden="true"></i>
                                        </a>
                                    </li>
                                </ul>
                            </td>
                        </tr>
                    </tbody>
                    <tbody>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
