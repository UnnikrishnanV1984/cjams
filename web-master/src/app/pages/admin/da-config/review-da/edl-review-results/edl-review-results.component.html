<div role="tabpanel" class="tab-pane" id="edl-review-results">
  <div class="box-grid">
    <div class="row">
      <div class="col-sm-9">
        <h3>EDL Review Results</h3>
      </div>
      <div class="col-sm-3 tab-title-btn">
        <button data-bs-toggle="modal" data-bs-target="#add-edit-edl-review-results" (click)="changeModelLabel('Add Review Result')" class="btn-pri pull-right">
          <em class="fa fa-plus right-sspace"> </em> Add Review Result</button>
      </div>
    </div>
    <div class="row">
      <div class="col-md-12">
        <div class="table-responsive">
          <table class="table table-bordered" sortable-table (sorted)="onSorted($event)" aria-describedby="Add Review Result">
            <thead>
              <tr>
                <th id="nameHeader" sortable-column="name" sort-direction="asc">Name</th>
                <th id="deficiencyHeader">Deficiency</th>
                <th id="editReviewResultHeader">Edit Review Result</th>
                <th id="actionHeader">Action</th>
              </tr>
              <tr>
                <td>
                  <div class="inner-addon right-addon">
                    <em class="fa fa-search" href="#" data-bs-toggle="modal" data-bs-target="#attach-user-selection"></em>
                    <input class="form-control full-collapse-horizontal" type="text" value="" (input)="onSearch('name', $event)" placeholder="Search Name">
                  </div>
                </td>
                <td></td>
                <td></td>
                <td></td>
              </tr>
            </thead>
            <tbody *ngIf="edlReviewResultTypes$ | async; let edlReviewResultsList">
              <tr *ngFor="let edlreviewresult of edlReviewResultsList">
                <td>{{edlreviewresult.name}}</td>
                <td>
                  <label class="control control--checkbox">
                    <input type="checkbox" name="deficiency" id="deficiency" [(ngModel)]="edlreviewresult.deficiency" disabled>
                    <div class="control__indicator"></div>
                  </label>
                </td>
                <td>
                  <span data-bs-toggle="tooltip" data-bs-placement="top" title="Edit" class="mrg-rht10">
                    <a (click)="editItem(edlreviewresult)" data-bs-toggle="modal" data-bs-target="#add-edit-edl-review-results">
                      <img src="assets/images/form-letter/edit-icon.png" alt="">
                    </a>
                  </span>
                </td>
                <td>
                  <span data-bs-toggle="tooltip" data-bs-placement="top" title="Delete">
                    <a (click)="confirmDelete(edlreviewresult)">
                      <img src="assets/images/form-letter/delete-icon.png" alt="">
                    </a>
                  </span>
                </td>
              </tr>
              <tr *ngIf="edlReviewResultsList?.length === 0">
                <td colspan="5">No records found.</td>
              </tr>
            </tbody>
          </table>
          <div *ngIf="{ canDisplayPager: canDisplayPager$ | async, totalRecords: totalRecords$ | async } as pagination">
            <pagination *ngIf="pagination.canDisplayPager" [totalItems]="pagination.totalRecords ?? 0" [(ngModel)]="paginationInfo.pageNumber"
              (pageChanged)="pageChanged($event)" class="pagination-sm" [boundaryLinks]="true" [maxSize]="10" [itemsPerPage]="paginationInfo.pageSize"></pagination>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="modal fade in" id="add-edit-edl-review-results" data-bs-backdrop="static" data-bs-keyboard="false" role="dialog" style="display: none;">
    <div class="modal-dialog">
      <div class="modal-content customize-modal">
        <div class="modal-header">
          <div class="modal-header">
            <button type="button" class="btn-close" data-bs-dismiss="modal">×</button>
            <h4 class="modal-title">{{addEditLabel}}</h4>
          </div>
        </div>
        <form [formGroup]="edlreviewformgroup" class="modal-body">
          <div class="row">
            <div class="col-sm-6 mrg-top25">
              <div class="fm-box">
                <label class="required">Name</label>
                <div class="fm-box-form">
                  <input type="text" maxlength="50" formControlName="name" class="form-control fm-style" placeholder="">
                  <control-messages [control]="nameControl"></control-messages>
                </div>
              </div>
            </div>
            <div class="col-sm-6 mrg-top25">
              <div class="fm-box">
                <label class="control control--checkbox">Deficiency:
                  <input type="checkbox" formControlName="deficiency">
                  <control-messages [control]="deficiencyControl"></control-messages>
                  <div class="control__indicator manual-checkbox-right"></div>
                </label>
              </div>
            </div>
            <div class="col-sm-12 mrg-top25">
              <div class="pull-right">
                <button type="button" value="Cancel" data-bs-dismiss="modal" class="btn-bg" name="">Cancel</button>
                <button type="button" value="Save" class="btn-pri" name="" [disabled]="edlreviewformgroup.pristine || edlreviewformgroup.invalid"
                  (click)="saveItem()">Save</button>
              </div>
            </div>
          </div>
        </form>
      </div>

    </div>

  </div>
</div>

<div class="modal fade custom-modal" id="delete-popup" role="dialog">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <button type="button" class="btn-close" data-bs-dismiss="modal" style="float: right;">×</button>
        <h4 class="modal-title"> Confirm Delete </h4>
      </div>

      <div class="modal-body">
        <p> Are you sure you want to delete this item? </p>

        <div class="text-end big-bot-space right-mspace-15">
          <button type="button" value="No" class="btn-bg" name="" (click)="declineDelete()"> No </button>
          <button type="button" value="Yes" class="btn-pri" name="" (click)="deleteItem()"> Yes </button>
        </div>
      </div>
    </div>
  </div>
</div>
