<div role="tabpanel" class="tab-pane" id="assessment-score-usage">
    <div class="box-grid">
        <div class="row">
            <div class="col-sm-9">
                <h3>Manage Allegation Scoring</h3>
            </div>
            <div class="col-sm-3 tab-title-btn">
                <button data-bs-toggle="modal" data-bs-target="#myModal-assesment-score-add" class="btn-pri" (click)="loadDropdownItems()" >
                    <em class="fa fa-plus right-sspace"></em> Add Score Usage</button>
            </div>
        </div>
        <div class="row">
            <div class="col-md-12">
                <div class="table-responsive">
                    <table class="table table-bordered" sortable-table (sorted)="onSorted($event)" aria-describedby="Assessment score">
                        <thead>
                            <tr>
                                <th id="score-type-header" sortable-column="name" sort-direction="asc">Score Type</th>
                                <th id="assessment-header" sortable-column="assessmentscoretypekey">Assessment(s)</th>
                                <th id="actions-header">Actions</th>
                            </tr>
                            <tr>
                                <td>
                                    <div class="inner-addon right-addon">
                                        <em class="fa fa-search" href="#" data-bs-toggle="modal" data-bs-target="#attach-user-selection"></em>
                                        <input class="form-control full-collapse-horizontal" type="text" (input)="onSearch('name', $event)" value="" placeholder="Search Score Type">
                                    </div>
                                </td>
                                <td>
                                    <div class="inner-addon right-addon">
                                        <em class="fa fa-search" href="#" data-bs-toggle="modal" data-bs-target="#attach-user-selection"></em>
                                        <input class="form-control full-collapse-horizontal" type="text" (input)="onSearch('assessmentscoretypekey', $event)" value=""
                                            placeholder="Search Assessment">
                                    </div>
                                </td>
                                <td></td>
                            </tr>
                        </thead>
                        <tbody *ngIf="scoreUsage$ | async; let AssessmentScoreUsageList">
                            <tr *ngFor="let scoreusage of AssessmentScoreUsageList">
                                <td>{{scoreusage.assessmentscoretypekey}}</td>
                                <td>
                                    <span *ngFor="let assessment of scoreusage.assessmenttemplate ?? []; let isLast=last">{{assessment.name}}{{isLast?'':', '}}</span>
                                </td>
                                <td>
                                    <span data-bs-toggle="tooltip" data-bs-placement="top" title="Edit" class="mrg-rht10">
                                        <a href="javascript:{}" data-bs-toggle="modal" (click)="editItem(scoreusage)" data-bs-target="#myModal-assesment-score-add">
                                            <img src="assets/images/form-letter/edit-icon.png" alt="">
                                        </a>
                                    </span>
                                    <span data-bs-toggle="tooltip" data-bs-placement="top" title="Delete">
                                        <a href="javascript:{}">
                                            <img src="assets/images/form-letter/delete-icon.png" alt="">
                                        </a>
                                    </span>
                                </td>
                            </tr>
                            <tr *ngIf="AssessmentScoreUsageList?.length === 0">
                                <td colspan="3">No records found.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <pagination class="pagination-sm" [totalItems]="(totalRecords$ | async) ?? 0" [(ngModel)]="paginationInfo.pageNumber" (pageChanged)="pageChanged($event)"
                    [boundaryLinks]="true" [maxSize]="10" [itemsPerPage]="paginationInfo.pageSize">
                </pagination>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="myModal-assesment-score-add" role="dialog">
    <div class="modal-dialog modal-lg">
        <form [formGroup]="scoreUsageGroup">
            <div class="modal-content customize-modal">
                <div class="modal-header">
                    <button type="button" class="btn-close" data-bs-dismiss="modal">×</button>
                    <h4 class="modal-title">Activity Category</h4>
                </div>
                <div class="modal-body">

                    <div class="row">
                        <div class="col-sm-6">
                            <div class="fm-box">
                                <label>Name: </label>
                                <div class="fm-box-form">
                                    <select formControlName="assessmentscoretypekey" class="form-select fm-style w-select">
                                        <option value="">Select</option>
                                        <option *ngFor="let dbScoreType of assessmentScoreType$ | async" [value]="dbScoreType.value">
                                            {{dbScoreType.text}}
                                        </option>
                                    </select>
                                </div>
                            </div>
                        </div>
                        <div class="col-sm-6">
                            <div class="fm-box">
                                <label>Status: </label>
                                <div class="fm-box-form">
                                    <select formControlName="assessmentscoringmethodid" class="form-select fm-style w-select">
                                        <option value="">Select</option>
                                        <option *ngFor="let dbScoringmethod of assessmentScoringMethod$ | async" [value]="dbScoringmethod.value">
                                            {{dbScoringmethod.text}}
                                        </option>
                                    </select>
                                </div>
                            </div>
                        </div>

                    </div>
                    <div class="row">
                        <div class="col-sm-12 mrg-top25">
                            <div class="col-md-5 ">
                                <div class="mb-3 multiple-select multi">
                                    <select multiple class="form-select full-collapse-horizontal" formControlName="leftSelectedItems">
                                        <option *ngFor="let item of availableAssessmentTemplate" [style.display]="!item.isSelected ? '' : 'none'" [value]="item.assessmentscoretypekey">{{item.assessmentscoretypekey}}</option>
                                    </select>
                                </div>
                            </div>
                            <div class="col-md-2 text-center">
                                <div class="btn-group btn-group-re multi-slt-btn">
                                    <button type="button" class="btn-pri" data-bs-target="#groupReason" data-bs-toggle="modal" (click)="selectAll()">
                                        Add All</button>
                                    <button type="button" class="btn-pri" data-bs-target="#groupReason" data-bs-toggle="modal" (click)="select()">
                                        Add</button>
                                    <button type="button" class="btn-pri mt-15" (click)="unSelect()"> Remove</button>
                                    <button type="button" class="btn-pri" data-bs-target="#groupReason" data-bs-toggle="modal" (click)="unSelectAll()">Remove All</button>
                                </div>
                            </div>
                            <div class="col-md-5">
                                <div class="mb-3 multiple-select multi">
                                    <select multiple class="form-select full-collapse-horizontal" formControlName="rightSelectedItems">
                                        <option *ngFor="let item of availableAssessmentTemplate" [style.display]="item.isSelected ? '' : 'none'" [value]="item.assessmentscoretypekey">{{item.assessmentscoretypekey}}</option>
                                    </select>
                                </div>
                            </div>

                            <div class="col-sm-12 mrg-top25">
                                <div class="pull-right">
                                    <button type="button" value="Save" (click)="saveItem()" class="btn-pri" name="">Save</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </div>

</div>
