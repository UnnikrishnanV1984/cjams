<div role="tabpanel" class="tab-pane" id="allegation-tasks">
    <div class="box-grid">
        <div class="row">
            <div class="col-sm-9">
                <h3>Manage Allegation Tasks</h3>
            </div>
            <div class="col-sm-3 tab-title-btn">
                <button data-bs-toggle="modal" data-bs-target="#myModal-allegation-task-add" class="btn-pri" (click)="changeModelLabel('Add')">
                    <em class="fa fa-plus right-sspace"> </em> Add Allegation Tasks</button>
            </div>
        </div>
        <div class="row">
            <div class="col-md-12">
                <div class="table-responsive">
                    <table class="table table-bordered" sortable-table (sorted)="onSorted($event)" aria-describedby="allegation table">
                        <thead>
                            <tr>
                                <th id="name-header" sortable-column="name" sort-direction="asc">Name</th>
                                <th id="description-header" sortable-column="description">Description</th>
                                <th id="actions-header">Actions</th>
                            </tr>
                            <tr>
                                <td>
                                    <div class="inner-addon right-addon">
                                        <em class="fa fa-search" href="#" data-bs-toggle="modal" data-bs-target="#attach-user-selection"></em>
                                        <input class="form-control full-collapse-horizontal" type="text" (input)="onSearch('name', $event)" value="" placeholder="Search Name">
                                    </div>
                                </td>
                                <td>
                                    <div class="inner-addon right-addon">
                                        <em class="fa fa-search" href="#" data-bs-toggle="modal" data-bs-target="#attach-user-selection"></em>
                                        <input class="form-control full-collapse-horizontal" type="text" (input)="onSearch('description', $event)" value="" placeholder="Search Description">
                                    </div>
                                </td>
                                <td></td>
                            </tr>

                        </thead>
                        <tbody *ngIf="allegationTasks$ | async; let allegationTasksList">
                            <tr *ngFor="let task of allegationTasksList">
                                <td>{{task.name}}</td>
                                <td>{{task.description}}</td>
                                <td>
                                    <span data-bs-toggle="tooltip" data-bs-placement="top" title="Edit" class="mrg-rht10">
                                        <a href="javascript:void(0);" data-bs-toggle="modal" (click)="editItem(task)" data-bs-target="#myModal-allegation-task-add">
                                            <img src="assets/images/form-letter/edit-icon.png" alt="">
                                        </a>
                                    </span>
                                    <span data-bs-toggle="tooltip" data-bs-placement="top" title="Delete">
                                        <a href="javascript:void(0);" (click)="confirmDelete(task)">
                                            <img src="assets/images/form-letter/delete-icon.png" alt="">
                                        </a>
                                    </span>
                                </td>
                            </tr>
                            <tr *ngIf="allegationTasksList?.length === 0">
                                <td colspan="3">No records found.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div class="col-xs-12 col-12" *ngIf="{ canDisplayPager: canDisplayPager$ | async, totalRecords: totalRecords$ | async } as pagination">
                    <pagination *ngIf="pagination.canDisplayPager" [totalItems]="pagination.totalRecords ?? 0" [(ngModel)]="paginationInfo.pageNumber"
                        (pageChanged)="pageChanged($event)" class="pagination-sm" [boundaryLinks]="true" [maxSize]="10" [itemsPerPage]="paginationInfo.pageSize"></pagination>
                </div>
            </div>
        </div>
    </div>
</div>


<form [formGroup]="tasksForm">
    <div class="modal fade" id="myModal-allegation-task-add" role="dialog">
        <div class="modal-dialog">
            <div class="modal-content customize-modal">
                <div class="modal-header">
                    <button type="button" class="btn-close" data-bs-dismiss="modal">&times;</button>
                    <h4 class="modal-title">{{labelAddEdit}} Allegation Taks</h4>
                </div>
                <div class="modal-body">
                    <div class="row">
                        <div class="col-sm-12">
                            <div class="fm-box">
                                <label class="required">Name</label>
                                <div class="fm-box-form col-sm-5">
                                    <input type="text" class="form-control fm-style" placeholder="" formControlName="name">
                                </div>
                            </div>
                        </div>
                        <div class="col-sm-12">
                            <div class="fm-box">
                                <label class="required">Description:</label>
                                <div class="fm-box-form col-sm-5 fm-narrate">
                                    <textarea class="form-control fm-style" placeholder="Start writing from here.." formControlName="description"></textarea>
                                </div>
                            </div>
                        </div>
                        <div class="col-sm-12 mrg-top25">
                            <div class="pull-right">
                                <button type="button" value="Cancel" class="btn-bg" data-bs-dismiss="modal" name="">Cancel</button>
                                <button type="button" value="Save" class="btn-pri" [disabled]="tasksForm.pristine || tasksForm.invalid" (click)="saveItem()"
                                    name="">Save</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</form>

<div class="modal fade custom-modal" id="delete-popup" role="dialog">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="btn-close" data-bs-dismiss="modal" style="float: right;">×</button>
                <h4 class="modal-title"> Confirm Delete </h4>
            </div>

            <div class="modal-body">
                <p> Are you sure you want to delete this item? </p>

                <div class="text-end big-bot-space right-mspace-15">
                    <button type="button" value="No" class="btn-bg" name="" (click)="declineDelete()"> No </button>
                    <button type="button" value="Yes" class="btn-pri" name="" (click)="deleteItem()"> Yes </button>
                </div>
            </div>
        </div>
    </div>
</div>
