<div role="tabpanel" class="tab-pane active" id="allegation-configuration">
    <div class="box-grid">
        <div class="row">
            <div class="col-sm-9">
                <h3>Add Allegation Assessments</h3>
            </div>
            <div class="col-sm-3 tab-title-btn">
            </div>
        </div>
        <div class="row">
            <div class="col-md-12">
                <div class="">
                    <div class="form-search-person">
                        <div class="row multi customize-modal">
                            <div class="col-md-5 ">
                                <div class="mb-3 multiple-select">
                                    <div class="fm-box">
                                        <p>
                                            <strong></strong>
                                        </p>
                                        <div class="modal-multi">
                                            <table class="table" aria-describedby=" allegation config"><!--/* //NOSONAR */-->
                                                <tbody>
                                                    <tr *ngFor="let item of leftItems| orderBy:'name'">
                                                        <td>
                                                            <label class="control control--checkbox">
                                                                <input type="checkbox" (change)="selectItem('left', item, $event)">
                                                                <div class="control__indicator"></div>
                                                            </label>
                                                        </td>
                                                        <td>{{item.titleheadertext}}</td>
                                                    </tr>
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-2 text-center">
                                <div class="btn-group btn-group-re multi-slt-btn">
                                    <button type="button" class="btn-pri" data-bs-target="#groupReason" data-bs-toggle="modal" (click)="selectAll()">
                                        Add All</button>
                                    <button type="button" class="btn-pri" data-bs-target="#groupReason" data-bs-toggle="modal" (click)="select()">
                                        Add</button>
                                    <button type="button" class="btn-pri mt-15" (click)="unSelect()"> Remove</button>
                                    <button type="button" class="btn-pri" data-bs-target="#groupReason" data-bs-toggle="modal" (click)="unSelectAll()">Remove All</button>
                                </div>
                            </div>
                            <div class="col-md-5">
                                <div class="mb-3 multiple-select">
                                    <div class="fm-box">
                                        <p>
                                            <strong></strong>
                                        </p>
                                        <div class="modal-multi">
                                            <table class="table" aria-describedby="allegation configuration"><!--/* //NOSONAR */-->
                                                <tbody>
                                                    <tr *ngFor="let item of rightItems">
                                                        <td>
                                                            <label class="control control--checkbox">
                                                                <input type="checkbox" (change)="selectItem('right', item, $event)">
                                                                <div class="control__indicator"></div>
                                                            </label>
                                                        </td>
                                                        <td>{{item.titleheadertext}}</td>
                                                    </tr>
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-sm-12 ">
                <div class="pull-right">
                    <button type="button" value="Save" class="btn-pri" [disabled]="rightItems.length === 0" (click)="saveItem()">Save</button>
                </div>
            </div>
        </div>
    </div>
</div>
