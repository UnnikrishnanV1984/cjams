<div class="modal fade in" id="add-edit-da-action-type" data-bs-backdrop="static" data-bs-keyboard="false" role="dialog" style="display: block;">
    <div class="modal-dialog">

        <div class="modal-content customize-modal">
            <div class="modal-header">
                <button type="button" class="btn-close" data-bs-dismiss="modal" [routerLink]="['/pages/admin/general/manage-dsds-action-type']">×</button>
                <h4 class="modal-title" *ngIf="!isEditMode">Add Action Type</h4>
                <h4 class="modal-title" *ngIf="isEditMode">Edit Action Type</h4>
            </div>
            <div class="modal-body">
                <form [formGroup]="formGroup">
                    <div class="row">
                        <div class="col-sm-6">
                            <div class="fm-box">
                                <label class="required" >Action Key</label>
                                <div class="fm-box-form">
                                    <input formControlName="intakeservreqtypekey" class="form-control fm-style">
                                    <control-messages [control]="intakeservreqtypekeyControl"></control-messages>
                                </div>
                            </div>
                        </div>
                        <div class="col-sm-6">
                            <div class="fm-box">
                                <label class="required" >Description:</label>
                                <div class="fm-box-form">
                                    <input formControlName="description" class="form-control fm-style">
                                    <control-messages [control]="descriptionFormGroupControl"></control-messages>
                                </div>
                            </div>
                        </div>
                        <div class="col-sm-12">
                            <div class="pull-left">
                                <button *ngIf="!isEditMode" type="submit" class="btn-pri" (click)="addDaType(formGroup.value)"[disabled]="formGroup.pristine || formGroup.invalid">Add Service Type</button>
                                <button *ngIf="isEditMode" type="submit" class="btn-pri" (click)="addDaType(formGroup.value)"[disabled]="formGroup.pristine || formGroup.invalid">Update Service Type</button>
                            </div>
                        </div>
                    </div>
                </form>

                <div *ngIf="isDepartmentActionAdded || isEditMode">
                    <hr/>
                    <form [formGroup]="daSubTypeFormGroup">
                        <div class="row">
                            <div class="col-sm-6">
                                <div class="fm-box">
                                    <label class="required" >Action SubType</label>
                                    <div class="fm-box-form">
                                        <input formControlName="classkey" id="classkey" class="form-control fm-style">
                                        <control-messages [control]="classkeyControl"></control-messages>
                                    </div>
                                </div>
                            </div>
                            <div class="col-sm-6">
                                <div class="fm-box">
                                    <label class="required" >Description:</label>
                                    <div class="fm-box-form">
                                        <input formControlName="description" id="description" class="form-control fm-style">
                                        <control-messages [control]="descriptionControl"></control-messages>
                                    </div>
                                </div>
                            </div>
                            <div class="col-sm-12">
                                <div class="pull-left">
                                    <button (click)="saveDaSubType(daSubTypeFormGroup.value)" [disabled]="daSubTypeFormGroup.pristine || daSubTypeFormGroup.invalid"
                                        class="btn-pri">Add Sub Type</button>
                                </div>
                            </div>
                        </div>
                    </form>
                    <div class="row">
                        <div class="col-sm-12">
                            <div class="table-responsive mrg-top25">
                                <table class="table table-striped table-hover" aria-describedby="Add sub type">
                                    <thead>
                                        <tr>
                                            <th id="actionSubtypesHeaders">Action Subtypes</th>
                                            <th id="descriptionHeaders">Description</th>
                                            <th id="actionsHeader">Actions</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr *ngFor="let data of daActionSubtypes">
                                            <td>{{data.classkey}}</td>
                                            <td>{{data.description}}</td>
                                            <td>
                                                <ul class="list-unstyled list-inline mrg-btm0">
                                                    <li>
                                                        <a href="javascript:{}" (click)="editDaSubType(data)">
                                                            <i class="fa fa-pencil" aria-hidden="true"></i>
                                                        </a>
                                                    </li>
                                                    <li>
                                                        <a href="javascript:{}" (click)="confirmDelete(data)">
                                                            <i class="fa fa-trash" aria-hidden="true"></i>
                                                        </a>
                                                    </li>
                                                </ul>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        <div class="col-sm-12 mrg-top25">
                            <div class="pull-right">
                                <button type="button" value="Cancel" class="btn-bg" [routerLink]="['/pages/admin/general/manage-dsds-action-type']"
                                    data-bs-dismiss="modal">Close</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<div class="modal fade custom-modal" id="delete-popup" role="dialog">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="btn-close" data-bs-dismiss="modal">×</button>
                <h4 class="modal-title"> Confirm Delete </h4>
            </div>

            <div class="modal-body">
                <p> Are you sure you want to delete this item? </p>

                <div class="text-end big-bot-space right-mspace-15">
                    <button type="button" value="No" class="btn-bg" name="" (click)="declineDelete()"> No </button>
                    <button type="button" value="Yes" class="btn-pri" name="" (click)="deleteItem()"> Yes </button>
                </div>
            </div>
        </div>
    </div>
</div>
