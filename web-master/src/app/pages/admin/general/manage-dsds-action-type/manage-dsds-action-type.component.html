<div class="box-grid">
    <div class="row">
        <div class="col-sm-9">
            <h3>Manage Action Type</h3>
        </div>
        <div class="col-sm-3">
            <div class="tab-title-btn">
                <button [routerLink]="['/pages/admin/general/manage-dsds-action-type/add-edit-da-action-type', 0]" class="btn-pri">+ Add New </button>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col-md-12">
            <div class="table-responsive">
                <table class="table table-bordered" sortable-table (sorted)="onSorted($event)" aria-describedby="Manage action type">
                    <thead>
                        <tr>
                            <th id="actionTypeHeader" sortable-column="intakeservreqtypekey" sort-direction="asc"> Action Type</th>
                            <th id="descriptionHeader" sortable-column="description">Description</th>
                            <th id="actionsHeader">Actions</th>
                        </tr>
                        <tr>
                            <td>
                                <div class="inner-addon right-addon">
                                    <em class="fa fa-search" href="#" data-bs-toggle="modal" data-bs-target="#attach-user-selection"></em>
                                    <input class="form-control full-collapse-horizontal" type="text" value="" (input)="onSearch('intakeservreqtypekey', $event)"
                                        placeholder="Search Name">
                                </div>
                            </td>
                            <td>
                                <div class="inner-addon right-addon">
                                    <em class="fa fa-search" href="#" data-bs-toggle="modal" data-bs-target="#attach-user-selection"></em>
                                    <input class="form-control full-collapse-horizontal" type="text" value="" (input)="onSearch('description', $event)" placeholder="Search Description">
                                </div>
                            </td>
                            <td></td>
                        </tr>
                    </thead>
                    <tbody *ngIf="manageDAActions$ | async; let manageDAActions">
                        <tr *ngFor="let data of manageDAActions">
                            <td>{{data.intakeservreqtypekey}}</td>
                            <td>{{data.description}}</td>
                            <td>
                                <ul class="list-unstyled list-inline mrg-btm0">
                                    <li>
                                        <a [routerLink]="['/pages/admin/general/manage-dsds-action-type/add-edit-da-action-type', data.intakeservreqtypeid]">
                                            <i class="fa fa-pencil" aria-hidden="true"></i>
                                        </a>
                                    </li>
                                    <li>
                                        <a (click)="confirmDelete(data)" data-bs-toggle="modal">
                                            <i class="fa fa-trash" aria-hidden="true"></i>
                                        </a>
                                    </li>
                                </ul>
                            </td>
                        </tr>
                        <tr *ngIf="manageDAActions?.length === 0">
                            <td colspan="3">No records found.</td>
                        </tr>
                    </tbody>
                </table>
                <div *ngIf="{ canDisplayPager: canDisplayPager$ | async, totalRecords: totalRecords$ | async } as pagination">
                <pagination *ngIf="pagination.canDisplayPager" [totalItems]="pagination.totalRecords ?? 0" [(ngModel)]="paginationInfo.pageNumber" (pageChanged)="pageChanged($event)"
                    class="pagination-sm" [boundaryLinks]="true" [maxSize]="10" [itemsPerPage]="paginationInfo.pageSize">
                </pagination>
                </div>
            </div>
        </div>
    </div>
</div>
<div id="add-edit-da-action-type-popup">
    <router-outlet></router-outlet>
    <div class="modal fade custom-modal" id="delete-popup" role="dialog">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="btn-close" data-bs-dismiss="modal">×</button>
                    <h4 class="modal-title"> Confirm Delete </h4>
                </div>

                <div class="modal-body">
                    <p> Are you sure you want to delete this item? </p>

                    <div class="text-end big-bot-space right-mspace-15">
                        <button type="button" value="No" class="btn-bg" name="" data-bs-dismiss="modal"> No </button>
                        <button type="button" value="Yes" class="btn-pri" name="" (click)="deleteItem()"> Yes </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
