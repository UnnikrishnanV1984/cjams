<general-master-catalogue 
    (catelogSaved)="saveItem($event)" 
    (catelogDeleted)="deleteItem($event)" 
    (pageChanged)="pageChanged($event)" 
    (onSort)="onSort($event)"
    (onSearch)="onSearch($event)"
    [formGroup]="formGroup" 
    [totalRecords]="totalRecords$" 
    [paginationInfo]="paginationInfo" 
    [componentConfig]="addressTypeConfig"
    [catelogList]="addressTypes$"
    [canDisplayPager$] = "canDisplayPager$">
</general-master-catalogue>
