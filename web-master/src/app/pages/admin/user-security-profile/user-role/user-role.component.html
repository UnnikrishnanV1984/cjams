<div id="roles">
    <div class="row m-t-10">
        <div class="col-md-12 col-xs-12 col-sm-12">
            <div [formGroup]="addUserRoleForm">
                <div class="row">
                    <div class="col-sm-12">
                        <h3>Add New Roles</h3>
                    </div>
                </div>
                <div class="row">
                    <div class="col-sm-4">
                        <mat-form-field>
                            <mat-label>Role Name</mat-label>
                            <input formControlName="rolename" matInput placeholder="">
                        </mat-form-field>
                    </div>
                    <div class="col-sm-4">
                        <mat-form-field>
                            <mat-label>Role Description</mat-label>
                            <input formControlName="description" matInput placeholder="">
                        </mat-form-field>
                    </div>
                    <div class="col-sm-4">
                        <mat-form-field>
                            <mat-label>Agency</mat-label>
                            <mat-select formControlName="Agency" required>
                                <mat-option *ngFor="let item of (intakeAgencies$ | async)" [value]="item.value">
                                    {{ item.text }}</mat-option>
                            </mat-select>
                        </mat-form-field>
                    </div>
                    <div class="col-sm-4">
                        <mat-form-field>
                            <mat-label>Role Type</mat-label>
                            <mat-select formControlName="roletypecode" required>
                                <mat-option *ngFor="let item of (rolesDropdownItems$ | async)" [value]="item.value">
                                    {{ item.text }}</mat-option>
                            </mat-select>
                        </mat-form-field>
                    </div>
                    <div class="col-sm-4">
                        <mat-form-field>
                            <mat-label>Open Am Role</mat-label>
                            <input formControlName="openamrole" matInput placeholder="">
                        </mat-form-field>
                    </div>
                    <div class="col-sm-2 m-t-30">
                        <mat-checkbox (change)="isSuperVisible()">Supervisor</mat-checkbox>
                    </div>
                    <div class="col-sm-2 text-end m-t-30">
                        <button class="btn-pri" (click)="addRole()"
                            [disabled]="addUserRoleForm.pristine || addUserRoleForm.invalid">Add</button>
                    </div>
                </div>
            </div>
        </div>
        <section class="mrg-top25">
            <div class="box-grid pt-0">
                <div class="row">
                    <div class="col-sm-3 m-t-30">
                        <div class="table-responsive m-height">
                            <table class="table table-bordered icon-action group-role-tbl" sortable-table=""  aria-describedby="Role List">
                                <thead>
                                    <th id="roleNameHeader">Role Name
                                        <div class="inner-addon right-addon">
                                            <em class="fa fa-search" href="#"></em>
                                            <input class="form-control" type="text" [formControl]="rolegroupfilterText"  placeholder="Search" />
                                        </div>
                                    </th>
                                    <th id="actionsHeader">Actions</th>
                                </thead>
                                <tbody>
                                    <tr *ngFor="let role of userRole; let i = index"
                                        [class]="role.isSelected ? 'selected' : ''">
                                        <td (click)="editPermissionGroup(role, i)">{{ role.description }}</td>
                                        <td>
                                            <span data-bs-toggle="tooltip" data-bs-placement="top" title=""
                                                data-original-title="Delete">
                                                <a href="javascript:void(0)" (click)="confirmDelete(role)">
                                                    <img src="../../../../../assets/images/form-letter/delete-icon.png"
                                                        alt="" />
                                                </a>
                                            </span>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                    <div class="col-sm-9 m-t-30">
                        <div class="row">
                            <div class="col-sm-4">
                                <div class="card panel-default m-height">
                                    <div class="card-header permissiongrpheader">
                                        <h3 class="card-title">Permission Groups
                                            <div class="inner-addon right-addon">
                                                <em class="fa fa-search" href="#"></em>
                                                <input class="form-control" type="text" [formControl]="permissiongroupfilterText" placeholder="Search" />
                                            </div> 
                                        </h3>
                                    </div>
                                    <div class="card-body" [formGroup]="rolePermissionForm">
                                        <section class="rolesec" formArrayName="rolePermissionFormArray">
                                            <ul class="list-unstyled">
                                                <li *ngFor="let data of getRolePermissionFormData('rolePermissionFormArray'); let i = index"
                                                    [formGroupName]="i">
                                                    <mat-checkbox formControlName="isSelected">
                                                        {{ data.get('permissiongroupname').value }}</mat-checkbox>
                                                </li>
                                            </ul>
                                        </section>
                                    </div>
                                </div>
                            </div>
                            <div class="col-sm-8 text-end">
                                <button class="btn btn-pri" (click)="updateRoles()">Save</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>
    <div class="modal fade custom-modal" id="delete-alias-popup" role="dialog">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="btn-close" data-bs-dismiss="modal">×</button>
                    <h4 class="modal-title">Confirm Delete</h4>
                </div>
                <div class="modal-body">
                    <p>Are you sure you want to delete this Rolename?</p>
                    <div class="text-end big-bot-space right-mspace-15">
                        <button type="button" value="No" class="btn-pri" name="" data-bs-dismiss="modal">No</button>
                        <button type="button" value="Yes" class="btn-pri" name=""
                            (click)="deleteRoleName()">Yes</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
