<div class="col-md-3">
  <div class="team_manage">
    <ul>
      <li (click)="onSelected(null, 1, true)" [class]="selectedIndex === null ? 'active': ''">
        Common
      </li>
      <li *ngFor="let item of teamTreeview$ | async; let i = index" (click)="onSelected(item.name, 1, true)"
        [class]="selectedIndex === item.name ? 'active': ''">
        {{item.name}}
      </li>
    </ul>
  </div>

</div>
