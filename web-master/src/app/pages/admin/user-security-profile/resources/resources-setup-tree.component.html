<div class="col-md-3">
    <div class="team_manage">
    <ul>
            <li  (click)="onSelected(null, 1, 10, true)" [class]="selectedIndex === null ? 'active': ''">
                Common
            </li>
        <li *ngFor="let item of teamTreeview$ | async; let i = index" (click)="onSelected(item.id, 1, 10, true, i)" [class]="selectedIndex === item.id ? 'active': ''">
         {{item.name}}
        </li>
    </ul>
    </div>

</div>
