<div class="form-letter-tab form-align">
  <div class="row">
    <div class="col-sm-9">
      <h3>Manage User Security Profile</h3>
    </div>
    <div class="col-sm-3 tab-title-btn">
    </div>
  </div>
  <div class="row">
    <div class="col-xs-12">
      <div class="table-responsive table-theme">
        <table class="table table-bordered table-striped icon-action" sortable-table (sorted)="onSorted($event)" aria-describedby="profile details">
          <thead>
            <tr>
              <th id="user-name" sortable-column="displayname" sort-direction="asc" style="min-width: 130px;">User Name</th>
              <th id="gender" sortable-column="gender" style="min-width: 75px;">Gender</th>
              <th id="email" sortable-column="email">Email</th>
              <th id="county" sortable-column="county" style="min-width: 120px;">County</th>
              <th id="zipcode" sortable-column="zipcode" style="min-width: 130px;">Zipcode</th>
              <th id="team" sortable-column="team" style="min-width: 100px;">Team</th>
              <th id="role" sortable-column="role" style="min-width: 100px;">Role</th>
              <th id="action">Action</th>
            </tr>

            <tr>
              <td>
                <div class="inner-addon right-addon">
                  <em class="fa fa-search" href="#" data-bs-toggle="modal" data-bs-target="#attach-user-selection"></em>
                  <input class="form-control full-collapse-horizontal" type="text"
                    (input)="onSearch('displayname', $event)" value="" placeholder="Name">
                </div>
              </td>
              <td>
                <div class="inner-addon right-addon">
                  <em class="fa fa-search" href="#" data-bs-toggle="modal" data-bs-target="#attach-user-selection"></em>
                  <input class="form-control full-collapse-horizontal" type="text" (input)="onGenderSearch('gender', $event)"
                    value="" placeholder="Gender">
                </div>
              </td>
              <td>
                <div class="inner-addon right-addon">
                  <em class="fa fa-search" href="#" data-bs-toggle="modal" data-bs-target="#attach-user-selection"></em>
                  <input class="form-control full-collapse-horizontal" type="text" (input)="onSearch('email', $event)"
                    value="" placeholder="Email">
                </div>
              </td>
              <td>
                <div class="inner-addon right-addon">
                  <em class="fa fa-search" href="#" data-bs-toggle="modal" data-bs-target="#attach-user-selection"></em>
                  <input class="form-control full-collapse-horizontal" type="text" (input)="onSearch('county', $event)"
                    value="" placeholder="County">
                </div>
              </td>
              <td>
                <div class="inner-addon right-addon">
                  <em class="fa fa-search" href="#" data-bs-toggle="modal" data-bs-target="#attach-user-selection"></em>
                  <input class="form-control full-collapse-horizontal" type="text" (input)="onSearch('zipcode', $event)"
                    value="" placeholder="Zip Code">
                </div>
              </td>
              <td>
                <div class="inner-addon right-addon">
                  <em class="fa fa-search" href="#" data-bs-toggle="modal" data-bs-target="#attach-user-selection"></em>
                  <input class="form-control full-collapse-horizontal" type="text" (input)="onSearch('teamname', $event)"
                    value="" placeholder="Team Name">
                </div>
              </td>
              <td>
                <div class="inner-addon right-addon">
                  <em class="fa fa-search" href="#" data-bs-toggle="modal" data-bs-target="#attach-user-selection"></em>
                  <input class="form-control full-collapse-horizontal" type="text" (input)="onSearch('role', $event)"
                    value="" placeholder="Role">
                </div>
              </td>

              <td></td>
            </tr>
          </thead>
          <tbody *ngIf="usersList$ | async; let usersList">
            <tr *ngFor="let item of usersList">
              <td>{{item?.displayname}}</td>
              <td>{{item?.gender}}</td>
              <td>{{item?.email}}</td>
              <td>{{item?.county}}</td>
              <td>{{item?.zipcode}}</td>
              <td>{{item?.teamname}}</td>
              <td>{{item?.role}}</td>
              <td>
                <span data-bs-toggle="tooltip" data-bs-placement="top" title="Edit" class="mrg-rht10"
                  data-original-title="Edit">
                  <a
                    [routerLink]="['/pages/admin/user-security-profile/manage-user-security/add-edit-user-security-profile', item.id,item.teamid]">
                    <img src="assets/images/form-letter/edit-icon.png" alt="">
                  </a>
                </span>
              </td>
            </tr>
            <tr *ngIf="usersList?.length === 0">
              <td colspan="8">No records found.</td>
            </tr>
          </tbody>
        </table>
      </div>
      <div>
        <div *ngIf="{ canDisplayPager: canDisplayPager$ | async, totalRecords: totalRecords$ | async } as pagination">
          <pagination *ngIf="pagination.canDisplayPager" [totalItems]="pagination.totalRecords ?? 0"
            [(ngModel)]="paginationInfo.pageNumber" (pageChanged)="pageChanged($event)" class="pagination-sm"
            [boundaryLinks]="true" [maxSize]="10" [itemsPerPage]="paginationInfo.pageSize"></pagination>
        </div>
      </div>
    </div>
  </div>
  <div role="tabpanel" class="tab-pane" id="add-edit-user-security-profile-popup">
    <router-outlet></router-outlet>
  </div>
</div>
