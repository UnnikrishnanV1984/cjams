<div class="modal fade" id="add-newusers-popup" role="dialog" role="dialog" data-bs-backdrop="static" data-bs-keyboard="false" style="display: block;">
  <div class="modal-dialog modal-lg">
    <!-- Allegation Configuration - Modal content-->
    <div class="modal-content customize-modal">
      <div class="modal-header">
        <button type="button" class="btn-close" data-bs-dismiss="modal" (click)="closeUserProfile()">×</button>
        <h4 class="modal-title">{{ isAddMode ? 'Add New User' : 'Update User Detail'}}</h4>
      </div>
      <div class="modal-body">
        <div class="row">
          <div class="col-sm-12 form-letter-tab mrg-top0">
            <ul class="nav nav-tabs tab-bg" role="tablist">
              <li role="presentation" class="active">
                <a href="#add-user-profile" aria-controls="add-user-profile" role="tab" data-bs-toggle="tab">User Profile</a>
              </li>
              <li id="userroles" role="presentation">
                <a href="#add-security-roles" aria-controls="add-security-roles" data-bs-toggle="tab" role="tab">Security Credential</a>
              </li>
              <li id="rolesposition" role="presentation" *ngIf="!isAddMode">
                <a href="#roles-and-position" aria-controls="roles-and-position" data-bs-toggle="tab" role="tab">Role and Permissions</a>
              </li>
              <li id="updateSupervisor" role="presentation" *ngIf="!isAddMode">
                <a href="#updateSupervisor-Id" aria-controls="roles-and-position" data-bs-toggle="tab" role="tab">Update Supervisor</a>
              </li>
            </ul>
            <div class="tab-content mrg-top25">

              <div class="tab-pane active" id="add-user-profile">
                <user-profile [id]="sUserid" [emailSubject]="emailSubject" [userRoles]="editUserRoles" [positionTeammember$]='positionTeammember$'></user-profile>
              </div>

              <div class="tab-pane" id="add-security-roles">
                <roles-login-details [id]="sUserid" [emailSubject]="emailSubject" [userRoles]="editUserRoles" [positionTeammember$]='positionTeammember$'></roles-login-details>
              </div>

              <div class="tab-pane" id="roles-and-position">
                <roles-and-position [userRoles]="editUserRoles"></roles-and-position>
              </div>

              <div class="tab-pane" id="updateSupervisor-Id">
                <supervisor-user [id]="securityusersid"></supervisor-user>
              </div>

            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
