<div class=" col-md-12">

    <div class="content-area-fm">
        <div class="row">
            <h4 class="title">{{componentConfig.BlockTitle}}</h4>
        </div>
        <div class="row">
            <form [formGroup]="formGroup" (submit)="saveCatelog()">
                <div class="col-sm-12">
                    <div class="row mrg-top25">
                        <div class="col-sm-6">
                            <div class="fm-box">
                                <label class="required">{{componentConfig.LabelNameTitle}}:</label>
                                <div class="fm-box-form col-sm-6">
                                    <input formControlName="name" id="name" class="form-control fm-style" />
                                    <control-messages [control]="nameControl"></control-messages>
                                </div>
                            </div>
                        </div>
                        <div class="col-sm-6" *ngIf="isDescriptionFieldRequired">
                            <div class="fm-box">
                                <label class="required">{{componentConfig.LabelDescriptionTitle}}:</label>
                                <div class="fm-box-form col-sm-6">
                                    <input formControlName="description" id="description" class="form-control fm-style" />
                                    <control-messages [control]="descriptionControl"></control-messages>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-sm-12">
                            <div class="pull-right">
                                <button type="button" (click)="clearCatelog()" class="btn-bg">Clear</button>
                                <button type="submit" class="btn-pri" [disabled]="formGroup.pristine || formGroup.invalid">Save</button>
                            </div>
                        </div>
                    </div>
                </div>
            </form>
        </div>
        <div class="row">
            <div class="" style="position: relative">
                <div class="table-responsive mrg-top25">
                    <table class="table table-striped table-hover table-bordered" sortable-table (sorted)="onSorted($event)" aria-describedby="table">
                        <thead>
                            <tr>
                                <th id="name-header" sortable-column="name" sort-direction="asc"> {{componentConfig.TableHeaderName}}</th>
                                  <th id="description-header" sortable-column="description" *ngIf="isDescriptionFieldRequired"> {{componentConfig.TableHeaderDescription}}</th>
                                <th id="actions-header">Actions</th>
                            </tr>
                            <tr>
                                <td>
                                    <div class="inner-addon right-addon">
                                        <em class="fa fa-search" href="#" data-bs-toggle="modal" data-bs-target="#attach-user-selection"></em>
                                        <input class="form-control full-collapse-horizontal" type="text" (input)="onSearched('name', $event)" placeholder="Search {{componentConfig.TableHeaderName}}">
                                    </div>
                                </td>
                                <td *ngIf="isDescriptionFieldRequired">
                                    <div class="inner-addon right-addon">
                                        <em class="fa fa-search" href="#" data-bs-toggle="modal" data-bs-target="#attach-user-selection"></em>
                                        <input class="form-control full-collapse-horizontal" type="text" (input)="onSearched('description', $event)" value="" placeholder="Search Description">
                                    </div>
                                </td>
                                <td></td>
                            </tr>
                        </thead>
                        <tbody *ngIf="catelogList | async; let catList">
                            <tr *ngFor="let data of catList">
                                <td>{{data.name}}</td>
                                <td *ngIf="isDescriptionFieldRequired">{{data.description}}</td>
                                <td>
                                    <ul class="list-unstyled list-inline mrg-btm0">
                                        <li>
                                            <a href="javascript:{}" (click)="editCatelog(data)">
                                                <i class="fa fa-pencil" aria-hidden="true"></i>
                                            </a>
                                        </li>
                                        <li>
                                            <a href="javascript:{}" (click)="deleteCatelog(data)">
                                                <i class="fa fa-trash" aria-hidden="true"></i>
                                            </a>
                                        </li>
                                    </ul>
                                </td>
                            </tr>
                            <tr *ngIf="catList?.length === 0">
                                <td colspan="3">No records found.</td>
                            </tr>
                        </tbody>
                    </table>
                    <div *ngIf="{ canDisplayPager: canDisplayPager$ | async, totalRecord: totalRecords | async } as pagination">
                    <pagination *ngIf="pagination.canDisplayPager" [totalItems]="pagination.totalRecord ?? 0" [(ngModel)]="paginationInfo.pageNumber" (pageChanged)="changePage($event)"
                        class="pagination-sm" [boundaryLinks]="true" [maxSize]="10" [itemsPerPage]="paginationInfo.pageSize"></pagination>
                    </div>
                </div>
            </div>
        </div>

    </div>

</div>
