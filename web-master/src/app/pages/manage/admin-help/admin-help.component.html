<div class="container-fluid">
    <div class="box-grid">
        <div class="row">
            <div class="col-sm-9">
                <h3> Admin Module -Help </h3>
            </div>
            <div class="col-sm-3">
                <div class="tab-popup-button text-end">
                    <button data-bs-toggle="modal" data-bs-target="#myModal-add-edit-events" (click)="showAddEdit('Add')" class="btn-pri">
                        <em class="fa fa-plus right-sspace"> </em>Add</button>
                </div>
            </div>
        </div>

        <div class="table-responsive help-documents-tab">
            <table class="table table-bordered" sortable-table (sorted)="onSorted($event)" aria-describedby="Documents">
                <thead>
                    <tr>
                        <th id="select-all"> Select All </th>  
                        <th id="file-name" sortable-column="name" sort-direction="asc">File Name </th>
                        <th id="category" sortable-column="category"> Category </th>
                        <th id="subcategory" sortable-column="subcategory"> Subcategory </th>
                        <th id="uploaded-on"> Uploaded On </th>
                        <th id="updated-by"> Updated By </th>
                        <th id="action"> Action </th>                      
                    </tr>                   
                </thead>
                <tbody *ngIf="helpDocumentsList.length > 0">
                    <tr *ngFor="let item of helpDocumentsList">                        
                        <td> <input type="checkbox"> </td>
                        <td> {{item.filename}} </td>                        
                        <td> {{item.category}} </td>
                        <td> {{item.subcategory}} </td>
                        <td> {{ item.updatedon | date : 'MM/dd/yyyy'}} </td>
                        <td> </td>
                        <td>
                            <span data-bs-toggle="tooltip" data-bs-placement="top" title="Edit" class="mrg-rht10">
                                <a (click)="editEvent(item)" data-bs-toggle="modal" data-bs-target="#myModal-add-edit-events">
                                    <img src="assets/images/form-letter/edit-icon.png" alt="">
                                </a>
                            </span>
                            <span data-bs-toggle="tooltip" data-bs-placement="top" title="Delete">
                                <a (click)="confirmDelete(item)">
                                    <img src="assets/images/form-letter/delete-icon.png" alt="">
                                </a>
                            </span>
                        </td>
                    </tr>
                    <tr *ngIf="helpEvents?.length === 0">
                        <td colspan="6">No records found.</td>
                    </tr>

                </tbody>
            </table>
            <div *ngIf="{ canDisplayPager: canDisplayPager$ | async, totalRecords: totalRecords$ | async } as pagination">
                <pagination *ngIf="pagination.canDisplayPager" [totalItems]="pagination.totalRecords ?? 0" [(ngModel)]="paginationInfo.pageNumber"
                    (pageChanged)="pageChanged($event)" class="pagination-sm" [boundaryLinks]="true" [maxSize]="10" [itemsPerPage]="paginationInfo.pageSize"></pagination>
            </div>
        </div>
    </div>
</div>

<div class="modal fade in" data-bs-backdrop="static" data-bs-keyboard="false" id="myModal-add-edit-events" role="dialog">
    <div class="modal-dialog">
        <div class="modal-content customize-modal">
            <div class="modal-header">
                <h4 class="modal-title">Help -Add</h4>
                <button type="button" class="btn-close close pull-right" data-bs-dismiss="modal" (click)="cancelEvent()"></button>
            </div>
            <form [formGroup]="helpDocumentsForm" (submit)="(saveButton) ? updateEvent(helpDocumentsForm.value) :saveEvent(helpDocumentsForm.value)">
                <div class="modal-body dd-overflow-inherit">
                    <div class="">                      
                        <div class="row">                          
                            <div class="col-sm-10">
                                <div class="row">
                                    <div class="col-sm-4 bot-mspace-15">
                                        <label class="required">File Name: </label>
                                    </div>
                                    <div class="col-sm-8 bot-mspace-15">
                                        <input type="text" formControlName="filename" maxlength="30" name="filename" class="form-control" />
                                    </div> 
                                </div>
                            </div>
                        </div>
                        <div class="row">                          
                            <div class="col-sm-10">
                                <div class="row">
                                    <div class="col-sm-4 bot-mspace-15">
                                        <label class="required">File Title: </label>
                                    </div>
                                    <div class="col-sm-8 bot-mspace-15">
                                        <input type="text" formControlName="title" maxlength="30" name="title" class="form-control" />
                                    </div> 
                                </div>
                            </div>
                        </div>
                        <div class="row">                          
                            <div class="col-sm-10">
                                <div class="row">
                                    <div class="col-sm-4 bot-mspace-15">
                                        <label class="required">File Category: </label>
                                    </div>
                                    <div class="col-sm-8 bot-mspace-15">
                                        <div class="select-icon">
                                            <select formControlName="category" name="category" class="form-select">
                                              <option value="releasenotes">Release Notes</option>
                                              <option value="howtos">How To's</option>
                                              <option value="references">References</option>
                                            </select>
                                        </div>
                                    </div> 
                                </div>
                            </div>
                        </div>
                        <div class="row">                          
                            <div class="col-sm-10">
                                <div class="row">
                                    <div class="col-sm-4 bot-mspace-15">
                                        <label class="required">File Sub-Category: </label>
                                    </div>
                                    <div class="col-sm-8 bot-mspace-15">
                                        <div class="select-icon">
                                            <select formControlName="subcategory" class="form-select">
                                              <option value="announcements">Announcements</option>
                                              <option value="tipsheet">Tip sheet</option>
                                              <option value="deskreference">Desk Reference</option>
                                              <option value="processguides">Process Guides</option>
                                              <option value="videos">Videos</option>               
                                            </select>
                                        </div>
                                    </div>  
                                </div>
                            </div>
                        </div>  
                        <div class="text-end upload">
                               <input type="file" (ngxf-select)="uploadFile($event)" accept=".mp3,.ogg,.wav,.acc,.flac,.aiff,.mp4,.mov,.avi,.3gp,.wmv,.mpeg-4,.pdf,.txt,.docx,.doc,.xls,.xlsx,.jpeg,.jpg,.png,.ppt,.pptx,.gif,.cr2,.rtf" class="" multiple/> 
                           
                        </div>                     
                    </div>
                    <div class="text-end">
                        <button type="submit" value="Save" class="btn-pri save-btn" name="save">Save</button>
                        <button type="button" value="Cancel" class="btn-bg" data-bs-dismiss="modal" (click)="cancelEvent()" name="cancel">Cancel</button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
<div class="modal fade custom-modal" id="delete-popup" role="dialog">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h4 class="modal-title"> Confirm Delete </h4>
                <button type="button" class="btn-close close pull-right" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">
                <p> Are you sure you want to delete this item? </p>

                <div class="text-end big-bot-space right-mspace-15">
                    <button type="button" value="No" class="btn-bg" name="" (click)="declineDelete()"> No </button>
                    <button type="button" value="Yes" class="btn-pri" name="" (click)="deleteEvent()"> Yes </button>
                </div>
            </div>
        </div>
    </div>
</div>
