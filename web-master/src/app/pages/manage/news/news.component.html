<div class="container-fluid">

    <div class="box-grid">
        <div class="row">
            <div class="col-sm-9">
                <h3> Manage News </h3>
            </div>
            <div class="col-sm-3">
                <div class="tab-popup-button text-end">
                    <button data-bs-toggle="modal" (click)="changeModelLabel('Add')" data-bs-target="#myModal-add-edit-news" class="btn-pri">
                        <em class="fa fa-plus right-sspace"> </em> Add News </button>
                </div>
            </div>
        </div>

        <div class="table-responsive form-letter-tab">
            <table class="table table-bordered icon-action" sortable-table (sorted)="onSorted($event)" aria-describedby="attach user">
                <thead>
                    <tr>
                        <th id="date"> Date </th>
                        <th id="description" sortable-column="longtext"> Description </th>
                        <th id="actions"> Actions </th>
                    </tr>
                    <tr>
                            <td></td>
                            <td>
                              <div class="inner-addon right-addon">
                                <em class="fa fa-search" href="#" data-bs-toggle="modal" data-bs-target="#attach-user-selection"></em>
                                <input class="form-control full-collapse-horizontal" type="text" (input)="onSearch('longtext', $event)" value="" placeholder="Description">
                              </div>
                            </td>
                            <td></td>
                          </tr>
                </thead>

                <tbody *ngIf="manageNews$ | async; let manageNews">
                    <tr *ngFor="let news of manageNews">
                        <td> {{news.effectivedate | date:'MM/dd/yyyy'}} </td>
                        <td> {{news.longtext}} </td>
                        <td>
                            <span data-bs-toggle="tooltip" data-bs-placement="top" title="" class="mrg-rht10" data-original-title="Edit">
                                <a data-bs-toggle="modal" data-bs-target="#myModal-add-edit-news" (click)="editItem(news)">
                                    <img src="assets/images/form-letter/edit-icon.png" alt="">
                                </a>
                            </span>
                            <span data-bs-toggle="tooltip" data-bs-placement="top" title="" data-original-title="Delete">
                                <a (click)="confirmDelete(news)">
                                    <img src="assets/images/form-letter/delete-icon.png" alt="">
                                </a>
                            </span>
                        </td>
                    </tr>
                    <tr *ngIf="manageNews?.length === 0">
                        <td colspan="3">No records found.</td>
                    </tr>
                </tbody>
            </table>
            <div *ngIf="{ canDisplayPager: canDisplayPager$ | async, totalRecords: totalRecords$ | async } as pagination">
            <pagination *ngIf="pagination.canDisplayPager" [totalItems]="pagination.totalRecords ?? 0" [(ngModel)]="paginationInfo.pageNumber" (pageChanged)="pageChanged($event)"
                class="pagination-sm" [boundaryLinks]="true" [maxSize]="10" [itemsPerPage]="paginationInfo.pageSize"></pagination>
            </div>
        </div>
    </div>
</div>


<form [formGroup]="newsForm">
    <div class="modal fade custom-modal" id="myModal-add-edit-news" role="dialog">
        <div class="modal-dialog modal-sm">
            <div class="modal-content">
                <div class="modal-header">
                    <h4 class="modal-title"> {{labelAddEdit}} News </h4>
                    <button type="button" class="btn-close close pull-right" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">
                    <div class="fm-box">
                        <div class="row">
                            <div class="col-sm-4 col-md-3">
                                <label class="required"> Description: </label>
                            </div>
                            <div class="col-sm-8 col-md-9">
                                <div class="fm-box-form">
                                    <textarea class="form-control" placeholder="Enter Description" maxlength="160" formControlName="longtext"></textarea>
                                    <control-messages [control]="getControlByIndexFn('longtext')"></control-messages>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="text-end">
                        <button type="button" value="Cancel" class="btn-bg" data-bs-dismiss="modal" (click)="clearItems()" name="">Cancel</button>
                        <button type="button" value="Save" (click)="saveItem()" class="btn-pri" [disabled]="newsForm.pristine || newsForm.invalid"
                            name="">Save</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</form>
<div class="modal fade custom-modal" id="delete-popup" role="dialog">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h4 class="modal-title"> Confirm Delete </h4>
                <button type="button" class="btn-close close pull-right" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <p> Are you sure you want to delete this item? </p>
                <div class="text-end big-bot-space right-mspace-15">
                    <button type="button" value="No" class="btn-bg" name="" (click)="declineDelete()"> No </button>
                    <button type="button" value="Yes" class="btn-pri" name="" data-bs-dismiss="modal" (click)="deleteItem()"> Yes </button>
                </div>
            </div>
        </div>
    </div>
</div>
