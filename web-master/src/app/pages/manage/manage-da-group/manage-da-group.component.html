<div class="container-fluid">
  <div class="box-grid">
    <div class="row">
      <div class="col-sm-9">
        <h3> Manage DHS Action Group </h3>
      </div>
      <div class="col-sm-3">
        <div class="tab-popup-button text-end">
          <button [routerLink]="['/pages/manage/manage-da-group/add-edit-manage-da-group',0]" class="btn-pri">
            <em class="fa fa-plus right-sspace"> </em> Add DA Group </button>
        </div>
      </div>
    </div>
    <form [formGroup]="manageDAGroupForm">
    <div class="row form-control-size big-top-space">
      <div class="col-sm-3">
        <div class="row textLeft">
          <div class="col-sm-6 col-md-4">
            <label> Group Number: </label>
          </div>
          <div class="col-sm-6 col-md-8">
            <div class="fm-box-form">
              <input type="text" class="form-control" formControlName="groupnumber"/>
            </div>
          </div>
        </div>
      </div>
      <div class="col-sm-3">
        <div class="row textLeft">
          <div class="col-sm-6 col-md-4">
            <label> Created Date: </label>
          </div>
          <div class="col-sm-6 col-md-8">
            <div class="fm-box-form">
              <input class="form-control" placeholder="mm/dd/yyyy" bsDatepicker id="createdDate" type="text" [bsConfig]="bsConfig" formControlName="createdDate"
              >
              <i class="fa fa-calendar" aria-hidden="true"></i>
            </div>
          </div>
        </div>
      </div>
      <div class="col-sm-3">
        <div class="text-start">
          <button class="btn-bg group-serach" name="Search"> Search </button>
        </div>
      </div>
    </div>
  </form>
    <div class="group-serach-result big-top-space hide">
      <h3> Search Results </h3>
      <div class="table-responsive form-letter-tab group-table no-mar">
        <table class="table table-bordered no-mar" aria-describedby="group search">
          <thead>
            <tr>
              <th> </th> <!--/* //NOSONAR */-->
              <th id="number"> Number </th>
              <th id="date-created"> Date Created </th>
            </tr>
          </thead>

          <tbody>
            <tr>
              <td>
                <label class="control control--checkbox no-mar">
                  <input type="checkbox">
                  <div class="control__indicator"></div>
                </label>
              </td>
              <td> G201736300307 </td>
              <td> 12/29/2017 </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
  <div class="box-grid group-block hide">
    <div class="createGroup form-control-size">
      <div class="row textLeft">
        <div class="col-sm-3 col-lg-2">
          <div class="row">
            <div class="col-sm-6 bot-mspace-15">
              <label> Group Id: </label>
            </div>
            <div class="col-sm-6 bot-mspace-15">
              <p class="top-sspace no-mar"> G201736300307 </p>
            </div>
          </div>
        </div>

        <div class="col-sm-3 col-lg-2">
          <div class="row">
            <div class="col-sm-6 bot-mspace-15">
              <label> Group Reason: </label>
            </div>
            <div class="col-sm-6 bot-mspace-15">
              <p class="top-sspace no-mar"> xxxxx </p>
            </div>
          </div>
        </div>

        <div class="col-sm-3 col-lg-2">
          <div class="row">
            <div class="col-sm-6 bot-mspace-15">
              <label> Group Status: </label>
            </div>
            <div class="col-sm-6 bot-mspace-15">
              <p class="top-sspace no-mar"> Open </p>
            </div>
          </div>
        </div>

        <div class="col-sm-3 col-lg-2 col-lg-offset-4">
          <div class="text-end">
            <button type="button" value="" class="btn-bg" name="" data-bs-toggle="modal" data-bs-target="#group-history">
              Grouping History </button>
          </div>
        </div>
      </div>
    </div>

    <div class="big-top-space createGroup-table">
      <div class="table-responsive form-letter-tab group-table">
        <table class="table table-bordered icon-action" aria-describedby="creating group">
          <thead>
            <tr>
              <th id="da-identifier"> DA Identifier </th>
              <th id="service-type"> Service Type </th>
              <th id="subtype"> SubType </th>
              <th id="ra"> RA </th>
              <th id="status"> Status </th>
              <th id="remove"> Remove </th>
            </tr>
          </thead>

          <tbody>
            <tr>
              <td> 201126500084 </td>
              <td> ANE </td>
              <td> Class II </td>
              <td> JAY SCOTT SMITH </td>
              <td> Open </td>
              <td>
                <span data-bs-toggle="tooltip" data-bs-placement="top" title="" data-original-title="Delete">
                  <a href="#" data-bs-toggle="modal" data-bs-target="#delete-popup">
                    <img src="assets/images/form-letter/delete-icon.png" alt="">
                  </a>
                </span>
              </td>
            </tr>
            <tr>
              <td> 201126500087 </td>
              <td> ANE </td>
              <td> Class II </td>
              <td> ALAN W ARNSPERGER </td>
              <td> Open </td>
              <td>
                <span data-bs-toggle="tooltip" data-bs-placement="top" title="" data-original-title="Delete">
                  <a href="#" data-bs-toggle="modal" data-bs-target="#delete-popup">
                    <img src="assets/images/form-letter/delete-icon.png" alt="">
                  </a>
                </span>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <div class="text-end big-bot-space">
        <button type="button" value="" class="btn-bg" name="" data-bs-toggle="modal" data-bs-target="#update-da-group"> Add Agency Action to Group </button>
      </div>
    </div>
  </div>
</div>
<div id="add-edit-da-group-popup" role="dialog">
  <router-outlet></router-outlet>
</div>
