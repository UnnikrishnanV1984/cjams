<div class="col-sm-9 mt-20 mb-20">
    <h5 class="header-4">Name: {{personService.person.firstname }}&nbsp;{{personService.person.lastname }} </h5>
    <h5 class="header-4" ><span *ngIf="agency==='DJS'">Assist PID# - {{personService.person.assistpid }} &nbsp;</span>CJAMS PID# -
        {{personService.person.cjamspid }}</h5>
    <h5 class="header-4">Active Status: {{personActiveStatuses}}</h5>
</div>
<div class="col-sm-3 pull-right mt-20 mb-20">
    <mat-form-field>
        <mat-label>Select Status</mat-label>
        <mat-select placeholder="" [(ngModel)]="personStatus" (selectionChange)="loadTabs()">
            <mat-option [value]="PERSON_ALL_STATUS">ALL</mat-option>
            <mat-option *ngFor="let item of personStatusList" value="{{item.ref_key}}">{{item.description}}</mat-option>
        </mat-select>
    </mat-form-field>
</div>
<div class="person-detail-wrapper">
    <div class="col-sm-12 m-b-20">
        <div class="tab-horizontal">
            <ul class="nav nav-tabs person-cus-tab-section persontabs nav-pills" id="persontabs">
            </ul>
        </div>
    </div>
    <div class="col-sm-12">
        <router-outlet></router-outlet>
    </div>
</div>
