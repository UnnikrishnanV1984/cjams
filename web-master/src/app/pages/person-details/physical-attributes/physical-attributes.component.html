<div class="tab-content no-shadow">
  <div id="legal-action-history" class="tab-pane fade show active">
    <div class="content-pad ">
      <div class="row">
        <div class="col-sm-12">
          <h4>Physical Attributes</h4>
        </div>
      </div>
      <div class="row">
        <div class="col-sm-12 m-t-20">
          <div class="table-responsive table-theme">
            <table class="table table-striped" aria-describedby="tbl-physical-attributes">
              <thead>
                <tr>
                  <th scope="col">Photo</th>
                  <th scope="col">Height</th>
                  <th scope="col">Weight</th>
                  <th scope="col">Tattoo</th>
                  <th scope="col">Physical Marks</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td><img class="img-thumbnail" *ngIf="personService.person.userphoto" [src]="personService.person.userphoto" alt=""></td>
                  <td>{{height}}</td>
                  <td>{{weight}}</td>
                  <td>{{tattoo}}</td>
                  <td>{{physicalMark}}</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
