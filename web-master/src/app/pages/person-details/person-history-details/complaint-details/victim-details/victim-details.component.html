<div class="table-responsive table-theme ">
    <table class="table table-striped" aria-describedby="tbl-victim-details-lst">
      <thead>
        <tr>
          <th scope="col">Victim Name</th>
          <th scope="col" style="width:'150'">Address</th>
          <th scope="col">County</th>
          <th scope="col" style="width:'150'">Phone Number &  Ext</th>
          <th scope="col">State</th>
          <th scope="col">Zip</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let item of victims">
          <td>{{item.firstname}}&nbsp; {{item.lastname}}</td>
          <td>{{item.address}} &nbsp;{{item.address2}}  &nbsp;{{item.city}}</td>
          <td>{{item.county}}</td>
          <td>
            <ng-container *ngFor="let phone of item.phone; let isLast = last;">
                <span>{{phone.phonenumber}}&nbsp;{{phone.phoneextension}} </span>
                <span *ngIf="!isLast">,</span>
            </ng-container>
              </td>
          <td>{{item.state}}</td>
          <td>{{item.zipcode}}</td>
        </tr>
        <tr *ngIf="victims?.length === 0">
            <td colspan="6">No victims found.</td>
        </tr>
      </tbody>
    </table>
  </div>
