<div class="row">
  <div class="col-sm-12">
    <div class="table-responsive table-theme">
      <table class="table table-striped" aria-describedby="tbl-contact-note-lst">
        <thead>
          <tr>
            <th scope="col">Intake #</th>
            <th scope="col">Case #</th>
            <th scope="col">Contact Date</th>
            <th scope="col">Contact type</th>
            <th scope="col">Staff Name</th>
            <th scope="col">Contact Status</th>
            <th scope="col">Location Name </th>
          </tr>
        </thead>
        <tbody>
          <ng-container *ngFor="let item of contactNotes">
            <tr>
              <td>{{item.intakenumber}}</td>
              <td>{{item.servicerequestnumber}}</td>
              <td>{{item.contactdate | date:'MM/dd/yyyy'}}</td>
              <td>{{item.contacttype}}</td>
              <td>{{item.staffname}}</td>
              <td>
                <ng-container *ngIf="item.contactstatus; else elseTemplate">
                  YES
                </ng-container>
                <ng-template #elseTemplate>
                  NO
                </ng-template>

              </td>
              <td>{{item.locationname}}</td>
            </tr>
          </ng-container>

          <tr *ngIf="contactNotes.length ===0">
            <td colspan="5">No Records found</td>
          </tr>
        </tbody>
      </table>
      <div class="text-center" *ngIf="totalRecords && totalRecords > paginationInfo.pageSize">
        <pagination [totalItems]="totalRecords" [(ngModel)]="paginationInfo.pageNumber" (pageChanged)="pageChanged($event)"
          class="pagination-sm" [boundaryLinks]="true" [maxSize]="10" [itemsPerPage]="paginationInfo.pageSize"></pagination>
      </div>
    </div>
  </div>
</div>
