<div class="row">
  <div class="col-sm-6 text-start">
    <h4>  Medical Conditions  </h4>
  </div>
  <div class="col-sm-6 text-end m-t-20">
    <a class="btn btn-pri" id="backbutton" [routerLink]="['../list']">BACK</a>
  </div>
</div>

<div [formGroup]="medicalconditionForm">

  <div class="row">
    <div class="col-sm-6">
      <mat-form-field>
        <mat-label>Medical Conditions</mat-label>
        <mat-select required formControlName="medicalconditiontypekey" placeholder="" multiple (selectionChange)="selectMedicalConditionType($event.value)">
          <mat-select-trigger>
            {{medicalConditionDescription? medicalConditionDescription[0] : ''}}
            <span *ngIf="medicalConditionDescription && medicalConditionDescription.length > 1" class="example-additional-selection">
              (+{{medicalConditionDescription.length - 1}} {{medicalConditionDescription.length === 2 ? 'other' :
              'others'}})
            </span>
          </mat-select-trigger>
          <mat-option *ngFor="let item of medicalConditionType$ | async" [value]="item.value">{{item.text}}</mat-option>
        </mat-select>
      </mat-form-field>
    </div>
  </div>
  <div class="row">
    <div class="col-sm-3">
      <mat-form-field>
        <mat-label>Begin Date</mat-label>
        <input required (change)="startDateChanged()" formControlName="begindate" matInput autocomplete="off" [matDatepicker]="picker41" placeholder="">
        <mat-datepicker-toggle matSuffix [for]="picker41"></mat-datepicker-toggle>
        <mat-datepicker #picker41></mat-datepicker>
      </mat-form-field>
    </div>
    <div class="col-sm-3">
      <mat-form-field>
        <mat-label>End Date</mat-label>
        <input required (change)="endDateChanged()" formControlName="enddate" matInput autocomplete="off" [matDatepicker]="picker42" placeholder="">
        <mat-datepicker-toggle matSuffix [for]="picker42"></mat-datepicker-toggle>
        <mat-datepicker #picker42></mat-datepicker>
      </mat-form-field>
    </div>
    <div class="col-sm-6">
      <mat-form-field>
        <mat-label>Recorded By</mat-label>
        <input required matInput formControlName="recordedby" placeholder="">
      </mat-form-field>
    </div>
  </div>
  <div class="row m-b-20">
    <div class="col-sm-11 ">
      <div class="pull-right">
        <span *ngIf="reportMode === 'add'">
          <button class="btn-pri" (click)="resetForm()">Clear</button> &nbsp;
          <button class="btn-pri" [disabled]="medicalconditionForm.pristine || medicalconditionForm.invalid" (click)="addUpdate(medicalconditionForm.value)">Add</button>
        </span>
        <span *ngIf="reportMode === 'edit'">
          <button class="btn-pri" [disabled]="medicalconditionForm.pristine || medicalconditionForm.invalid" *ngIf="editMode === true"
            (click)="addUpdate(medicalconditionForm.value)">Update</button>
        </span>
      </div>
    </div>
  </div>
</div>
