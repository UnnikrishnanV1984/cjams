<div class="row">
    <div class="col-sm-6 text-start">
        <h4> Medications </h4>
    </div>
    <div class="col-sm-6 text-end m-t-20">
        <a class="btn btn-pri" id="backbutton" [routerLink]="['../list']" >BACK</a>
    </div>
</div>
<div class="row" [formGroup]="medicationpsychotropicForm">
  <div class="col-sm-6">
      <mat-form-field>
        <mat-label>Medication Name</mat-label>
          <input required matInput formControlName="medicationname" placeholder="">
      </mat-form-field>
      <div class="row">
          <div class="col-sm-6">
              <mat-form-field>
                <mat-label>Dosage</mat-label>
                  <input required matInput formControlName="dosage" placeholder="" >
              </mat-form-field>
          </div>
          <div class="col-sm-6">
              <mat-form-field>
                <mat-label>Frequency</mat-label>
                  <input required matInput formControlName="frequency" placeholder="" >
              </mat-form-field>
          </div>
      </div>
      <mat-form-field>
        <mat-label>Last Dose Taken Date</mat-label>
          <input required matInput [max]="maxDate" formControlName="lastdosetakendate" autocomplete="off" [matDatepicker]="picker11" placeholder="">
          <mat-datepicker-toggle matSuffix [for]="picker11"></mat-datepicker-toggle>
          <mat-datepicker #picker11></mat-datepicker>
      </mat-form-field>
      <mat-form-field>
        <mat-label>Information Source</mat-label>
          <mat-select formControlName="informationsourcetypekey" placeholder="">
                  <mat-option *ngFor="let item of informationSourceType$ | async" value="{{item.value}}">{{item.text}}</mat-option>
          </mat-select>
      </mat-form-field>
      <mat-form-field>
        <mat-label>Comments</mat-label>
            <textarea formControlName="comments" matInput placeholder=""></textarea>
        </mat-form-field>
  </div>
  <div class="col-sm-6">
      <div class="row">
          <div class="col-sm-6">
              <mat-form-field>
                <mat-label>Effective Date</mat-label>
                  <input required matInput formControlName="medicationeffectivedate" autocomplete="off" [matDatepicker]="picker13" placeholder="">
                  <mat-datepicker-toggle matSuffix [for]="picker13"></mat-datepicker-toggle>
                  <mat-datepicker #picker13></mat-datepicker>
              </mat-form-field>
          </div>
          <div class="col-sm-6">
              <mat-form-field>
                <mat-label>Expiration Date</mat-label>
                  <input matInput formControlName="medicationexpirationdate" autocomplete="off" [matDatepicker]="picker14" placeholder="">
                  <mat-datepicker-toggle matSuffix [for]="picker14"></mat-datepicker-toggle>
                  <mat-datepicker #picker14></mat-datepicker>
              </mat-form-field>
          </div>
      </div>
      <mat-form-field>
        <mat-label>Prescribing Doctor</mat-label>
          <input matInput formControlName="prescribingdoctor" placeholder="">
      </mat-form-field>
      <mat-form-field>
        <mat-label>Prescription Reason</mat-label>
          <mat-select formControlName="prescriptionreasontypekey" placeholder="">
                  <mat-option *ngFor="let item of prescriptionReasonType$ | async" value="{{item.value}}">{{item.text}}</mat-option>
          </mat-select>
      </mat-form-field>
      <mat-form-field>
        <mat-label>Related Testing or Monitoring</mat-label>
            <input matInput formControlName="monitoring" placeholder="">
        </mat-form-field>

  </div>
  <div class="row m-b-20">
      <div class="col-sm-12 ">
          <div class="pull-right">
              <span *ngIf="reportMode === 'add'">
                  <button class="btn-pri" (click)="resetForm()">Clear</button> &nbsp;
                  <button class="btn-pri" [disabled]="medicationpsychotropicForm.pristine || medicationpsychotropicForm.invalid" (click)="addUpdate(medicationpsychotropicForm.value)">Add</button>
              </span>
              <span *ngIf="reportMode === 'edit'">
                  <button class="btn-pri" [disabled]="medicationpsychotropicForm.pristine || medicationpsychotropicForm.invalid" *ngIf="editMode === true" (click)="addUpdate(medicationpsychotropicForm.value)">Update</button>

              </span> </div>
      </div>
  </div>

</div>
