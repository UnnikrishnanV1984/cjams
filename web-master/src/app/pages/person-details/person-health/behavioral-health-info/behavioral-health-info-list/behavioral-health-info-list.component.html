<div class="row">
  <div class="col-sm-6 text-start">
    <h4>   Behavioral /Mental Health Situation/ Assessments  </h4>
  </div>
  <div class="col-sm-6 text-end m-t-20" *ngIf="_personDetailService.isEditable">
    <a class="btn btn-pri" [routerLink]="['../create-edit']">ADD</a>
  </div>
</div>
<div class="row">
  <div class="col-sm-12">&nbsp;</div>
</div>
<div class="row">
  <div class="col-sm-12">
    <div class="table-responsive table-theme table-bordered">
      <table class="table" aria-describedby="tbl-behaviour-info-lst">
        <thead>
          <tr>
            <th scope="col">Clinician Name</th>
            <th scope="col">Address</th>
            <th scope="col">Report Name</th>
            <th scope="col">Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let healthInfo of behaviorHealth$ | async;  let i=index">
            <td>{{healthInfo.clinicianname}}</td>
            <td>{{healthInfo.address1}},{{healthInfo.address2}}</td>
            <td>
              <a [href]="healthInfo.reportpath" target="_blank">
                <p>{{healthInfo.reportname}}</p>
              </a>
            </td>
            <td>
              <a (click)="view(healthInfo.personbehavioralhealthid)">
                <em class="fa fa-eye text-16"></em>
              </a> 
              <a *ngIf="_personDetailService.isEditable" (click)="edit(healthInfo.personbehavioralhealthid)">
                  | <em class="fa fa-pencil text-16"></em>
              </a> 
              <a *ngIf="_personDetailService.isEditable" (click)="showDeletePop(healthInfo.personbehavioralhealthid)">
                  | <em class="fa fa-trash text-16"></em>
              </a>
            </td>
          </tr>
          <tr *ngIf="(behaviorHealth$ | async)?.length === 0">
            <td colspan=5 style="text-align: center !important;">No Records Found.</td>
          </tr>
        </tbody>
      </table>
    </div>
    <div *ngIf="{ canDisplayPager: canDisplayPager$ | async, totalRecords: totalRecords$ | async } as pagination">
      <pagination *ngIf="pagination.canDisplayPager" [totalItems]="pagination.totalRecords ?? 0" [(ngModel)]="paginationInfo.pageNumber"
        (pageChanged)="pageChanged($event)" class="pagination-sm m-t-20" [boundaryLinks]="true" [maxSize]="10"
        [itemsPerPage]="paginationInfo.pageSize"></pagination>
    </div>
  </div>
</div>
<div class="modal fade custom-modal" id="delete-behaviorHealthInfo-popup" role="dialog">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h4 class="modal-title"> Confirm Delete </h4>
        <button type="button" class="btn-close close pull-right" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <p> Are you sure you want to delete this item? </p>
        <div class="text-end big-bot-space right-mspace-15">
          <button type="button" value="No" class="btn-pri" name="" data-bs-dismiss="modal"> No </button>
          <button type="button" value="Yes" class="btn-pri " name="" (click)="delete()"> Yes
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
