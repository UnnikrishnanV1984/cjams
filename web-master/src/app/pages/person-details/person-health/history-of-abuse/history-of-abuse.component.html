<div class="row" [formGroup]="historyofabuseForm">
    <div class="col-sm-6 m-b-20">
        <h5 class="f-w-600">Neglect</h5>
        <mat-radio-group formControlName="isneglect">
            <mat-radio-button (click)="neglectSelection(true)" class="m-r-10" [value]="true">Yes</mat-radio-button>
            <mat-radio-button (click)="neglectSelection(false)" [value]="false">No</mat-radio-button>
        </mat-radio-group>
        <mat-form-field class="m-t-10">
            <input required matInput formControlName="neglectnotes" placeholder="Notes">
        </mat-form-field>
    </div>
    <div class="col-sm-6 m-b-20">
        <h5 class="f-w-600">Physical abuse</h5>
        <mat-radio-group formControlName="isphysicalabuse">
            <mat-radio-button (click)="physicalabuseSelection(true)" class="m-r-10" [value]="true">Yes</mat-radio-button>
            <mat-radio-button (click)="physicalabuseSelection(false)" [value]="false">No</mat-radio-button>
        </mat-radio-group>
        <mat-form-field class="m-t-10">
            <input required formControlName="physicalnotes" matInput placeholder="Notes">
        </mat-form-field>
    </div>
    <div class="col-sm-6 m-b-20">
        <h5 class="f-w-600">Emotional abuse</h5>
        <mat-radio-group formControlName="isemotionalabuse">
            <mat-radio-button (click)="emotionalabuseSelection(true)" class="m-r-10" [value]="true">Yes</mat-radio-button>
            <mat-radio-button (click)="emotionalabuseSelection(false)" [value]="false">No</mat-radio-button>
        </mat-radio-group>
        <mat-form-field class="m-t-10">
            <input required formControlName="emotionalnotes" matInput placeholder="Notes">
        </mat-form-field>
    </div>
    <div class="col-sm-6 m-b-20">
        <h5 class="f-w-600">Sexual abuse</h5>
        <mat-radio-group formControlName="issexualabuse">
            <mat-radio-button (click)="sexualabuseSelection(true)" class="m-r-10" [value]="true">Yes</mat-radio-button>
            <mat-radio-button (click)="sexualabuseSelection(false)" [value]="false">No</mat-radio-button>
        </mat-radio-group>
        <mat-form-field class="m-t-10">
            <input required matInput formControlName="sexualnotes" placeholder="Notes">
        </mat-form-field>
    </div>
    <div class="row m-b-20">
        <div class="col-sm-6"></div>
        <div class="col-sm-6 ">
            <div class="pull-right" *ngIf="_personDetailService.isEditable">
                <span *ngIf="reportMode === 'add'">
                    <button class="btn-pri" (click)="resetForm()">Clear</button> &nbsp;
                    <button class="btn-pri" [disabled]="historyofabuseForm.pristine || historyofabuseForm.invalid"
                        (click)="addUpdate(historyofabuseForm.value)">Save</button>
                </span>
                <span *ngIf="reportMode === 'edit'">
                    <button class="btn-pri" [disabled]="historyofabuseForm.pristine || historyofabuseForm.invalid"
                        *ngIf="editMode === true" (click)="addUpdate(historyofabuseForm.value)">Update</button>
                    <button class="btn-pri" *ngIf="editMode === true" (click)="showDeletePop()">Delete</button>
                </span>
            </div>
        </div>
    </div>

</div>
<div class="modal fade custom-modal" id="delete-historyofabuse-popup" role="dialog">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h4 class="modal-title"> Confirm Delete </h4>
                <button type="button" class="btn-close close pull-right" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <p> Are you sure you want to delete this item? </p>
                <div class="text-end big-bot-space right-mspace-15">
                    <button type="button" value="No" class="btn-pri" name="" data-bs-dismiss="modal"> No </button>
                    <button type="button" value="Yes" class="btn-pri " name="" (click)="delete()"> Yes
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
