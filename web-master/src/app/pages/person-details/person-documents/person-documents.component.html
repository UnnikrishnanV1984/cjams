<div class="tab-content no-shadow">
  <div class="tab-pane fade show active">
    <div class="content-pad ">
      <div class="row">
        <div class="col-sm-12">
          <div class="table-responsive table-theme">
            <table class="table table-striped" aria-describedby="tbl-person-doc-lst">
              <thead>
                <tr>
                  <th scope="col">Intake #</th>
                  <th scope="col">Case #</th>
                  <th scope="col">Name</th>
                  <th scope="col">Category</th>
                  <th scope="col">Action</th>
                </tr>
              </thead>
              <tbody>
                <ng-container *ngFor="let item of items">
                  <tr>
                    <td>{{item.intakenumber}}</td>
                    <td>{{item.servicerequestnumber}}</td>
                    <td>{{item.originalfilename}}</td>
                    <td>{{item.category}}</td>
                    <td><a download [href]="item.s3bucketpathname">Download</a></td>
                  </tr>
                </ng-container>

                <tr *ngIf="items.length ===0">
                  <td colspan="5">No Records found</td>
                </tr>
              </tbody>
            </table>
            <div class="text-center" *ngIf="totalRecords && totalRecords > paginationInfo.pageSize">
              <pagination [totalItems]="totalRecords" [(ngModel)]="paginationInfo.pageNumber" (pageChanged)="pageChanged($event)"
                class="pagination-sm" [boundaryLinks]="true" [maxSize]="10" [itemsPerPage]="paginationInfo.pageSize"></pagination>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
