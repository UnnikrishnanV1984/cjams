<div class="row">
    <form [formGroup]="personSearchForm">
        <div class="col-sm-12 brd-lft">
            <div class="row">
                <div class="col-sm-12">
                    <h4 class="header-4 m-b-20">Search & Add Relationship</h4>
                    <div class="text-end">
                        <a class="btn-pri" [routerLink]="['../persons']">BACK</a>
                    </div>
                    <div class="row m-t-20">
                        <div class="col-sm-4">
                            <mat-form-field>
                                <mat-label>First Name</mat-label>
                                <input type="text" matInput formControlName="firstname" placeholder="">
                            </mat-form-field>
                        </div>

                        <div class="col-sm-4">
                            <mat-form-field>
                                <mat-label>Last Name</mat-label>
                                <input type="text" matInput formControlName="lastname" placeholder="">
                            </mat-form-field>
                        </div>
                        <div class="col-sm-4">
                            <div class="row">
                                <div class="col-sm-6">
                                    <mat-form-field>
                                        <mat-label>Approx. Age</mat-label>
                                        <input type="text" matInput placeholder="" formControlName="age">
                                    </mat-form-field>
                                </div>
                                <div class="col-sm-6">
                                    <mat-form-field>
                                        <mat-label>Select Gender</mat-label>
                                        <mat-select placeholder="" formControlName="gender">
                                            <mat-option *ngFor="let item of genderDropdownItems$ | async" value="{{item.gendertypekey}}">{{item.typedescription}}</mat-option>
                                        </mat-select>
                                    </mat-form-field>
                                </div>
                            </div>
                        </div>
                        <div class="col-sm-4">
                            <mat-form-field>
                                <mat-label>SSN</mat-label>
                                <input type="text" matInput placeholder="" mask="000-00-0000" formControlName="ssn">
                            </mat-form-field>
                        </div>
                        <div class="col-sm-4">
                            <mat-form-field>
                                <mat-label>CJIS # / SID # / Assist PID # /CJAMS PID #</mat-label>
                                <input type="text" matInput placeholder=""
                                    formControlName="cjisnumber">
                            </mat-form-field>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-sm-12">
                            <div class="wizard-buttons text-end">
                                <input class="btn-bg" type="button" (click)="clearPersonSearch()" value="Clear" />
                                <button class="btn-pri btn" type="submit" [disabled]="personSearchForm.pristine || personSearchForm.invalid"
                                    (click)="searchInvolvedPersons(personSearchForm.value)">Search</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col-sm-12">
                    <search-relationship-result *ngIf="showResults"></search-relationship-result>
                </div>
            </div>
        </div>
    </form>

</div>
