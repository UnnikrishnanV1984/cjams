<div class="cnt-min-height">
    <div class="row m-t-20">
        <div class="col-sm-6">
            <div class="document-search">
                <div class="input-group">
                    <input type="text" class="form-control" [(ngModel)]="searchText" placeholder="Search Documents">
                    <span class="input-group-btn">
                        <button class="btn btn-pri btn-pri-s" type="button">Search</button>
                    </span>
                </div>
            </div>
        </div>
        <div class="col-sm-6">
            <button class="btn btn-pri pull-right" *ngIf="isFileSelected()" (click)="generateSelectedDocuments()">Generate</button>
            <button data-bs-toggle="modal" data-bs-target="#docu-View" class="btn btn-pri pull-right" *ngIf="isFileSelected()"
                (click)="downloadSelectedDocuments()">View/Download
            </button>
        </div>
    </div>
    <div class="row m-t-20 created-tab">

        <div class="col-sm-12">
            <div class="table-responsive table-theme">

                <table class="table table-striped" aria-describedby="Documents List">
                    <thead>
                        <tr>
                            <th id="emptyHeader"></th>
                            <th id="nameHeader">name</th>
                            <th id="generatedByHeader">generated by</th>
                            <th id="generatedDtaeHeader">generated date</th>
                            <th id="actionsHeader">actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr *ngFor="let document of generatedDocuments">
                            <td colspan="5">
                                <table class="table custom-innertable" aria-describedby="Document List">
                                    <thead>
                                        <tr>
                                            <th id="checkboxHeader">
                                                <mat-checkbox [(ngModel)]="document.isSelected"></mat-checkbox>
                                            </th>
                                            <th id="titleHeader">{{document.title}}
                                                <span *ngIf="document.isRequired" style="color:red">
                                                    * </span>
                                            </th>
                                            <th id="genByHeader">{{document.generatedBy}}</th>
                                            <th id="genTimeHeader">{{document.generatedDateTime | date :
                                                'MM/dd/yyyy hh:mm:ss a'}}</th>
                                            <th id="actionHeader">
                                                <ul class="list-unstyled list-inline action-icons" *ngIf='!document.isInProgress'>
                                                    <li class="list-inline-item" *ngIf='document.isGenerated'><a download [href]="document.documentpath"><i
                                                                class="fa fa-download" aria-hidden="true"></i>View/Download</a></li>
                                                    <li class="list-inline-item" *ngIf='document.isGenerated'><a><i class="fa fa-envelope-o"
                                                                aria-hidden="true"></i>Email</a></li>
                                                    <li class="list-inline-item"><a (click)="generateNewDocument(document)"><em class="fa fa-gears"></em>Generate</a></li>
                                                </ul>
                                                <ul class="list-unstyled list-inline action-icons" *ngIf='document.isInProgress'>
                                                    <li class="list-inline-item"><img src="assets/images/loader.gif" alt="Loader icon"></li>

                                                </ul>

                                            </th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                    </tbody>
                                </table>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
<div class="modal fade" id="generate-details" role="dialog">
    <div class="modal-dialog modal-md custom-wid">
        <div class="modal-content">
            <div class="modal-header">
                <h4 class="modal-title"> Generate Document </h4>
                <button type="button" class="btn-close close pull-right" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form [formGroup]="generateDocForm">
                    <div class="row m-t-20">
                        <div class="col-sm-6">
                            <mat-form-field>
                                <mat-select required placeholder="Complaint" formControlName="complaint" (selectionChange)="loadVictims();">
                                    <mat-option *ngFor="let item of complaints" value="{{item.intakeservicerequestevaluationid}}">{{item.complaintid}}</mat-option>
                                </mat-select>
                            </mat-form-field>
                        </div>
                        <div class="col-sm-6" *ngIf="isGenerateByVictim">
                            <mat-form-field>
                                <mat-label>Victim</mat-label>
                                <mat-select required placeholder="" formControlName="victim">
                                    <mat-option *ngFor="let item of victims" value="{{item.personid}}">{{item.firstname}}&nbsp;{{item.lastname}}</mat-option>
                                </mat-select>
                            </mat-form-field>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <div class="text-end big-bot-space right-mspace-15">
                    <button type="button" class="btn-pri" [disabled]="generateDocForm.invalid" (click)="generateDocumnet(selectedDocument)">
                        Generate
                    </button>
                    <button type="button" class="btn-pri" data-bs-dismiss="modal">
                        Cancel
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
