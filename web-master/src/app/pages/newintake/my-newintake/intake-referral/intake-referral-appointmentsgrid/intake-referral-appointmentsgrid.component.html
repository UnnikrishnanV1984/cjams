<div class="col-sm-12 text-start">
    <h4>Appointments</h4>
  </div>
  <div class="col-sm-12 text-start">
    &nbsp;
  </div>
  <div class="col-sm-12">
    <div class="table-responsive table-theme">
      <table class="table table-striped" aria-describedby="Appointments List">
        <thead>
          <tr>
            <th id="titleHeader">Title</th>
            <th id="dateHeader">Date</th>
            <th id="intakeHeader">Intake Worker</th>
            <th id="personsHeader">Persons</th>
            <th id="statusHeader">Status</th>
            <th id="notesHeader">Notes</th>
          </tr>
        </thead>
        <tbody>
          <ng-container *ngIf="appointments && appointments.length>0; else noItems">
            <tr *ngFor="let appointment of appointments; let i=index">
              <td>{{appointment.title}}</td>
              <td>
                {{appointment.appointmentDate | date:'MM/dd/yyyy hh:mm
                aa'}}
              </td>
              <td>{{getIntakeWorkerName(appointment.intakeWorkerId)}}</td>
              <td>
                <span *ngFor="let actor of appointment.actors">
                  {{getPersonName(actor?.actorid)}} <br>
              </span>
              </td>
              <td>{{appointment.status}}</td>
              <td>
                  <div [innerHTML]="appointment.notes" style="cursor: pointer;" class="editor-notes"></div>
              </td>
            </tr>
          </ng-container>
          <ng-template #noItems>
            <tr>
              <td colspan="7" style="text-align: center !important;"> No records found </td>
            </tr>
          </ng-template>
        </tbody>
      </table>
    </div>
  </div>
