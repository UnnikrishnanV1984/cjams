<div class="cnt-min-height">
    <form [formGroup]="privateadoptionform">
      <div class="m-b-30">
        <h4 class="mt-0">ADOPTION SUBSIDY DETAILS</h4>
      </div>
      <div>
        <div class="col-md-4">
          <div>
            <mat-form-field>
              <mat-label>Offered Adoption Subsidy</mat-label>
              <mat-select placeholder="" formControlName="adoptionofferedflag">
                <mat-option value="1">Yes</mat-option>
                <mat-option value="0">No</mat-option>
              </mat-select>
            </mat-form-field>
          </div><br/>
          <div>
            <label>Offer Accepted</label>
            <mat-radio-group formControlName="isofferaccepted">  
                <mat-radio-button value=true>Yes</mat-radio-button>
                <mat-radio-button value=false>No</mat-radio-button>
            </mat-radio-group>
          </div>
        </div>
        <div class="col-md-8">
          <div class="row">
            <div class="col-md-8">
              <label>Adoptive parents indicate that they would only be able to adopt if a Subsidy is paid</label>
              <mat-radio-group formControlName="subsidyflag">
                <mat-radio-button value="1">Yes</mat-radio-button>
                <mat-radio-button value="0">No</mat-radio-button>
              </mat-radio-group>
            </div>
            <div class="col-md-4">
              <mat-form-field>
                <mat-label>MA Only</mat-label>
                <mat-select placeholder="" formControlName="paymentkeytype">
                  <mat-option value="Y">Yes</mat-option>
                  <mat-option value="N">No</mat-option>
                </mat-select>
              </mat-form-field>
            </div>
          </div>
          <div class="row">
            <div class="col-md-6">
              <mat-form-field>
                <mat-label>Adoption Finalization Date</mat-label>
                <input matInput  autocomplete="off" [matDatepicker]="adoptiondate" id="adoptiondate" placeholder=""
                  formControlName="adoptiondate" >
                <mat-datepicker-toggle matSuffix [for]="adoptiondate"></mat-datepicker-toggle>
                <mat-datepicker #adoptiondate></mat-datepicker>
              </mat-form-field>
            </div>
            </div>
        </div>
      </div>
      <div>
        <p>Review Signature Dates</p>
        <div class="col-md-4">
          <mat-form-field>
            <mat-label>Adoptive Parent 1</mat-label>
            <input matInput  autocomplete="off" [matDatepicker]="fatheragreementdate" id="fatheragreementdate" placeholder=""
              formControlName="fatheragreementdate" >
            <mat-datepicker-toggle matSuffix [for]="fatheragreementdate"></mat-datepicker-toggle>
            <mat-datepicker #fatheragreementdate></mat-datepicker>
          </mat-form-field>          
        </div>
        <div class="col-md-4">
          <mat-form-field>
            <mat-label>Adoptive Parent 2</mat-label>
            <input matInput  autocomplete="off" [matDatepicker]="motheragreementdate" id="motheragreementdate" placeholder=""
              formControlName="motheragreementdate" >
            <mat-datepicker-toggle matSuffix [for]="motheragreementdate"></mat-datepicker-toggle>
            <mat-datepicker #motheragreementdate></mat-datepicker>
          </mat-form-field>          
        </div>
        <div class="col-md-4">
          <mat-form-field>
            <mat-label>LDSS Director/ Designee</mat-label>
            <input matInput  autocomplete="off" [matDatepicker]="designeeagreementdate" id="designeeagreementdate" placeholder=""
              formControlName="designeeagreementdate" >
            <mat-datepicker-toggle matSuffix [for]="designeeagreementdate"></mat-datepicker-toggle>
            <mat-datepicker #designeeagreementdate></mat-datepicker>
          </mat-form-field>          
        </div>
      </div>
    </form>
  </div>
