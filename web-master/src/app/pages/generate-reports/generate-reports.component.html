<div class="row">
  <div class="col-sm-8">
    <h3>
      <span>REPORTS</span>
    </h3>
  </div>
  <div class="col-sm-4 m-t-20">
    <mat-form-field>
      <mat-label>Selected Report</mat-label>
      <mat-select (selectionChange)="loadSelectedReport($event.value)"  [(ngModel)]="selectedReport" required>
        <mat-option *ngFor="let report of reports" [value]="report.ref_key">{{report.value_text}}</mat-option>
      </mat-select>
    </mat-form-field>
  </div>
</div>
<router-outlet></router-outlet>
